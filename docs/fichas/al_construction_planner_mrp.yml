titulo: 'Planificación de obra: producción'
subtitulo: Órdenes de fabricación desde el plan de la obra, por nivel y etapa de producción,
  con el consumo de vuelta en cada línea.
categoria: Construcción · Proyectos
etiquetas:
- Orden de fabricación
- Etapa de consumo
- Espera del metrado
destacados:
- icono: ⚙
  titulo: OF desde el plan
  texto: Propone una OF por nivel con su producto y su cantidad, desde las líneas de producción
    del plan.
- icono: ▦
  titulo: Etapa de consumo
  texto: Cada componente de la lista de materiales dice en qué etapa se consume.
- icono: ↺
  titulo: Real desde Fabricación
  texto: Lo consumido por la OF sube como real a las líneas del plan.
- icono: ⏸
  titulo: Espera del metrado
  texto: La OF de un nivel con metrado pendiente de aprobación espera.
configuracion:
- Instale el núcleo **Planificación de obra** (`al_construction_planner`).
- Active **Producción** en **Planificación de obra ▸ Configuración ▸ Ajustes ▸ Funciones**,
  o aplique un perfil de vertical que la incluya.
requisitos_nota: Requiere Fabricación (`project_mrp`). Licencia LGPL-3 porque el planificador
  depende de `base_tier_validation` (AGPL-3).
novedades:
