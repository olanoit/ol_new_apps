  - "Regla multicompañía como la de los productos."

configuracion:
  - "Instale el módulo desde Aplicaciones (categoría OL-HEALTH)."
  - "En el producto, pestaña **Presentaciones**, agregue la caja, el blíster u otras con sus unidades y su precio."

