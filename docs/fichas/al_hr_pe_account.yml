funcionalidades:
  - grupo: Asiento de planilla por lote
    items:
      - Agregación por regla salarial y cuenta de todas las boletas no anuladas del lote.
      - Detalle por trabajador en las reglas que lo piden, con su contacto.
      - Abono de los aportes AFP en la cuenta de la afiliación, una línea por administradora.
      - Previsualización con totales y diferencia, con y sin analítica, y línea de ajuste por redondeo.
      - Asiento publicado con referencia PLA + mes + año y enlazado al lote y a sus boletas.
      - Lanzamiento desde el menú de la tarjeta del lote o desde Nómina ▸ Contabilidad.
  - grupo: Beneficios sociales
    items:
      - CTS y gratificación con reversión de la provisión acumulada y gasto por la diferencia.
      - Bono extraordinario de la Ley 29351 dentro del asiento de gratificación.
      - Un asiento por trabajador cesado, con truncos, conceptos extra y retenciones de AFP u ONP.
      - Provisión mensual por concepto, al haber detallada por trabajador o agrupada, que pasa a Hecho al contabilizarse.
      - Un único asistente de generación para los cuatro tipos de documento, con cuenta de ajuste propuesta.
  - grupo: Analítica y configuración
    items:
      - Distribución analítica nativa por compañía, de la regla salarial o de la ficha del trabajador.
      - Cuentas de beneficios sociales por compañía en los Parámetros principales.
      - Validación de cuentas faltantes con la lista de las que hay que configurar.

ejemplos:
  - titulo: Qué va a cada columna en el asiento de lote
    tabla:
      - [Regla, Debe, Haber]
      - ["Ingreso (básico, asignación, horas extras…)", Cuenta de débito de la regla, "Cuenta de crédito, por trabajador si la regla lo pide"]
      - [Descuento por inasistencia (importe negativo), Cuenta de crédito, Cuenta de débito]
      - [Aporte AFP del trabajador, Cuenta de débito de la regla, Cuenta de la afiliación de cada trabajador]
      - [Aporte del empleador (EsSalud), Cuenta de débito de la regla, Cuenta de crédito de la regla]
    nota: Las líneas sin categoría o con importe cero no entran; la cuenta de crédito de las reglas AFP se ignora.

  - titulo: Sin cuenta de afiliación
    texto: >-
      Si un trabajador tiene aportes AFP y su afiliación no tiene cuenta en la
      compañía, el asistente no calcula el asiento y muestra la lista
      «trabajador (afiliación: …)» para corregirla antes de volver a elegir el
      lote.

configuracion:
  - "Asigne las cuentas de debe y haber a las reglas salariales, y el detalle por empleado a las que lo necesiten."
  - "En **Parámetros principales ▸ Contabilidad** configure diario, partner, analítica y las reglas de aportes AFP."
  - Asigne a cada afiliación su cuenta contable en la compañía.
  - "En **Parámetros principales ▸ Contabilidad BBSS** configure las cuentas de CTS, gratificación, bono, vacaciones, liquidación y ajuste."
  - Si usa el asiento de lote, deje sin diario la estructura salarial para que la validación de boletas no genere asientos propios.
requisitos_nota: >-
  Requiere Nómina de Odoo Enterprise con su contabilización y el módulo de
  beneficios sociales peruano.

faq:
  - pregunta: ¿El asiento se genera solo al validar la planilla?
    respuesta: >-
      No. Se genera desde el asistente «Asiento de planilla por lote» cuando se
      decide, después de previsualizarlo.
  - pregunta: ¿Qué pasa si debe y haber no cuadran?
    respuesta: >-
      El asistente muestra la diferencia y exige una cuenta de ajuste; al
      generar añade la línea «Ajuste por Redondeo» por esa diferencia.
  - pregunta: ¿De dónde sale la distribución analítica?
    respuesta: >-
      De la regla salarial si la tiene y, si no, de la ficha del trabajador.
      Solo se aplica cuando está activo «Asiento de lote con analítica» o se
      marca «Con distribución analítica» en el asistente.
  - pregunta: El asistente dice que no hay importes que contabilizar en la CTS.
    respuesta: >-
      Procese el documento y, si corresponde, obtenga las provisiones antes de
      generar el asiento. Un documento que ya tiene asiento tampoco genera
      otro: hay que eliminar el actual.
  - pregunta: ¿Cómo quedan las AFP si falta la cuenta de la afiliación?
    respuesta: >-
      El asistente se detiene y lista los trabajadores con aportes AFP cuya
      afiliación no tiene cuenta en esa compañía; asígnela y vuelva a elegir el
      lote.
  - pregunta: ¿Por qué la liquidación tiene un asiento por trabajador?
    respuesta: >-
      Cada cese tiene su fecha, sus importes y su contacto. Al generarlo, la
      fila queda marcada con «No recalcular» para que volver a procesar la
      liquidación no la pierda.

