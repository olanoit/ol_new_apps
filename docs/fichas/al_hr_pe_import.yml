      - [Datos PE de versiones, "NRO DOCUMENTO · RÉGIMEN LABORAL · CUSPP · TIPO COMISIÓN AFP · AFILIACIÓN (AFP/ONP) · SEGURO SOCIAL · TIPO TRABAJADOR (T08) · SITUACIÓN (T15) · EXCEPCIÓN JORNADA (PLAME) · TIPO DE LABOR (PLAME)"]
      - [Récord vacacional, "FECHA DE APLICACIÓN · NRO DOCUMENTO · DÍAS DE SALDO · IMPORTE DE SALDO"]
      - [Adelantos, "NRO DOCUMENTO · TIPO DE ADELANTO · FECHA DE ADELANTO · FECHA DE DESCUENTO · MONTO · OBSERVACIONES"]
      - [Asistencias, "EMPLEADO (nombre exacto o documento) · ENTRADA (check_in) · SALIDA (check_out)"]
      - [Reglas salariales, "CATEGORÍA (nombre o código) · COMPAÑÍA (informativa) · CÓDIGO · NOMBRE · SECUENCIA · CÓDIGO PYTHON · CONDICIÓN PYTHON"]

configuracion:
  - Instale el módulo; requiere la biblioteca Python `openpyxl` en el servidor.
  - "Asegúrese de que los trabajadores tengan su **número de documento** en la versión vigente."
  - "Para novedades, cree el lote del mes y verifique que los códigos de input estén permitidos en la estructura salarial."
  - "Descargue la plantilla desde el propio asistente y respete la fila de cabecera."
requisitos_nota: >-
  Es el módulo de cierre de la suite: depende del núcleo, beneficios,
  asistencia, contabilidad y reportes de planillas Perú.

faq:
  - pregunta: ¿Qué pasa si vuelvo a subir el mismo archivo?
    respuesta: >-
      Con **Actualizar existentes** marcado, las filas ya importadas se
      actualizan; sin marcarlo, se omiten y el reporte lo indica.
  - pregunta: Una fila dice que el input no está permitido en la estructura.
    respuesta: >-
      Añada ese tipo de input a la estructura salarial de la boleta y vuelva a
      importar esa fila.
  - pregunta: ¿Puedo importar sobre boletas ya validadas?
    respuesta: No. Solo sobre boletas en borrador o por verificar.
  - pregunta: ¿En qué zona horaria se leen las asistencias?
    respuesta: >-
      En la **Zona horaria del archivo** que se elige en el asistente (por
      defecto la del usuario o America/Lima), y se convierten a UTC al guardar.

