titulo: Planillas Perú — Importadores Excel
subtitulo: >-
  Cargas masivas de planilla desde Excel —novedades del mes, datos laborales,
  saldos de vacaciones, adelantos, asistencias y reglas salariales— con
  plantilla descargable, progreso en vivo y un reporte que dice fila por fila
  qué corregir.
categoria: Localización Perú · Planillas
etiquetas: [Excel .xlsx, Plantillas, Progreso en vivo, Reporte de errores, Novedades del mes, Multicompañía]
portada: screenshots/04-progreso.png

destacados_intro: >-
  Seis importadores con el mismo asistente de tres pasos: cargar archivo,
  configurar y ver el resultado.
destacados:
  - icono: "⬇"
    titulo: Plantilla descargable
    texto: >-
      Cada asistente entrega su plantilla con las columnas exactas y una fila
      de ejemplo, sin tener que guardar antes el asistente.
  - icono: "▭"
    titulo: Progreso en vivo
    texto: >-
      La importación corre en segundo plano y la ventana muestra filas
      procesadas, creadas, actualizadas, omitidas y con error.
  - icono: "!"
    titulo: Errores con sugerencia
    texto: >-
      Cada fila rechazada se informa con su número, el motivo y una sugerencia
      de corrección, en un Excel descargable.
  - icono: "∑"
    titulo: Proceso por lotes
    texto: >-
      Se confirma por bloques (100 filas por defecto): un fallo al final de un
      archivo grande no deshace lo ya importado.
  - icono: "DNI"
    titulo: Por número de documento
    texto: >-
      Los trabajadores se localizan por su documento, como vienen en los
      reportes de los bancos y de los relojes biométricos.
  - icono: "v18"
    titulo: Reglas de la versión anterior
    texto: >-
      Las reglas salariales exportadas de la versión 18 se adaptan solas al
      modelo de Odoo 19 y cada cambio queda anotado.

contexto:
  titulo: El problema que resuelve
  texto: >-
    Cada mes llegan comisiones, bonos, adelantos o préstamos en hojas de
    cálculo, y al arrancar con el sistema hay que cargar los datos laborales y
    los saldos de vacaciones de toda la planilla. Teclearlo boleta por boleta
    es lento, y una importación genérica falla sin explicar qué fila está mal.


    Este módulo ofrece importadores específicos de planilla: validan cada fila
    contra las reglas de la localización (boleta en borrador, input permitido
    en la estructura, catálogos SUNAT) y devuelven un reporte para corregir y
    volver a subir solo lo que falló.
  nota: >-
    **Acepta `.xlsx` y `.xlsm`.** Detecta las hojas del libro y propone la que
    corresponde al importador; la fila de cabecera y la primera fila de datos
    son configurables. Requiere la biblioteca `openpyxl` en el servidor.

flujos_intro: >-
  Todos los importadores comparten el mismo motor; cambia solo cómo se valida
  y se escribe cada fila.
flujos:
  - id: motor
    titulo: El recorrido de una importación
    texto: >-
      Del archivo al reporte. La lectura ocurre al pulsar Importar; el
      proceso sigue en segundo plano aunque se cierre la ventana.
    mermaid: |
      flowchart TD
        A[Abrir el importador<br/>y subir el Excel .xlsx / .xlsm] --> B[Analizar archivo:<br/>detecta las hojas y propone una]
        B --> C[Configurar: hoja, primera fila de datos,<br/>actualizar existentes y tamaño de lote]
        C --> D{¿La hoja tiene filas?}
        D -- No --> E[Aviso: la hoja no contiene filas válidas]
        D -- Sí --> F[Importar: se crea el registro del historial<br/>y el proceso sigue en segundo plano]
        F --> G[Cada fila se valida y se escribe aparte:<br/>creado, actualizado, omitido o error]
        G --> H[Al cerrar cada lote se confirma lo importado<br/>y la barra de progreso avanza]
        H --> I[Completado: reporte Excel<br/>con hojas Resultado, Errores y Omitidos]
        I --> J[Corregir solo las filas con error<br/>y volver a subirlas]
    pie: "Una fila con error no detiene la importación: se anota y se sigue con la siguiente."
  - id: novedades
    titulo: Novedades del mes sobre las boletas de un lote
    texto: >-
      Validaciones que hace el importador de inputs en cada fila, en este
      orden.
    mermaid: |
      flowchart TD
        A[Fila: documento, código de input y monto] --> B{¿Hay documento?}
        B -- No --> S[Omitida]
        B -- Sí --> C{¿Hay una sola boleta del lote<br/>para ese documento?}
        C -- No --> X[Error]
        C -- Sí --> D{¿Boleta en borrador<br/>o por verificar?}
        D -- No --> X
        D -- Sí --> E{¿Existe el código de input<br/>y lo permite la estructura?}
        E -- No --> X
        E -- Sí --> F{¿La boleta ya tiene ese input?}
        F -- "Sí, sin «Actualizar existentes»" --> S
        F -- "Sí, con «Actualizar existentes»" --> U[Actualizado: nuevo importe]
        F -- No --> N[Creado: entrada salarial<br/>con el monto redondeado]
  - id: maestros
    titulo: Datos laborales, saldos y adelantos
    texto: >-
      Los tres importadores localizan al trabajador por documento dentro de la
      compañía del asistente y se diferencian en qué hacen si el dato ya existe.
    mermaid: |
      flowchart TD
        A[Fila con número de documento] --> B{¿Un solo empleado con ese<br/>documento en la compañía?}
        B -- No --> X[Error con sugerencia]
        B -- Sí --> C{¿Qué importador?}
        C -- Datos PE de versiones --> D[Escribe en la versión vigente<br/>solo las celdas con valor]
        C -- Récord vacacional --> E{¿Ya tiene saldo inicial?}
        E -- "Sí, sin «Actualizar existentes»" --> O[Omitido]
        E -- "Sí, con «Actualizar existentes»" --> F[Reemplaza el saldo inicial]
        E -- No --> G[Crea el saldo inicial]
        C -- Adelantos --> H{¿Adelanto no pagado del mismo<br/>tipo y fecha de descuento?}
        H -- "Sí, sin «Actualizar existentes»" --> O
        H -- "Sí, con «Actualizar existentes»" --> I[Actualiza el adelanto]
        H -- No --> J[Crea el adelanto]
  - id: reglas
    titulo: Reglas salariales exportadas de la versión 18
    texto: >-
      Con «Adaptar código v18 → v19» marcado, cada regla pasa por esta
      limpieza antes de guardarse en la estructura destino.
    mermaid: |
      flowchart TD
        A[Fila: categoría, código, nombre,<br/>secuencia, código y condición Python] --> B{¿Categoría encontrada<br/>por nombre o código?}
        B -- No --> X[Error]
        B -- Sí --> C{¿La condición es la que Odoo<br/>pone por defecto?}
        C -- Sí --> D[Se descarta: la regla<br/>queda «Siempre verdadero»]
        C -- No --> E[Se conserva]
        D --> F[Traducción: contract → version,<br/>payslip.wage → version.wage,<br/>campos peruanos renombrados]
        E --> F
        F --> G{¿Existe la regla con ese código<br/>en la estructura destino?}
        G -- "Sí, sin «Actualizar existentes»" --> O[Omitida]
        G -- "Sí, con «Actualizar existentes»" --> H[Actualizada]
        G -- No --> I[Creada]
        H --> J[Las adaptaciones quedan<br/>anotadas en la fila del reporte]
        I --> J

pasos_intro: >-
  Recorrido real con los datos de demostración «DEMO FICHA HR1»: los seis
  importadores ejecutados desde la interfaz, cada uno con al menos una fila
  errónea a propósito.
pasos:
  - seccion: Acceso
    texto: Dónde están los importadores.
  - titulo: El menú de importadores
    ruta: Nómina ▸ Importar desde Excel
    texto: >-
      Asistencias, Inputs de boletas (novedades), Récord vacacional (saldos),
      Adelantos, Datos PE de versiones y Reglas salariales, además del
      **Historial de importaciones**.
    puntos:
      - Datos PE de versiones y Reglas salariales solo los ve el administrador de nómina.
    imagen: screenshots/01-menu.png

  - titulo: Importar desde las listas
    ruta: Asistencias ▸ Información general ▸ Tablero (vista de lista)
    texto: >-
      Las listas de asistencias y de reglas salariales muestran el botón
      **Importar desde Excel**, que abre su asistente directamente; al
      cerrarlo, la lista se recarga. Desde Asistencias pueden usarlo también
      los encargados de asistencias que no son usuarios de nómina.
    imagen: screenshots/12-asistencias-lista.png

  - titulo: El mismo botón en las reglas salariales
    ruta: Nómina ▸ Configuración ▸ Salario ▸ Reglas
    imagen: screenshots/15-reglas-lista.png

  - seccion: Novedades del mes
    texto: >-
      El importador que más se usa: comisiones, bonos, horas extras,
      adelantos o préstamos sobre las boletas de un lote. Muestra también los
      tres pasos comunes a todos los asistentes.
  - titulo: Paso 1 — Cargar el archivo
    ruta: Nómina ▸ Importar desde Excel ▸ Inputs de boletas (novedades)
    texto: >-
      Elija el **Lote de boletas** y suba el Excel. Si aún no tiene el formato,
      **Descargar plantilla** baja un libro con las columnas NRO DOCUMENTO,
      CÓDIGO DE INPUT y MONTO y una fila de ejemplo. Pulse **Analizar
      archivo**.
    puntos:
      - La plantilla se descarga sin haber elegido lote ni subido archivo.
      - Un archivo que no sea .xlsx o .xlsm se rechaza al subirlo.
    imagen: screenshots/02-archivo.png

  - titulo: Paso 2 — Configurar la lectura
    ruta: Asistente ▸ paso Configurar
    texto: >-
      El asistente muestra la **Hoja a importar** detectada, la **Fila de
      cabecera técnica** y la **Primera fila de datos**, y las opciones
      **Actualizar existentes**, **Procesar por lotes** y **Tamaño de lote**.
      Pulse **Importar**.
    puntos:
      - Solo se escriben boletas en borrador o por verificar.
      - El input debe estar permitido en la estructura salarial de la boleta.
      - El monto se redondea a dos decimales con criterio SUNAT (medio hacia arriba).
    imagen: screenshots/03-configurar.png

  - titulo: Paso 3 — Progreso y resultado
    ruta: Asistente ▸ Importar
    texto: >-
      La ventana de progreso se actualiza sola cada segundo hasta terminar. Al
      final ofrece **Descargar reporte** (Excel con hojas Resultado, Errores y
      Omitidos), **Ver registros** (abre los registros creados o actualizados)
      y **Listo**.
    imagen: screenshots/04-progreso.png
    pie: "6 filas: 4 inputs creados y 2 errores (un código inexistente y un documento sin boleta en el lote)."

  - titulo: Las novedades ya están en la boleta
    ruta: Nómina ▸ Recibos de nómina ▸ boleta ▸ Entradas salariales
    texto: >-
      Cada fila correcta queda como entrada salarial de la boleta del
      trabajador; al pulsar **Calcular hoja**, las reglas la pagan o la
      descuentan.
    imagen: screenshots/05-boleta.png
    pie: "Boleta DEMO de agosto 2026 de Salazar: comisiones por S/ 350,00."

  - seccion: Datos laborales PE
    texto: Para el alta inicial o un cambio masivo de AFP, régimen o catálogos PLAME.
  - titulo: Cargar los datos PE de las versiones
    ruta: Nómina ▸ Importar desde Excel ▸ Datos PE de versiones
    texto: >-
      Diez columnas: documento, régimen laboral, CUSPP, tipo de comisión AFP,
      afiliación, seguro social, tipo de trabajador (T08), situación (T15),
      excepción de jornada y tipo de labor. Se escribe en la **versión
      vigente** del trabajador.
    puntos:
      - Las celdas vacías no borran el valor actual.
      - "Régimen, comisión, excepción y tipo de labor aceptan la clave (`general`, `mixed`, `N`) o la etiqueta (Régimen general, Comisión mixta, N — Normal)."
      - T08 y T15 aceptan el código SUNAT o el nombre; afiliación y seguro social, el nombre.
      - "Este asistente no tiene «Actualizar existentes»: siempre actualiza la versión."
    imagen: screenshots/06-versiones-archivo.png

  - titulo: Resultado de la carga de versiones
    ruta: Asistente ▸ Importar
    texto: >-
      Cada trabajador localizado cuenta como **actualizado**. Una fila con un
      valor que no está en la lista (por ejemplo, un régimen «CAS») se rechaza
      entera y no escribe ningún campo.
    imagen: screenshots/07-versiones-resultado.png
    pie: "Tres versiones DEMO actualizadas y una fila rechazada por régimen no reconocido."

  - seccion: Récord vacacional
    texto: Saldos de vacaciones pendientes al arrancar con el sistema.
  - titulo: Importar los saldos iniciales
    ruta: Nómina ▸ Importar desde Excel ▸ Récord vacacional (saldos)
    texto: >-
      Columnas FECHA DE APLICACIÓN, NRO DOCUMENTO, DÍAS DE SALDO e IMPORTE DE
      SALDO (opcional). Cada fila crea el **saldo inicial** del trabajador, del
      que parte el recálculo del récord vacacional.
    puntos:
      - Con **Actualizar existentes**, el saldo inicial anterior se reemplaza (no se suma); sin marcarlo, la fila se omite.
      - Los días pueden ser negativos y con decimales.
    imagen: screenshots/08-vacaciones-configurar.png

  - titulo: Los saldos creados
    ruta: Progreso ▸ Ver registros
    texto: >-
      El motivo se asigna solo: **Saldo acumulado anterior** si los días son
      positivos y **Saldo Ajuste Adelantos** si son negativos. El año sale de
      la fecha de aplicación.
    imagen: screenshots/09-vacaciones-registros.png
    pie: "Tres saldos al 01/01/2026; la cuarta fila, con la fecha escrita como texto 01/01/2026, dio error."

  - seccion: Adelantos
    texto: Adelantos de sueldo, gratificación, CTS o vacaciones que se descuentan en una boleta posterior.
  - titulo: Importar adelantos
    ruta: Nómina ▸ Importar desde Excel ▸ Adelantos
    texto: >-
      Columnas NRO DOCUMENTO, TIPO DE ADELANTO (nombre exacto del tipo en la
      compañía), FECHA DE ADELANTO, FECHA DE DESCUENTO, MONTO y OBSERVACIONES.
      La **fecha de descuento** decide en qué boleta se descuenta.
    puntos:
      - Si ya hay un adelanto no pagado del mismo trabajador, tipo y fecha de descuento, se actualiza (o se omite sin «Actualizar existentes»).
      - Los adelantos ya pagados nunca se tocan.
      - El monto debe ser positivo; sin fecha de adelanto se usa la de descuento.
    imagen: screenshots/10-adelantos-configurar.png

  - titulo: Los adelantos creados
    ruta: Progreso ▸ Ver registros
    texto: Quedan en estado **No pagado**, listos para descontarse en la boleta de su fecha de descuento.
    imagen: screenshots/11-adelantos-registros.png
    pie: "Dos adelantos DEMO; la fila con el tipo «Adelanto de movilidad», que no existe, dio error."

  - seccion: Asistencias
    texto: Marcaciones de un reloj biométrico o de una hoja de control.
  - titulo: Configurar la zona horaria del archivo
    ruta: Nómina ▸ Importar desde Excel ▸ Asistencias
    texto: >-
      Columnas EMPLEADO, ENTRADA y SALIDA. El empleado se busca por su nombre
      exacto y, si no aparece, por su número de documento. Las horas del Excel
      se leen en la **Zona horaria del archivo** y se guardan en UTC.
    puntos:
      - La salida puede quedar vacía (marcación abierta).
      - Si ya existe una asistencia del mismo trabajador con la misma entrada, se actualiza la salida.
    imagen: screenshots/13-asistencias-configurar.png

  - titulo: Resultado de las marcaciones
    ruta: Asistente ▸ Importar
    texto: >-
      Una salida anterior a la entrada se rechaza con su sugerencia; también
      los homónimos (se pide precisar el nombre).
    imagen: screenshots/14-asistencias-resultado.png
    pie: "Tres marcaciones DEMO ya existentes (por nombre y por documento) actualizadas y una rechazada."

  - seccion: Reglas salariales
    texto: Carga o migración de las reglas de una estructura.
  - titulo: Elegir la estructura destino
    ruta: Nómina ▸ Importar desde Excel ▸ Reglas salariales
    texto: >-
      El Excel no trae la estructura: todas las reglas van a la **Estructura
      salarial destino**. La categoría se busca por nombre o código y la regla
      se crea con importe en código Python. Con **Adaptar código v18 → v19**
      se traduce el código de la versión anterior.
    imagen: screenshots/16-reglas-configurar.png

  - titulo: La regla adaptada
    ruta: Nómina ▸ Configuración ▸ Salario ▸ Reglas ▸ regla
    texto: >-
      La condición `result = contract.retirement_fund == 'onp'` del Excel quedó
      como `result = version.l10n_pe_retirement_fund == 'onp'`. En la otra
      regla se descartó la condición por defecto de Odoo y quedó «Siempre
      verdadero».
    imagen: screenshots/17-regla-adaptada.png

  - seccion: Historial
    texto: Qué se importó, cuándo y con qué resultado.
  - titulo: Consultar el historial
    ruta: Nómina ▸ Importar desde Excel ▸ Historial de importaciones
    texto: >-
      Una línea por importación con fecha, modelo de destino, compañía,
      estado, contadores e inicio y fin. En verde las completadas, en rojo las
      que fallaron. Al abrir una línea se ve de nuevo la ventana de progreso
      con **Descargar reporte** y **Ver registros**.
    puntos:
      - Filtros Completadas, Con error y En proceso; agrupación por Modelo destino o Estado.
      - Cada usuario ve solo las importaciones de sus compañías.
    imagen: screenshots/18-historial.png

campos_intro: >-
  Campos de cada pantalla del módulo, con sus etiquetas y valores por defecto
  reales.
campos:
  - grupo: Paso «Cargar archivo» (todos los asistentes)
    ruta: Nómina ▸ Importar desde Excel ▸ cualquier importador
    campos:
      - [Archivo Excel, "Libro a importar.", Vacío, "Obligatorio; solo .xlsx o .xlsm"]
      - [Analizar archivo, Botón que lee las hojas del libro., "—", Pasa al paso Configurar]
      - [Descargar plantilla, "Libro con las cabeceras del importador y una fila de ejemplo resaltada.", "—", "No necesita archivo ni datos del asistente"]
  - grupo: Paso «Configurar» (todos los asistentes)
    ruta: Asistente ▸ paso Configurar
    campos:
      - [Nombre del archivo, Nombre del libro subido., "—", Solo lectura]
      - [Hoja a importar, "Hoja del libro que se leerá.", "La que contiene la palabra clave del importador (input, vac, adelanto, version) o la primera", Obligatoria]
      - [Fila de cabecera técnica, Fila de los nombres de columna; es solo referencia., "1", "No cambia el orden de columnas, que es fijo"]
      - [Primera fila de datos, Fila desde la que se leen registros., "2", "Las filas totalmente vacías se saltan"]
      - [Compañía, "Compañía en la que se buscan trabajadores y tipos.", Compañía activa, "Visible con multicompañía; se guarda en el historial"]
      - [Actualizar existentes, "Qué hacer si el registro ya existe (por su clave).", Marcado, "Desmarcado: la fila se omite"]
      - [Procesar por lotes, Confirma lo importado al cerrar cada lote., Marcado, "Desmarcado: confirma fila a fila"]
      - [Tamaño de lote, Filas por lote., "100", Solo con «Procesar por lotes»]
      - [Importar, Lanza el proceso en segundo plano., "—", Abre la ventana de progreso]
  - grupo: Campos propios de cada importador
    ruta: Asistente ▸ paso Configurar
    campos:
      - ["Lote de boletas (Inputs de boletas)", Lote cuyas boletas reciben las novedades., Vacío, "Obligatorio; se elige en el paso 1"]
      - ["Zona horaria del archivo (Asistencias)", Zona en la que están las horas del Excel., "La del usuario o America/Lima", Conversión a UTC al guardar]
      - ["Estructura salarial destino (Reglas salariales)", Estructura a la que se asignan todas las reglas., Vacío, "Obligatoria; clave código + estructura"]
      - ["Adaptar código v18 → v19 (Reglas salariales)", Traduce el código Python de la versión anterior y descarta la condición por defecto., Marcado, Cada cambio se anota en el reporte]
  - grupo: Columnas y clave de cada plantilla
    ruta: Descargar plantilla
    campos:
      - [Inputs de boletas, "NRO DOCUMENTO · CÓDIGO DE INPUT · MONTO", "Hoja INPUTS", "Clave: boleta del lote + tipo de input"]
      - [Datos PE de versiones, "NRO DOCUMENTO · RÉGIMEN LABORAL · CUSPP · TIPO COMISIÓN AFP · AFILIACIÓN (AFP/ONP) · SEGURO SOCIAL · TIPO TRABAJADOR (T08) · SITUACIÓN (T15) · EXCEPCIÓN JORNADA (PLAME) · TIPO DE LABOR (PLAME)", "Hoja VERSIONES", "Clave: versión vigente del documento"]
      - [Récord vacacional, "FECHA DE APLICACIÓN · NRO DOCUMENTO · DÍAS DE SALDO · IMPORTE DE SALDO", "Hoja VACACIONES", "Clave: saldo inicial del trabajador"]
      - [Adelantos, "NRO DOCUMENTO · TIPO DE ADELANTO · FECHA DE ADELANTO · FECHA DE DESCUENTO · MONTO · OBSERVACIONES", "Hoja ADELANTOS", "Clave: trabajador + tipo + fecha de descuento (no pagado)"]
      - [Asistencias, "EMPLEADO (nombre exacto o documento) · ENTRADA (check_in) · SALIDA (check_out)", "Hoja ASISTENCIAS", "Clave: trabajador + entrada"]
      - [Reglas salariales, "CATEGORÍA (nombre o código) · COMPAÑÍA (informativa) · CÓDIGO · NOMBRE · SECUENCIA · CÓDIGO PYTHON · CONDICIÓN PYTHON", "Hoja REGLAS", "Clave: código + estructura destino"]
  - grupo: Ventana de progreso
    ruta: Asistente ▸ Importar (o Historial ▸ línea)
    campos:
      - [Barra de progreso, Filas procesadas sobre el total y porcentaje., "—", Se actualiza cada segundo]
      - ["Total, Procesados, Creados, Actualizados, Omitidos, Errores", Contadores de la importación., "0", "—"]
      - [Detalle del error, Motivo si el proceso entero falla., "—", Solo en estado Error]
      - [Descargar reporte, "Excel con las hojas Resultado, Errores y Omitidos: fila, estado, detalle, sugerencia y los datos leídos.", "—", Aparece al terminar]
      - [Ver registros, Lista de los registros creados o actualizados., "—", Solo si hubo alguno]
  - grupo: Historial de importaciones
    ruta: Nómina ▸ Importar desde Excel ▸ Historial de importaciones
    campos:
      - [Fecha, Momento en que se lanzó la importación., Automático, Orden descendente]
      - [Modelo destino, "Modelo técnico que recibe los datos (hr.payslip, hr.version…).", Automático, Filtro y agrupación]
      - [Compañía, Compañía del asistente., Compañía activa, Regla de acceso por compañía]
      - [Estado, "Pendiente, Procesando, Completado o Error.", Pendiente, Color de la línea]
      - ["Total, Procesados, Creados, Actualizados, Omitidos, Errores", Contadores finales., "0", "—"]
      - ["Date Start, Date End", Inicio y fin del proceso., Automático, "—"]

funcionalidades:
  - grupo: Importadores
    items:
      - "Inputs de boletas: novedades del mes sobre las boletas de un lote, por documento y código de input."
      - "Datos PE de versiones: régimen laboral, CUSPP, tipo de comisión AFP, afiliación, seguro social, tipo de trabajador (T08), situación (T15), excepción de jornada y tipo de labor."
      - "Récord vacacional: saldos iniciales de días e importe por trabajador, con motivo automático según el signo."
      - "Adelantos: tipo, fechas de adelanto y de descuento, monto y observaciones."
      - "Asistencias: entrada y salida por nombre o documento, con la zona horaria del archivo."
      - "Reglas salariales: carga en una estructura, con opción de adaptar el código de fórmulas de la versión anterior."
  - grupo: Motor común
    items:
      - Plantilla Excel generada por el sistema y servida sin guardar el asistente.
      - Detección de hojas con autoselección según el importador.
      - Fila de cabecera y primera fila de datos configurables; filas vacías ignoradas.
      - Proceso en segundo plano con confirmación por lotes y progreso publicado aparte.
      - "Cada fila aislada: un error no deshace las demás."
      - Estados creado, actualizado, omitido y error por fila, con sugerencia de corrección.
      - Reporte Excel con hojas Resultado, Errores y Omitidos y resumen de contadores.
      - Acceso directo a los registros creados o actualizados.
      - Celdas vacías que no sobrescriben datos en la importación de versiones.
      - Documentos numéricos leídos sin decimales espurios.
      - Montos redondeados con criterio SUNAT.
  - grupo: Control
    items:
      - Compañía en asistentes e historial, con regla de registro por compañía.
      - Importadores de versiones y reglas salariales restringidos al administrador de nómina.
      - Botón «Importar desde Excel» en las listas de asistencias y de reglas salariales.

