titulo: 'Planificación de obra: orden de fabricación del mueble'
subtitulo: Accesorios de armado pedidos desde la orden sobre lo proyectado, y presupuestado,
  requerido y consumido en la orden y en el planificador.
categoria: Construcción · Proyectos
etiquetas:
- Orden de fabricación
- Accesorios de armado
- Presupuestado frente a real
destacados:
- icono: 🔩
  titulo: Pedir accesorios
  texto: Propone lo proyectado de Armado de los módulos de la orden, con su saldo.
- icono: ✔
  titulo: Cambios a Oficina Técnica
  texto: Otro accesorio o más cantidad que el saldo va a Aprobaciones; sin cambios, directo a la orden.
- icono: ⚖
  titulo: Presupuestado, requerido y consumido
  texto: Por material en la orden, con montos solo para quien tiene el permiso.
- icono: ▦
  titulo: Informe del planificador
  texto: Las mismas cifras por obra, piso, ambiente, mueble, módulo y etapa.
configuracion:
- "Se instala solo con **Planificación de obra: aprobaciones en fabricación**."
- "Asigne el grupo **Planificación de obra: jefe de producción** y revise la ruta **Accesorios de armado**."
requisitos_nota: Requiere `al_construction_planner_approvals_mrp`. Licencia LGPL-3 porque el planificador
  depende de `base_tier_validation` (AGPL-3).
novedades:
- version: '6.20261027'
  fecha: 27/10/2026
  cambios:
    - "Ícono nuevo: el isotipo de ALTA."
- version: '5.20261019'
  fecha: 23/10/2026
  cambios:
  - "Requerimiento CREVAL v1.0, capítulo 5: accesos, menús y botones con los grupos en dos ejes (Plan: consulta, planificador, aprueba; Ejecución: reporta avance, ejecuta, valida, aprueba)."
- version: '4.20261019'
  fecha: 19/10/2026
  cambios:
  - "Paquete 1.10, M110-04: «Pedir accesorios» y su aviso salen de las etapas marcadas «Accesorios a pedido desde la orden» (ya no del código de armado) y el informe compara solo las etapas de la orden. M110-08: cifras de la solicitud del pedido de accesorios."
- version: '3.20261018'
  fecha: 18/10/2026
  cambios:
  - "Confirmar la orden sin accesorios ya no falla para el comprador: el aviso a Logística se arma aunque no pueda leer las compañías de los demás usuarios."
- version: '2.20261017'
  fecha: 17/10/2026
  cambios:
  - "El pedido de accesorios no vuelve a proponer lo que la orden ya trae en sus componentes (prueba en dev1 del 17-oct)."
- version: '1.20261017'
