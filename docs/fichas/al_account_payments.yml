titulo: Medios de pago SUNAT
subtitulo: >-
  El catálogo de medios de pago de SUNAT y el número de operación bancaria en
  cada pago, registrados desde el mismo asistente con el que se paga la
  factura.
categoria: Localización Perú · Contabilidad
etiquetas: [Medios de pago, Bancarización, Número de operación, Tabla 1 SUNAT, Detracciones]
portada: screenshots/03-asistente-pago.png

destacados_intro: >-
  Dos datos que cualquier fiscalización pide y que Odoo no guarda de serie:
  con qué medio se pagó y qué número de operación dio el banco.
destacados:
  - icono: "001"
    titulo: Catálogo SUNAT cargado
    texto: >-
      Los 20 medios de pago de la tabla de SUNAT, del 001 Depósito en cuenta al
      999 Otros medios de pago, listos al instalar.
  - icono: "→"
    titulo: Desde el asistente de pago
    texto: >-
      **Medio pago** y **Número de operación banco** se llenan al pagar la
      factura y pasan solos al pago creado, también en pagos agrupados.
  - icono: "S/"
    titulo: Sustento de bancarización
    texto: >-
      Cada pago queda con el medio utilizado y la referencia bancaria para
      cruzarla con el extracto.
  - icono: "SP"
    titulo: Marca para detracción
    texto: >-
      Cada medio indica si es válido para el depósito de detracciones; en el
      catálogo inicial, la 003 Transferencia de fondos.

contexto:
  titulo: El problema que resuelve
  texto: >-
    La Ley para la Lucha contra la Evasión y para la Formalización de la
    Economía obliga a pagar con **medios de pago bancarizados** las
    obligaciones desde cierto importe; si no, el gasto y el crédito fiscal
    pueden desconocerse. Para sustentarlo hay que saber, pago por pago, **qué
    medio se usó** según la tabla de SUNAT y **qué número de operación** dio el
    banco.


    En Odoo estándar ese dato queda en el extracto o en una hoja aparte. Este
    módulo lo guarda en el propio pago y lo pide en el momento de registrarlo.
  nota: >-
    **Sin cambiar el flujo de pagos.** Los campos se añaden al formulario de
    pago y al asistente **Pagar** nativos; no hay pantallas nuevas que
    aprender. Los dos son opcionales.

pasos_intro: >-
  Recorrido con los datos de demostración del proveedor DEMO PAGO Proveedor SAC.
pasos:
  - titulo: El catálogo de medios de pago
    ruta: Perú ▸ Configuración ▸ Tributos SUNAT ▸ Medios de pago
    texto: >-
      Lista con el **Código** y la **Descripción** de cada medio. Las columnas
      **Código de facturador** y **Para detracción** están ocultas por defecto:
      actívelas desde el selector de columnas. También en **Contabilidad ▸
      Configuración ▸ Medios de pago**.
    imagen: screenshots/01-catalogo.png

  - titulo: Ficha del medio de pago
    ruta: Medios de pago ▸ 003 TRANSFERENCIA DE FONDOS
    texto: >-
      Cada medio tiene código (hasta 4 caracteres), descripción, **Código de
      facturador** y la casilla **Para detracción**. Puede crear medios nuevos
      o archivar los que no use.
    imagen: screenshots/02-medio-pago.png

  - titulo: Pagar la factura indicando el medio
    ruta: Contabilidad ▸ Proveedores ▸ Facturas ▸ Pagar
    texto: >-
      El asistente **Pagar** muestra **Medio pago** y **Número de operación
      banco**. El medio se busca por código o por descripción: escriba `003` o
      `transferencia`.
    imagen: screenshots/03-asistente-pago.png
    pie: "Factura F001-00004588 de S/ 590,00 pagada por transferencia, operación 00461390."

  - titulo: El pago guarda los datos
    ruta: Contabilidad ▸ Proveedores ▸ Pagos
    texto: >-
      El pago creado lleva el medio y el número de operación del asistente.
      Mientras está en borrador se pueden editar en el formulario; una vez
      confirmado quedan de solo lectura.
    imagen: screenshots/04-pago.png
    pie: "Pago PBNK1/2026/00002 de S/ 590,00: 003 - TRANSFERENCIA DE FONDOS, operación 00458721."

funcionalidades:
  - grupo: Catálogo
    items:
      - "Modelo **Medios de pago** con código, descripción, código de facturador y marca **Para detracción**."
      - 20 medios de pago SUNAT cargados al instalar (001 a 011, 101 a 108 y 999).
      - Registros mostrados como «código - descripción» y búsqueda por cualquiera de los dos.
      - Archivado de medios que no se usan.
  - grupo: Pagos
    items:
      - "**Medio pago** y **Número de operación banco** en el formulario del pago, editables en borrador."
      - Los mismos campos en el asistente **Pagar**.
      - Traslado automático del asistente al pago, también al pagar varias facturas en un pago agrupado.
      - Sin medio de pago elegido, el pago queda con el campo vacío.
  - grupo: Menús
    items:
      - "Perú ▸ Configuración ▸ Tributos SUNAT ▸ Medios de pago."
      - "Contabilidad ▸ Configuración ▸ Medios de pago."

