configuracion:
  - Instale el módulo desde Aplicaciones; el catálogo se carga solo.
  - "Revise el catálogo en **Perú ▸ Configuración ▸ Tributos SUNAT ▸ Medios de pago** y archive los medios que no use."
  - Al registrar cada pago, elija el medio y anote el número de operación del banco.
requisitos_nota: >-
  Funciona en Community y Enterprise. Cualquier usuario interno puede
  consultar y mantener el catálogo.

faq:
  - pregunta: ¿Puedo completar el medio de pago después de confirmar el pago?
    respuesta: >-
      En el formulario los dos campos solo se editan en borrador. Si el pago ya
      está confirmado, restablézcalo a borrador, complételos y vuelva a
      confirmarlo.
  - pregunta: ¿Por qué no veo las columnas Código de facturador y Para detracción?
    respuesta: >-
      Son columnas opcionales de la lista. Actívelas desde el selector de
      columnas, a la derecha de la cabecera.
  - pregunta: Si modifico el catálogo, ¿se pierden mis cambios al actualizar el módulo?
    respuesta: >-
      No. Los medios de pago iniciales se cargan una sola vez y las
      actualizaciones del módulo no los sobrescriben.

