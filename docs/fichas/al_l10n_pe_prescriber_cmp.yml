titulo: "PE - Farmacia: verificación del médico en el CMP"
subtitulo: "Abre el portal «Conoce a tu médico» del Colegio Médico del Perú para buscar la colegiatura y registra si el médico está hábil, con fecha y responsable."
categoria: "Salud · Perú"
etiquetas: [Farmacia, CMP, Colegio Médico, Receta, Perú]

destacados:
  - icono: "⌕"
    titulo: "Al portal en un clic"
    texto: "El botón abre «Conoce a tu médico» para buscar la colegiatura del prescriptor."
  - icono: "✓"
    titulo: "Verificación registrada"
    texto: "El químico farmacéutico marca hábil o inhábil; quedan la fecha y quién verificó."
  - icono: "⛔"
    titulo: "Inhábil no valida"
    texto: "Una receta de un médico inhábil no se valida."

contexto:
  titulo: "El problema que resuelve"
  texto: "La receta debe llevar el nombre y la colegiatura del prescriptor (BPOF 7.5.2.9) y conviene verificar que el médico esté hábil."
  nota: "**Sin consulta automática:** desde 2026 el portal del CMP pide iniciar sesión y reCAPTCHA; no se automatiza para no saltar esa protección."

funcionalidades:
  - "Botón «Consultar en el CMP» (URL configurable)."
  - "Botones «Verificado: hábil» e «inhábil», solo para el químico farmacéutico."
  - "Consejo regional, fecha y responsable de la verificación."

novedades:
  - version: 2.20261018
    fecha: 18/10/2026
    cambios:
      - "El portal del CMP pasó a conoceatumedico.cmp.org.pe con inicio de sesión y reCAPTCHA: la consulta automática se reemplaza por la apertura del portal y la verificación registrada."
  - version: 1.20261018
    fecha: 18/10/2026
    cambios:
      - "Primera versión: consulta automática del portal antiguo."

relacionados: [al_pharmacy_prescription, al_pharmacy_pos]
