titulo: Numeración por secuencia y Series CPE
subtitulo: >-
  Controle la serie y el correlativo de sus comprobantes electrónicos:
  F001-00000001, B001-00000001, FC01-00000001… Numeración sin huecos, opcional
  por diario, que no toca los diarios que usted no active.
categoria: Localización Perú · Facturación electrónica
etiquetas: [Series CPE, Serie-correlativo SUNAT, Sin huecos, Notas de crédito y débito, Opcional por diario]
portada: screenshots/08-factura-serie.png

destacados_intro: >-
  Dos formas de numerar, según el diario, y ninguna obligación: sin activar la
  casilla, el diario numera exactamente como Odoo estándar.
destacados:
  - icono: "F"
    titulo: Series CPE
    texto: >-
      Cada serie (F001, B001…) agrupa sus series rectificativas de nota de
      crédito y débito. Al publicarla se crean sus tres secuencias.
  - icono: "✓"
    titulo: Opcional por diario
    texto: >-
      La casilla **Numerar por secuencia** decide diario a diario. Los demás
      siguen con la numeración nativa, incluida la de documentos latam.
  - icono: "00"
    titulo: Sin huecos
    texto: >-
      Secuencias sin huecos y con relleno de 8 dígitos. El número se asigna al
      publicar, no al crear el borrador.
  - icono: "NC"
    titulo: Rectificativas correctas
    texto: >-
      Las notas de crédito y débito toman la serie rectificativa de la serie del
      comprobante que corrigen: una NC de F001 sale como FC01.
  - icono: "#"
    titulo: Número de documento listo
    texto: >-
      El nombre del asiento es a la vez el número de documento serie-correlativo
      que usan la facturación electrónica y los reportes.
  - icono: "CC"
    titulo: Prefijos simples
    texto: >-
      En diarios sin documentos latam basta un prefijo (p. ej. `CC01-`) para
      numerar con una secuencia propia, con serie aparte para las notas de crédito.

contexto:
  titulo: El problema que resuelve
  texto: >-
    SUNAT identifica cada comprobante de pago electrónico por su **serie de
    cuatro caracteres** (F para facturas, B para boletas) y un **correlativo
    continuo** de hasta ocho dígitos. Las notas de crédito y débito llevan su
    propia serie, vinculada a la del comprobante que modifican.


    La numeración nativa de Odoo se basa en el último número del diario y
    permite renumerar, lo que complica mantener varias series en un mismo
    diario o garantizar que no se repitan ni salten números. Este módulo pone
    la numeración en secuencias explícitas, sin huecos, y solo en los diarios
    que usted elija.
  nota: >-
    **No invasivo.** A diferencia de las soluciones que fuerzan la secuencia
    en todos los diarios y desactivan el mecanismo nativo, aquí nada cambia
    hasta que un diario marca **Numerar por secuencia**. Desmarcarla devuelve
    el diario a la numeración estándar.

flujos_intro: >-
  De la serie al número del comprobante, y cómo se decide qué secuencia usa.
flujos:
  - id: series
    titulo: Poner en marcha una serie CPE
    mermaid: |
      flowchart TD
        A[Series CPE ▸ Nuevo] --> B[Tipo de documento<br/>y serie, p. ej. F003]
        B --> C[Se proponen las rectificativas<br/>FC03 y FD03]
        C --> D{¿Formato válido<br/>y serie única?}
        D -- No --> E[Error al guardar]
        D -- Sí --> F[Publicar: se crean tres secuencias<br/>sin huecos, relleno 8]
        F --> G[Diario con Numerar por secuencia<br/>▸ Series CPE]
        G --> H[Comprobantes numerados<br/>F003-00000001…]
        F --> I{¿Deja de usarse?}
        I -- Inhabilitar --> J[Inhabilitada: fuera de los diarios]
        J -- Volver a borrador --> K[Borrador]
    pie: "Formato: facturas F + 3 caracteres; boletas B o E + 3 caracteres."
  - id: numeracion
    titulo: Qué número recibe un comprobante al publicarse
    texto: >-
      La decisión se toma al publicar, solo en diarios con la casilla marcada.
    mermaid: |
      flowchart TD
        A[Comprobante publicado] --> B{¿Diario con<br/>Numerar por secuencia?}
        B -- No --> N[Numeración nativa de Odoo]
        B -- Sí --> C{¿Diario con<br/>Usa Documentos?}
        C -- Sí --> D{Tipo de documento}
        D -- 01 / 03 --> E[Secuencia de la Serie CPE<br/>del comprobante]
        D -- 07 nota de crédito --> F[Secuencia NC de la serie<br/>del documento de origen]
        D -- 08 nota de débito --> G[Secuencia ND de la serie<br/>del documento de origen]
        E --> H{¿Hay secuencia?}
        F --> H
        G --> H
        H -- No --> N
        H -- Sí --> OK[Siguiente número de la secuencia,<br/>con la fecha del asiento]
        C -- No --> I{¿Nota de crédito y diario<br/>con secuencia de NC?}
        I -- Sí --> J[Secuencia de notas de crédito]
        I -- No --> K{¿Tiene Secuencia<br/>de asientos?}
        J --> OK
        K -- Sí --> OK
        K -- No --> N

pasos_intro: >-
  Todas las funciones con los datos de demostración: series F001/F002 y
  B001/B002 en los diarios de ventas del TPV, y un diario de caja chica con
  prefijo simple.
pasos:
  - seccion: Series CPE
    texto: Se crean una vez y se asignan a los diarios.
  - titulo: La lista de series
    ruta: Perú ▸ Configuración ▸ Comprobantes electrónicos ▸ Series CPE
    texto: >-
      Cada serie con su tipo de documento, sus series de nota de crédito y
      débito y su estado. El mismo menú está en **Contabilidad ▸
      Configuración ▸ Series CPE**.
    imagen: screenshots/01-series-cpe.png

  - titulo: Crear una serie
    ruta: Series CPE ▸ Nuevo
    texto: >-
      Elija **(01) Factura** o **(03) Boleta** y escriba la serie. Al escribirla
      se proponen las rectificativas: F003 → **FC03** y **FD03** (solo si están
      vacías; puede cambiarlas).
    imagen: screenshots/02-serie-nueva.png

  - titulo: Formato validado al guardar
    ruta: Series CPE ▸ Guardar
    texto: >-
      Facturas: `F` + 3 caracteres alfanuméricos; boletas: `B` o `E` + 3. Una
      serie repetida en la misma compañía también se rechaza.
    imagen: screenshots/03-error-formato.png

  - titulo: Publicar la serie
    ruta: Series CPE ▸ Publicar
    texto: >-
      **Publicar** crea las secuencias del comprobante, de la nota de crédito y
      de la nota de débito (sin huecos, relleno 8) y la serie queda disponible
      en los diarios. Publicada ya no se edita. El botón **Comprobantes** de la
      barra superior cuenta y abre los documentos de la serie.
    puntos:
      - El grupo **Secuencias** solo se ve en modo desarrollador.
    imagen: screenshots/04-serie-publicada.png
    pie: "Serie F002 con sus secuencias CPE/01/F002, CPE/07/FC02 y CPE/08/FD02."

  - titulo: Inhabilitar una serie
    ruta: Series CPE ▸ Inhabilitar
    texto: >-
      **Inhabilitar** retira la serie: deja de ofrecerse en los diarios, que
      solo admiten series publicadas. **Volver a borrador** la reabre.
    imagen: screenshots/05-serie-inhabilitada.png

  - titulo: Tipos de documento
    ruta: Perú ▸ Configuración ▸ Comprobantes electrónicos ▸ Tipos de documento
    texto: >-
      Acceso desde la app Perú al catálogo nativo de tipos de documento, en el
      que se apoyan las series.
    imagen: screenshots/06-tipos-documento.png

  - seccion: Comprobantes con serie
    texto: Diarios con Usa Documentos.
  - titulo: Asignar las series al diario
    ruta: Perú ▸ Configuración ▸ Contabilidad ▸ Diarios
    texto: >-
      En el grupo **Numeración por secuencia — CPE Perú (opcional)** marque
      **Numerar por secuencia**. En un diario con **Usa Documentos** aparece
      **Series CPE**: asigne las series publicadas que se emiten desde él.
    imagen: screenshots/07-diario-series.png
    pie: Diario Facturas TPV con las series F001 y F002.

  - titulo: Elegir la serie en el comprobante
    ruta: Contabilidad ▸ Clientes ▸ Facturas
    texto: >-
      En el borrador, la **Serie CPE** aparece junto al tipo de documento. Si el
      diario tiene una sola serie para ese tipo, se asigna sola; si tiene varias,
      elija una. Al cambiar de diario o de tipo de documento la serie se
      revalida.
    imagen: screenshots/08-factura-serie.png
    pie: Factura en borrador del diario Facturas TPV, que ofrece F001 y F002.

  - titulo: La factura toma el número de su serie
    ruta: Factura ▸ Confirmar
    texto: >-
      Al confirmar, el comprobante recibe el siguiente número de la secuencia
      de la serie. El nombre es a la vez el número de documento
      serie-correlativo.
    imagen: screenshots/09-factura-f002.png
    pie: "«DEMO serie F002»: F002-00000002 por S/ 1.180,00."

  - titulo: La nota de crédito usa la serie rectificativa
    ruta: Factura ▸ Nota de crédito
    texto: >-
      La nota de crédito (07) se numera con la serie de nota de crédito de la
      serie del documento que corrige; la de débito (08), con su serie de nota
      de débito.
    imagen: screenshots/10-nota-credito-fc02.png
    pie: Nota de crédito de F002-00000002 numerada FC02-00000001.

  - titulo: Comprobantes de la serie
    ruta: Series CPE ▸ F002 ▸ Comprobantes
    texto: >-
      Lista de todos los documentos asignados a la serie, incluidos los
      borradores y las notas que tomaron su serie rectificativa.
    imagen: screenshots/11-comprobantes-serie.png

  - seccion: Diarios sin documentos latam
    texto: Una serie por diario con un prefijo simple.
  - titulo: Prefijo simple
    ruta: Perú ▸ Configuración ▸ Contabilidad ▸ Diarios
    texto: >-
      En diarios sin **Usa Documentos** (ventas, compras o misceláneos) escriba
      el **Prefijo (serie)**: al guardar se crea la **Secuencia de asientos** con
      ese prefijo, sin huecos y relleno 8. En ventas y compras puede indicar
      además un **Prefijo NC (serie)** para las notas de crédito.
    puntos:
      - La secuencia de asientos y la de notas de crédito no pueden ser la misma.
    imagen: screenshots/12-diario-prefijo.png

  - titulo: Botón Generar
    ruta: Diario ▸ Secuencia de asientos ▸ Generar
    texto: >-
      Si el diario no tiene secuencia, **Generar** la crea con el prefijo
      indicado —o con el código del diario si no hay prefijo— en la compañía
      del diario.
    imagen: screenshots/13-boton-generar.png

  - titulo: Asientos numerados con el prefijo
    ruta: Contabilidad ▸ Contabilidad ▸ Asientos contables
    texto: >-
      Cada asiento publicado en el diario toma el siguiente número de su
      secuencia.
    imagen: screenshots/14-asiento-cc01.png
    pie: "Segundo gasto de caja chica: CC01-00000002 por S/ 142,50."

campos_intro: >-
  Cada campo que añade el módulo, dónde está y qué efecto tiene.
campos:
  - grupo: Serie CPE
    ruta: Perú ▸ Configuración ▸ Comprobantes electrónicos ▸ Series CPE
    campos:
      - [Tipo de documento, "(01) Factura o (03) Boleta.", Vacío, "Define el formato de la serie y a qué comprobantes se ofrece"]
      - [Serie, "Serie de 4 caracteres (F001, B001…).", Vacío, "Única por compañía; propone las rectificativas"]
      - [Serie nota de crédito, Serie de las NC de los comprobantes de esta serie., "Propuesta: letra + C + últimos 2", "Prefijo de la secuencia de NC"]
      - [Serie nota de débito, Serie de las ND., "Propuesta: letra + D + últimos 2", "Prefijo de la secuencia de ND"]
      - [Compañía, Compañía de la serie y de sus secuencias., Compañía actual, Solo visible con varias compañías]
      - [Secuencia del comprobante / de nota de crédito / de nota de débito, Secuencias creadas al publicar., Solo lectura, Visibles en modo desarrollador]
      - [Estado, "Borrador, Publicada o Inhabilitada.", Borrador, Solo las publicadas se asignan a diarios]
      - [Comprobantes, Documentos con esta serie., Calculado, Abre la lista]
  - grupo: Diario
    ruta: Diario ▸ Numeración por secuencia — CPE Perú (opcional)
    texto: El grupo aparece en diarios de ventas, compras y misceláneos.
    campos:
      - [Numerar por secuencia, Activa la numeración por secuencia en el diario., Desmarcado, "Sin marcar, numeración nativa"]
      - [Series CPE, Series publicadas que se emiten desde el diario., Vacío, "Solo con Usa Documentos; única modalidad en esos diarios"]
      - [Prefijo (serie), "Prefijo de la secuencia de asientos, p. ej. «CC01-».", Vacío, "Al guardar crea la secuencia; vacío usa el código del diario"]
      - [Secuencia de asientos, Secuencia que numera los asientos., Vacío, "Se crea sola al marcar la casilla; botón Generar"]
      - [Prefijo NC (serie), Prefijo de la secuencia de notas de crédito., Vacío, "Solo ventas y compras; al guardar crea la secuencia de NC"]
      - [Secuencia de notas de crédito, Secuencia propia de las NC., Vacío, "Vacía: las NC usan la secuencia de asientos; Generar usa R + código"]
  - grupo: Comprobante
    ruta: Contabilidad ▸ Clientes ▸ Facturas
    campos:
      - [Serie CPE, Serie con la que se numera el comprobante., "Única serie candidata del diario, o vacía", "Solo en borrador y si el diario tiene series"]

asientos_intro: >-
  El módulo no cambia los importes: da el número al asiento. Asientos reales de
  los datos de demostración.
asientos:
  - titulo: Factura numerada con la serie F002
    referencia: F002-00000002
    texto: Factura «DEMO serie F002» a DEMO Distribuidora Norte SAC.
    lineas:
      - [1213000, "Facturas por cobrar — DEMO serie F002 - F002-00000002", "1.180,00", ""]
      - [7012100, "Mercaderías – Venta local — Servicio de instalación de red, setiembre 2026", "", "1.000,00"]
      - [4011100, IGV – Cuenta propia (IGV 18 %), "", "180,00"]
  - titulo: Nota de crédito con la serie rectificativa FC02
    referencia: FC02-00000001
    texto: >-
      Anula la factura anterior («DEMO error en el precio»): toma la serie de
      nota de crédito de F002.
    lineas:
      - [7012100, "Mercaderías – Venta local — Servicio de instalación de red, setiembre 2026", "1.000,00", ""]
      - [4011100, IGV – Cuenta propia (IGV 18 %), "180,00", ""]
      - [1213000, Facturas por cobrar, "", "1.180,00"]
  - titulo: Asiento de caja chica con prefijo simple
    referencia: CC01-00000002
    texto: Diario DEMO Caja chica, secuencia con prefijo CC01-.
    lineas:
      - [6560000, Suministros — Útiles de oficina, "142,50", ""]
      - [1041001, Banco — Útiles de oficina, "", "142,50"]

funcionalidades:
  - grupo: Series CPE
    items:
      - Serie de factura (01) o boleta (03) con series rectificativas de nota de crédito y débito.
      - Rectificativas propuestas al escribir la serie (F001 → FC01 / FD01).
      - Validación del formato SUNAT de la serie y unicidad por compañía.
      - Tres secuencias sin huecos, relleno 8, creadas al publicar.
      - Estados Borrador, Publicada e Inhabilitada, con historial de cambios.
      - Botón **Comprobantes** con los documentos de la serie.
  - grupo: Numeración
    items:
      - Casilla **Numerar por secuencia** por diario, desactivada por defecto.
      - En diarios con documentos latam, solo numeran las Series CPE asignadas; sin serie resoluble, el comprobante numera de forma nativa.
      - Serie autoasignada cuando el diario tiene una sola candidata para el tipo de documento.
      - Notas de crédito (07) y débito (08) con la serie rectificativa del documento de origen.
      - En los demás diarios, prefijo simple y secuencia opcional para notas de crédito.
      - Número asignado al publicar, con la fecha del asiento para prefijos y rangos con fecha.
  - grupo: Compatibilidad
    items:
      - El nombre generado (p. ej. F001-00000001) se toma completo como número de documento latam.
      - Sin la validación nativa entre el número y la fecha del asiento en los diarios con secuencia.
      - Sin el aviso nativo de hueco al cancelar en secuencias sin huecos.
      - Menús en la app Perú y en Contabilidad ▸ Configuración.

ejemplos:
  - titulo: Qué serie usa cada comprobante
    texto: >-
      Diario Facturas TPV con **Usa Documentos**, **Numerar por secuencia** y
      las series F001 y F002 asignadas:
    tabla:
      - [Comprobante, Serie que numera, Número real]
      - ["Factura (01) con serie F002", F002, F002-00000002]
      - ["Nota de crédito (07) de F002-00000002", FC02, FC02-00000001]
      - ["Nota de débito (08) de una factura F002", FD02, "Siguiente de FD02-"]
    nota: La serie rectificativa sale de la serie del documento de origen, no de la que tenga la nota.

  - titulo: Prefijos simples en un diario sin documentos latam
    tabla:
      - [Configuración del diario, Resultado]
      - ["Prefijo (serie) `CC01-`", "Secuencia «DEMO Caja chica (DCCH)»: CC01-00000001, CC01-00000002…"]
      - ["Prefijo NC (serie) `FC01-` (ventas o compras)", "Notas de crédito del diario: FC01-00000001…"]
      - ["Casilla marcada sin prefijo", "Secuencia con el código del diario como prefijo: `DCCH-`"]
      - ["Botón **Generar** de notas de crédito sin prefijo NC", "Secuencia con prefijo `RDCCH-`"]

configuracion:
  - Instale el módulo desde Aplicaciones.
  - "Cree y publique sus series en **Perú ▸ Configuración ▸ Comprobantes electrónicos ▸ Series CPE**."
  - "En cada diario que deba numerar por secuencia, marque **Numerar por secuencia** y asigne sus **Series CPE** (o escriba el prefijo si el diario no usa documentos)."
  - Emita un comprobante de prueba y compruebe el número al confirmarlo.
requisitos_nota: >-
  Funciona en Community y Enterprise. Gestionar las Series CPE requiere el
  rol de administrador de Contabilidad; los usuarios internos solo las leen.

faq:
  - pregunta: Marqué Numerar por secuencia pero la factura sigue con la numeración nativa
    respuesta: >-
      En diarios con **Usa Documentos** solo cuentan las Series CPE: asigne al
      diario al menos una serie publicada del tipo de documento y elija la serie
      en el comprobante.
  - pregunta: ¿Por qué no aparece el campo Serie CPE en la factura?
    respuesta: >-
      Solo se muestra en borrador y cuando el diario tiene Series CPE asignadas.
  - pregunta: ¿Se reutiliza el número de un comprobante cancelado?
    respuesta: >-
      No. Las secuencias no tienen huecos al asignar, pero no retroceden: el
      número cancelado queda usado y Odoo no muestra el aviso de hueco en esos
      diarios.
  - pregunta: ¿Puedo tener varias series en un mismo diario?
    respuesta: >-
      Sí. Asigne varias Series CPE al diario; si hay más de una candidata para
      el tipo de documento, el usuario elige la serie en cada borrador.
  - pregunta: Cambié el prefijo del diario y los números siguen con el anterior
    respuesta: >-
      El prefijo se usa al **crear** la secuencia. Si el diario ya tiene una,
      cambie el prefijo en la propia secuencia o quítela del diario y pulse
      **Generar** para crear otra.
  - pregunta: ¿Afecta a los diarios que no marco?
    respuesta: >-
      No. Sin la casilla, el diario numera igual que el Odoo estándar.

