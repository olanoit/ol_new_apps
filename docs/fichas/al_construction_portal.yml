titulo: "Aplicación de obra"
subtitulo: >-
  El trabajo de campo en el celular y la tablet, con o sin señal: avance con
  fotos, parte diario, tareo, pedidos, recepción, devolución y valorizaciones.
categoria: Construcción · Proyectos
portada: screenshots/01-inicio.png
etiquetas: [Aplicación instalable, Sin señal, Avance con fotos, Parte diario, Tareo, Requerimientos]

destacados_intro: >-
  Una aplicación instalable desde el navegador para el capataz, la contrata y
  la oficina técnica (requerimiento CREVAL v1.0, 4.11).
destacados:
  - icono: "⇅"
    titulo: Funciona sin señal
    texto: >-
      Lo registrado queda en el celular y se envía solo al volver la
      conexión, sin duplicados.
  - icono: "▣"
    titulo: QR y PIN
    texto: >-
      El cartel de la obra lleva un QR; cada persona entra con su PIN de 4
      dígitos, o con usuario y clave.
  - icono: "≡"
    titulo: Tareo por partida
    texto: >-
      Las horas de la cuadrilla por partida reparten el jornal: el costo de
      personal propio llega a cada partida.

contexto:
  titulo: El problema que resuelve
  texto: >-
    En la obra no siempre hay señal; los avances, partes y pedidos se
    anotaban en papel o en mensajes y se pasaban a Odoo días después.

pasos_intro: >-
  Se instala desde el navegador en /obra/app/; no necesita la tienda de
  aplicaciones.
pasos:
  - titulo: Inicio
    ruta: /obra/app/
    texto: >-
      Elige la obra y muestra las partidas por validar, lo pendiente de enviar
      y las entregas por recibir.
    imagen: screenshots/01-inicio.png
  - titulo: Registrar avance
    ruta: Avance ▸ partida
    texto: >-
      Cantidad o porcentaje, al menos una foto, la ubicación del celular y el
      motivo si es re-trabajo. Entra «Por validar».
    imagen: screenshots/02-avance.png
  - titulo: Sin señal
    ruta: Por enviar
    texto: >-
      La cola de lo registrado sin conexión; se envía sola al volver la señal.
    imagen: screenshots/03-sin-senal.png
  - titulo: Cuadrilla y tareo
    ruta: Cuadrilla y tareo
    texto: >-
      Asistencia con la hora de entrada y las horas de cada persona por
      partida, en la tablet de la obra.
    imagen: screenshots/04-cuadrilla.png
  - titulo: Requerimientos
    ruta: Requerimientos
    texto: >-
      Materiales de la partida con su saldo, EPP y útiles de oficina con kits
      armados.
    imagen: screenshots/05-pedidos.png
  - titulo: Valorizaciones de la contrata
    ruta: Valorizaciones y pagos
    texto: >-
      Detalle con deductivos, fondo de garantía, detracción y el neto a su
      cuenta.
    imagen: screenshots/06-valorizacion.png

novedades:
  - version: '6.20261025'
    fecha: 26/10/2026
    cambios:
    - "CR-16, criterio 5: ajuste «Devolución de lo dañado»: lo que la obra devuelve como dañado vuelve en su propia transferencia a esa ubicación (Bajas del almacén); vacío, se desecha en la obra como antes."
  - version: '5.20261025'
    fecha: 26/10/2026
    cambios:
    - "CR-17: el rol no repite el tipo cuando la actividad ya lo dice («Drywall (contrata)»)."
  - version: '4.20261025'
    fecha: 26/10/2026
    cambios:
    - "CR-17: Avance, Requerimientos y Cuadrilla y tareo muestran el código y el nombre de la partida, con su nivel superior y el rol; ya no la ruta interna. El servicio agrega task_code, task_name, parent_label y role_label sin quitar los campos anteriores; lo guardado sin señal se envía igual."
    - "CR-17: el catálogo de Requerimientos busca por producto y por código o nombre de la partida."
    - "7.1: el parte diario lista los avances reportados y validados del día con su estado. 7.2: el tareo dice partida y rol en cada columna y agrupa por partida. 7.3: el requerimiento interno pedido desde el portal queda en la obra."
    - "Tareo: la marcación de la cuadrilla registra las horas del tareo completas; la salida se corre lo que dura el almuerzo del horario del empleado (Odoo lo descuenta de las horas trabajadas)."
  - version: '3.20261025'
    fecha: 25/10/2026
    cambios:
    - "Avance sobre el saldo más la tolerancia según la política del plan, como en el prototipo: con aprobación adicional se envía como exceso y lo aprueba la jefatura; con solo alerta se envía con aviso; con bloqueo no se guarda."
  - version: '2.20261024'
    fecha: 24/10/2026
    cambios:
    - "Pantallas según el prototipo «Portal de obra CREVAL»: ingreso con la marca de la empresa, mostrar la clave y «Mantener la sesión en este celular»; QR leído con la cámara; inicio con la semana de la obra y los contadores de avances por validar, pedidos en aprobación y entregas de hoy."
    - "Avance: el exceso sobre el saldo más la tolerancia del plan se avisa y no se guarda (Odoo no lo acepta); GPS dentro o fuera del radio de la obra; pantalla «Avance guardado» con los registros de hoy."
    - "Parte diario ya llenado con el personal propio que marcó hoy, cada contrata de la obra y los avances del día; cuadrilla en dos columnas en la tablet con Presente/Falta y total de 8 horas."
    - "Requerimientos con los materiales de las recetas de la cuadrilla; recepción con el estado de cada producto (completo, faltan, llegó de más); devolución eligiendo cada producto."
    - "Contrata: tarjeta de la orden (contratado, valorizado, fondo y deductivos), detalle con las partidas de más avance, el re-trabajo no pagado, el neto que descuenta el adelanto, los pagos y el PDF del valorizado y de la factura."
  - version: '1.20261024'
    fecha: 24/10/2026
    cambios:
    - "Primera versión: aplicación de obra instalable y sin señal con servicios JSON, ingreso por QR y PIN, parte diario, tareo por partida, catálogos con kits, recepción y devolución (requerimiento CREVAL v1.0, 4.11)."

relacionados: [al_construction_planner_subcontract, al_construction_material_request, al_construction_attendance, al_construction_planner_crew]
