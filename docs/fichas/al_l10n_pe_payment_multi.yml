configuracion:
  - "Diario de banco o caja con «Comprobante de pago numerado» si quiere imprimir el comprobante de egreso."
  - "Ajustes ▸ Perú ▸ Anticipos y aplicación de documentos: cuentas 122 y 422 para las líneas de anticipo."

faq:
  - pregunta: "¿Cómo anulo un pago múltiple?"
    respuesta: >-
      Con «Anular» en el pago múltiple: el pago y su asiento quedan anulados y las
      facturas, abiertas. «Volver a borrador» permite corregirlo y validarlo de
      nuevo.
  - pregunta: "¿Puedo pagar una factura en dólares desde un banco en soles?"
    respuesta: >-
      Sí: el importe va en dólares y se convierte al cambio de la fecha del pago;
      Odoo registra la diferencia con el cambio de la factura.
  - pregunta: "¿Puedo empezar desde la lista de facturas?"
    respuesta: >-
      Sí: seleccione las facturas y elija Acción ▸ Pago múltiple.

