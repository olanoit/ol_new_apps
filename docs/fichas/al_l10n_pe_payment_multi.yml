titulo: Pago múltiple
subtitulo: >-
  Un solo movimiento de banco o caja para pagar facturas de varios proveedores,
  entregar anticipos y registrar otros pagos; y un solo depósito para cobrar
  facturas de varios clientes.
categoria: Localización Perú · Tesorería
etiquetas: [Pago múltiple, Cobro múltiple, Varios socios, Anticipos, Comprobante de egreso]
portada: screenshots/form.png

destacados_intro: >-
  Sobre el pago estándar de Odoo 19: el resultado es un pago normal, con su
  conciliación y su diferencia de cambio.
destacados:
  - icono: "1"
    titulo: Un movimiento, un pago
    texto: >-
      Una línea de banco por el total y una contrapartida por línea: el extracto
      se concilia con un solo pago.
  - icono: "∑"
    titulo: Varios socios
    texto: >-
      Facturas de distintos proveedores o clientes, también en parte y con notas
      de crédito que descuentan.
  - icono: "+"
    titulo: Anticipos y otros pagos
    texto: >-
      Adelantos a la 422 o la 122 y gastos sin comprobante (comisiones, ITF) con
      su distribución analítica.
  - icono: "$"
    titulo: Otra moneda
    texto: >-
      Cada comprobante en su moneda al cambio de la fecha del pago; la diferencia
      de cambio la registra Odoo.

contexto:
  titulo: El problema que resuelve
  texto: >-
    El banco carga en un solo movimiento lo que la empresa paga a varios
    proveedores, más la comisión. Odoo solo agrupa pagos de un mismo socio: con
    varios, el extracto queda contra varios pagos y no hay un comprobante de
    egreso que muestre el detalle.
  nota: >-
    **Retenciones y detracciones.** La factura sujeta a retención se paga con
    «Registrar pago», que emite el comprobante de retención del proveedor; la
    detracción se deposita en el Banco de la Nación con su propio asistente.

pasos_intro: >-
  Dos facturas de proveedores de transporte (S/ 1 475,00 y S/ 566,40), un anticipo
  de S/ 300,00 a un tercer proveedor y la comisión de S/ 7,50, en una sola
  transferencia de S/ 2 348,90.
pasos:
  - titulo: Crear el pago múltiple
    ruta: Perú ▸ Proveedores ▸ Pagos múltiples
    texto: >-
      Diario, fecha, medio de pago y número de operación. «Cargar documentos» trae
      las facturas abiertas de los socios elegidos; se agregan el anticipo y la
      comisión.
    imagen: screenshots/form.png
  - titulo: Validar
    texto: >-
      Se crea un solo pago con su asiento; cada factura queda conciliada y el
      anticipo, pendiente de aplicar.
  - titulo: Imprimir el comprobante de egreso
    texto: >-
      «Varios (ver detalle)» y el socio de cada comprobante, el anticipo y la
      comisión, con el monto en letras.
    imagen: screenshots/receipt.png

asientos_intro: >-
  El asiento del ejemplo, en el diario del banco.
asientos:
