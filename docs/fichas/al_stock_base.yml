titulo: Base de Inventario Perú
subtitulo: >-
  La página **Logística PE** de las transferencias: guía de remisión, transporte,
  libros electrónicos y requerimiento de obra en un solo lugar, agrupados por
  tema.
categoria: Localización Perú · Inventario
etiquetas: [Logística PE, Guía de remisión, Transporte, PLE, Módulo base]
portada: screenshots/02-logistica-pe.png

destacados_intro: >-
  Un módulo liviano, sin lógica de negocio propia, del que cuelgan los datos
  peruanos de las transferencias.
destacados:
  - icono: "PE"
    titulo: Una sola página
    texto: >-
      Todo lo peruano de la transferencia en **Logística PE**, como
      «Facturación PE» en la factura.
  - icono: "▤"
    titulo: Por grupos
    texto: >-
      Guía de remisión y transporte arriba; libros electrónicos y obra debajo.
      Cada grupo aparece solo si su módulo está instalado.

pasos:
  - titulo: La transferencia
    ruta: Inventario ▸ Operaciones ▸ Transferencias ▸ abrir una
    texto: >-
      La cabecera queda limpia: los datos peruanos ya no se mezclan con
      «Documento origen» ni «Propietario».
    imagen: screenshots/01-formulario.png
  - titulo: Logística PE
    ruta: Inventario ▸ Operaciones ▸ Transferencias ▸ pestaña Logística PE
    texto: >-
      **Guía de remisión** (estado, número, ticket, modalidad, motivo y fecha
      de inicio del traslado) y **Transporte** (vehículo, conductor, documento
      relacionado y observaciones), y debajo **Libros electrónicos (PLE)**
      (tipo de operación de la tabla 12 y consignación) y, si la transferencia
      viene de un requerimiento, **Requerimiento de obra**.
    imagen: screenshots/02-logistica-pe.png

novedades:
  - version: '7.20261027'
    fecha: 27/10/2026
    cambios:
      - "Ícono nuevo: el isotipo de ALTA."
  - version: '6.20261024'
    fecha: 24/10/2026
    cambios:
      - "Devolver una transferencia sin cantidades muestra «Indique la cantidad a devolver de al menos un producto» en lugar del error «Falta el valor requerido para el campo Ubicación de destino», que provocaba mrp_subcontracting con el asistente sin líneas."
  - version: '4.20261024'
    fecha: 24/10/2026
    cambios:
      - "Paquete 1.11, M111-13: validar un despacho con una fracción de plancha da el error de planchas enteras aunque ninguna línea esté marcada «Recogido»."
      - "Paquete 1.11, M111-19 A: Ajustes › Inventario › «Resumen de inventario» elige el estilo de las tarjetas (Estándar de Odoo o Compacta), su ancho y si llevan el gráfico; cada usuario puede elegir otro estilo en sus preferencias."
      - "Paquete 1.11, M111-19 D: casillas de alcance de las planchas enteras (despacho a producción, requerimiento de obra y compras)."
      - "Paquete 1.11, M111-18: la compra de un tablero indivisible se redondea en planchas y luego pasa a la unidad de compra; la validación en lote ya no falla por la firma de _sanity_check."
  - version: '3.20261023'
    fecha: 23/10/2026
    cambios:
      - "Paquete 1.11, M111-12 (fase B): producto retazo del tablero («Producto retazo», «Es retazo», «Retazo de») y costo fijo de una salida de producción."
  - version: '2.20261023'
    fecha: 23/10/2026
    cambios:
      - "Paquete 1.11, M111-09: resumen de inventario compacto, con o sin el planificador de obra: tarjetas sin gráfico, más angostas, con botones pequeños y las etiquetas en español (Con demora, En espera, Órdenes parciales, Movimientos). Antes estaba en el puente de compras del planificador."
      - "Paquete 1.11, M111-12: regla de las planchas enteras: casilla «Pedir tableros en planchas enteras» y tolerancia en la compañía, unidad marcada «Plancha entera» con su área en m², «Plancha indivisible» en el producto, necesidad y redondeo en los movimientos y en la impresión de la transferencia, reserva en planchas enteras y error al validar fracción."
  - version: 1.20261008
    fecha: 08/10/2026
    cambios:
      - "Página Logística PE en las transferencias, con grupos de guía de remisión, transporte, libros electrónicos y requerimiento de obra."

relacionados: [al_l10n_pe_delivery_guide_report, al_l10n_pe_ple, al_construction_material_request, ol_stock_kardex_pe]
