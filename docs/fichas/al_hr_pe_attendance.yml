faq:
  - pregunta: ¿Por qué un trabajador no aparece en el tareaje?
    respuesta: >-
      El tareaje solo incluye a quienes tienen al menos una marcación en el
      periodo. Los planificados sin ninguna marcación se detectan en el
      monitor de asistencia.
  - pregunta: ¿Por qué no se calculan horas extras?
    respuesta: >-
      Hacen falta dos cosas: **Calcular horas extras** en el tareaje y
      **Sujeto a horas extras (PE)** en la versión del trabajador.
  - pregunta: ¿Las ausencias aprobadas cuentan como falta?
    respuesta: >-
      No. Si ese día no hay marcación, el día queda como ausencia aprobada y
      el tareaje no lo clasifica: la ausencia llega a la boleta por sus propias
      entradas de trabajo.
  - pregunta: ¿Por qué el monitor no muestra un día?
    respuesta: >-
      El monitor lista los días con turno publicado en Planeación y los
      descansos de los ciclos atípicos asignados. Un turno en borrador no
      aparece.
  - pregunta: ¿El tareaje lee los turnos de Planeación?
    respuesta: >-
      No. El tareaje compara las marcaciones con el horario de trabajo del
      empleado (o el de la compañía). Los turnos alimentan el monitor.
  - pregunta: Modifiqué el tareaje después de aplicarlo, ¿cómo lo llevo a la boleta?
    respuesta: >-
      Pulse **Reabrir**, corrija, vuelva a **Aplicar al periodo** y recalcule
      la boleta para que relea los días trabajados.

