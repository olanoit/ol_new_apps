titulo: Factoring de facturas
subtitulo: >-
  Ceda facturas a un banco o empresa de factoring, con o sin recurso, y lleve
  la cesión, el desembolso, los intereses y el cobro del factor con sus asientos
  del PCGE.
categoria: Localización Perú · Contabilidad
etiquetas: [Factoring, Factura negociable, CAVALI, Con recurso, Sin recurso, NIIF 9, PCGE]
portada: screenshots/01-operaciones.png

destacados_intro: >-
  La operación se arma sobre las facturas de Odoo: no se duplica la factura ni
  el cobro, y cada paso deja su asiento.
destacados:
  - icono: "⇄"
    titulo: Con y sin recurso
    texto: >-
      Sin recurso la factura se da de baja y la deuda pasa al factor; con
      recurso el adelanto es una obligación financiera.
  - icono: "%"
    titulo: Adelanto y retenido
    texto: >-
      Porcentaje de adelanto por factura; el retenido se cobra cuando el
      cliente paga al factor.
  - icono: "S/"
    titulo: Intereses y comisiones
    texto: >-
      Intereses a 6734 (o diferidos en 3731 y devengados) y comisiones a 6391,
      configurables por modalidad y moneda.
  - icono: "↩"
    titulo: Recompra
    texto: >-
      Con recurso, si el cliente no paga se devuelve el adelanto; la factura
      nunca dejó de estar pendiente de cobro.
  - icono: "✓"
    titulo: Sin dobles cesiones
    texto: >-
      Una factura no se cede dos veces; la pestaña Factoring de la factura
      muestra su operación y estado.
  - icono: "▤"
    titulo: Cartera y análisis
    texto: >-
      Facturas cedidas por factor y vencimiento, con las vencidas en rojo, y
      análisis en tabla dinámica y gráfico.

contexto:
  titulo: El problema que resuelve
  texto: >-
    Las empresas que venden sus facturas a un factor necesitan reflejar en la
    contabilidad la cesión, el dinero recibido, el costo financiero y, si la
    operación es con recurso, la obligación hasta que el cliente pague. Según
    NIIF 9, sin recurso la cuenta por cobrar se da de baja (gasto financiero en
    la 67); con recurso se mantiene y el adelanto es una obligación (45). La
    cesión del crédito no está gravada con IGV ni genera comprobante.
  nota: >-
    **Factura negociable:** se guarda el número de anotación en CAVALI. La
    integración con la API de CAVALI no está incluida.

flujos:
  - id: factoring
    titulo: Operación de factoring
    texto: >-
      Sin recurso, la cesión retira la factura de la cuenta del cliente; con
      recurso la factura sigue pendiente hasta el cobro. El desembolso registra
      el adelanto neto; al final, el cobro del factor o (con recurso) la
      recompra cierran la operación.
    mermaid: |
      flowchart TD
        A[Operación en borrador<br/>factor, modalidad, facturas] --> B{¿Modalidad?}
        B -- Sin recurso --> B1[Ceder facturas<br/>1212 → 1214, factura pagada]
        B -- Con recurso --> B2[Ceder facturas<br/>sin asiento, factura pendiente]
        B1 --> C[Registrar desembolso<br/>banco + intereses + comisión]
        B2 --> C
        C --> D{¿Modalidad?}
        D -- Sin recurso --> E[Cobro del factor<br/>retenido al banco]
        D -- Con recurso --> F[Devengo de intereses<br/>3731 → 6734]
        F --> G{¿El cliente pagó?}
        G -- Sí --> H[Cobro del factor<br/>cancela 4512 y la factura]
        G -- No --> I[Recompra<br/>devuelve el adelanto,<br/>la factura sigue pendiente]
        E --> J[Liquidada]
        H --> J
        I --> K[Recomprada]

pasos_intro: >-
  Ejemplo: factura de S/ 1 000 cedida con un adelanto del 90 %, intereses de
  S/ 20, comisión de S/ 10 y gastos de S/ 5.
pasos:
  - seccion: Ceder las facturas
  - titulo: Elegir las facturas
    ruta: Contabilidad ▸ Clientes ▸ Facturas ▸ Acciones ▸ Ceder a factoring
    texto: >-
      Seleccione las facturas (misma compañía y moneda) y cree la operación en
      borrador, o hágalo desde Perú ▸ Factoring ▸ Operaciones.
  - titulo: Completar la operación
    ruta: Perú ▸ Factoring ▸ Operaciones
    texto: >-
      Indique el factor, la modalidad, el contrato y el % de adelanto. Cada
      factura propone su monto neto pendiente de pago (sin la detracción ni la
      retención del IGV) y su vencimiento; registre la conformidad del cliente
      y la anotación en CAVALI (número y fecha).
    puntos:
      - "Conformidad: expresa, presunta (8 días calendario desde la emisión, DU 013-2020) o disconformidad, que impide ceder."
      - Si la factura es al contado (sin plazo de pago), la cesión lo advierte en el historial.
    imagen: screenshots/02-borrador.png
  - titulo: Ceder
    ruta: Operación ▸ Ceder facturas
    texto: >-
      Sin recurso la factura queda pagada y la deuda pasa al factor (1214). Con
      recurso no hay asiento: la factura sigue pendiente (NIIF 9) y queda
      pagada recién con el cobro del factor. La factura muestra la operación en
      Facturación PE ▸ Factoring.
    imagen: screenshots/07-factura.png

  - seccion: Desembolso y cierre
  - titulo: Registrar el desembolso
    ruta: Operación ▸ Registrar desembolso
    texto: >-
      Banco, fecha, intereses, comisión y gastos. Entra al banco el neto
      (S/ 865 en el ejemplo); con recurso el adelanto queda como obligación
      con el factor (4512).
    imagen: screenshots/03-sin-recurso.png
  - titulo: Devengar intereses
    ruta: Operación ▸ Devengar intereses
    texto: >-
      Solo con recurso y con la cuenta de intereses diferidos: pasa a gasto la
      parte del periodo. Al cerrar la operación se devenga lo que falte.
    imagen: screenshots/05-devengo.png
  - titulo: Cobro del factor (total o parcial)
    ruta: Operación ▸ Cobro del factor
    texto: >-
      Lo que el cliente paga al factor cubre primero el adelanto y después
      libera el retenido. Con una sola factura se puede indicar un importe
      cobrado menor (cobro parcial); la factura sigue cedida por el saldo.
      Si el factor factura su comisión, elija su factura de proveedor: el
      descuento la paga y el IGV queda como crédito fiscal en ella.
    imagen: screenshots/10-cobro-factor.png
  - titulo: Recompra o pérdida del retenido
    ruta: Operación ▸ Recompra / Pérdida del retenido
    texto: >-
      Cuando el cliente paga al factor se cancelan las facturas cedidas y entra
      el retenido. Con recurso, si el cliente no paga, la recompra devuelve al
      factor el adelanto no cubierto y la factura sigue pendiente. Sin recurso,
      el impago es del factor, pero el retenido no liberado pasa a pérdida
      (6741).
    imagen: screenshots/04-con-recurso.png

  - seccion: Seguimiento
  - titulo: Facturas cedidas
    ruta: Perú ▸ Factoring ▸ Facturas cedidas
    texto: >-
      Todas las facturas cedidas con su factor, modalidad, anotación CAVALI,
      adelanto, retenido y estado; las vencidas en rojo.
    imagen: screenshots/06-facturas-cedidas.png
  - titulo: Análisis
    ruta: Perú ▸ Factoring ▸ Análisis
    texto: >-
      Cartera cedida por factor, estado y vencimiento: nominal y lo que falta
      cobrar.
    imagen: screenshots/08-analisis.png
  - titulo: Costo financiero
    ruta: Perú ▸ Factoring ▸ Costo financiero
    texto: >-
      Intereses, comisión, gastos y retenido perdido por factor y mes: el costo
      real de financiarse con factoring.
    imagen: screenshots/11-costo-financiero.png
  - titulo: Cuentas
    ruta: Perú ▸ Configuración ▸ Cuentas de la localización ▸ Factoring
    texto: >-
      Una fila por modalidad y moneda, creada sola con el PCGE; ajústela al
      plan de cuentas de la empresa.
    imagen: screenshots/09-cuentas.png

campos:
  - grupo: Operación
    ruta: Perú ▸ Factoring ▸ Operaciones
    campos:
      - [Factor, Banco o empresa de factoring, —, Tercero de la obligación y (sin recurso) de la deuda cedida]
      - [Modalidad, Con o sin recurso, Sin recurso, Decide los asientos]
      - ["% de adelanto", Parte del nominal que adelanta el factor, 100, Se propone en cada factura; el resto queda retenido]
      - [Diario, Diario de la cesión y del devengo, Primer diario varios, —]
  - grupo: Cuentas del factoring
    ruta: Perú ▸ Configuración ▸ Cuentas de la localización ▸ Factoring
    campos:
      - [Facturas cedidas, Cuenta de las facturas cedidas, 1214, Conciliable]
      - [Obligación con el factor, Adelanto con recurso, 4512, Solo con recurso]
      - [Intereses, Gasto financiero, 6734, —]
      - [Intereses diferidos, Intereses por devengar, 3731, Solo con recurso; vacía va directo a gasto]
      - [Comisiones y gastos, Comisión del factor y gastos, 6391, Si la comisión viene facturada se usa la factura del factor]
      - [Pérdida del retenido, Retenido que el factor no libera, 6741, Solo sin recurso]
  - grupo: Factura cedida
    ruta: Operación ▸ Facturas
    campos:
      - [Valor nominal, Monto neto pendiente de pago, Saldo sin detracción ni retención, Base del adelanto y del retenido]
      - [Conformidad, Expresa / presunta / disconformidad, Pendiente, La disconformidad impide ceder]
      - [Conformidad presunta, Fecha en que se presume la conformidad, Emisión + 8 días, Informativa]
      - [Anotación CAVALI, Número y fecha de la anotación en cuenta, —, Desde la anotación la factura negociable se transfiere]
      - [Cobrado / Por cobrar, Lo que el cliente ya pagó al factor, 0, Cobros parciales]

