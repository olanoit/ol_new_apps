titulo: Cobro con pasarelas en el TPV
subtitulo: >-
  Cada pasarela (Izipay, Niubiz, Culqi…) como método de pago propio del TPV:
  el cliente paga con el QR en su teléfono y las devoluciones vuelven a su
  tarjeta.
categoria: Punto de venta
etiquetas: [Punto de venta, Pago en línea, Izipay, Niubiz, Culqi, Devoluciones]

destacados_intro: >-
  Completa el pago en línea nativo del TPV para cobrar con varias pasarelas a
  la vez.
destacados:
  - icono: "▦"
    titulo: Un método por pasarela
    texto: >-
      La caja tiene «Izipay», «Niubiz» y «Culqi» a la vez; el QR abre
      directamente la pasarela que eligió el cajero.
  - icono: "Σ"
    titulo: Cierre por pasarela
    texto: >-
      El cierre de caja muestra lo cobrado con cada pasarela, para cuadrar con
      la liquidación de cada proveedor.
  - icono: "↩"
    titulo: Devolución a la tarjeta
    texto: >-
      La devolución de una venta cobrada con una pasarela vuelve al medio de
      pago del cliente, total o parcial.
  - icono: "⚙"
    titulo: Un clic para configurar
    texto: >-
      El botón «Cobrar en el TPV» de la pasarela crea su método de pago.

contexto:
  titulo: El problema que resuelve
  texto: >-
    El pago en línea de Odoo 19 admite un solo método por caja: el cliente
    elige la pasarela en su teléfono y el cierre muestra todo junto, aunque
    cada proveedor liquida por separado. Una devolución tampoco puede volver a
    la tarjeta: Odoo no acepta pagos en línea negativos y el cajero devuelve en
    efectivo.
  nota: >-
    Funciona con cualquier pasarela de Odoo que admita devoluciones. Niubiz
    acepta devoluciones desde las 48 horas hábiles siguientes al cobro; el
    mismo día se anula desde la transacción de pago.

funcionalidades:
  - grupo: Cobro
    items:
      - Varios métodos de pago en línea por caja, cada uno con sus pasarelas (una pasarela en un solo método).
      - El QR de la orden abre solo las pasarelas del método que eligió el cajero.
      - El pago se registra con el método de la pasarela que cobró.
  - grupo: Devoluciones
    items:
      - Devuelve con la pasarela, sobre el cobro de la venta original, al validar la devolución en el TPV.
      - Total o parcial, sin superar lo que queda por devolver del cobro.
      - Si la pasarela no confirma, el TPV muestra el motivo y la devolución no se cierra.
  - grupo: Configuración
    items:
      - Botón «Cobrar en el TPV» en la pasarela, que crea o abre su método de pago.

ejemplos_titulo: Datos de prueba
ejemplos_intro: >-
  Cómo probar el cobro y la devolución en la caja con cada pasarela en modo de
  prueba, sin dinero real. Las claves y tarjetas de cada una están en su
  ficha.
ejemplos:
  - titulo: Pasarelas y tarjetas de prueba
    tabla:
      - [Pasarela, Claves de prueba, Tarjeta aprobada, Ficha con todos los datos]
      - [Izipay, "Tienda pública `89289758`", "`4970100000000055` · venc. futuro · CVV `123`", "[al_payment_izipay](/al_payment_izipay/static/description/index.html)"]
      - [Niubiz, "Sandbox público (comercio `456879852`)", "`4551708161768059` · `03/28` · CVV `111`", "[al_payment_niubiz](/al_payment_niubiz/static/description/index.html)"]
      - [Culqi, "Llaves `pk_test_`/`sk_test_` del comercio", "`4111111111111111` · `09/30` · CVV `123`", "[al_payment_culqi](/al_payment_culqi/static/description/index.html)"]
    nota: >-
      Niubiz y Culqi necesitan el proveedor habilitado en **Modo de prueba**;
      Culqi, además, las llaves de integración del propio comercio.
  - titulo: Qué probar en la caja
    texto: >-
      **1. Configurar:** en [Proveedores de pago](/odoo/action-payment.action_payment_provider),
      abrir la pasarela y pulsar «Cobrar en el TPV»; agregar el método creado
      a la caja con la sesión cerrada.


      **2. Cobrar:** en el TPV, elegir el método de la pasarela y validar. La
      caja muestra un QR; el cliente lo escanea (o se abre el enlace) y paga
      con la tarjeta de prueba. El TPV marca el pedido como pagado y emite el
      comprobante.


      **3. Devolver:** en el TPV, «Reembolso» sobre la orden pagada, elegir el
      mismo método y validar. La devolución vuelve a la tarjeta por la
      pasarela; si la pasarela no la confirma, el TPV muestra el motivo.


      **4. Cerrar caja:** el cierre muestra lo cobrado con cada pasarela por
      separado.
    nota: >-
      Niubiz solo acepta devoluciones desde las 48 horas hábiles siguientes al
      cobro; el mismo día se anula desde la transacción de pago.
  - titulo: Revisar los pagos
    texto: >-
      [Proveedores de pago en Odoo](/odoo/action-payment.action_payment_provider):
      claves, estado y el botón «Cobrar en el TPV» de cada pasarela.


      [Métodos de pago del TPV](/odoo/action-point_of_sale.action_pos_payment_method_form):
      el método de cada pasarela y sus cajas.


      Back Office de cada pasarela:
      [Izipay](https://secure.micuentaweb.pe/vads-merchant/),
      [Niubiz](https://comercio.niubiz.com.pe/) y
      [Culqi](https://culqipanel.culqi.com/).
    nota: >-
      En Odoo, cada cobro y cada devolución quedan en **Contabilidad ▸
      Configuración ▸ Pagos en línea ▸ Transacciones de pago**, con la orden
      del TPV de origen.

configuracion:
  - "Pasarela publicada en modo de prueba o activa: al_payment_izipay, al_payment_niubiz o al_payment_culqi."
  - "En la pasarela, «Cobrar en el TPV»; luego agregar el método a la caja con la sesión cerrada."

