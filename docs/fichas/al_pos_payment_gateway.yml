    fecha: 18/10/2026
    cambios:
      - "Primera versión: un método de pago del TPV por pasarela y devoluciones a la tarjeta."

relacionados: [al_pos_online_payment, al_payment_izipay, al_payment_niubiz, al_payment_culqi, al_pos_pe_wallet_qr]
