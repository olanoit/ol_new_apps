titulo: "PE - Farmacia: estupefacientes y psicotrópicos"
subtitulo: "Listas de fiscalización, receta especial con sus datos y vigencia de 3 días, retención con folio, libros de estupefacientes y psicotrópicos y balance trimestral en PDF y Excel."
categoria: "Salud · Perú"
etiquetas: [Farmacia, Controlados, DS 023-2001-SA, Receta especial, Balance trimestral]

destacados:
  - icono: "℞"
    titulo: "Receta especial"
    texto: "Documento, dirección y teléfono del paciente, diagnóstico y posología; vigencia de 3 días y datos de quien recibe."
  - icono: "#"
    titulo: "Retención con folio"
    texto: "Las recetas especiales y retenidas quedan con folio correlativo."
  - icono: "▤"
    titulo: "Libros desde el inventario"
    texto: "Entradas, salidas y saldo por producto con su documento y la receta, desde movimientos validados."
  - icono: "∑"
    titulo: "Balance trimestral"
    texto: "Saldo inicial, entradas, salidas y saldo final por producto con las recetas del periodo, en PDF y Excel."

contexto:
  titulo: "El problema que resuelve"
  texto: "El DS 023-2001-SA (actualizado por el DS 020-2024-SA) exige receta especial para ciertas listas, retener recetas, llevar los libros de estupefacientes y psicotrópicos y presentar un balance trimestral ante la DIRIS, DIRESA o GERESA."
  nota: "**Por confirmar:** el plazo exacto del balance (art. 50); los comunicados de las DIRIS lo fijan hacia el día 15 del mes siguiente al trimestre."

funcionalidades:
  - "Lista de fiscalización por producto (IIA, IIB, IIIA-C, IVA-B, VI, cannabis) con su condición de venta y su libro."
  - "Validación de la receta especial (art. 23) y vigencia de 3 días."
  - "Solo la receta especial dispensa las listas de receta especial; nombre y documento del adquiriente obligatorios."
  - "Folio correlativo de recetas retenidas."
  - "Libro de movimientos y balance trimestral en PDF y Excel."
  - "Recordatorio del balance el primer día de cada trimestre en el libro de ocurrencias."
  - "Bloqueo de controlados en ventas por internet o delivery."

configuracion:
  - "Marque la lista de fiscalización en los productos controlados (pestaña Farmacia)."
  - "Genere libros y balance en **Farmacia ▸ Controlados ▸ Libros y balance**."

