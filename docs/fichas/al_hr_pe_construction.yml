titulo: Planillas de construcción civil
subtitulo: >-
  El régimen de construcción civil peruano en Odoo 19: jornal diario por
  categoría desde la tabla del convenio, planilla semanal con BUC, D.S.O.,
  bonificaciones, beneficios sociales pagados en cada semana y el resumen
  mensual del CONAFOVICER.
categoria: Localización Perú · Nómina
etiquetas: [Jornal por convenio, Planilla semanal, BUC y D.S.O., "CTS 15 % y vacaciones 10 %", CONAFOVICER, Boleta del régimen]
portada: screenshots/12-boleta-impresa.png

destacados_intro: >-
  Construcción civil no es el régimen general con otro sueldo: cambian la
  unidad de pago, la periodicidad y qué beneficios se pagan y cuándo. El
  módulo lo modela tal cual.
destacados:
  - icono: "S/"
    titulo: Jornal desde la tabla del convenio
    texto: >-
      El jornal del trabajador no se escribe a mano: sale de la tabla salarial
      vigente según su categoría. Trae cargada la R.M. N.° 197-2025-TR
      (01/01/2026 – 31/12/2026).
  - icono: "7d"
    titulo: Planilla semanal
    texto: >-
      Estructura CONSTRUCCIÓN CIVIL con jornal, D.S.O., BUC, movilidad, BAE,
      bonificaciones por condiciones de trabajo y horas extras al 60 % y 100 %.
  - icono: "15%"
    titulo: Beneficios en cada semana
    texto: >-
      Indemnización 15 % (la CTS del régimen), vacaciones 10 %, gratificación
      proporcional de 40 jornales, bonificación de la Ley 30334 y asignación
      escolar.
  - icono: "2%"
    titulo: CONAFOVICER
    texto: >-
      Retención del 2 % sobre jornal más D.S.O. en cada boleta y resumen
      mensual con vencimiento el día 15 y detalle en Excel para el depósito.
  - icono: "▦"
    titulo: Obras y bonificaciones
    texto: >-
      Catálogo editable de BAE y bonificaciones por altitud, contacto con agua,
      cota cero y altura. Cada obra activa las suyas para todos sus trabajadores.
  - icono: "✎"
    titulo: Boleta del régimen
    texto: >-
      El botón Imprimir de la boleta saca la variante de construcción: jornal
      básico, categoría, obra y especialidad, sin tocar la del régimen general.

contexto:
  titulo: El problema que resuelve
  texto: >-
    En construcción civil se paga por **jornal diario** fijado por la
    convención colectiva CAPECO–FTCCP, por categoría (operario, oficial, peón),
    con planilla **semanal**. La CTS y las vacaciones se pagan en cada planilla
    (15 % y 10 %), la gratificación es de **40 jornales**, el sobretiempo va al
    **60 % y 100 %** y el trabajador aporta al **CONAFOVICER** (D.L. 21067).


    Llevarlo con el régimen general obliga a cargar a mano, cada semana y
    trabajador por trabajador, importes que en realidad salen de una tabla
    publicada, y a rehacer los jornales cada vez que entra un convenio nuevo.
  nota: >-
    **El redondeo es el del convenio.** Los importes del periodo se redondean
    una sola vez, no multiplicando el diario redondeado por los días. En el
    oficial la diferencia es de seis céntimos por semana. Las pruebas del
    módulo reproducen la tabla oficial concepto por concepto en las tres
    categorías.

flujos_intro: >-
  Del convenio publicado a la boleta semanal y al depósito mensual del
  CONAFOVICER.
flujos:
  - id: convenio-jornal
    titulo: Del convenio al jornal de la boleta
    texto: >-
      El jornal nunca se escribe a mano: se busca la tabla vigente en la fecha
      y, dentro de ella, la fila de la categoría del trabajador.
    mermaid: |
      flowchart TD
        A[Tabla salarial con vigencia<br/>y jornales por categoría] --> B{¿Hay tabla propia de la<br/>compañía vigente en la fecha?}
        B -- Sí --> C[Se usa la de la compañía]
        B -- No --> D[Se usa la tabla nacional]
        C & D --> E[Fila de la categoría del trabajador]
        E --> F[Jornal básico en la ficha<br/>a la fecha de la versión]
        E --> G[Al calcular la boleta: jornal congelado<br/>a la fecha de fin del periodo]
        G --> H{¿Jornal ajustado a mano<br/>en la boleta?}
        H -- Sí --> I[El cálculo usa el jornal de la boleta]
        H -- No --> J[El cálculo usa el de la tabla]
    pie: Dos tablas activas con vigencias solapadas para la misma compañía no se pueden guardar.
  - id: boleta-semanal
    titulo: Cálculo de la boleta semanal
    texto: >-
      Las reglas de la estructura CONSTRUCCIÓN CIVIL en su orden de secuencia.
      Los importes del periodo se redondean una sola vez.
    mermaid: |
      flowchart TD
        A[Días pagados: laborados, feriados,<br/>vacaciones, descanso médico, paternidad, licencia] --> B[JOR jornal × días<br/>DSO ÷ 6 · BUC % categoría · MOV × días]
        B --> C[BAE y bonificaciones de obra y de puesto<br/>fijo por día o % del jornal]
        C --> D[HE60 y HE100: horas × jornal ÷ 8<br/>× 1,6 o × 2]
        D --> E[INDEM 15 % jornal + extras a valor simple<br/>VAC10 10 % del jornal]
        E --> F[GRAT 40 jornales: ventana 210 días<br/>hasta julio y 150 desde agosto<br/>BEXT 9 % · AESC por hijo con derecho]
        F --> G[CONAF 2 % de jornal + D.S.O.]
        G --> H[TREM: JOR+DSO+BUC+BAE+bonificaciones<br/>+horas extras+AESC]
        H --> I{¿Cobertura SCTR?}
        I -- Sí --> J[ESSALUD, SCTRS y SCTRP<br/>sobre TREM]
        I -- No --> K[Solo ESSALUD sobre TREM]
        J & K --> L[TINGR ingresos − TDES descuentos = NETO]
  - id: conafovicer
    titulo: Resumen mensual del CONAFOVICER
    texto: >-
      La retención se descuenta cada semana; el depósito es mensual.
    mermaid: |
      flowchart TD
        A[Nuevo resumen: periodo mensual] --> B[Calcular]
        B --> C[Boletas de construcción validadas o pagadas<br/>del mes y de sus semanas]
        C --> D[Una línea por boleta con retención:<br/>días, jornal, D.S.O., base y retenido]
        D --> E[Estado Calculado<br/>vence el día 15 del mes siguiente]
        E --> F[Exportar detalle: Excel adjunto<br/>para el depósito]
        F --> G[Constancia de pago y Marcar pagado]
        G --> H{¿Hay que corregir?}
        H -- Sí --> I[Volver a borrador y recalcular]
        H -- No --> J[Estado Pagado: ya no se recalcula]

pasos_intro: >-
  Recorrido con los datos de demostración: tres obreros de la obra «DEMO
  FICHA HR2 Edificio Los Álamos» con cuatro semanas de agosto de 2026.
pasos:
  - seccion: Maestros del convenio
    texto: Se instalan con el módulo y se ajustan cuando cambia el convenio.
  - titulo: Tablas salariales
    ruta: Nómina ▸ Configuración ▸ Perú ▸ Construcción civil ▸ Tablas salariales
    texto: >-
      Una tabla por convenio, con su resolución y vigencia. Vacía de compañía es
      la tabla nacional; con compañía, una tabla propia que prevalece.
    imagen: screenshots/01-tablas-salariales.png

  - titulo: Jornales por categoría e importes derivados
    ruta: Tablas salariales ▸ Convención colectiva 2026
    texto: >-
      Por categoría se indican el **jornal básico** y la **bonificación por
      movilidad**; el resto se calcula solo: D.S.O. (jornal ÷ 6), BUC, valor
      hora (jornal ÷ 8), horas extras al 60 % y 100 %, indemnización 15 %,
      vacaciones 10 %, gratificaciones diarias y asignación escolar diaria.
    puntos:
      - Cuando salga el convenio siguiente se crea otra tabla con su vigencia; las boletas antiguas conservan el jornal de su fecha.
      - La columna opcional «BUC %» permite cambiar el porcentaje de la categoría en esa tabla.
    imagen: screenshots/02-tabla-salarial.png
    pie: "Convención colectiva 2026: operario S/ 89,30, oficial S/ 69,75 y peón S/ 62,80."

  - titulo: Importar la tabla del convenio desde su PDF
    ruta: Tablas salariales ▸ botón Importar tabla del convenio
    texto: >-
      Lee el PDF de la tabla salarial que publican CAPECO o la FTCCP, subido o
      por su dirección web, y crea la tabla con su vigencia, su resolución y
      los jornales y la movilidad de operario, oficial y peón. El botón solo
      lo ven los responsables de planillas.
    puntos:
      - "Antes de crearla recalcula el CONAFOVICER, la pensión y el neto semanal de cada categoría y los compara con los que publica el convenio: si uno no coincide al céntimo, no importa nada."
      - "La tabla se crea **archivada**, con la fuente en el historial: revise los jornales y actívela para que la planilla la use."
      - Si ya existe una tabla nacional con la misma vigencia, activa o archivada, no crea otra.
      - "Si el convenio aplica un CONAFOVICER distinto del de alguna compañía, lo avisa en el historial de la tabla."
    imagen: screenshots/15-importar-tabla-boton.png

  - titulo: Revisión mensual de convenios nuevos
    ruta: Importar tabla del convenio ▸ Revisión mensual
    texto: >-
      La acción planificada **Construcción civil: buscar tabla salarial
      nueva** descarga cada mes los PDF de la lista. Si uno publica un
      convenio con una vigencia que aún no está cargada, lo importa archivado
      y crea una actividad **Revisar y activar la tabla salarial** a cada
      responsable de planillas. **Revisar direcciones ahora** hace lo mismo en
      el acto.
    puntos:
      - Vienen cargadas las direcciones de la tabla 2026 de CAPECO y de la FTCCP; como cambian cada año, añada la del convenio nuevo cuando se publique.
      - "Al importar por dirección web, «Revisar esta dirección cada mes» la añade a la lista."
    imagen: screenshots/16-importar-tabla-asistente.png
    pie: Asistente con las dos direcciones de la tabla 2026.

  - titulo: Categorías
    ruta: Nómina ▸ Configuración ▸ Perú ▸ Construcción civil ▸ Categorías
    texto: >-
      Operario, oficial y peón con su porcentaje de BUC (32 % y 30 %) y si
      admiten la bonificación por alta especialización: solo el operario.
    imagen: screenshots/03-categorias.png

  - titulo: Catálogo de bonificaciones
    ruta: Nómina ▸ Configuración ▸ Perú ▸ Construcción civil ▸ Bonificaciones
    texto: >-
      Las cuatro especialidades BAE (8 %, 9 %, 10 % y 22 % del jornal) y cuatro
      bonificaciones por condiciones de trabajo, con importe fijo por día o
      porcentaje del jornal, editables en la lista.
    puntos:
      - Los importes de altitud, contacto con agua, cota cero y altura vienen con la nota de verificarlos contra el convenio de la empresa.
      - Una bonificación limitada a categorías solo se paga a esas; sin categorías, a todas.
    imagen: screenshots/04-bonificaciones.png

  - seccion: Obras y compañía
    texto: Dónde se trabaja y con qué tasas.
  - titulo: Lista de obras
    ruta: Empleados ▸ Empleados ▸ Obras
    texto: >-
      Cada obra con código, distrito, altitud, fechas y número de trabajadores.
    imagen: screenshots/05-obras.png

  - titulo: Crear la obra
    ruta: Obras ▸ Nuevo
    texto: >-
      Código, fechas, dirección, distrito, altitud y el establecimiento con el
      que se declara en el T-Registro. En **Bonificaciones que activa la obra**
      se eligen las de condiciones de trabajo que cobran todos sus
      trabajadores. El botón **Trabajadores** abre quienes tienen la obra.
    imagen: screenshots/06-obra.png
    pie: La obra DEMO activa la bonificación por riesgo bajo la cota cero para sus tres obreros.

  - titulo: Tasas del régimen en la compañía
    ruta: Ajustes ▸ Usuarios y empresas ▸ Empresas ▸ Construcción civil (PE)
    texto: >-
      EsSalud, SCTR salud y pensión, CONAFOVICER y su cuenta en el Banco de la
      Nación, la bonificación extraordinaria sobre la gratificación y las
      edades tope de la asignación escolar. La pestaña solo aparece en
      compañías de Perú.
    puntos:
      - "Las tasas del SCTR vienen en cero a propósito: las fija la aseguradora. Sin tasa no se calcula el aporte."
    imagen: screenshots/07-compania.png

  - seccion: Trabajador
    texto: El régimen laboral Construcción civil activa el bloque.
  - titulo: Categoría, obra y especialidad
    ruta: Empleados ▸ ficha del trabajador ▸ Nómina
    texto: >-
      El bloque **Construcción civil** muestra la categoría, la obra, la
      especialidad BAE (solo operarios; otra categoría no la admite) y las
      bonificaciones propias del puesto. El **jornal básico** aparece calculado
      desde la tabla vigente.
    puntos:
      - Al cambiar a una categoría sin BAE, la especialidad se vacía.
      - La cobertura SCTR salud y pensión de la versión decide si se calculan esos aportes.
    imagen: screenshots/08-trabajador.png

  - seccion: Planilla semanal
    texto: Boletas por semana con la estructura del régimen.
  - titulo: Boletas semanales
    ruta: Nómina ▸ Recibos de nómina
    texto: >-
      Una boleta por trabajador y semana con la estructura **CONSTRUCCIÓN
      CIVIL**. Los periodos semanales se generan desde los periodos de nómina de
      la localización y se cortan a fin de mes.
    imagen: screenshots/09-boletas-semanales.png
    pie: Las columnas de importes de esta lista son las nativas de Odoo, que las estructuras peruanas no alimentan; el neto del régimen está en la regla NETO.

  - titulo: Días trabajados y horas extras
    ruta: Boleta ▸ Días trabajados
    texto: >-
      El régimen añade el tipo de entrada **HORAS EXTRAS 60% (CONSTRUCCIÓN)**.
      Cuentan como días pagados los laborados, feriados, vacaciones, descanso
      médico, paternidad y licencia con goce.
    imagen: screenshots/10-boleta-dias.png

  - titulo: Cálculo del salario
    ruta: Boleta ▸ Cálculo del salario
    texto: >-
      Jornal, D.S.O., BUC, movilidad, BAE, bonificaciones, horas extras y los
      beneficios del régimen, el descuento del CONAFOVICER y los aportes del
      empleador sobre la remuneración computable.
    puntos:
      - El jornal queda congelado en la boleta al calcularla y puede ajustarse a mano.
    imagen: screenshots/11-boleta-semanal.png
    pie: "Semana del 10 al 16 de agosto de un operario con 4 horas extras al 60 %: neto S/ 1.294,42."

  - titulo: Boleta impresa del régimen
    ruta: Boleta ▸ Imprimir
    texto: >-
      La estructura declara su propia plantilla, así que el botón nativo
      **Imprimir** saca la boleta de construcción: **jornal básico**,
      **categoría**, **obra** y **especialidad**, con los códigos de la tabla 22
      de SUNAT.
    imagen: screenshots/12-boleta-impresa.png
    pie: "Boleta del 3 al 9 de agosto: ingresos S/ 1.228,78, CONAFOVICER S/ 12,50 y neto S/ 1.216,28."

  - seccion: CONAFOVICER
    texto: El depósito mensual de las retenciones semanales.
  - titulo: Resúmenes mensuales
    ruta: Nómina ▸ Configuración ▸ Perú ▸ Construcción civil ▸ CONAFOVICER
    texto: >-
      Un resumen por periodo y compañía con vencimiento, trabajadores, base,
      retenido y estado (**Borrador**, **Calculado**, **Pagado**).
    imagen: screenshots/13-conafovicer-lista.png

  - titulo: Calcular, exportar y pagar
    ruta: CONAFOVICER ▸ Agosto 2026
    texto: >-
      **Calcular** toma las boletas validadas o pagadas del mes y de sus
      semanas, una línea por boleta, y fija el vencimiento el día 15 del mes
      siguiente. **Exportar detalle** adjunta un Excel con tipo y número de
      documento, nombre, categoría, días, jornal, D.S.O., base y retenido.
      **Marcar pagado** cierra el resumen; **Volver a borrador** lo reabre.
    imagen: screenshots/14-conafovicer.png
    pie: "Agosto 2026: 3 trabajadores, base S/ 6.130,43 y retenido S/ 122,61, vence el 15 de septiembre."

campos_intro: >-
  Cada pantalla propia del módulo con sus etiquetas, valores por defecto y efecto.
