      - ["Trabajadores, Base, Retenido", Totales del detalle., Calculado, "—"]
      - [Constancia de pago, Referencia del depósito., Vacío, Informativo]
      - ["Detalle: Trabajador, Categoría, Boleta, Días, Jornal básico, D.S.O., Base, Retenido", Una línea por boleta., Calculado, "La base debe ser jornal + D.S.O."]

funcionalidades:
  - grupo: Maestros del régimen
    items:
      - Categorías con su porcentaje de BUC y si admiten BAE.
      - Tablas salariales con vigencia por fechas, nacionales o por compañía.
      - "Importación de la tabla del convenio desde el PDF de CAPECO o la FTCCP, validada contra los importes semanales publicados y creada archivada para revisión."
      - Acción planificada mensual que busca convenios nuevos en las direcciones configuradas y crea una actividad de revisión.
      - Importes derivados por categoría (D.S.O., BUC, valor hora, horas extras, indemnización, vacaciones, gratificación y asignación escolar diarias).
      - Catálogo de bonificaciones BAE y por condiciones de trabajo, de importe fijo o porcentaje.
      - Obras con altitud, establecimiento y bonificaciones que activan.
  - grupo: Planilla semanal
    items:
      - Estructura CONSTRUCCIÓN CIVIL con 29 reglas y códigos de la tabla 22 de SUNAT.
      - Jornal calculado en la ficha del trabajador y congelado en la boleta.
      - Horas extras al 60 % y 100 % sobre el valor hora sin redondear.
      - Remuneración computable (TREM) que enumera lo afecto; beneficios sociales, gratificación y movilidad quedan fuera.
      - ONP o AFP del trabajador (fondo, comisión sobre flujo o mixta y prima de seguros) sobre TREM, con los mismos códigos SUNAT que la planilla general.
      - EsSalud, SCTR salud y SCTR pensión por separado, solo para quien tiene cobertura.
      - Periodos semanales colgados de su mes y cortados a fin de mes.
  - grupo: Beneficios pagados en planilla
    items:
      - Indemnización 15 % sobre el jornal del periodo más las horas extras a valor simple.
      - Vacaciones 10 % del jornal percibido.
      - Gratificación proporcional de 40 jornales, con ventana de 210 días hasta julio y de 150 desde agosto.
      - Bonificación extraordinaria de la Ley 30334 (9 % de la gratificación).
      - Asignación escolar de 30 jornales al año por hijo, desde los derechohabientes del trabajador.
  - grupo: CONAFOVICER y documentos
    items:
      - Retención del 2 % sobre jornal básico más D.S.O. en cada boleta.
      - Resumen mensual con vencimiento, estados Borrador, Calculado y Pagado y constancia de pago.
      - Detalle en Excel por trabajador para el depósito.
      - Boleta impresa propia del régimen, elegida por la estructura salarial.

ejemplos_intro: >-
  Cifras de la tabla de la R.M. N.° 197-2025-TR con los datos de demostración.
  Todas se pueden comprobar en las capturas.
ejemplos:
  - titulo: Reglas de la estructura CONSTRUCCIÓN CIVIL
    texto: >-
      Las 29 reglas que instala el módulo, en su orden de cálculo. Las bonificaciones
      del catálogo se suman en la regla que indica su «Código de la regla».
    tabla:
      - [Código, Nombre, SUNAT, Cálculo]
      - [JOR, Jornal básico, "0121", Jornal × días pagados]
      - [DSO, Descanso semanal obligatorio, "0100", Jornal del periodo ÷ 6]
      - [BUC, Bonificación unificada de construcción, "0300", "% de la categoría (o de la tabla) del jornal del periodo"]
      - [MOV, Bonificación por movilidad, "0904", Movilidad diaria × días]
      - [BAE, Bonificación por alta especialización, "0300", "% de la especialidad sobre el jornal del periodo"]
      - ["BALTI, BAGUA, BCOTA, BALTU", Bonificaciones por condiciones de trabajo, "0300", "Importe fijo × días o % del jornal del periodo"]
      - [HE60, Horas extras 60%, "0105", "Horas × jornal ÷ 8 × 1,6"]
      - [HE100, Horas extras 100%, "0106", "Horas × jornal ÷ 8 × 2"]
      - [INDEM, "Indemnización 15% (CTS)", "0916", "15 % de jornal del periodo + horas extras a valor simple"]
      - [VAC10, Vacaciones 10%, "0400", 10 % del jornal del periodo]
      - [GRAT, Gratificación proporcional, "0406", "Jornal × 40 × días × 7/6 ÷ 210 (hasta julio) o ÷ 150"]
      - [BEXT, Bonificación extraordinaria Ley 30334, "0906", "% de la compañía sobre GRAT"]
      - [AESC, Asignación escolar, "0201", "Jornal × 30 ÷ 360 × días × 7/6 × hijos con derecho"]
      - [CONAF, CONAFOVICER 2%, "0703", "−(% de la compañía sobre JOR + DSO)"]
      - [TREM, Total remuneración computable, "—", "JOR + DSO + BUC + BAE + BALTI + BAGUA + BCOTA + BALTU + HE60 + HE100 + AESC"]
      - [ONP, ONP, "0607", "−(% del fondo sobre TREM), solo afiliados a la ONP"]
      - [A_JUB, AFP Aporte Fondo de Pensiones, "0608", "−(% del fondo sobre TREM), afiliados a una AFP"]
      - [COMFI, AFP Comisión sobre flujo, "0601", "−(% de comisión sobre TREM), comisión sobre flujo"]
      - [COMMIX, AFP Comisión mixta, "0601", "−(% de comisión sobre TREM), comisión mixta"]
      - [SEGI, AFP Prima de seguros, "0606", "−(% de prima sobre TREM hasta el tope asegurable)"]
      - [ESSALUD, EsSalud, "0804", "% de la compañía sobre TREM"]
      - [SCTRS, SCTR salud, "0805", "% de la compañía sobre TREM, solo con cobertura"]
      - [SCTRP, SCTR pensión, "0806", "% de la compañía sobre TREM, solo con cobertura"]
      - [TINGR, Total ingresos, "—", Suma de la categoría Ingresos]
      - [TDES, Total descuentos, "—", Aportes y descuentos del trabajador en positivo]
      - [NETO, Neto a pagar, "—", TINGR − TDES]

  - titulo: Semana completa de las tres categorías
    texto: >-
      Seis días trabajados, sin bonificaciones de obra ni horas extras. Son los
      importes que el módulo reproduce de la tabla oficial:
    tabla:
      - [Categoría, Jornal (6 días), D.S.O., BUC, Movilidad, Total salarios, CONAFOVICER 2 %]
      - [Operario, "535,80", "89,30", "171,46", "51,60", "848,16", "12,50"]
      - [Oficial, "418,50", "69,75", "125,55", "51,60", "665,40", "9,77"]
      - [Peón, "376,80", "62,80", "113,04", "51,60", "604,24", "8,79"]
    nota: >-
      La base del CONAFOVICER incluye el D.S.O.: (535,80 + 89,30) × 2 % = 12,50.
      Con el jornal solo serían 10,72, que no es lo que publica la tabla.

  - titulo: Boleta de un operario especializado en una obra bajo la cota cero
    texto: >-
      Operador de equipo pesado (BAE 10 %), obra con bonificación por riesgo
      bajo la cota cero (S/ 1,90 por día), semana del 3 al 9 de agosto de 2026
      con 6 días:
    tabla:
      - [Código, Concepto, Cálculo, Importe S/]
      - [JOR, Jornal básico, "89,30 × 6", "535,80"]
      - [DSO, Descanso semanal obligatorio, "535,80 ÷ 6", "89,30"]
      - [BUC, Bonificación unificada, "32 % de 535,80", "171,46"]
      - [MOV, Movilidad, "8,60 × 6", "51,60"]
      - [BAE, Alta especialización, "10 % de 535,80", "53,58"]
      - [BCOTA, Riesgo bajo la cota cero, "1,90 × 6", "11,40"]
      - [INDEM, Indemnización 15 %, "15 % de 535,80", "80,37"]
      - [VAC10, Vacaciones 10 %, "10 % de 535,80", "53,58"]
      - [GRAT, Gratificación proporcional, "89,30 × 40 ÷ 150 × 7 días", "166,69"]
      - [BEXT, Bonificación Ley 30334, "9 % de 166,69", "15,00"]
      - [CONAF, CONAFOVICER, "2 % de 625,10", "-12,50"]
      - [ONP, ONP (afiliado a la ONP), "13 % de 861,54", "-112,00"]
      - [NETO, Neto a pagar, "1.228,78 − 12,50 − 112,00", "1.104,28"]
    nota: >-
      La remuneración computable es 861,54 (jornal + D.S.O. + BUC + BAE + cota
      cero): sobre ella se calculan la ONP o la AFP del trabajador y EsSalud, a
      cargo del empleador, 77,54. Movilidad, indemnización, vacaciones y
      gratificación no aportan. En agosto la gratificación
      se devenga en la ventana de Navidad (150 días); con el mismo jornal, hasta
      julio saldría 119,07.

  - titulo: Horas extras al 60 %
    texto: >-
      Valor hora del operario: 89,30 ÷ 8 = 11,1625. Cuatro horas al 60 % son
      4 × 11,1625 × 1,6 = **71,44**. Esa semana la indemnización sube a 87,07,
      porque su base suma las horas extras a valor simple (535,80 + 44,65).

  - titulo: Resumen de CONAFOVICER de agosto de 2026
    tabla:
      - [Trabajador, Semanas, Base, Retenido]
      - [Operario, "4 × 625,10", "2.500,40", "50,00"]
      - [Oficial, "3 × 488,25 + 406,88 (5 días)", "1.871,63", "37,45"]
      - [Peón, "4 × 439,60", "1.758,40", "35,16"]
      - [Total, "", "6.130,43", "122,61"]
    nota: Vence el 15/09/2026, día 15 del mes siguiente al periodo.

configuracion_intro: >-
  La tabla del convenio 2026, las categorías, las bonificaciones y la estructura
  salarial se instalan con el módulo.
configuracion:
  - "Revise la tabla salarial en **Nómina ▸ Configuración ▸ Perú ▸ Construcción civil ▸ Tablas salariales** y cargue la del convenio que corresponda."
  - Contraste los importes de las bonificaciones por condiciones de trabajo con el convenio de la empresa.
  - "En **Ajustes ▸ Usuarios y empresas ▸ Empresas**, pestaña **Construcción civil (PE)**, ponga las tasas del SCTR de su póliza y la cuenta del CONAFOVICER."
  - "Genere los periodos del año marcando **Generar también semanas**."
  - Cree las obras y, en cada trabajador, elija el régimen laboral Construcción civil, la categoría, la obra y la cobertura SCTR.
requisitos_nota: >-
  Requiere Nómina de Odoo Enterprise y la localización de planillas peruana
  (beneficios sociales y documentos).

faq:
  - pregunta: ¿Qué pasa con las boletas antiguas cuando entra un convenio nuevo?
    respuesta: >-
      Nada. Cada boleta congela el jornal de la tabla vigente en su fecha al
      calcularse. El convenio nuevo se carga como otra tabla con su vigencia y
      solo afecta a las boletas de esas fechas.
  - pregunta: ¿Por qué la tabla importada no se usa en las boletas?
    respuesta: >-
      Porque llega archivada a propósito: un error de lectura cambiaría el
      jornal de toda la planilla. Ábrala con el filtro «Archivadas (por
      revisar)», compruebe los jornales y desarchívela.
  - pregunta: ¿Por qué no se importó el PDF?
    respuesta: >-
      Porque no trae la vigencia o los datos de las tres categorías, o porque
      el CONAFOVICER, la pensión o el neto semanal publicados no coinciden con
      los que calcula el módulo. El mensaje indica la categoría y el importe
      que no cuadra.
  - pregunta: ¿Se actualiza sola la tasa del CONAFOVICER?
    respuesta: >-
      No: es el 2 % fijado por la R.S. 001-95-MTC y no hay un servicio que la
      publique. Si un convenio importado aplica otra tasa, el historial de la
      tabla lo avisa y la tasa se cambia en la pestaña Construcción civil (PE)
      de la empresa.
  - pregunta: ¿Por qué el SCTR sale en cero?
    respuesta: >-
      Porque la compañía no tiene tasa de SCTR: viene en cero a propósito. Ponga
      las tasas de su póliza en la pestaña Construcción civil (PE) de la empresa
      y marque la cobertura en los trabajadores expuestos.
  - pregunta: ¿La movilidad está afecta a aportes?
    respuesta: >-
      No. La remuneración computable (TREM) suma jornal, D.S.O., BUC, BAE,
      bonificaciones por condiciones, horas extras y asignación escolar; la
      movilidad, la
      indemnización, las vacaciones 10 %, la gratificación y su bonificación
      quedan fuera.
  - pregunta: ¿Qué boletas entran en el resumen de CONAFOVICER?
    respuesta: >-
      Las de construcción civil en estado validado o pagado cuyo periodo es el
      mes elegido o una de sus semanas. Recalcular reemplaza el detalle; un
      resumen pagado no se puede recalcular.
  - pregunta: ¿Genera el archivo para el Banco de la Nación?
    respuesta: >-
      No. Genera el detalle en Excel que acompaña al depósito; no hay un formato
      TXT publicado que implementar.

