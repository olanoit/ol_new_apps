    fecha: 21/10/2026
    cambios:
      - "Primera versión: impuesto gratuito exonerado/inafecto, afectación 37 gratuita, leyenda 1002 y contado automáticos, validación de las reglas 2641, 3110 y 3111 al publicar y botón Transferencia gratuita."

