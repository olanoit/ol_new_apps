titulo: Hoja de trabajo del planificador de obra
subtitulo: >-
  Presupuesto, APU y plan de la obra en una hoja de cálculo de Documentos, con
  las hojas del libro de carga, validación, «Enviar al planificador» y
  versiones numeradas.
categoria: Construcción · Proyectos
etiquetas: [Hoja de cálculo, Documentos, Presupuesto, APU, Plan de recursos]

destacados_intro: >-
  El presupuestador y la oficina técnica trabajan el presupuesto en Odoo, entre
  varios y con comentarios por celda, y lo envían al planificador
  (requerimiento CREVAL v1.0, 6.7).
destacados:
  - icono: "▦"
    titulo: Las hojas del libro de carga
    texto: >-
      OBRA, INSUMOS, APU, APU_DETALLE, PRESUPUESTO, PLAN y LISTAS, con fórmulas
      de costo y listas vivas de Odoo.
  - icono: "✓"
    titulo: Validar plantilla
    texto: >-
      Los errores con su hoja, fila y columna en la pestaña ERRORES antes de
      enviar.
  - icono: "→"
    titulo: Enviar al planificador
    texto: >-
      Presupuesto o presupuesto y plan, con la revisión del asistente del libro;
      con el plan aprobado, una nueva versión.
  - icono: "⧉"
    titulo: Versiones
    texto: >-
      Cada envío y cada «Nueva versión» guardan una copia numerada en la misma
      carpeta, con el enlace en el historial.

funcionalidades:
  - "Botón «Hoja de trabajo» en la cotización (carpeta Presupuestos › cotización) y en la obra."
  - "«Traer de Odoo» y «Actualizar insumos» (costo vigente del maestro)."
  - "Las obras de mobiliario llenan su maestro con el puente de mobiliario."

novedades:
  - version: '6.20261027'
    fecha: 27/10/2026
    cambios:
      - "Ícono nuevo: el isotipo de ALTA."
  - version: '5.20261016'
    fecha: 27/10/2026
    cambios:
    - "CR-18, a: todas las celdas se guardan como texto (la hoja con números no abría: «content.startsWith is not a function»); migración que convierte las hojas de trabajo existentes sin perder sus revisiones."
    - "CR-18, c y d: PRESUPUESTO con las columnas A a W del libro 6.6 y sus fórmulas (metrado y costo ofertado, precio unitario, costo real, parcial de venta y reserva); «Traer de Odoo» reescribe esa pestaña completa, llena «Costo unitario sin APU» de las partidas sin receta con su costo o su precio (D1) y los % de gastos generales, imprevistos, utilidad y descuento de OBRA desde la cotización, con 6 decimales."
    - "CR-18, D3 y D4: «Enviar al planificador: presupuesto» queda deshabilitado con la cotización confirmada; la hoja de una cotización sin obra trae la biblioteca de recetas y sus insumos."
  - version: '4.20261016'
    fecha: 24/10/2026
    cambios:
