titulo: "Recaudación bancaria"
subtitulo: "El banco cobra con el RUC o DNI del cliente en ventanilla, agentes y banca por internet; Odoo envía el archivo de deudores, importa lo cobrado, crea los pagos y concilia las facturas."
categoria: "Localización Perú · Tesorería"
etiquetas: [Recaudación, BCP, BBVA, Scotiabank, CREP, Conciliación, Cobranza]

destacados:
  - icono: "⇪"
    titulo: "Archivo de deudores"
    texto: "Las cuotas abiertas del convenio con el código del depositante y el documento, en el formato del banco."
  - icono: "⇩"
    titulo: "Respuesta del banco"
    texto: "Identifica cliente y documento, crea los pagos en la cuenta recaudadora y los concilia."
  - icono: "⚙"
    titulo: "Formato configurable"
    texto: "Posición, longitud y tipo de cada campo como datos: incluye el CREP del BCP y los formatos oficiales de BBVA y Scotiabank, y se ajusta a la ficha técnica de cada banco sin programar."
  - icono: "✓"
    titulo: "Sin duplicados"
    texto: "Una operación ya pagada no se vuelve a procesar aunque el archivo se importe otra vez."

funcionalidades:
  - "Convenio por banco y moneda: cuenta recaudadora, diario, sucursal, código de servicio y modalidad de validación (completa, parcial o sin validación)."
  - "Código del depositante: RUC o DNI, referencia del cliente o un código de recaudación propio."
  - "Archivo de reemplazo o de actualización, opcionalmente solo para algunos clientes; excluye los documentos en reclamo, los anticipos y las detracciones."
  - "Texto en ASCII sin descuadrar las posiciones (á → a, ñ → n), caracteres que el banco no acepta cambiados por espacios e importes con decimales implícitos."
  - "BBVA: archivo de entrada de datos de 360 bytes (encabezado, detalle y totales, versión del envío del día, carga total o parcial, fecha de bloqueo) y respuesta de 152 bytes con oficina, movimiento, forma de pago y canal, según la ficha técnica E1891 V21 (marzo 2025)."
  - "Modalidades: validación completa (una línea por cuota), parcial (una línea por cliente con importe libre, aplicada a sus cuotas más antiguas) e importes (catálogo de tipos de pago con valor, recargo y total; quien paga se identifica con su documento)."
  - "Scotiabank: validación completa con archivo de cobranza de 200 posiciones y archivo de resultados con oficina, operación, referencia, medio y hora de atención, tomados de la macro oficial que publica el banco."
  - "Respuesta: cobro identificado por documento (información de retorno) o, si no viene, aplicado a las cuotas más antiguas; sin cuotas abiertas queda como anticipo."
  - "Cobros sin identificar: se elige el cliente y se vuelve a identificar, o se descartan."
  - "Control con la cabecera del banco: cantidad de registros y total."

configuracion:
  - "Cobranza ▸ Configuración ▸ Convenios de recaudación: diario del banco, moneda, sucursal y cuenta, formatos y código del depositante."
  - "Cobranza ▸ Configuración ▸ Formatos de recaudación: comparar el formato BCP · CREP con la ficha técnica que entrega el banco y ajustar posiciones si difieren."
  - "Permiso Cobranza / Administrador."

faq:
  - pregunta: "¿El formato BCP es el oficial?"
    respuesta: >-
      Es el layout CREP más difundido (validación completa, registros de 250 posiciones). El BCP entrega la
      ficha técnica al afiliar a la empresa: compárela y ajuste el formato antes del primer envío; los
      cambios se conservan al actualizar el módulo.
  - pregunta: "¿Y el formato de BBVA?"
    respuesta: >-
      Es el de la ficha técnica oficial publicada por BBVA (E1891 V21, marzo 2025). Solo hay que ajustar
      la longitud del código de identificación al «tamaño campo código» de la ficha de su empresa.
  - pregunta: "¿Sirve para otros bancos?"
    respuesta: >-
      Sí: cree un formato con las posiciones de su ficha técnica y úselo en un convenio nuevo. Interbank
      entrega su formato al afiliar; no es público.
  - pregunta: "¿De dónde sale el formato de Scotiabank?"
    respuesta: >-
      Del código de la macro oficial que Scotiabank publica para generar el archivo de cobranza y leer
      el de resultados, en sus tres modalidades: validación completa, parcial e importes.

pasos:
  - titulo: Generar el archivo de deudores
    ruta: Cobranza ▸ Recaudación bancaria ▸ Archivos de deudores
    texto: >-
      Cargar cuotas, generar el archivo en el formato del banco y descargarlo para subirlo a la banca
      por internet.
    imagen: screenshots/v3-batch.png
  - titulo: Importar la respuesta del banco
    ruta: Cobranza ▸ Recaudación bancaria ▸ Respuestas del banco
    texto: >-
      Cada cobro queda identificado, solo con cliente, sin identificar o ya procesado; «Crear pagos y
      conciliar» paga lo identificado.
    imagen: screenshots/v3-response.png

