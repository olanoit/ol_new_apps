configuracion_intro: >-
  El módulo trae scripts de datos de demostración (`tools/`) que crean el
  escenario «DEMO SPOT» y validan el flujo completo.
configuracion:
  - Instale el módulo desde Aplicaciones; el catálogo 54 se carga solo.
  - Asigne el **Tipo de detracción (SPOT)** a los productos y servicios afectos.
  - "Ventas: registre la cuenta de detracciones del **Banco de la Nación** en las cuentas bancarias de la compañía; la usa el XML."
  - Cree un diario de banco que represente la cuenta de detracciones para registrar los cobros.
  - "Depósito masivo: complete la **Cuenta de detracciones** de cada proveedor en su ficha de contacto (y la de la empresa para la modalidad proveedor)."
  - "Opcional: active el reparto en **Perú ▸ Configuración ▸ Ajustes ▸ Detracciones (SPOT)** con sus dos cuentas."
requisitos_nota: >-
  Requiere Odoo Enterprise: la constancia usa los campos de detracción de
  `l10n_pe_reports`, los mismos que alimentan el PLE 8.1.

faq:
  - pregunta: No aparece la pestaña Detracción en la factura, ¿por qué?
    respuesta: >-
      Ningún producto de la factura tiene tipo de detracción, el total con IGV
      en soles no supera el monto mínimo del código o el documento es una nota
      de crédito.
  - pregunta: Al publicar sale un aviso sobre la cuenta de detracciones.
    respuesta: >-
      La opción de separar la detracción en el asiento está activa y falta la
      cuenta por cobrar o por pagar. Configúrela en Ajustes o desactive la
      opción.
  - pregunta: ¿El depósito crea un asiento contable?
    respuesta: >-
      Crea un pago estándar de Odoo 19. Si el método de pago del diario tiene
      cuenta de pagos o recibos pendientes, el asiento sale al registrar
      (como en PBNK1/2026/00003); si no, nace al conciliar el extracto.
  - pregunta: ¿Por qué no aparece «Registrar depósito»?
    respuesta: >-
      La factura no está publicada o ya tiene número de constancia en el campo
      **Detracción**.
  - pregunta: ¿Por qué un comprobante no entra en el depósito masivo?
    respuesta: >-
      El asistente lo lista con su motivo: sin tipo de detracción, monto cero,
      contacto sin RUC, sin cuenta de detracciones del Banco de la Nación o sin
      fecha de emisión.
  - pregunta: SUNAT cambió un porcentaje, ¿qué hago?
    respuesta: >-
      Edite el tipo en el catálogo y pulse **Actualizar productos
      vinculados**, o márquelo en un contraste con SUNAT y pulse **Aplicar
      marcadas**, que hace ambas cosas. Las facturas en borrador recalculan al
      editar sus líneas.
  - pregunta: ¿Qué pasa si aplico un contraste antiguo?
    respuesta: >-
      Cada línea se resuelve contra el catálogo del momento, archivados
      incluidos: si el código ya existe no se crea otra vez, y si su
      porcentaje ya coincide la línea queda aplicada con la nota «ya estaba en
      el catálogo».
  - pregunta: ¿El contraste con SUNAT cambia el catálogo solo?
    respuesta: >-
      No. SUNAT no publica el porcentaje por código y el módulo lo deduce
      cruzando nombres, así que solo muestra las diferencias. Se aplican al
      marcarlas y pulsar Aplicar marcadas.

