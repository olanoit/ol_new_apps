titulo: Detracciones (SPOT)
subtitulo: >-
  El Sistema de Pago de Obligaciones Tributarias de punta a punta: catálogo
  54 administrable, cálculo en facturas de venta y compra, reparto en el
  asiento, registro del depósito con su constancia y archivo de depósito
  masivo para el Banco de la Nación.
categoria: Localización Perú · Contabilidad
etiquetas: [Catálogo 54, Redondeo a soles, Constancia de depósito, Depósito masivo BN, Reparto 121x / 424x, PLE 8.1 y 8.3]
portada: screenshots/06-factura-venta.png

destacados_intro: >-
  La localización nativa ya emite el bloque de detracción en el XML a partir
  del porcentaje del producto. Este módulo añade todo lo que hace falta para
  operar el régimen en el día a día.
destacados:
  - icono: "54"
    titulo: Catálogo 54 administrable
    texto: >-
      32 códigos precargados con porcentaje y monto mínimo propios (S/ 700,
      S/ 400 en transporte, ½ UIT en el Anexo 1). Cambiar un porcentaje y
      actualizar los productos vinculados es un botón.
  - icono: "S/"
    titulo: Cálculo en la factura
    texto: >-
      Código dominante (mayor %), verificación del mínimo sobre el total con
      IGV en soles, monto redondeado a soles enteros y neto a cobrar o pagar.
  - icono: "1001"
    titulo: Tipo de operación automático
    texto: >-
      Al publicar una venta afecta se fija el tipo de operación 1001 si no se
      eligió otro de la familia 100x, requisito para que el XML lleve el
      bloque de detracción.
  - icono: "⇄"
    titulo: Reparto en el mismo asiento
    texto: >-
      Opcional: la cuenta por cobrar o pagar se divide en neto y detracción
      (121x / 424x) dentro del asiento de la factura, sin crear un segundo
      asiento.
  - icono: "✓"
    titulo: Depósito y constancia
    texto: >-
      Un asistente registra el pago de la detracción, solo contra la línea de
      la detracción, y guarda el número y la fecha de la constancia que usan
      los PLE 8.1 y 8.3.
  - icono: "BN"
    titulo: Depósito masivo
    texto: >-
      Genera el archivo de ancho fijo del Banco de la Nación para pagar muchas
      detracciones a la vez, con la lista de comprobantes excluidos y el
      motivo.

contexto:
  titulo: El problema que resuelve
  texto: >-
    En las operaciones del Anexo de detracciones (catálogo 54 de SUNAT, R.S.
    183-2004/SUNAT y modificatorias) el comprador descuenta un porcentaje del
    importe total y lo deposita en la cuenta del proveedor en el **Banco de
    la Nación**; el proveedor cobra el neto. Aplica, en general, a
    operaciones mayores a **S/ 700**.


    Sin apoyo en el sistema hay que buscar el porcentaje de cada servicio,
    comprobar el mínimo, redondear a mano, separar lo que se paga al
    proveedor de lo que va al banco, anotar la constancia en algún sitio para
    el Registro de Compras y armar el archivo del depósito masivo campo por
    campo.
  nota: >-
    **Se redondea a soles enteros.** No a dos decimales: es la regla de SUNAT
    y el mismo criterio que usa el XML nativo. Una detracción del 12 % sobre
    S/ 3.540,00 es S/ 425, no S/ 424,80.

flujos_intro: >-
  Qué decide el módulo en cada paso, desde la factura hasta el banco.
flujos:
  - id: calculo
    titulo: Cálculo de la detracción en la factura
    texto: >-
      Se recalcula cada vez que cambian los productos o el total de una
      factura de venta o de proveedor. Las notas de crédito no llevan
      detracción.
    mermaid: |
      flowchart TD
        A[Factura de venta<br/>o de proveedor] --> B{¿Algún producto con<br/>tipo de detracción?}
        B -- No --> Z[Sin detracción:<br/>no aparece la pestaña]
        B -- Sí --> C[Código dominante:<br/>el de mayor porcentaje]
        C --> D{¿Total con IGV<br/>en soles mayor que<br/>el mínimo?}
        D -- No --> Z
        D -- Sí --> E[Pestaña Detracción:<br/>monto = total × %<br/>redondeado a soles]
        E --> F[Publicar]
        F --> G{¿Venta sin tipo<br/>de operación 100x?}
        G -- Sí --> H[Tipo de operación<br/>1001]
        G -- No --> I{¿Separar detracción<br/>en el asiento activo?}
        H --> I
        I -- No --> J[Total en la cuenta<br/>del tercero]
        I -- Sí --> K[Mismo asiento:<br/>neto al tercero,<br/>detracción a 121x / 424x]
    pie: Si la factura vuelve a borrador y cambia su importe, al publicarla otra vez el reparto se rehace desde cero.
  - id: compras
    titulo: Compras — la empresa deposita la detracción
    texto: >-
      El depósito se registra contra la línea de la detracción; el neto se
      paga al proveedor con el flujo normal de pagos.
    mermaid: |
      flowchart TD
        A[Factura de proveedor<br/>con detracción] --> B{¿Muchos depósitos<br/>a la vez?}
        B -- Sí --> C[Depósito masivo:<br/>TXT para el banco]
        B -- No --> D[Depósito individual<br/>en el Banco de la Nación]
        C --> E[Constancias<br/>del banco]
        D --> E
        E --> F[Registrar depósito:<br/>diario, fecha<br/>y Nº de constancia]
        F --> G[Pago de la detracción<br/>con reparto: solo su línea]
        G --> H[Constancia en la factura<br/>PLE 8.1 y 8.3]
        G --> I[Pago normal<br/>del neto]
  - id: ventas
    titulo: Ventas — el cliente deposita en nuestra cuenta
    texto: >-
      El cliente paga el neto por el canal habitual y deposita la detracción en
      la cuenta de detracciones de la empresa en el Banco de la Nación.
    mermaid: |
      flowchart TD
        A[Venta publicada<br/>con operación 1001] --> B[XML con bloque<br/>de detracción]
        B --> C[El cliente paga el neto]
        B --> D[El cliente deposita<br/>en el Banco de la Nación]
        D --> E[Registrar depósito<br/>con el diario del BN]
        E --> F[Cobro de la detracción<br/>con reparto: línea 121x]
        C --> G[Cobro normal<br/>del neto]
  - id: deposito-masivo
    titulo: Archivo de depósito masivo
    texto: >-
      Cada comprobante se valida antes de entrar al archivo; los que fallan se
      listan con su motivo y el resto sigue adelante.
    mermaid: |
      flowchart TD
        A[Modalidad, lote<br/>y periodo] --> B{¿Comprobantes<br/>elegidos a mano?}
        B -- Sí --> C[Se usan esos]
        B -- No --> D[Publicadas del periodo:<br/>compras si adquiriente,<br/>ventas si proveedor]
        C --> E{¿Tipo, monto, RUC,<br/>cuenta BN y fecha?}
        D --> E
        E -- Falta algo --> F[Excluido con su motivo]
        E -- Completo --> G[Línea de detalle<br/>de 107 caracteres]
        G --> H{¿Longitudes<br/>exactas?}
        H -- No --> I[Error: no se<br/>entrega el archivo]
        H -- Sí --> J[TXT D + RUC + lote<br/>y tabla de excluidos]

pasos_intro: >-
  Todas las funciones del módulo con los datos de demostración «DEMO SPOT» y
  «DEMO SPLIT», agrupadas por tarea.
pasos:
  - seccion: Configuración
    texto: Una sola vez, antes de la primera factura afecta.
  - titulo: Revisar el catálogo 54
    ruta: Perú ▸ Configuración ▸ Tributos SUNAT ▸ Detracciones (SPOT)
    texto: >-
      El catálogo llega cargado con 32 códigos: **Código**, **Descripción**,
      **Porcentaje (%)**, **Monto mínimo (S/)** y cuántos productos usan cada
      tipo. El menú lo ven los administradores de contabilidad.
    puntos:
      - Los códigos del Anexo 1 (001 y 003) traen como mínimo S/ 2.750 (½ UIT de 2026); actualícelo con la UIT de cada año.
      - "El código es único y el porcentaje debe estar entre 0 y 100: el sistema no deja guardar otro valor."
    imagen: screenshots/01-catalogo.png

  - titulo: Actualizar los productos cuando SUNAT cambia un porcentaje
    ruta: Detracciones (SPOT) ▸ abrir un tipo
    texto: >-
      Edite el porcentaje y pulse **Actualizar productos vinculados**: el
      código y el porcentaje se reescriben en todos los productos que usan ese
      tipo. El botón **Productos** abre su lista.
    puntos:
      - El interruptor **Active** retira un código de las listas sin borrarlo.
    imagen: screenshots/02-tipo-detraccion.png
    pie: "Código 037, «Demás servicios gravados con el IGV»: 12 %, mínimo S/ 700 y dos productos vinculados."

  - titulo: Asignar el tipo de detracción al producto
    ruta: Contabilidad ▸ Clientes ▸ Productos
    texto: >-
      Elija **Tipo de detracción (SPOT)** en la ficha del producto: el
      **Código de detracción** y el **Porcentaje de detracción** nativos, los
      que usa la factura electrónica, se completan solos y se mantienen
      alineados al guardar.
    imagen: screenshots/03-producto.png

  - titulo: Registrar la cuenta de detracciones del contacto
    ruta: Contactos ▸ contacto ▸ junto al número de identificación
    texto: >-
      Escriba el número de la cuenta de detracciones del **Banco de la
      Nación** (11 dígitos) en el campo **Cuenta de detracciones**, que se
      muestra sin etiqueta justo debajo del RUC. Solo admite dígitos y es
      obligatorio para incluir al contacto en un depósito masivo.
    puntos:
      - El campo solo se muestra en contactos de Perú.
    imagen: screenshots/04-contacto.png
    pie: "DEMO SPOT Contraparte SAC: RUC 20131312955 y cuenta 00012345678."

  - titulo: Activar el reparto contable (opcional)
    ruta: Perú ▸ Configuración ▸ Ajustes ▸ Detracciones (SPOT)
    texto: >-
      Marque **Separar detracción en el asiento** y elija la **Cuenta
      detracciones por cobrar** (tipo por cobrar) y la **Cuenta detracciones
      por pagar** (tipo por pagar). Desactivada, el total queda en la cuenta
      del cliente o proveedor, como en Odoo estándar.
    puntos:
      - Con la opción activa y sin cuentas, publicar una factura afecta se detiene con un aviso que indica dónde configurarlas.
    imagen: screenshots/05-ajustes.png

  - seccion: Contraste con SUNAT
    texto: Comprobar el catálogo contra la página de SUNAT, sin aplicar nada solo.
  - titulo: Contrastar el catálogo con SUNAT
    ruta: Perú ▸ Configuración ▸ Tributos SUNAT ▸ Detracciones (SPOT) ▸ botón Contrastar con SUNAT
    texto: >-
      Descarga la página de apéndices del SPOT de SUNAT y compara cada código
      con el catálogo. SUNAT no publica el porcentaje por código: el módulo
      cruza por nombre sus tablas de modificaciones y toma la de fecha más
      reciente (por ejemplo, el 12 % de los servicios desde el 01/04/2018).
      El botón lo ven los administradores de contabilidad.
    imagen: screenshots/15-contrastar-boton.png

  - titulo: Revisar y aplicar las diferencias
    ruta: Perú ▸ Configuración ▸ Tributos SUNAT ▸ Contrastes con SUNAT
    texto: >-
      Cada contraste queda guardado con una línea por código: **Coincide**,
      **Porcentaje distinto**, **Nuevo en SUNAT**, **Sin porcentaje en
      SUNAT** o **No figura en SUNAT**. Marque **Aplicar** en las diferencias
      que haya comprobado y pulse **Aplicar marcadas**: el porcentaje se
      actualiza y se reaplica a los productos, o el código nuevo se crea.
    puntos:
      - "Los códigos nuevos del Anexo 1 toman el monto mínimo de los otros bienes del anexo (media UIT); los demás, S/ 700. Revíselo en el tipo creado."
      - "«Sin porcentaje» y «No figura» son informativos: el 027, transporte de bienes, tiene norma propia y no está en esa página."
      - "La acción planificada **Detracciones: contrastar el catálogo con SUNAT** lo hace cada mes; solo guarda un contraste —con una actividad para los administradores de contabilidad— cuando cambian las diferencias."
      - "Los cambios de porcentaje y monto mínimo quedan en el historial del tipo de detracción."
    imagen: screenshots/16-contraste-sunat.png
    pie: "Contraste del 16/09/2026, antes de aplicar: los 26 porcentajes coinciden y SUNAT lista seis códigos nuevos (007, 011, 016, 023, 032 y 041), que ya vienen en el catálogo."

  - seccion: Ventas
    texto: El cliente retiene la detracción y la deposita en la cuenta de la empresa.
  - titulo: La factura de venta calcula la detracción
    ruta: Contabilidad ▸ Clientes ▸ Facturas ▸ pestaña Detracción
    texto: >-
      Si el total supera el mínimo del código, aparece la pestaña
      **Detracción** con el tipo, el **Tipo de operación SPOT** (tabla 5.5 del
      Banco de la Nación), el porcentaje, el **Monto de detracción** y el
      **Neto tras detracción**. A la derecha, la **Constancia de depósito**.
    puntos:
      - Con varios productos afectos se toma el código de mayor porcentaje.
      - En borrador el tipo y el porcentaje se pueden corregir a mano.
      - "Al publicar, el tipo de operación de la factura electrónica pasa a **1001** si no tenía uno de la familia 100x."
    imagen: screenshots/06-factura-venta.png
    pie: "Venta de S/ 5.900,00 con código 037 al 12 %: detracción S/ 708,00 y neto S/ 5.192,00."

  - titulo: Reparto de la detracción en el asiento de la venta
    ruta: Factura ▸ pestaña Apuntes contables
    texto: >-
      Con el reparto activo, al publicar la línea por cobrar se divide: el
      neto queda en la cuenta del cliente y la detracción en la cuenta de
      detracciones por cobrar, con el mismo vencimiento. Total, residual e
      importes de la factura no cambian.
    puntos:
      - Cada línea por cobrar se concilia por separado.
      - Si el total cae por debajo del mínimo, al republicar el reparto desaparece.
    imagen: screenshots/07-reparto-venta.png
    pie: "DPSV/2026/00008 por S/ 3.540,00: S/ 3.115,00 en 1213000 y S/ 425,00 en 121901. La cinta «Parcial» es por el cobro de la detracción ya registrado."

  - seccion: Compras
    texto: La empresa es la adquiriente y deposita la detracción al proveedor.
  - titulo: La factura de proveedor muestra lo que hay que depositar
    ruta: Contabilidad ▸ Proveedores ▸ Facturas ▸ pestaña Detracción
    texto: >-
      El cálculo es el mismo que en ventas. Mientras no tenga constancia, la
      factura publicada muestra el botón **Registrar depósito**.
    imagen: screenshots/08-factura-compra.png
    pie: "DPSC/2026/07/0004: S/ 2.360,00 al 12 % = S/ 283,00 a depositar y S/ 2.077,00 de neto."

  - titulo: Registrar el depósito y la constancia
    ruta: Factura ▸ pestaña Detracción ▸ Registrar depósito
    texto: >-
      El asistente propone el **Monto del depósito** (la detracción, editable).
      Elija el **Diario del depósito** (banco o caja) e indique la **Fecha de
      la constancia** y el **Nº de constancia**. Al **Registrar** se crea el
      pago con el memo «Detracción ‹constancia› - ‹factura›» y la constancia
      queda guardada en la factura.
    puntos:
      - Con reparto activo, el pago se aplica solo a la línea de la detracción y la deuda con el proveedor sigue pendiente.
      - Sin reparto, es un pago parcial de la factura por el monto de la detracción.
      - La factura debe estar publicada y el monto ser mayor que cero.
    imagen: screenshots/09-registrar-deposito.png

  - titulo: La constancia queda en la factura
    ruta: Factura ▸ pestaña Detracción ▸ Constancia de depósito
    texto: >-
      Los campos **Detracción** (número) y **Fecha de detracción** se llenan
      con los datos de la constancia y el botón desaparece. Son los campos que
      leen el PLE 8.1 y el PLE 8.3.
    imagen: screenshots/10-constancia.png
    pie: "DPSC/2026/07/0007 con constancia DEMO-SPLIT-0001 del 20/07."

  - titulo: Reparto en el asiento de la compra
    ruta: Factura ▸ pestaña Apuntes contables
    texto: >-
      Es el espejo de la venta: al haber, el neto en la cuenta del proveedor
      y la detracción en la cuenta de detracciones por pagar.
    imagen: screenshots/11-reparto-compra.png
    pie: "S/ 1.770,00: S/ 1.558,00 en 4212000 y S/ 212,00 en 424901."

  - titulo: El pago del depósito
    ruta: Contabilidad ▸ Proveedores ▸ Pagos
    texto: >-
      El depósito es un pago estándar de Odoo 19, con el diario elegido y el
      memo que identifica la constancia y la factura.
    imagen: screenshots/12-pago-deposito.png

  - titulo: Detracciones pendientes de constancia
    ruta: Contabilidad ▸ Proveedores ▸ Facturas ▸ Filtros
    texto: >-
      El filtro **Detracción sin constancia** lista las facturas publicadas
      con detracción que aún no tienen número de constancia; **Con
      detracción** muestra todas las afectas. Ambos están en las listas de
      facturas de clientes y de proveedores.
    imagen: screenshots/13-sin-constancia.png

  - seccion: Depósito masivo
    texto: Un archivo para pagar muchas detracciones de una vez en el Banco de la Nación.
  - titulo: Generar el archivo del Banco de la Nación
    ruta: Perú ▸ Detracciones ▸ Depósito masivo (Banco de la Nación)
    texto: >-
      Elija la **Modalidad**, el **Nº de lote** (6 dígitos, AANNNN) y el
      periodo **Desde** / **Hasta**. Si deja **Comprobantes** vacío se toman
      todos los publicados con detracción del periodo. **Generar archivo**
      entrega el TXT y lista los comprobantes excluidos con su motivo.
    puntos:
      - "Como adquiriente: facturas de proveedor, cabecera con `*` y la cuenta de cada proveedor."
      - "Como proveedor: facturas de venta, cabecera con `P` y el RUC de la empresa; cada línea identifica al cliente que debía depositar y lleva la cuenta de detracciones de la propia empresa (en su contacto)."
      - El archivo se valida antes de entregarse; el banco rechaza el lote completo si una línea no mide lo que debe.
    imagen: screenshots/14-deposito-masivo.png
    pie: "Julio de 2026: tres facturas de proveedor en el archivo y una excluida por no tener cuenta del Banco de la Nación."

  - seccion: Declaración
    texto: Lo que otros módulos toman de las detracciones.
  - titulo: Constancia en los registros de compras
    ruta: Perú ▸ Libros PLE
    texto: >-
      El número y la fecha de la constancia salen en el PLE 8.1 (campos 32-33,
      informe nativo de Odoo Enterprise) y en el PLE 8.3 Compras Simplificado
      (campos 24-25) de `al_l10n_pe_ple`. No requiere configuración.
  - titulo: Exclusión de la retención del IGV
    texto: >-
      Con `al_l10n_pe_retention` instalado, una factura de proveedor sujeta a
      detracción no calcula retención del IGV: el régimen las excluye.

campos_intro: >-
  Cada campo que añade el módulo, dónde está y qué efecto tiene.
campos:
  - grupo: Tipo de detracción (catálogo 54)
    ruta: Perú ▸ Configuración ▸ Tributos SUNAT ▸ Detracciones (SPOT)
    campos:
      - [Código, "Código de 3 caracteres del catálogo 54; único.", Vacío, Se copia al producto y va en el archivo del banco]
      - [Descripción, Nombre del bien o servicio., Vacío, "Se muestra como «[código] descripción»"]
      - [Active, Deja el código disponible en las listas., Activado, Desactivado no se ofrece en productos ni facturas]
      - ["Porcentaje (%)", "Tasa vigente; mayor que 0 y hasta 100.", Vacío, Tasa de la factura y del producto]
      - ["Monto mínimo (S/)", "Total con IGV a partir del cual aplica; 0 = cualquier monto.", "700,00", "Facturas iguales o menores no llevan detracción"]
      - [Notas, "Base legal, vigencia u otras observaciones.", Vacío, Informativo]
      - [Productos, Productos que usan el tipo., Calculado, Abre su lista]
  - grupo: Contraste con SUNAT
    ruta: Perú ▸ Configuración ▸ Tributos SUNAT ▸ Contrastes con SUNAT
    campos:
      - [Fecha y Fuente, Cuándo y de qué página se contrastó., "Página de apéndices del SPOT", "La dirección se cambia en el parámetro del sistema al_l10n_pe_detraction.sunat_spot_url"]
      - [Diferencias / Por aplicar, Porcentajes distintos y códigos nuevos; los que faltan aplicar., Calculado, "«Aplicar marcadas» solo se muestra si hay pendientes"]
      - [Aplicar, Marca la línea para aplicarla., Desmarcado, Solo en diferencias no aplicadas]
      - ["% Odoo / % SUNAT", Porcentaje del catálogo y el publicado., "—", "Vigente desde: fecha de la tabla de SUNAT"]
      - [Estado, "Coincide, Porcentaje distinto, Nuevo en SUNAT, Sin porcentaje en SUNAT o No figura en SUNAT.", Calculado, Solo los dos primeros piden decisión]
      - [Aplicado, La línea ya se aplicó al catálogo., Desmarcado, Queda en el historial del contraste]
  - grupo: Producto
    ruta: Contabilidad ▸ Clientes ▸ Productos
    campos:
      - [Tipo de detracción (SPOT), Código del catálogo 54 del producto., Vacío, Rellena el código y el porcentaje nativos]
      - [Código de detracción, Campo nativo de la factura electrónica., Vacío, Se sincroniza con el tipo]
      - [Porcentaje de detracción, Campo nativo de la factura electrónica., "0,00", Se sincroniza con el tipo]
  - grupo: Contacto
    ruta: Contactos ▸ contacto
    campos:
      - [Cuenta de detracciones, "Cuenta del Banco de la Nación; hasta 11 dígitos, solo números.", Vacío, "Obligatoria para el depósito masivo"]
  - grupo: Ajustes de la compañía
    ruta: Perú ▸ Configuración ▸ Ajustes ▸ Detracciones (SPOT)
    campos:
      - [Separar detracción en el asiento, Reparte la línea por cobrar o pagar al publicar., Desmarcado, Neto y detracción en líneas separadas]
      - [Cuenta detracciones por cobrar, Cuenta de tipo por cobrar para las ventas., Vacío, "Obligatoria con el reparto activo"]
      - [Cuenta detracciones por pagar, Cuenta de tipo por pagar para las compras., Vacío, "Obligatoria con el reparto activo"]
  - grupo: Factura de venta o de proveedor
    ruta: Factura ▸ pestaña Detracción
    campos:
      - [Tipo de detracción, Código dominante entre los productos., Calculado, Editable en borrador]
      - [Tipo de operación SPOT, "Tabla 5.5 del Banco de la Nación (01 a 05).", "01 - Venta de bienes, prestación de servicios…", Va en el archivo de depósito masivo]
      - ["% detracción", Porcentaje del tipo dominante., Calculado, Editable en borrador]
      - [Monto de detracción, "Total con IGV en soles × %, redondeado a soles.", Calculado, Importe del depósito y del reparto]
      - [Neto tras detracción, Total en soles menos la detracción., Calculado, Lo que se cobra o paga fuera del banco]
      - [Detracción, Número de la constancia de depósito., Vacío, "PLE 8.1 y 8.3; oculta «Registrar depósito»"]
      - [Fecha de detracción, Fecha de la constancia., Vacío, PLE 8.1 y 8.3]
