titulo: Cobranza
subtitulo: >-
  La aplicación del equipo de cobranza: cartera por gestor, gestiones, compromisos de pago
  evaluados solos, proyección de cobranza, metas, indicadores, estado de cuenta y avisos.
categoria: Localización Perú · Tesorería
etiquetas: [Cobranza, Cartera, Compromisos de pago, Proyección, DSO, Estado de cuenta]
portada: screenshots/dashboard.png

destacados_intro: >-
  Sobre el seguimiento de pagos nativo de Odoo: el gestor es su responsable y los
  recordatorios siguen siendo los niveles de seguimiento.
destacados:
  - icono: "▦"
    titulo: Cartera por gestor
    texto: >-
      Antigüedad por tramos, zona y compromiso vigente, en lista y tabla dinámica.
  - icono: "☎"
    titulo: Gestiones
    texto: >-
      Llamadas, visitas, correos y WhatsApp con su resultado y la próxima acción.
  - icono: "✓"
    titulo: Compromisos
    texto: >-
      Se evalúan solos: cumplido, parcial o incumplido, con alerta al gestor.
  - icono: "↗"
    titulo: Proyección
    texto: >-
      Por compromiso, historial de pago del cliente y probabilidad por antigüedad;
      proyectado frente a cobrado.
  - icono: "%"
    titulo: Tablero y metas
    texto: >-
      Tablero nativo de Odoo con filtros por gestor, zona, cliente y periodo; meta por
      gestor, DSO y cumplimiento de compromisos.
  - icono: "✉"
    titulo: Avisos
    texto: >-
      Recordatorio al cliente, alerta de incumplidos y resumen diario a cada gestor.
  - icono: "A"
    titulo: Riesgo y bloqueo
    texto: >-
      Calificación A–D de cada cliente, cola de trabajo por prioridad y bloqueo de crédito
      por mora.
  - icono: "⚖"
    titulo: Cumplimiento peruano
    texto: >-
      Reclamos que pausan la cobranza, protección al consumidor (art. 62), intereses por
      nota de débito, provisión y castigo tributario y centrales de riesgo.

contexto:
  titulo: El problema que resuelve
  texto: >-
    Odoo recuerda las facturas vencidas, pero no registra qué se habló con el cliente, qué
    prometió pagar ni si cumplió, ni proyecta cuánto se cobrará. El equipo de cobranza lo
    llevaba en hojas de cálculo que nadie podía consolidar.
  nota: >-
    **Cartera.** Excluye los anticipos de clientes (122) y las detracciones por cobrar, que
    van al Banco de la Nación.

pasos_intro: >-
  Una cartera de 24 clientes repartida entre dos gestoras.
pasos:
  - titulo: Asignar la cartera
    ruta: Cobranza ▸ Cartera ▸ Clientes y gestores
    texto: >-
      Gestor de cobranza y zona de cada cliente, en lote.
  - titulo: Revisar la antigüedad
    ruta: Cobranza ▸ Cartera ▸ Antigüedad
    texto: >-
      Saldo por gestor y tramo de días de atraso.
    imagen: screenshots/aging.png
  - titulo: Registrar gestiones y compromisos
    ruta: Cobranza ▸ Gestión ▸ Gestiones
    texto: >-
      Cada llamada con su resultado; «Promete pagar» crea el compromiso, que se evalúa solo.
    imagen: screenshots/promises.png
  - titulo: Proyectar la cobranza
    ruta: Cobranza ▸ Proyección y metas ▸ Proyección de cobranza
    texto: >-
      Cobranza esperada por semana con su origen: compromiso, historial o vencimiento.
    imagen: screenshots/forecast.png
  - titulo: Enviar el estado de cuenta
    texto: >-
      Desde la ficha del cliente o a varios clientes a la vez.
    imagen: screenshots/statement.png
  - titulo: Trabajar la cola del día
    ruta: Cobranza ▸ Cartera ▸ Cola de trabajo
    texto: >-
      Clientes con deuda vencida ordenados por vencido y riesgo; «Gestionar» registra la
      llamada.
    imagen: screenshots/v3-worklist.png
  - titulo: Provisionar la cobranza dudosa
    ruta: Cobranza ▸ Gestión ▸ Provisión de cobranza dudosa
    texto: >-
      Propone las deudas de más de 12 meses con gestiones registradas, contabiliza 68711 / 19,
      imprime el expediente de cada deudor y después registra recuperaciones y castigos.
    imagen: screenshots/v3-provision.png
  - titulo: Reportar a una central de riesgo
    ruta: Cobranza ▸ Gestión ▸ Centrales de riesgo
    texto: >-
      Aviso previo al deudor, plazo de espera, reporte y aviso al gestor para retirarlo cuando
      paga.
    imagen: screenshots/v3-bureaus.png
  - titulo: Llevar la cobranza judicial
    ruta: Cobranza ▸ Gestión ▸ Cobranza judicial
    texto: >-
      Demanda, expediente, actuaciones con plazos y gastos; sustenta la provisión y el castigo de
      la cobranza dudosa ante SUNAT.
    imagen: screenshots/v3-lawsuit.png
  - titulo: Entregar cartera a una agencia externa
    ruta: Cobranza ▸ Cartera ▸ Agencias externas
    texto: >-
      Asigna clientes a un estudio o call center por fechas; sus usuarios solo ven esos clientes
      y sus documentos, sin entrar a Contabilidad.
    imagen: screenshots/v3-agency.png
  - titulo: Liquidar comisiones
    ruta: Cobranza ▸ Proyección y metas ▸ Comisiones
    texto: >-
      Porcentaje de lo recuperado según la antigüedad de la deuda, para gestores y agencias; cada
      cobro comisiona una vez y la comisión de la agencia queda como factura de proveedor.
    imagen: screenshots/v3-commission.png

configuracion:
  - "Permisos Cobranza / Gestor o Administrador; el personal de las agencias recibe «Cobranza: agencia externa» al agregarlo a su agencia."
  - "Cobranza ▸ Configuración: zonas, tramos de antigüedad con su probabilidad y resultados de gestión."
  - "Cobranza ▸ Configuración ▸ Ajustes (app Cobranza de Ajustes): toda la configuración de la app en cuatro bloques, con accesos a zonas, tramos, resultados, motivos, tasas del BCRP, planes, agencias y proveedores de pago."
  - "Pago en línea: activar una pasarela (Culqi, Niubiz, Izipay…) en Contabilidad ▸ Configuración ▸ Proveedores de pago; el enlace se desactiva en Cobranza ▸ Configuración ▸ Ajustes ▸ Cobranza."
  - "Ajustes de Cobranza: horario de contacto con consumidores, bloqueo por mora, tasa de interés moratorio, cuentas y diario de provisiones, UIT y plazo del aviso a centrales."
  - "Comisiones: plan de los gestores y servicio de la factura de agencias en los Ajustes de Cobranza; planes en Cobranza ▸ Configuración; agencias en Cobranza ▸ Cartera ▸ Agencias externas."
  - "Feriados: ausencias globales del horario laboral de la compañía (módulo Recursos)."

faq:
  - pregunta: "¿Reemplaza al seguimiento de pagos de Odoo?"
    respuesta: >-
      No: lo usa. El gestor es el responsable de seguimiento y los niveles siguen enviando
      los recordatorios; la app agrega gestiones, compromisos, proyección, metas e
      indicadores.
  - pregunta: "¿Un gestor ve la cartera de otros?"
    respuesta: >-
      No: el permiso Gestor ve solo sus clientes, gestiones y compromisos; el
      Administrador ve todo.
  - pregunta: "¿De dónde sale el atraso promedio de un cliente?"
    respuesta: >-
      De sus facturas pagadas en los últimos meses (12 por defecto): días entre el
      vencimiento y el pago, ponderados por importe.

  - pregunta: "¿Cómo sabe la app que un cliente es consumidor?"
    respuesta: >-
      Por su documento: sin RUC es consumidor. En la ficha del cliente se puede fijar el tipo
      de deudor a mano.
  - pregunta: "¿Qué sustenta la provisión ante SUNAT?"
    respuesta: >-
      Las gestiones de cobro registradas después del vencimiento (la Casación 15840-2025 pide
      acciones concretas) o un proceso judicial; el expediente de cobranza en PDF las reúne
      con los compromisos, reclamos y comunicaciones.
  - pregunta: "¿Envía la deuda a Equifax o Sentinel?"
    respuesta: >-
      No hay API pública: la app lleva el aviso previo, el plazo, el reporte y el retiro, y
      genera el Excel con los datos que se cargan en la central.

