    fecha: 14/10/2026
    cambios:
      - "Primera versión: QR de Yape, Plin u otra billetera como formato del cobro por QR del TPV, también sin conexión."

relacionados: [al_pos_pe_partner_lookup, al_payment_izipay, al_payment_niubiz, al_payment_culqi]
