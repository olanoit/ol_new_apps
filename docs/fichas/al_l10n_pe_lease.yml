titulo: Arrendamientos NIIF 16
subtitulo: >-
  Alquileres de oficinas, almacenes y equipos según NIIF 16, de la firma al
  cierre: pasivo a valor presente, derecho de uso con su depreciación, cuotas
  del arrendador, remediciones, terminación anticipada, contratos en dólares e
  impuesto diferido, sobre los activos y préstamos de Odoo.
categoria: Localización Perú · Contabilidad
etiquetas: [NIIF 16, Arrendamientos, Derecho de uso, Pasivo por arrendamiento, Remedición, Moneda extranjera, Impuesto diferido, Enterprise]
portada: screenshots/02-contrato.png
ediciones: [enterprise]

destacados_intro: >-
  El contrato se arma una vez; los asientos de cada mes los generan los motores
  de activos y préstamos de Odoo.
destacados:
  - icono: "%"
    titulo: Valor presente
    texto: >-
      Pasivo por el valor presente de las cuotas con la tasa incremental de
      endeudamiento; tabla por el método del interés efectivo.
  - icono: "▣"
    titulo: Derecho de uso
    texto: >-
      Activo = pasivo + cuota adelantada + costos directos − incentivos, con
      depreciación lineal mensual en el plazo del contrato.
  - icono: "⇄"
    titulo: Interés y capital cada mes
    texto: >-
      El pasivo vive en un préstamo de Odoo: cada cuota separa interés y
      capital y reclasifica el corto plazo.
  - icono: "＋"
    titulo: Cuotas del arrendador
    texto: >-
      «Registrar cuota» crea la factura del arrendador contra el pasivo; IGV y
      detracción como cualquier factura.
  - icono: "12"
    titulo: Exenciones
    texto: >-
      Contratos de 12 meses o menos y bienes de bajo valor: sin activo ni
      pasivo, la cuota va a gasto de alquiler.
  - icono: "↻"
    titulo: Remedición y terminación
    texto: >-
      Cambio de cuota, plazo o tasa con su ajuste del pasivo y del derecho de
      uso; terminación anticipada con baja de ambos y resultado.
  - icono: "$"
    titulo: Contratos en dólares
    texto: >-
      El pasivo se ajusta por diferencia de cambio cada fin de mes; el derecho
      de uso queda al tipo de cambio del inicio (NIC 21).
  - icono: "≠"
    titulo: Impuesto diferido
    texto: >-
      Gasto contable (depreciación + interés) frente al alquiler deducible por
      contrato y ejercicio, con el impuesto diferido (NIC 12).

contexto:
  titulo: Qué pide la NIIF 16
  texto: >-
    Desde 2019 el arrendatario ya no registra el alquiler como gasto del mes:
    reconoce un pasivo por las cuotas futuras (a valor presente) y un activo
    por el derecho de usar el bien, que se deprecia en el plazo. El gasto del
    periodo pasa a ser depreciación (683) más intereses (673). Las empresas
    que reportan con NIIF plenas lo aplican a oficinas, almacenes, locales y
    equipos; quedan fuera los contratos de corto plazo y los de bienes de bajo
    valor.
  nota: >-
    **Requiere Odoo Enterprise**: usa los módulos de activos fijos
    (account_asset) y préstamos (account_loans).

flujos:
  - id: arrendamiento
    titulo: Del contrato a los asientos
    texto: >-
      El contrato confirmado crea el asiento inicial, el activo y el préstamo;
      cada mes se deprecia el activo, se devenga el interés y llega la factura
      del arrendador.
    mermaid: |
      flowchart TD
        A[Contrato en borrador<br/>plazo, cuota, tasa] --> B{¿Exento?}
        B -- Corto plazo o bajo valor --> C[Exento<br/>cuota a gasto de alquiler]
        B -- No --> D[Calcular<br/>valor presente y tabla]
        D --> E[Confirmar]
        E --> F[Asiento inicial<br/>32 derecho de uso / 45 pasivo]
        E --> G[Activo<br/>depreciación lineal 683 / 39]
        E --> H[Préstamo<br/>interés 673 y capital por cuota]
        H --> I[Registrar cuota<br/>factura del arrendador contra el pasivo]
        I --> J{¿Cambia el contrato?}
        J -- Cuota, plazo o tasa --> K[Remedir<br/>ajuste del pasivo y del derecho de uso]
        J -- Termina antes --> L[Terminación anticipada<br/>baja del activo y del pasivo]
        J -- En dólares --> M[Diferencia de cambio<br/>del pasivo a fin de mes]
        J -- No --> N[Fin del plazo]
        K --> I
        M --> I

pasos_intro: >-
  Ejemplo: oficina a 36 meses, cuota adelantada de S/ 4 500 sin IGV, tasa
  incremental del 12 % anual y S/ 1 200 de costos directos.
pasos:
  - seccion: Contrato
  - titulo: Registrar el contrato
    ruta: Perú ▸ Arrendamientos ▸ Contratos ▸ Nuevo
    texto: >-
      Arrendador, bien, inicio, plazo, cuota y si se paga al inicio o al final
      del mes. Con 12 meses o menos queda marcado como exento (corto plazo);
      «Activo de bajo valor» se elige a mano.
    imagen: screenshots/04-borrador.png
  - titulo: Calcular y confirmar
    ruta: Contrato ▸ Calcular / Confirmar
    texto: >-
      «Calcular» muestra el pasivo, el derecho de uso y la tabla. «Confirmar»
      registra el asiento inicial, el activo y el préstamo, enlazados por un
      grupo de activos.
    puntos:
      - "Cuota adelantada: la primera se paga al firmar y va al activo, no al pasivo (35 cuotas en la tabla)."
      - "La tasa es la incremental de endeudamiento: la de un préstamo al mismo plazo."
    imagen: screenshots/02-contrato.png
  - titulo: Cuentas del contrato
    ruta: Contrato ▸ Contabilidad
    texto: >-
      Cuentas del activo, del pasivo, de intereses y la transitoria, con las del
      PCGE por defecto; se pueden cambiar mientras el contrato esté en borrador.
    puntos:
      - "El plan de Odoo solo trae la 452: «Crear subcuentas del pasivo» crea 4521 (largo plazo) y 4522 (corto plazo), así la reclasificación separa ambos plazos en el balance."
      - "«Producto de la cuota» (un servicio de alquiler) lleva el IGV y el tipo de detracción a cada factura del arrendador."
    imagen: screenshots/03-cuentas.png
  - titulo: El activo y el pasivo
    ruta: Contrato ▸ Derecho de uso / Pasivo
    texto: >-
      El derecho de uso es un activo fijo con su tabla de depreciación mensual;
      el pasivo es un préstamo de Odoo con la tabla del contrato: cada cuota
      publica su interés y su capital en su fecha.
    imagen: screenshots/07-pasivo.png
  - titulo: Contrato exento
    ruta: Perú ▸ Arrendamientos ▸ Contratos
    texto: >-
      A 12 meses o menos (o de bajo valor), el contrato queda «Exento»: sin
      activo ni pasivo; sus cuotas se facturan a gasto de alquiler.
    imagen: screenshots/05-exento.png
  - seccion: Cada mes
  - titulo: Registrar la cuota
    ruta: Contrato ▸ Registrar cuota
    texto: >-
      Crea en borrador la factura del arrendador de la siguiente cuota: la
      primera (adelantada) contra la cuenta transitoria y las demás contra el
      pasivo de corto plazo. El préstamo ya registró su interés y su capital.
    imagen: screenshots/08-factura.png
  - titulo: Seguimiento
    ruta: Perú ▸ Arrendamientos ▸ Tabla de cuotas / Análisis
    texto: >-
      Cuotas, intereses, capital y saldo por contrato y por año. En el contrato,
      «Saldos a hoy» compara el pasivo según la tabla con el del libro (en soles
      la diferencia es cero) y muestra el valor en libros del derecho de uso.
    imagen: screenshots/09-analisis.png

  - seccion: Cambios en el contrato
  - titulo: Remedir
    ruta: Contrato ▸ Remedir
    texto: >-
      Reajuste de la renta, prórroga o acortamiento del plazo, o nueva tasa: se
      indica desde qué mes rige (primer día de un mes sin asientos
      contabilizados). El pasivo se recalcula con las cuotas que faltan y la
      diferencia aumenta o disminuye el derecho de uso, que se deprecia en el
      plazo nuevo.
    puntos:
      - "Aumento: «Reevaluar» del activo crea el aumento bruto (32 / 45)."
      - "Disminución: baja el derecho de uso contra el pasivo; lo que exceda su valor en libros va a resultados."
      - "El préstamo anterior se cierra y uno nuevo lleva la tabla remedida; el historial guarda el antes y el después."
    imagen: screenshots/11-asistente-remedicion.png
  - titulo: Historial
    ruta: Contrato ▸ Historial
    texto: >-
      Remediciones, terminación y diferencias de cambio con su fecha, motivo,
      pasivo antes y después y sus asientos.
    imagen: screenshots/10-remedicion.png
  - titulo: Contrato en dólares
    ruta: Contrato ▸ Diferencia de cambio
    texto: >-
      Con moneda extranjera el derecho de uso se registra al tipo de cambio del
      inicio y no se ajusta; el pasivo se expresa al tipo de cambio de cada fin
      de mes (un cron lo hace solo; el botón permite otra fecha). El arrendador
      factura en dólares.
    imagen: screenshots/12-moneda-extranjera.png
  - titulo: Terminación anticipada
    ruta: Contrato ▸ Terminación anticipada
    texto: >-
      Desde el primer día del mes sin contrato: el derecho de uso se da de baja a
      su valor en libros (pérdida) y el pasivo pendiente (ganancia); el préstamo
      se cierra y el contrato queda «Terminado». Las cuotas ya devengadas se
      siguen facturando; una penalidad se registra con su factura, a gasto.

  - seccion: Impuesto a la renta
  - titulo: Diferencias temporales
    ruta: Perú ▸ Arrendamientos ▸ Diferencias temporales
    texto: >-
      Por ejercicio y contrato: depreciación del derecho de uso + interés
      (gasto contable) frente al alquiler de las facturas del arrendador (gasto
      deducible), con la diferencia temporal y el impuesto diferido a la tasa
      indicada. El derecho de uso no se deprecia para el impuesto a la renta
      (Informe N.° 054-2021-SUNAT/7T0000).
    imagen: screenshots/13-diferencias-temporales.png

asientos_intro: >-
  Oficina del ejemplo: pasivo S/ 133 483,38 (valor presente de 35 cuotas) y
  derecho de uso S/ 139 183,38 (pasivo + cuota adelantada 4 500 + costos 1 200).
asientos:
  - titulo: Reconocimiento inicial
    referencia: Reconocimiento inicial ARR/2026/0029
    lineas:
      - ["32331", "Derecho de uso – edificaciones", "139.183,38", ""]
      - ["452", "Pasivo por arrendamiento", "", "133.483,38"]
      - ["183", "Cuota adelantada y costos directos (transitoria)", "", "5.700,00"]
    nota: >-
      La factura de la primera cuota y las de los costos directos cargan la
      cuenta transitoria y la saldan.
  - titulo: Cuota del mes 2 (préstamo)
    referencia: ARR/2026/0029 - Oficina Av. Javier Prado 450, piso 8 - Principal & Interest 08/2026
    lineas:
      - ["452", "Capital (largo plazo)", "3.233,40", ""]
      - ["6732", "Intereses del arrendamiento", "1.266,60", ""]
      - ["452", "Cuota por pagar (corto plazo)", "", "4.500,00"]
    nota: >-
      La factura del arrendador carga el corto plazo con la cuota (más IGV) y
      la abona al proveedor.

  - titulo: Remedición (depósito, reajuste del 10 % desde octubre)
    referencia: ARR/2026/0080 · Remedición
    lineas:
      - ["32331", "Derecho de uso (aumento bruto)", "7.858,79", ""]
      - ["4521", "Pasivo por arrendamiento – largo plazo", "", "7.858,79"]
    nota: >-
      Pasivo antes S/ 71 160,39 y remedido S/ 79 019,18 (27 cuotas de S/ 3 300
      al 12 % anual, la de octubre adelantada).
  - titulo: Diferencia de cambio (local en dólares, al 30/09)
    referencia: Diferencia de cambio del pasivo ARR/2026/0079
    lineas:
      - ["4521", "Pasivo por arrendamiento – largo plazo", "1.112,21", ""]
      - ["776", "Diferencia de cambio (ganancia)", "", "1.112,21"]
    nota: >-
      El tipo de cambio bajó de 3,417 (inicio) a 3,40: el pasivo en dólares vale
      menos en soles. El derecho de uso sigue en S/ 220 393,08.

