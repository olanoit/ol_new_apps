titulo: Entregas a rendir y caja chica
subtitulo: >-
  Dinero entregado a un trabajador para gastos de la empresa: entrega,
  rendición con comprobantes y planilla de movilidad, devolución o reembolso
  del saldo y cierre. También la caja chica con su reposición.
categoria: Localización Perú · Contabilidad
etiquetas: [Tesorería, Entregas a rendir, Caja chica, Fondo fijo, Planilla de movilidad, PCGE 1413, Impuesto a la Renta]
portada: screenshots/02-entrega.png

destacados_intro: >-
  Cada sol entregado a un trabajador queda a su nombre en la 1413 hasta que lo
  sustenta, lo devuelve o la empresa le reembolsa lo que puso de más.
destacados:
  - icono: "⇄"
    titulo: Entrega y rendición
    texto: >-
      La entrega es un pago al responsable; la rendición paga las facturas de
      proveedor con el fondo y deja el saldo a la vista.
  - icono: "🚕"
    titulo: Planilla de movilidad
    texto: >-
      Gastos de movilidad sin comprobante con su planilla numerada e impresa,
      tope diario del 4 % de la RMV y aviso del exceso no deducible.
  - icono: "↺"
    titulo: Caja chica
    texto: >-
      Fondo fijo con su custodio: cada rendición se repone con un clic por el
      importe gastado.
  - icono: "✓"
    titulo: Conciliación automática
    texto: >-
      Las facturas rendidas quedan pagadas y, al cerrar, la 1413 del fondo queda
      conciliada sin trabajo manual.
  - icono: "⏰"
    titulo: Plazo de rendición
    texto: >-
      Fecha límite por fondo, filtro de entregas vencidas y actividades en el
      chatter.
  - icono: "▤"
    titulo: Liquidación impresa
    texto: >-
      Resumen del fondo con entregas, rendiciones, devoluciones y saldo para la
      firma del responsable.

contexto:
  titulo: El problema que resuelve
  texto: >-
    Los viáticos, las compras urgentes y la caja chica se llevan en hojas de
    cálculo: el contador recibe las facturas semanas después, no sabe cuánto
    debe rendir cada trabajador y la movilidad sin comprobante se pierde o se
    registra sin planilla, con lo que SUNAT la repara. Aquí cada entrega tiene
    su número, su responsable y su saldo; las facturas se pagan con el fondo y
    la movilidad sale con la planilla que exige el Reglamento de la Ley del
    Impuesto a la Renta.
  nota: >-
    **Necesita** un diario de banco o caja para las entregas. La cuenta del
    fondo debe ser **conciliable**: por defecto la 1413 «Personal - Entregas a
    rendir cuenta» del PCGE; la movilidad va por defecto a la 63112.

requisitos_nota: >-
  Funciona en Community y Enterprise con la localización peruana (l10n_pe).
  Las facturas de proveedor se registran como siempre, con su tipo y número
  de comprobante.

flujos_intro: >-
  Vida de una entrega a rendir y de una caja chica.
flujos:
  - id: entrega
    titulo: Entrega a rendir
    texto: >-
      Se aprueba, se entrega con un pago y se rinde en una o varias
      rendiciones; el saldo se devuelve o se reembolsa antes de cerrar.
    mermaid: |
      flowchart TD
        A[Borrador<br/>responsable, motivo, monto] --> B[Aprobar<br/>número ER/año/…]
        B --> C[Entregar<br/>pago: 1413 / banco]
        C --> D[Rendición<br/>facturas + planilla de movilidad]
        D --> E{Saldo por rendir}
        E -- "> 0" --> F[Registrar devolución<br/>banco / 1413]
        E -- "< 0" --> G[Registrar reembolso<br/>1413 / banco]
        E -- "= 0" --> H[Cerrar<br/>1413 conciliada]
        F --> H
        G --> H
  - id: caja
    titulo: Caja chica
    texto: >-
      El fondo fijo se entrega una vez; cada rendición se repone por lo
      gastado y el fondo vuelve a su monto.
    mermaid: |
      flowchart TD
        A[Aprobar y entregar<br/>fondo fijo] --> B[Rendición<br/>comprobantes y movilidad]
        B --> C[Reponer<br/>pago por lo rendido]
        C --> B
        B --> D[Cierre: devolver el saldo]

pasos_intro: >-
  Ejemplo: S/ 500 a Rosa Quispe para visitar la obra de Ate; rinde una factura
  de combustible de S/ 300 y S/ 73 de movilidad (dos días, uno por encima del
  tope de S/ 45,20).
pasos:
  - seccion: Entregas a rendir
  - titulo: Fondos
    ruta: Perú ▸ Entregas a rendir ▸ Fondos
    texto: >-
      Entregas a rendir y cajas chicas con su responsable, monto, saldo por
      rendir y plazo. Filtros por tipo, estado y «Por rendir vencidas». También en
      **Contabilidad ▸ Proveedores**.
    imagen: screenshots/01-fondos.png
  - titulo: La entrega
    ruta: Fondos ▸ abrir uno
    texto: >-
      Responsable, motivo, monto, diario de pago y cuenta del fondo. **Aprobar**
      la numera; **Entregar** prepara el pago al responsable, con su número de
      operación. El bloque Saldo muestra lo entregado, rendido y devuelto.
    imagen: screenshots/02-entrega.png
  - titulo: La rendición
    ruta: Fondo ▸ Nueva rendición
    texto: >-
      Facturas de proveedor publicadas y pendientes de pago, por su saldo o una
      parte. Al confirmar, el asiento paga cada factura con el fondo y las deja
      conciliadas.
    imagen: screenshots/03-rendicion.png
  - titulo: Gastos de movilidad
    ruta: Rendición ▸ Planilla de movilidad
    texto: >-
      Fecha, motivo, destino y monto de cada desplazamiento, con distribución
      analítica opcional. Si un día supera el tope (4 % de la RMV), el aviso
      indica el exceso que no es deducible.
    imagen: screenshots/04-movilidad.png
  - titulo: Planilla de movilidad impresa
    ruta: Rendición ▸ Planilla de movilidad
    texto: >-
      Número PM/año/…, trabajador con su documento, periodo, detalle, total,
      exceso y la declaración del trabajador con las firmas: el sustento que
      pide el artículo 21 inciso v) del Reglamento.
    imagen: screenshots/05-planilla-movilidad.png
  - titulo: Liquidación del fondo
    ruta: Fondo ▸ Imprimir ▸ Liquidación del fondo
    texto: >-
      Pagos, rendiciones y saldo del fondo en una página para la firma del
      responsable.
    imagen: screenshots/06-liquidacion.png
  - seccion: Caja chica
  - titulo: Caja chica
    ruta: Perú ▸ Entregas a rendir ▸ Fondos ▸ Nuevo (tipo Caja chica)
    texto: >-
      El custodio recibe el fondo fijo; tras cada rendición, **Reponer** crea el
      pago por lo gastado para devolverlo a su monto.
    imagen: screenshots/07-caja-chica.png
  - seccion: Configuración
  - titulo: Cuentas y tope de movilidad
    ruta: Ajustes ▸ Perú ▸ Entregas a rendir y caja chica
    texto: >-
      Cuentas de entregas a rendir y de caja chica, diario de las rendiciones,
      cuenta del gasto de movilidad, RMV vigente y tope diario. Vacías, se
      usan la 1413 y la 63112 del plan contable.
    imagen: screenshots/08-ajustes.png

