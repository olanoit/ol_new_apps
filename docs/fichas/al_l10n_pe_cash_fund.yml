faq:
  - pregunta: ¿Puedo rendir una factura en dólares con un fondo en soles?
    respuesta: >-
      No: la rendición paga la factura con el fondo y ambos deben estar en la
      misma moneda. Para gastos en otra moneda, cree un fondo en esa moneda.
  - pregunta: ¿Y si el trabajador gastó más de lo entregado?
    respuesta: >-
      El saldo por rendir queda negativo: **Reembolsar** prepara el
      pago al trabajador por la diferencia y después se puede cerrar.
  - pregunta: ¿Qué pasa con la movilidad que supera el tope?
    respuesta: >-
      Se registra igual como gasto, pero la rendición y la planilla muestran el
      exceso: es el importe que no se deduce para el Impuesto a la Renta y debe
      adicionarse en la declaración anual.
  - pregunta: Me equivoqué en una rendición confirmada, ¿cómo la corrijo?
    respuesta: >-
      **Anular** cancela su asiento y deja las facturas pendientes otra vez;
      **Volver a borrador** permite corregirla y confirmarla de nuevo con el
      mismo número.

