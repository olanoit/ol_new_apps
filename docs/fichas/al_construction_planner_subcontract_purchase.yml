titulo: 'Planificación de obra: descuento del material extra'
subtitulo: Descuenta a la contrata el material extra aprobado en su siguiente liquidación
  semanal.
categoria: Construcción · Proyectos
etiquetas:
- Material extra
- Descuento a la contrata
- Liquidación semanal
destacados:
- icono: −
  titulo: Descuento en la liquidación
  texto: Al aprobar el extra, la jefatura decide descontarlo a una contrata; su liquidación
    lo resta del neto.
- icono: 🧾
  titulo: Línea en la factura
  texto: La factura lleva una línea negativa a la cuenta de Ajustes.
configuracion:
- Se instala solo cuando están las contratas y las compras del planificador.
requisitos_nota: Se instala automáticamente con `al_construction_planner_subcontract` y `al_construction_planner_purchase`.
  Licencia LGPL-3 porque el planificador depende de `base_tier_validation` (AGPL-3).
