      - [1212000, "Por cobrar — DEMO TC Analítica (US$ 10.000 × 3,395)", "", "150,00"]
      - [1212000, "Por cobrar — DEMO TC Cliente (US$ 6.000 × 3,395)", "", "142,00"]
      - [4212000, "Por pagar — DEMO TC Proveedor (US$ 6.000 × 3,404)", "84,00", ""]
