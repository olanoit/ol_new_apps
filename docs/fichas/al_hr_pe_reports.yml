      - [Trabajador, "DNI, régimen general, AFP INTEGRA con CUSPP, EsSalud, sueldo S/ 2.500,00 y cuenta de abono"]
      - [Días y horas, "24,5 días laborados y 196:00 horas ordinarias"]
      - [Ingresos, "0121 Básico 2.500,00 · 0201 Asignación familiar 113,00"]
      - [Descuentos, "0608 Aporte AFP 261,30 · 0601 Comisión 40,50 · 0606 Prima de seguros 44,42"]
      - [Neto, "S/ 2.266,78 (dos mil doscientos sesenta y seis con 78/100 soles)"]
      - [Aportes del empleador, "0804 EsSalud 235,17 (9 % de 2.613,00)"]

  - titulo: Marcadores de una plantilla de contrato
    texto: El texto de la plantilla…
    codigo: |
      EL TRABAJADOR percibirá una remuneración mensual de S/ {{salario}}
      ({{salario_letras}} {{moneda}}). El presente contrato tendrá una
      duración de {{meses}}, iniciándose el {{fecha_inicio}}.
    nota: >-
      …se imprime como «S/ 2800.00 (DOS MIL OCHOCIENTOS CON 00/100 Soles)» e
      «iniciándose el 01 de Marzo del 2025». Un marcador desconocido queda sin
      sustituir y se anota en el registro del servidor.

  - titulo: Formatos bancarios disponibles
    tabla:
      - [Banco, Haberes, CTS, Datos propios del formato]
      - [BCP, "Sí", "Sí", "Subtipo de planilla e indicador IDC"]
