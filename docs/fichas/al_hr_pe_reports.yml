configuracion:
  - "En **Parámetros principales**, elija el representante legal que firma, las categorías de conceptos de la boleta y la regla del neto a pagar."
  - "En la pestaña **Pagos bancarios** de los Parámetros principales, indique los diarios de pago masivo; el banco de la cuenta del diario debe tener su formato TXT."
  - Registre las cuentas bancarias de haberes y de CTS de los trabajadores y su correo laboral para el envío de boletas.
  - "Revise o cree las plantillas en **Nómina ▸ Configuración ▸ Perú ▸ Documentos ▸ Plantillas de contrato** y asígnelas en la ficha del trabajador."
requisitos_nota: >-
  Requiere Nómina de Odoo Enterprise y el módulo de beneficios sociales
  peruano. El envío de boletas usa el servidor de correo saliente de Odoo.

faq:
  - pregunta: ¿Por qué no hay un botón «Boleta PE» aparte?
    respuesta: >-
      Porque el Imprimir nativo ya saca la boleta peruana: así el PDF impreso,
      el adjunto al validar y el enviado por correo son el mismo documento.
  - pregunta: ¿Cómo imprime su boleta un régimen con estructura propia?
    respuesta: >-
      La estructura salarial apunta a su reporte y el botón lo respeta. Es lo
      que hace construcción civil con su boleta por jornal.
  - pregunta: ¿Qué pasa si el trabajador no tiene correo laboral?
    respuesta: >-
      Su boleta no se envía y aparece en el aviso final junto con las que no
      están validadas; las demás salen igualmente.
  - pregunta: El pago masivo sale con importes en cero.
    respuesta: >-
      Revise la regla de neto a pagar de los Parámetros principales: el abono
      de haberes se toma de ella (y de la regla de neto quincenal para la
      quincena).
  - pregunta: ¿El certificado de 5ta calcula el impuesto anual?
    respuesta: >-
      Muestra como impuesto la suma retenida en el año por la regla de quinta,
      igual que la retención efectuada, por lo que el saldo por regularizar
      sale en cero.

