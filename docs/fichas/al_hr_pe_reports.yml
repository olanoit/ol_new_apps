titulo: Documentos y bancos de planilla
subtitulo: >-
  La boleta de pago legal peruana con un solo botón de imprimir y envío con
  confirmación de recepción, los certificados de trabajo, de CTS y de 5ta
  categoría, los contratos desde plantilla y los archivos TXT de pago masivo
  de cinco bancos.
categoria: Localización Perú · Nómina
etiquetas: [Boleta D.S. 001-98-TR, Envío con confirmación, Certificado de 5ta, Contratos, TXT bancario, BCP · BBVA · Interbank]
portada: screenshots/01-boleta.png

destacados_intro: >-
  Todo lo que la planilla tiene que entregar al trabajador y al banco, desde
  los mismos datos de Nómina.
destacados:
  - icono: "▤"
    titulo: Boleta legal
    texto: >-
      Datos del empleador y del trabajador, días y horas, ingresos, descuentos
      y aportes del empleador con el código de la tabla 22 de SUNAT, neto en
      letras y firmas (D.S. N.° 001-98-TR).
  - icono: "⎙"
    titulo: Un solo botón de imprimir
    texto: >-
      El Imprimir nativo, la impresión del lote, el adjunto y el correo sacan la
      misma boleta; cada estructura salarial puede declarar la suya.
  - icono: "✉"
    titulo: Envío con confirmación
    texto: >-
      La boleta sale por correo con el PDF adjunto y un enlace firmado para que
      el trabajador confirme la recepción; queda registrada la fecha.
  - icono: "✓"
    titulo: Certificados y cartas
    texto: >-
      Certificado de trabajo, carta de retiro de CTS y certificado de rentas y
      retenciones de 5ta categoría, desde la ficha o la lista de empleados.
  - icono: "{}"
    titulo: Contratos desde plantilla
    texto: >-
      Plantillas por compañía con marcadores como {{nombre_trabajador}} o
      {{salario_letras}}, rellenadas con la ficha del trabajador.
  - icono: "TXT"
    titulo: Pago masivo bancario
    texto: >-
      Archivos de haberes y CTS en los formatos de BCP, BBVA, Interbank,
      Scotiabank y BanBif, desde lotes, quincena, CTS, gratificación y
      vacaciones.

contexto:
  titulo: El problema que resuelve
  texto: >-
    La boleta de pago peruana tiene un contenido mínimo fijado por el **D.S.
    N.° 001-98-TR** y el empleador debe poder demostrar que el trabajador la
    recibió. Además, cada cese pide su certificado de trabajo, cada año el
    certificado de retenciones de 5ta categoría (**art. 45 del D.S.
    122-94-EF**) y cada contratación su contrato.


    Los pagos, por su parte, se cargan en el banco con un archivo de ancho fijo
    propio de cada entidad. Este módulo genera todos esos documentos y archivos
    desde Odoo, sin hojas de cálculo intermedias.
  nota: >-
    **El enlace de confirmación va firmado.** Lleva un token HMAC derivado del
    secreto de la base de datos: sin él, cualquiera que conociera el número de
    la boleta podría darla por recibida.

flujos_intro: >-
  Lo que pasa entre el clic y el documento o el archivo, según el código.
flujos:
  - id: boleta-envio
    titulo: Impresión y envío de la boleta
    texto: >-
      Un solo camino de impresión para el botón, el lote, el adjunto y el
      correo; el envío deja constancia de la recepción.
    mermaid: |
      flowchart TD
        A[Boleta calculada] --> B[Imprimir]
        B --> C{¿La estructura declara<br/>su plantilla?}
        C -- Sí --> D[PDF con la plantilla de la estructura<br/>p. ej. construcción civil]
        C -- No --> E[Boleta legal D.S. 001-98-TR]
        A --> F[Enviar boleta: individual,<br/>desde la lista o desde el lote]
        F --> G{¿Validada o pagada<br/>y con correo laboral?}
        G -- No --> H[Se omite y se lista<br/>en el aviso final]
        G -- Sí --> I[Correo encolado con el PDF adjunto<br/>y fecha de envío]
        I --> J[El trabajador pulsa<br/>«Confirmar recepción»]
        J --> K{¿Token HMAC válido?}
        K -- No --> L[Página «Enlace no válido»]
        K -- Sí --> M[Recepción confirmada<br/>y fecha de confirmación]
  - id: pago-masivo
    titulo: Pago masivo bancario
    texto: >-
      Un registro por diario bancario; cada uno lleva solo las cuentas de su
      banco y genera el TXT con su formato.
    mermaid: |
      flowchart TD
        A[Origen: lote, quincena, CTS,<br/>gratificación o liquidación vacacional] --> B[Generar TXT banco]
        B --> C{¿Ya hay un pago Finalizado?}
        C -- Sí --> X[Error: no se regenera]
        C -- No --> D[Borra los pagos en borrador<br/>del origen]
        D --> E[Un pago por diario de Parámetros<br/>cuyo formato está en las cuentas destino]
        E --> F[Líneas: neto de la regla configurada,<br/>total a pagar o CTS en soles y dólares]
        F --> G[Aviso con los trabajadores<br/>sin banco con formato]
        G --> H[Revisar líneas e «Incluir en TXT»]
        H --> I[Generar TXT banco: valida cuentas,<br/>tipos de cuenta y datos del banco]
        I --> J[TXT de haberes o de CTS<br/>como adjunto descargable]
        J --> K[Finalizar: el origen queda<br/>con TXT generado]
  - id: contrato
    titulo: Contrato desde plantilla
    texto: >-
      Marcadores controlados: no se evalúa código de la plantilla.
    mermaid: |
      flowchart TD
        A[Plantilla con marcadores entre llaves dobles] --> B[Empleado: plantilla y régimen<br/>de periodo de prueba]
        B --> C[Fin del periodo de prueba:<br/>inicio + 3, 6 o 12 meses]
        C --> D[Imprimir contrato]
        D --> E{¿Plantilla con contenido y<br/>datos mínimos completos?}
        E -- No --> F[Aviso con la lista<br/>de datos que faltan]
        E -- Sí --> G[Sustituye los marcadores con datos<br/>de empresa, trabajador y contrato]
        G --> H[PDF del contrato]
    pie: Un marcador desconocido queda sin sustituir y se registra en el log del servidor.

pasos_intro: >-
  Recorrido con la planilla de pruebas de «Comercial Demo Perú S.A.C.»
  (trabajadores ficticios) y la trabajadora «DEMO FICHA HR2». No se envían
  correos ni se generan archivos.
pasos:
  - seccion: Boleta de pago
    texto: Impresión, envío y confirmación.
  - titulo: Imprimir la boleta de pago
    ruta: Nómina ▸ Recibos de nómina ▸ Imprimir
    texto: >-
      La boleta muestra en bloques los datos del trabajador (régimen laboral,
      pensionario y de salud, remuneración básica y cuenta de abono), los días
      laborados, no laborados, subsidiados y de vacaciones con las horas
      ordinarias y de sobretiempo, los conceptos con su código SUNAT, el **neto
      a pagar en letras**, los aportes del empleador y las firmas.
    puntos:
      - Los conceptos se agrupan según las categorías configuradas en los Parámetros principales.
      - Las horas extras se desglosan por sobretasa (25 %, 35 % y 100 %).
      - "Un régimen con estructura propia, como construcción civil, imprime su variante con el mismo botón."
    imagen: screenshots/01-boleta.png
    pie: "Boleta de junio de 2026: ingresos S/ 2.613,00, descuentos AFP S/ 346,22 y neto S/ 2.266,78."

  - titulo: Enviar la boleta desde su formulario
    ruta: Nómina ▸ Recibos de nómina ▸ Enviar boleta
    texto: >-
      Con la boleta validada o pagada aparece **Enviar boleta**: el correo se
      encola con el PDF adjunto y un botón de confirmación, y se anota la
      fecha de envío.
    imagen: screenshots/02-boleta-form.png

  - titulo: Envío masivo y seguimiento en la lista
    ruta: Nómina ▸ Recibos de nómina ▸ Acciones ▸ Enviar boletas PE por correo
    texto: >-
      Desde la lista se envían las boletas seleccionadas. Las columnas
      opcionales **Fecha de envío de boleta**, **Recepción confirmada** y
      **Fecha de confirmación** muestran el seguimiento.
    puntos:
      - Las boletas sin correo laboral o sin confirmar se informan en un aviso y no se envían; el resto sale igual.
    imagen: screenshots/03-boletas-lista.png

  - titulo: Imprimir y enviar todo el lote
    ruta: Nómina ▸ Recibos de nómina ▸ Periodos de nómina ▸ ⋮
    texto: >-
      Con el lote cerrado o pagado, el menú de la tarjeta trae **Imprimir
      boletas** (un solo PDF) y **Enviar boletas por correo**, además de
      **Generar TXT banco** y **Pagos bancarios**.
    imagen: screenshots/04-lote-menu.png

  - titulo: La plantilla del correo
    ruta: Ajustes ▸ Técnico ▸ Correo electrónico ▸ Plantillas de correo electrónico
    texto: >-
      «Planillas PE: Boleta de pago por correo» va al correo laboral del
      trabajador, adjunta la boleta y trae el botón **Confirmar recepción**.
      Es editable como cualquier plantilla de Odoo.
    imagen: screenshots/05-plantilla-correo.png

  - titulo: Confirmación de recepción
    ruta: Correo ▸ Confirmar recepción
    texto: >-
      El enlace lleva un token firmado. Si es válido marca **Recepción
      confirmada** con su fecha y muestra «¡Confirmación registrada!»; si ya se
      confirmó, lo indica. Un enlace alterado muestra esta página y no toca la
      boleta.
    imagen: screenshots/06-confirmacion.png

  - seccion: Certificados y cartas
    texto: Desde el menú Acción de la ficha o de la lista de empleados.
  - titulo: Certificado de trabajo
    ruta: Empleados ▸ ficha del empleado ▸ Acción ▸ Certificado de trabajo
    texto: >-
      El asistente propone el tratamiento, la ciudad y las fechas de ingreso y
      cese. **Imprimir certificado** genera el PDF firmado por el representante
      legal de los Parámetros principales.
    imagen: screenshots/07-certificado-asistente.png

  - titulo: El certificado impreso
    ruta: Certificado de trabajo ▸ Imprimir certificado
    texto: >-
      Tratamiento, documento de identidad, periodo laborado en letras y cargo,
      fechado en la ciudad indicada al día del cese.
    imagen: screenshots/08-certificado.png

  - titulo: Carta de retiro de CTS
    ruta: Empleados ▸ ficha del empleado ▸ Acción ▸ Carta de retiro CTS
    texto: >-
      Mismo asistente con tratamiento, ciudad y fecha de cese.
    imagen: screenshots/09-carta-cts-asistente.png

  - titulo: La carta impresa
    ruta: Carta de retiro CTS ▸ Imprimir carta
    texto: >-
      Dirigida al banco de la cuenta CTS del trabajador, con su número de
      cuenta y la fecha de cese.
    imagen: screenshots/10-carta-cts.png
    pie: Carta de un trabajador de pruebas con cuenta CTS en el BCP y cese de ejemplo el 30/06/2026.

  - titulo: Certificado de rentas y retenciones de 5ta categoría
    ruta: Empleados ▸ Acción ▸ Certificado de renta de 5ta
    texto: >-
      Para uno o varios trabajadores y un ejercicio: renta bruta de las boletas
      y gratificaciones del año, ingresos de otros empleadores, deducción de 7
      UIT, renta imponible, impuesto y retención efectuada. Un certificado por
      página.
    puntos:
      - La UIT se toma del catálogo del ejercicio; si falta, el asistente lo avisa antes de imprimir.
    imagen: screenshots/11-certificado-5ta.png
    pie: >-
      Ejercicio 2026 con los datos de prueba: renta bruta S/ 82.290,33 − 7 UIT
      (S/ 37.450,00) = S/ 44.840,33. Las boletas de prueba no tienen retención
      de 5ta, por eso el impuesto sale en cero.

  - seccion: Contratos
    texto: Plantillas por compañía y contrato impreso por trabajador.
  - titulo: Preparar la plantilla de contrato
    ruta: Nómina ▸ Configuración ▸ Perú ▸ Documentos ▸ Plantillas de contrato
    texto: >-
      Cada plantilla es un texto con formato y marcadores entre llaves dobles.
      El formulario lista los disponibles: datos de la empresa y su apoderado,
      del trabajador, del puesto, la remuneración en número y en letras, la
      duración, el fin del periodo de prueba, la jornada y la fecha de firma.
      Trae de ejemplo el contrato por inicio o incremento de actividad (art. 57
      del D.S. 003-97-TR).
    imagen: screenshots/12-plantilla-contrato.png

  - titulo: Plantilla y periodo de prueba del trabajador
    ruta: Empleados ▸ ficha del empleado ▸ Nómina ▸ Perú — Contrato de trabajo
    texto: >-
      Se elige la plantilla y el régimen de periodo de prueba (3, 6 o 12
      meses, art. 10 de la LPCL), que calcula el fin del periodo de prueba.
      **Imprimir contrato** comprueba antes los datos mínimos y lista los que
      faltan.
    imagen: screenshots/13-empleado-contrato.png
    pie: "Trabajadora DEMO con ingreso el 01/03/2025: prueba de 3 meses hasta el 01/06/2025."

  - titulo: El contrato impreso
    ruta: Perú — Contrato de trabajo ▸ Imprimir contrato
    imagen: screenshots/14-contrato.png
    pie: "Contrato de la trabajadora DEMO: S/ 2.800,00 al mes, del 01/03/2025 al 31/08/2026, con 3 meses de prueba."

  - seccion: Pago masivo bancario
    texto: TXT de haberes y de CTS por banco.
  - titulo: El pago masivo y sus líneas
    ruta: Nómina ▸ Pagos masivos bancarios
    texto: >-
      Cada pago lleva el diario de cargo, su cuenta, la fecha y la glosa, el
      origen y una línea por trabajador con documento, cuenta destino, banco,
      referencia e importe. **Incluir en TXT** excluye una línea del archivo.
      **Recargar líneas** las vuelve a traer del origen, **Generar TXT banco**
      descarga el archivo y **Finalizar** cierra el pago.
    puntos:
      - El importe de haberes es el de la regla de neto a pagar de los Parámetros principales.
    imagen: screenshots/15-pago-masivo.png
    pie: "PM-000007: planilla de abril de 2026 en formato BCP, 10 abonos por S/ 31.459,37."

  - titulo: Datos del formato del banco
    ruta: Pago masivo ▸ Configuración del banco
    texto: >-
      Solo aparecen los datos del formato del banco del diario: tipo y hora de
      proceso, validación de pertenencia y aviso (BBVA), subtipo e IDC (BCP),
      códigos y tipos de proceso y de persona (Interbank), forma de cargo, tipo
      de abono y forma de pago (Scotiabank) o subtipo (BanBif).
    imagen: screenshots/16-pago-config-banco.png

  - titulo: Generar desde el origen
    ruta: Nómina ▸ Beneficios sociales ▸ Gratificación
    texto: >-
      CTS, gratificación, quincena y liquidación vacacional suman **Generar TXT
      banco** (oculto una vez finalizado un pago) y **Pagos bancarios** para
      abrir los pagos creados. En la CTS el abono va a la cuenta CTS y el pago
      permite marcar **CTS en dólares**.
    imagen: screenshots/17-origen-gratificacion.png

  - titulo: Diarios de pago masivo
    ruta: Nómina ▸ Configuración ▸ Perú ▸ Parámetros ▸ Parámetros principales ▸ Pagos bancarios
    texto: >-
      Los diarios bancarios desde los que se paga. Se crea un pago por cada
      diario cuyo banco tenga un formato presente en las cuentas de los
      trabajadores.
    imagen: screenshots/18-parametros-pagos.png

  - titulo: Tipo de cuenta y formato del banco
    ruta: Contactos ▸ Configuración ▸ Cuentas bancarias ▸ Cuentas bancarias
    texto: >-
      La cuenta bancaria gana **Tipo de cuenta** (Corriente, Ahorros,
      Detracciones, CCI u Otros, con control de 11 dígitos para detracciones y
      20 para CCI) y **Sucursal BBVA**. El banco gana **Formato de TXT**, que
      decide qué layout usa el pago masivo.
    imagen: screenshots/19-cuenta-bancaria.png

