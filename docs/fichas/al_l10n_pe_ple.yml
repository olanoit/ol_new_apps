titulo: Libros electrónicos PLE
subtitulo: >-
  Completa los libros del PLE de SUNAT que la localización oficial no genera
  —activos fijos, retenciones del art. 34, consignaciones, anexos del Libro 3,
  costos y formatos simplificados— y corrige la estructura del RCE 8.4 / 8.5 y
  del RVIE 14.4 del SIRE.
categoria: Localización Perú · Contabilidad
etiquetas: [Libro 7 activos fijos, "4.1 retenciones", "9.1 / 9.2 consignaciones", "3.8 · 3.9 · 3.19 · 3.23", Libro 10 costos, Simplificados, RCE 8.4 y RVIE 14.4]
portada: screenshots/07-libro7-pantalla.png

destacados_intro: >-
  Un solo asistente para todos los TXT que faltaban, con el nombre oficial,
  validación de estructura y un Excel de revisión por formato.
destacados:
  - icono: "7"
    titulo: Registro de Activos Fijos
    texto: >-
      Formatos 7.1, 7.3 y 7.4 desde los activos de Odoo, con informe en
      pantalla por cuenta y botones TXT y XLSX.
  - icono: "4.1"
    titulo: Retenciones art. 34 LIR
    texto: >-
      Lista editable e importable de pagos y retenciones de los incisos e) y
      f), sin necesidad de planilla peruana en Odoo.
  - icono: "9"
    titulo: Consignaciones
    texto: >-
      Los albaranes marcados como consignación alimentan el 9.1 y el 9.2, con
      saldo inicial por producto y contraparte.
  - icono: "3"
    titulo: Anexos del Libro 3
    texto: >-
      3.8 inversiones, 3.9 intangibles automático desde los activos 34, 3.19
      patrimonio neto y el PDF de notas 3.23 con nombre oficial.
  - icono: "10"
    titulo: Registro de Costos
    texto: >-
      10.1 costo de ventas, 10.2 elementos del costo por mes, 10.3 costo por
      proceso y 10.4 centros de costos, sin necesidad de Fabricación.
  - icono: "SIRE"
    titulo: RCE y RVIE con la estructura oficial
    texto: >-
      41 campos en el 8.4, 35 en el 8.5 y 33 en el 14.4, con los datos que la
      localización dejaba vacíos y un botón XLSX para revisarlos.

contexto:
  titulo: El problema que resuelve
  texto: >-
    La localización peruana oficial de Odoo 19 genera el Diario y el Mayor
    (5.1, 5.3, 6.1), Caja y Bancos (1.1, 1.2), los registros de Ventas y
    Compras, el Libro 3 y el inventario permanente (12.1, 13.1). Pero **no
    genera** el Registro de Activos Fijos, las retenciones del 4.1, las
    consignaciones, varios anexos del Libro 3, el Registro de Costos ni los
    formatos simplificados, que acaban armándose en hojas de cálculo.


    Además, sus archivos del **SIRE** no respetan la norma: el RCE 8.4 lleva
    dos campos de más y nueve siempre vacíos, el RVIE 14.4 tiene 35 campos en
    lugar de 33, y la extracción falla con un error de base de datos en cuanto
    el filtro del informe necesita cruzar tablas. Este módulo cubre los libros
    que faltan y rehace esos tres archivos según las R.S. 040-2022/SUNAT y
    000112-2021/SUNAT.
  nota: >-
    **No duplica lo que ya existe.** Los libros que genera la localización
    oficial no se reimplementan: el submenú **Reportes PLE nativos** los
    reúne en la app Perú junto a los propios.

flujos_intro: >-
  Cómo sale cada archivo: del dato en Odoo al TXT que se carga en SUNAT.
flujos:
  - id: exportar
    titulo: Generar los TXT desde el asistente
    texto: >-
      El asistente **Exportar PLE** valida primero los datos generales y
      después arma cada formato marcado. Si algo falta, se detiene con un aviso
      y no entrega ningún archivo.
    mermaid: |
      flowchart TD
        A[Perú ▸ Libros PLE ▸ Exportar PLE:<br/>ejercicio, indicador y formatos] --> B{¿Compañía de la<br/>localización peruana?}
        B -- No --> X[Aviso: se detiene<br/>sin archivo]
        B -- Sí --> C{¿Simplificado sin la marca de Ajustes,<br/>libro mensual sin mes o<br/>Libro 3 sin fecha de EEFF?}
        C -- Sí --> X
        C -- No --> D[Líneas de cada formato marcado:<br/>activos, capturas, albaranes o asientos]
        D --> E{¿Falta un dato obligatorio<br/>o una línea no tiene los campos<br/>del Anexo 2?}
        E -- Sí --> X
        E -- No --> F[TXT con nombre oficial por formato<br/>y XLSX si «Incluir Excel»]
        F --> G{¿Más de un archivo?}
        G -- No --> H[Descarga del TXT]
        G -- Sí --> I[Descarga de un ZIP]
    pie: "Datos obligatorios típicos: RUC de 11 dígitos, tipo de activo (T18), número y fecha del contrato de leasing."

  - id: libro7
    titulo: Registro de Activos Fijos (Libro 7)
    texto: >-
      Pantalla, TXT y XLSX leen los mismos valores, así que no pueden
      descuadrar. El ejercicio es el de la fecha de cierre elegida.
    mermaid: |
      flowchart TD
        A[Activo en proceso, pausado o cerrado<br/>con la pestaña PLE SUNAT completa] --> B[Valor, mejoras y bajas del ejercicio<br/>y asientos de depreciación publicados]
        B --> C{¿Desde dónde?}
        C -- Informe en pantalla --> D[Perú ▸ Libros PLE ▸ Activos fijos:<br/>un renglón por activo, agrupado por cuenta]
        C -- Asistente --> E[Exportar PLE:<br/>7.1, 7.3 y 7.4]
        D --> F[Botones TXT 7.1, XLSX 7.1,<br/>TXT 7.3 y TXT 7.4]
        F --> G{¿Falta tipo de activo, datos<br/>en moneda extranjera o contrato?}
        E --> G
        G -- Sí --> X[Aviso con los activos a corregir]
        G -- No --> H[7.1 todos los activos · 7.3 los comprados<br/>en moneda extranjera · 7.4 los de leasing]
    pie: Los asientos de baja o venta no suman depreciación; el activo dado de baja sale con sus retiros en negativo.

  - id: capturas
    titulo: Libros por captura (4.1, Libro 3 y Libro 10)
    texto: >-
      Lo que Odoo no modela —retenciones de cuarta categoría sin planilla,
      títulos valores, patrimonio y costos— se captura o importa en listas
      editables. El asistente filtra cada lista por la fecha que corresponde.
    mermaid: |
      flowchart TD
        A[Captura o importación en las listas<br/>de Perú ▸ Libros PLE] --> B{¿Qué formato?}
        B -- "4.1" --> C[Registros con fecha<br/>dentro del mes]
        B -- "3.8 y 3.19" --> D[Registros con fecha igual<br/>a la Fecha de los EEFF]
        B -- "3.9" --> E[Sin captura: activos con cuenta 34<br/>vigentes a la Fecha de los EEFF]
        B -- "Libro 10" --> F[Registros del ejercicio]
        C --> G[Signo negativo en retenciones, provisiones,<br/>amortización e inventarios finales]
        D --> G
        E --> G
        F --> G
        G --> H[TXT y XLSX desde Exportar PLE]

  - id: consignaciones
    titulo: Registro de Consignaciones (Libro 9)
    texto: >-
      La clase marcada en el albarán decide el libro (9.1 consignador o 9.2
      consignatario) y la columna de cantidad.
    mermaid: |
      flowchart TD
        A["Albarán hecho con<br/>«Consignación PLE (Libro 9)»"] --> B{¿Clase de operación?}
        B -- "Entrega, devolución o venta 9.1" --> C[Rol consignador: 9.1]
        B -- "Recepción, devolución o venta 9.2" --> D[Rol consignatario: 9.2]
        C --> E[Saldo inicial por producto y contraparte<br/>con los albaranes anteriores al mes]
        D --> E
        E --> F{¿Es una venta?}
        F -- Sí --> G[Comprobante desde la factura publicada<br/>de la orden de venta]
        F -- No --> H[Comprobante 00]
        G --> I[Línea con cantidad entregada o recibida +,<br/>devuelta − o vendida −]
        H --> I
        I --> J[TXT 9.1 / 9.2 del mes]

  - id: sire
    titulo: RCE 8.4 / 8.5 y RVIE 14.4 con la estructura oficial
    texto: >-
      Los informes son los de la localización oficial; el módulo sustituye la
      extracción y el formato del TXT y añade el botón XLSX.
    mermaid: |
      flowchart TD
        A[Reportes PLE nativos:<br/>Compras 8.1, No domiciliados 8.2 o Ventas 14.1] --> B[Mes en el filtro de fechas]
        B --> C[Botón TXT o XLSX]
        C --> D[Comprobantes publicados y anulados del mes<br/>por fecha de factura, salvo diarios excluidos]
        D --> E{¿Qué registro?}
        E -- "Compras" --> F[RCE 8.4, 41 campos:<br/>clasificación, detracción, tipo de nota y estado]
        E -- "No domiciliados" --> G[RCE 8.5, 35 campos:<br/>tipos 00, 91, 97 y 98]
        E -- "Ventas" --> H[RVIE 14.4, 33 campos: anulados en cero<br/>y NC de meses anteriores como descuento]
        F --> I{¿Cada línea tiene el número<br/>de campos de la norma?}
        G --> I
        H --> I
        I -- No --> X[Error de estructura]
        I -- Sí --> J[TXT con nombre oficial<br/>o XLSX con una cabecera por campo]

pasos_titulo: Recorrido por libro
pasos_intro: >-
  Todas las funciones del módulo con los datos de demostración «DEMO PLE»:
  cuatro activos adquiridos en 2026 y capturas de julio de 2026.
pasos:
  - seccion: Configuración
    texto: Una sola vez; cada libro solo necesita sus propios datos.
  - titulo: Activar los formatos simplificados
    ruta: Perú ▸ Configuración ▸ Ajustes ▸ Libros electrónicos PLE
    texto: >-
      **Libros PLE simplificados** muestra en el asistente el grupo 5.2 Diario
      Simplificado, 5.4 Plan contable, 8.3 Compras Simplificado y 14.2 Ventas
      Simplificado. Son excluyentes con los formatos completos: márquela solo
      si la empresa está autorizada a llevar contabilidad simplificada.
    imagen: screenshots/01-ajustes.png

  - titulo: Clasificar los productos que se compran
    ruta: Inventario ▸ Productos ▸ Productos ▸ pestaña Contabilidad
    texto: >-
      **Clasificación RCE** (tabla 23) va junto a la cuenta de gastos del
      producto. Solo se muestra en compañías peruanas y alimenta el campo 33
      del RCE 8.4.
    imagen: screenshots/02-producto-rce.png
    pie: "«DEMO PLE Producto Consignado»: 1 - Mercadería, materia prima, suministro, envases y embalajes."

  - seccion: Asistente Exportar PLE
    texto: El punto único de generación de los TXT propios del módulo.
  - titulo: Generar libros anuales y mensuales
    ruta: Perú ▸ Libros PLE ▸ Exportar PLE
    texto: >-
      Indique **Ejercicio**, **Indicador de operaciones** y marque los
      formatos. El **Mes** aparece al marcar un libro mensual. **Generar** deja
      el archivo en el propio asistente: un TXT si es un solo archivo, un ZIP
      si son varios.
    puntos:
      - "**Incluir Excel** (activo por defecto) añade un XLSX de revisión por formato con los encabezados del Anexo 2; el TXT es el único que se carga en SUNAT."
      - Cada línea se valida contra el número de campos del Anexo 2 antes de descargarse.
      - "Sin ningún formato marcado, el asistente pide seleccionar al menos uno."
    imagen: screenshots/03-exportar-ple.png
    pie: Libro 7.1 del ejercicio 2026 y 4.1 de julio 2026 en un ZIP, con su Excel de revisión.

  - titulo: Generar los formatos del Libro 3
    ruta: Perú ▸ Libros PLE ▸ Exportar PLE ▸ Libro 3 — Inventarios y Balances
    texto: >-
      Al marcar 3.8, 3.9, 3.19 o adjuntar el PDF de notas aparecen **Fecha de
      los EEFF** (por defecto el 31/12 del ejercicio) y **Oportunidad (CC)**.
      Ambos forman parte del nombre del archivo, que en el Libro 3 lleva el
      día.
    puntos:
      - "**3.23 Notas a los EEFF (PDF)**: el PDF adjunto entra en el ZIP con el nombre oficial; no tiene estructura TXT."
    imagen: screenshots/04-exportar-libro3.png
    pie: "3.8, 3.9 y 3.19 al 31/07/2026, la fecha de los registros de demostración."

  - seccion: Libro 7 — Activos fijos
    texto: Formatos 7.1, 7.3 y 7.4, desde los activos de Odoo.
  - titulo: Completar los datos SUNAT del activo
    ruta: Contabilidad ▸ Contabilidad ▸ Activos y pasivos ▸ Activos ▸ pestaña PLE SUNAT
    texto: >-
      Código del activo, catálogo (tabla 13), **tipo de activo (tabla 18)**
      —obligatorio—, estado (tabla 19), marca, modelo y serie o placa. El
      **método (tabla 20)** y el **% de depreciación** se proponen desde el
      método y la vida útil del activo y son editables.
    puntos:
      - "**Arrendamiento financiero (7.4)**: al marcarlo aparecen número y fecha del contrato —obligatorios—, inicio, número de cuotas y monto total."
    imagen: screenshots/05-activo-ple-sunat.png
    pie: "Montacargas en leasing: contrato CT-2026-0099, 36 cuotas, S/ 52.000,00."

  - titulo: Activos comprados en moneda extranjera (7.3)
    ruta: Activo ▸ pestaña PLE SUNAT ▸ Diferencia de cambio (7.3)
    texto: >-
      Con **Moneda de adquisición (ME)** informada el activo entra en el 7.3 y
      aparecen el valor en moneda extranjera y el tipo de cambio de la compra,
      ambos obligatorios. El tipo de cambio de cierre se toma de las tasas de
      Odoo al 31/12 del ejercicio.
    imagen: screenshots/06-activo-moneda-extranjera.png
    pie: "Servidor comprado en USD 4.000,00 a 3,750."

  - titulo: Revisar el Registro de Activos Fijos en pantalla
    ruta: Perú ▸ Libros PLE ▸ Activos fijos (Libro 7)
    texto: >-
      Informe con las columnas del formato 7.1: identificación, valor del
      activo, uso y método, y depreciación; un renglón por activo agrupado por
      cuenta contable, con subtotales y total. Elija la fecha de cierre: el
      ejercicio es el de esa fecha. El menú del engranaje trae **TXT 7.1**,
      **XLSX 7.1**, **TXT 7.3** y **TXT 7.4**, los mismos archivos que genera el
      asistente.
    puntos:
      - Desde el menú contextual de cada activo, **Abrir activo** lleva a su ficha para corregir datos.
      - "También está en Contabilidad ▸ Revisión ▸ Inventario como Registro de Activos Fijos (PLE 7.1)."
    imagen: screenshots/07-libro7-pantalla.png

  - titulo: Depreciación del ejercicio
    ruta: Perú ▸ Libros PLE ▸ Activos fijos (Libro 7)
    texto: >-
      La depreciación sale de los **asientos de depreciación publicados** del
      activo: acumulada al cierre del ejercicio anterior (incluido el importe
      importado de otro sistema) y del ejercicio. Los asientos de baja o venta
      no cuentan como depreciación; un activo dado de baja sale del registro
      con sus retiros y su depreciación en negativo.
    imagen: screenshots/08-libro7-depreciacion.png
    pie: "Ejercicio 2026: S/ 2.250,00 de depreciación de los cuatro activos."

  - seccion: Libro 4 — Retenciones 4.1
    texto: Rentas de los incisos e) y f) del art. 34 de la LIR.
  - titulo: Capturar las retenciones del mes
    ruta: Perú ▸ Libros PLE ▸ Retenciones 4.1
    texto: >-
      Lista editable con fecha de pago o retención, prestador del servicio,
      monto bruto y retención efectuada, ambos en positivo (un importe negativo
      se rechaza). Admite el importador estándar, filtra por fecha y agrupa por
      prestador o por mes. Al exportar, la retención sale en negativo, como
      pide el Anexo 2.
    imagen: screenshots/09-retenciones-41.png
    pie: "Julio 2026: S/ 8.500,00 pagados y S/ 480,00 retenidos."

  - seccion: Libro 3 — Inventarios y Balances
    texto: Los cuatro anexos que no genera la localización oficial.
  - titulo: "3.8: inversiones mobiliarias (cuenta 30)"
    ruta: Perú ▸ Libros PLE ▸ Inversiones 3.8
    texto: >-
      Una fila por título al cierre: fecha del saldo, **Emisor** (contacto) o,
      si no tiene documento peruano, **Nombre del emisor** (columna opcional),
      código del título (tabla 15), valor nominal, cantidad, costo en libros y
      provisión en positivo.
    imagen: screenshots/10-inversiones-38.png

  - titulo: "3.19: estado de cambios en el patrimonio neto"
    ruta: Perú ▸ Libros PLE ▸ Patrimonio 3.19
    texto: >-
      Una fila por **rubro (tabla 34)** con la fecha del EEFF y las doce
      columnas del estado (capital, reservas, resultados…, varias opcionales
      en la lista); el **catálogo (tabla 22)** se propone desde el rubro.
    imagen: screenshots/11-patrimonio-319.png

  - titulo: "3.9 intangibles y 3.23 notas a los EEFF"
    ruta: Perú ▸ Libros PLE ▸ Exportar PLE
    texto: >-
      El **3.9** no requiere captura: toma los activos cuya cuenta empieza por
      **34**, vigentes a la fecha de los EEFF, con la amortización publicada del
      ejercicio hasta esa fecha. El **3.23** se presenta en PDF: se adjunta en
      el asistente y entra en el ZIP con el nombre oficial.

  - seccion: Libro 10 — Registro de Costos
    texto: Cuatro formatos anuales por captura, sin necesidad de Fabricación.
  - titulo: "10.1: estado de costo de ventas"
    ruta: Perú ▸ Libros PLE ▸ Costos (Libro 10) ▸ 10.1 Costo de ventas
    texto: >-
      Una sola fila por ejercicio: inventario inicial y final de productos
      terminados, costo de producción y ajustes. El inventario final se captura
      en positivo y el TXT lo emite en negativo.
    imagen: screenshots/12-costo-ventas-101.png

  - titulo: "10.2: elementos del costo por mes"
    ruta: Perú ▸ Libros PLE ▸ Costos (Libro 10) ▸ 10.2 Elementos del costo
    texto: >-
      Una fila por mes (no admite dos filas del mismo mes) con materiales
      directos, mano de obra directa, otros costos directos y los tres gastos
      indirectos de fabricación. Todas las filas van en el archivo anual.
    imagen: screenshots/13-costos-102.png

  - titulo: "10.3: costo de producción por proceso"
    ruta: Perú ▸ Libros PLE ▸ Costos (Libro 10) ▸ 10.3 Costo de producción
    texto: >-
      Una fila por proceso con su código, descripción, los seis elementos del
      costo (los gastos indirectos, en columnas opcionales), inventarios de
      productos en proceso y el **código de agrupamiento (tabla 21)**.
    imagen: screenshots/14-costo-produccion-103.png

  - titulo: "10.4: centros de costos"
    ruta: Perú ▸ Libros PLE ▸ Costos (Libro 10) ▸ 10.4 Centros de costos
    texto: >-
      Unidad de operación y centro de costos. Si elige una **Cuenta
      analítica**, se proponen su código (o su id) y su nombre, editables.
    imagen: screenshots/15-centros-costos-104.png

  - seccion: Libro 9 — Consignaciones
    texto: Desde los albaranes, sin captura aparte.
  - titulo: Marcar los albaranes de consignación
    ruta: Inventario ▸ Operaciones ▸ Traslados ▸ Consignación PLE (Libro 9)
    texto: >-
      Elija la clase de operación: entrega, devolución o venta para el 9.1
      (consignador) y recepción, devolución o venta para el 9.2
      (consignatario). El contacto del albarán es la contraparte. Solo cuentan
      las transferencias hechas del mes; en las ventas se busca la factura de
      la orden de venta para completar el comprobante.
    imagen: screenshots/16-consignacion.png

  - seccion: Formatos simplificados
    texto: Solo con la marca de Ajustes.
  - titulo: Generar 5.2, 5.4, 8.3 y 14.2
    ruta: Perú ▸ Libros PLE ▸ Exportar PLE ▸ Formatos simplificados (mensuales)
    texto: >-
      Salen sin captura: el **5.2** con una línea por apunte de los asientos
      publicados del mes, el **5.4** con el plan de cuentas, el **8.3** con las
      facturas y notas de proveedor publicadas (el número del comprobante es la
      referencia del proveedor, con la constancia de detracción y la marca de
      retención) y el **14.2** con las de cliente. Las notas de crédito salen en
      negativo.

  - seccion: SIRE — RCE y RVIE
    texto: Los informes oficiales de compras y ventas, con los TXT corregidos.
  - titulo: "RCE 8.4 con la estructura oficial"
    ruta: Perú ▸ Libros PLE ▸ Reportes PLE nativos ▸ Compras (8.1)
    texto: >-
      El informe de compras de la localización emite el **RCE 8.4**; con este
      módulo su **TXT** sale con los 41 campos de la norma y completa la
      clasificación de bienes y servicios, la detracción, el tipo de nota y el
      estado del comprobante. El botón **XLSX RCE 8.4** entrega las mismas
      líneas con una cabecera por campo.
    puntos:
      - "**Compras no domiciliados (8.2)** emite el RCE 8.5 con 35 campos y su botón XLSX RCE 8.5."
    imagen: screenshots/17-rce-84.png

  - titulo: "RVIE 14.4 con 33 campos"
    ruta: Perú ▸ Libros PLE ▸ Reportes PLE nativos ▸ Ventas (14.1)
    texto: >-
      El TXT del RVIE sale con los 33 campos de la norma: los comprobantes
      anulados se anotan con importe cero y las notas de crédito de un
      comprobante de un mes anterior van a las columnas de descuento. **XLSX
      RVIE 14.4** entrega las mismas líneas para revisarlas.
    imagen: screenshots/18-rvie-144.png

  - titulo: Clasificación y estado en la factura de proveedor
    ruta: Contabilidad ▸ Proveedores ▸ Facturas
    texto: >-
      En facturas y notas de crédito de proveedor peruanas, **Clasificación
      RCE** toma la del producto con mayor importe y **Estado RCE** (tabla 14)
      se deduce del estado del asiento: 1 - Activo si está publicada; si está
      cancelada, 2 - Baja, o 3 - Revertido en recibos por honorarios y
      liquidaciones de compra. Ambos son editables y alimentan los campos 33 y
      40 del 8.4.

  - seccion: Reportes PLE nativos
    texto: Todo el PLE en la app Perú.
  - titulo: Acceder a los libros de la localización oficial
    ruta: Perú ▸ Libros PLE ▸ Reportes PLE nativos
    texto: >-
      Accesos a los informes que genera la localización oficial: **Diario y
      Mayor (5.1 / 5.3 / 6.1)**, **Caja y Bancos (1.1 / 1.2)**, **Ventas
      (14.1)**, **Compras (8.1)**, **Compras no domiciliados (8.2)** e
      **Inventarios TXT (12.1 / 13.1)**. La app Perú abre directamente el
      Libro Mayor.
    imagen: screenshots/19-menu-libros-ple.png

campos_intro: >-
  Primero las pantallas del módulo; después, formato por formato, de qué dato
  de Odoo sale cada campo del Anexo 2.
campos:
