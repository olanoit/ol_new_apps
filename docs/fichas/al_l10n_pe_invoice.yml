      - [Op. gravadas, "S/ 1.950,00"]
      - [IGV (18 %), "S/ 351,00"]
      - [Importe total, "S/ 2.301,00"]
      - ["Detracción 022 Otros servicios empresariales (12 %)", "S/ 276,00"]
    nota: El monto de la detracción lo calcula el módulo de detracciones redondeado a soles enteros; este módulo lo imprime.

  - titulo: Venta al crédito DEMO FAC
    tabla:
      - [Línea, Cantidad, Precio, "Desc. %", Importe]
      - [DEMO FAC Servicio de mantenimiento, "1", "S/ 1.500,00", "0", "S/ 1.500,00"]
      - [DEMO FAC Revisión técnica, "2", "S/ 800,00", "10", "S/ 1.440,00"]
      - [DEMO FAC Descuento global, "1", "S/ -100,00", "0", "S/ -100,00"]
    nota: "Op. gravadas S/ 2.840,00 + IGV S/ 511,20 = S/ 3.351,20. Cuotas: 30 % el 10/09/2026 (S/ 1.005,36) y el resto el 09/11/2026 (S/ 2.345,84)."

configuracion:
  - Instale el módulo desde Aplicaciones; requiere la facturación electrónica peruana (`l10n_pe_edi`).
  - Cargue el logo, la dirección, el teléfono y el correo de la compañía; salen en el encabezado y el pie.
  - Registre las cuentas bancarias en el contacto de la compañía para la tabla de cuentas; la del **Banco de la Nación** se imprime en el bloque de detracción.
  - "En **Perú ▸ Configuración ▸ Ajustes ▸ Comprobantes electrónicos** active la firma si la necesita y escriba el eslogan."
  - Configure los certificados digitales en **Perú ▸ Configuración ▸ Comprobantes electrónicos ▸ Certificados digitales**.
ediciones: [enterprise]
requisitos_nota: >-
  Requiere Odoo Enterprise: se apoya en la facturación electrónica peruana
  (`l10n_pe_edi`). El módulo no firma ni envía comprobantes: el XML y su
  envío los resuelve esa localización.

faq:
  - pregunta: ¿Por qué el comprobante no muestra el código QR?
    respuesta: >-
      El QR se extrae del XML firmado. Mientras la factura no se haya enviado
      y no tenga ese XML, el recuadro no se imprime, a propósito: un QR sin el
      hash de la firma no permite verificar el comprobante.
  - pregunta: ¿Cuándo aparece el cuadro de cuotas?
    respuesta: >-
      Cuando la factura tiene un término de pago con líneas: la forma de pago
      pasa a **CRÉDITO** y se listan las cuotas con fecha y monto. Sin término
      de pago, se imprime **CONTADO**. El ticket no lleva el cuadro.
  - pregunta: ¿Por qué no sale la fila de ISC o de exoneradas?
    respuesta: >-
      El desglose solo imprime las filas con importe distinto de cero. El IGV
      y el importe total se muestran siempre.
  - pregunta: ¿Por qué la factura en dólares no muestra el tipo de cambio?
    respuesta: >-
      El A4 busca una tasa registrada exactamente en la fecha de emisión. Si
      ese día no hay tasa (fin de semana, feriado), la fila no se imprime.
  - pregunta: Al facturar un pedido con «OC. externa» aparece un error, ¿qué pasa?
    respuesta: >-
      En esta versión la creación de la factura desde un pedido con OC. externa
      informada falla («Invalid field 'external_purchase' in 'account.move'»).
      Mientras se corrige, facture el pedido y escriba la OC. externa después:
      el A4 la toma del pedido.
  - pregunta: ¿Incluye la guía de remisión?
    respuesta: >-
      No. La guía de remisión tiene su propio reporte en el módulo
      `al_l10n_pe_delivery_guide_report`, instalable por separado.

