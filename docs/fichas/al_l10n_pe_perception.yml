  Asientos reales de los datos de demostración.
asientos:
  - titulo: Comprobante de percepción emitido
    referencia: MISCE/2026/09/0021
    texto: >-
      El cliente pagó S/ 4.453,32 por una factura de S/ 4.366,00: el exceso queda
      a su favor hasta que el comprobante lo carga y lo traslada al IGV
      percibido por pagar.
    lineas:
      - [1213000, "Percepción IGV P001-00000001 · DPSV/2026/00010", "87,32", ""]
      - [401132, Comprobante de percepción P001-00000001, "", "87,32"]
    nota: El cargo al cliente queda conciliado con el exceso del cobro.
  - titulo: Percepción que nos cobró un proveedor
    referencia: MISCE/2026/09/0023
    lineas:
      - [401131, "Percepción P001-00004521 · DPSC/2026/09/0001", "259,60", ""]
      - [4212000, Percepción del IGV P001-00004521, "", "259,60"]
    nota: Al pagar al proveedor la factura más la percepción, el abono se concilia con lo pagado de más.

ejemplos:
  - titulo: Qué tasa se aplica
    tabla:
      - [Situación, "¿Percibe?", Tasa]
      - [Factura a una empresa, Sí, "2 %"]
      - [Factura a un cliente agente de percepción, Sí, "0,5 %"]
      - [Factura a un agente de retención o entidad exceptuada, "No", "—"]
      - ["Boleta a persona natural hasta S/ 1 500 (S/ 100 en los numerales 1, 2 y 3)", "No (consumidor final)", "—"]
      - ["Boleta a persona natural por más del límite", Sí, "2 %"]
      - [Combustible a una empresa con factura, Sí, "1 %"]
      - [Combustible a otro agente o consumidor directo, "No", "—"]
      - [Operación con detracción, "No", "—"]
  - titulo: Cálculo del comprobante
    texto: >-
      El factor es tasa ÷ (100 + tasa), redondeado a seis decimales, y se aplica
      al monto cobrado con la percepción (numeral 2.6 del art. 10.1).
    tabla:
      - [Régimen, Factor, Cobrado con la percepción, Percepción]
      - ["2 %", "0,019608", "S/ 4.453,32", "S/ 87,32"]
      - ["0,5 %", "0,004975", "S/ 9.961,56", "S/ 49,56"]
      - ["1 %", "0,009901", "S/ 1.191,80", "S/ 11,80"]

configuracion_intro: >-
  Pasos para empezar a percibir.
configuracion:
  - Instale el módulo desde Aplicaciones (requiere la localización peruana y el módulo de retenciones).
  - "En **Ajustes ▸ Perú ▸ Percepciones del IGV** marque la designación de agente y elija la cuenta y el diario."
  - Marque los bienes sujetos en sus productos.
  - Revise en los contactos «Agente de percepción» y «Exceptuado de la percepción»; la consulta de la ficha RUC marca el primero.
  - "El comprobante se envía con el operador electrónico de la compañía (SUNAT directo, IAP, Digiflow o The Factory HKA)."
requisitos_nota: >-
  Funciona en Community y Enterprise. El envío a SUNAT usa los servicios de la
  localización peruana de Odoo (l10n_pe_edi).

faq:
  - pregunta: ¿Por qué la factura no calcula la percepción?
    respuesta: >-
      La compañía no está marcada como agente, ningún producto de la factura es
      un bien sujeto o la operación está excluida: la pestaña **Percepción IGV**
      muestra el motivo.
  - pregunta: ¿Qué pasa con los pagos parciales?
    respuesta: >-
      Se emite un comprobante por cada cobro, con lo pagado en ese cobro; el
      XML numera los cobros de cada factura (1, 2…).
  - pregunta: ¿Y si la factura está en dólares?
    respuesta: >-
      Lo cobrado se convierte a soles al tipo de cambio de la fecha de cobro
      (art. 8 de la R.S. 058-2006/SUNAT); el comprobante informa el tipo usado.
  - pregunta: ¿De dónde sale «Agente de percepción» del cliente?
    respuesta: >-
      SUNAT no publica un padrón descargable de agentes de percepción como el de
      retención: al consultar la ficha RUC, si figura en ese padrón se marca solo;
      si no, márquelo a mano.
  - pregunta: ¿Las notas de crédito cambian la percepción?
    respuesta: >-
      No. La percepción ya efectuada no se modifica por notas de crédito
      (art. 3.2 de la R.S. 058-2006/SUNAT).

