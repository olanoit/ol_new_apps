configuracion_intro: >-
  Los beneficios leen las boletas de los lotes mensuales, así que conviene
  tener la planilla calculada antes de procesarlos.
configuracion:
  - "En **Ajustes ▸ Nómina ▸ Perú** fije la quincena, la asignación familiar en vacaciones y el encargado de la liquidación de cada compañía."
  - "Complete la pestaña **Beneficios sociales** de la Configuración principal de cada compañía: entradas, reglas para promedios y tipos de días."
  - "Genere los tramos de la renta de 5ta desde la pestaña **Quinta categoría** después de registrar la UIT del año."
  - "Revise los tipos de préstamo y de adelanto en **Nómina ▸ Beneficios sociales ▸ Adelantos y préstamos**."
  - Calcule los lotes de nómina mensuales con su periodo antes de procesar CTS, gratificación, provisiones o utilidades.
requisitos_nota: >-
  Requiere Nómina de Odoo Enterprise y el núcleo de planillas peruano. Los
  asientos contables y los archivos de pago bancario los añaden los módulos
  relacionados.

faq:
  - pregunta: ¿Por qué un trabajador sale con 1/6 de gratificación en cero?
    respuesta: >-
      El sexto de gratificación de la CTS se toma de la gratificación liquidada
      del semestre. Si no hay una gratificación registrada para ese periodo, el
      sexto queda en cero.
  - pregunta: ¿Recalcular pisa los cambios que hice a mano?
    respuesta: >-
      Procesar de nuevo borra y regenera las líneas, salvo las marcadas con
      **No recalcular**. **Recalcular** y **Calcular** rehacen los importes
      desde los valores que tenga la línea.
  - pregunta: Proceso la CTS y no aparece ningún trabajador, ¿qué reviso?
    respuesta: >-
      Que exista el lote del mes de cierre con su periodo y boletas, y que las
      reglas y tipos de días de la Configuración principal sean los de la
      estructura que usa la planilla: el motor busca esas reglas concretas en
      las boletas.
  - pregunta: ¿Genera asientos contables?
    respuesta: >-
      No. Este módulo calcula y exporta a las boletas; los asientos de CTS,
      gratificación, liquidación de cese y provisiones los genera el módulo
      de contabilización de planillas, desde los mismos documentos.
  - pregunta: ¿Por qué el trabajador cesado no sale en la provisión del mes?
    respuesta: >-
      Porque se liquida, no se provisiona: la provisión omite a quien tiene
      situación de baja con fin de contrato dentro del lote, y también a los
      empleadores marcados con menos de cuatro trabajadores.
  - pregunta: ¿Por qué no puedo cambiar la compañía de un documento?
    respuesta: >-
      Porque cada beneficio se calcula con las boletas, la configuración y los
      trabajadores de una sola compañía: se toma de la compañía activa al
      crearlo. Para trabajar con otra, cámbiela en el selector de compañías
      antes de crear el documento.
  - pregunta: ¿Dónde se configuraba antes la quincena?
    respuesta: >-
      En la pestaña Beneficios sociales de los Parámetros principales, que
      ahora se llaman Configuración principal. El modo, la fracción y lo que
      se adelanta pasaron a Ajustes ▸ Nómina ▸ Perú; las entradas y la regla
      del neto quincenal siguen en la Configuración principal.
  - pregunta: ¿Se contempla la pequeña empresa?
    respuesta: >-
      Sí. Para el régimen laboral de pequeña empresa la CTS y la gratificación
      por mes se dividen entre 24 y 12, y las provisiones se reducen a la mitad;
      en microempresa solo se provisionan vacaciones.

