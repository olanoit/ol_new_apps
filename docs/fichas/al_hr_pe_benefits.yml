titulo: Beneficios sociales de planilla
subtitulo: >-
  CTS, gratificaciones, renta de 5ta categoría, liquidación de cese,
  provisiones, subsidios, utilidades, vacaciones, préstamos y quincena para
  la planilla peruana, sobre un único motor de remuneración computable.
categoria: Localización Perú · Nómina
etiquetas: [CTS, Gratificaciones, Renta de 5ta, Liquidación de cese, Provisiones, Utilidades D.L. 892, Préstamos]
portada: screenshots/03-cts.png

destacados_intro: >-
  Todos los beneficios siguen el mismo circuito: se crea el documento del
  periodo, se procesa trabajador por trabajador, se revisa y se exporta a las
  boletas del lote. Cada documento es de una compañía y el año se elige de una
  lista, sin escribirlo.
destacados:
  - icono: "CTS"
    titulo: CTS semestral
    texto: >-
      Depósitos de mayo (noviembre–abril) y noviembre (mayo–octubre): 1/12 de
      la remuneración computable por mes y 1/360 por día, con faltas y exceso
      de descanso médico.
  - icono: "½"
    titulo: Gratificaciones
    texto: >-
      Fiestas Patrias y Navidad (Ley 27735): 1/6 por mes, con el bono
      extraordinario de la Ley 29351 según el seguro del trabajador.
  - icono: "5ta"
    titulo: Renta de 5ta categoría
    texto: >-
      Proyección anual, deducción de 7 UIT, tramos de 8 % a 30 % generables
      desde la UIT del año, reproyección con el mes anterior y lista de
      excluidos.
  - icono: "⇥"
    titulo: Liquidación de cese
    texto: >-
      CTS, gratificación y vacaciones truncas del trabajador cesado, más
      conceptos extra, exportados como entradas de su boleta.
  - icono: "%"
    titulo: Provisiones y utilidades
    texto: >-
      Devengo mensual de CTS, gratificación y vacaciones, y reparto de
      utilidades del D.L. 892: 50 % por remuneraciones y 50 % por días.
  - icono: "S/"
    titulo: Préstamos, adelantos y quincena
    texto: >-
      Cronograma de cuotas iguales a fin de mes, adelantos descontables y lote
      de adelanto quincenal que se descuenta en la planilla mensual.

contexto:
  titulo: El problema que resuelve
  texto: >-
    Casi ningún beneficio peruano se calcula sobre el sueldo, sino sobre la
    **remuneración computable**: lo fijo se suma y lo variable se promedia
    solo si apareció las veces suficientes. Hacerlo en hojas de cálculo
    obliga a reconstruir seis meses de boletas por trabajador, a contar meses
    y días computables, a descontar faltas y a trasladar después cada importe
    a la boleta.


    Este módulo lo calcula desde las boletas de Odoo con la configuración de
    cada compañía y deja el resultado listo para pagarse en el lote de nómina.
  nota: >-
    **La regla de las tres apariciones.** Un concepto variable (comisión,
    bonificación, horas extras) entra en el promedio si aparece en tres o más
    boletas del semestre; entonces se suma y se divide entre 6, o entre los
    meses trabajados si el trabajador ingresó a mitad del semestre. La misma
    regla la usan la CTS, la gratificación y la liquidación de cese.

flujos_intro: >-
  Cómo trabaja el módulo por dentro, beneficio por beneficio. Ninguno escribe
  en contabilidad: los asientos los genera el módulo de contabilización de
  planillas.
flujos:
  - id: circuito
    titulo: El circuito común de CTS, gratificación y liquidación
    texto: >-
      Los tres documentos llaman al mismo motor de la Configuración principal
      de la compañía y terminan escribiendo entradas en las boletas del lote.
    mermaid: |
      flowchart TD
        A[Documento del periodo<br/>año, tipo y lote de nómina] --> B[Procesar]
        B --> C[Borra las líneas<br/>sin «No recalcular»]
        C --> D[Motor: boletas de los lotes del semestre<br/>por trabajador del lote de cierre]
        D --> E[Meses y días laborados, faltas<br/>según los tipos de días configurados]
        D --> F{¿La variable aparece<br/>3 o más veces?}
        F -- Sí --> G[Promedio: suma ÷ 6<br/>o ÷ meses si ingresó después]
        F -- No --> H[No entra en el promedio]
        E --> I[Remuneración computable<br/>básico + asignación familiar + promedios]
        G --> I
        H --> I
        I --> J[Una línea por trabajador]
        J --> K{¿Ajuste manual?}
        K -- Sí --> L[Editar la línea y marcar<br/>No recalcular]
        K -- No --> M[Recalcular]
        L --> N[Exportar]
        M --> N
        N --> O[Entradas en la boleta del trabajador<br/>y documento Exportado]
  - id: cts
    titulo: CTS del semestre
    texto: >-
      Tipo **CTS Noviembre - Abril** (depósito de mayo) o **CTS Mayo -
      Octubre** (depósito de noviembre).
    mermaid: |
      flowchart TD
        A[Remuneración computable] --> B[+ 1/6 de la gratificación<br/>del semestre: julio o diciembre]
        B --> C{Régimen laboral}
        C -- General --> D[Monto por mes = ÷ 12]
        C -- Pequeña empresa --> E[Monto por mes = ÷ 24]
        D --> F[Monto por día = mes ÷ 30]
        E --> F
        F --> G[Descanso médico hasta 60 días<br/>suma días; el exceso se descuenta]
        G --> H[Total = meses + días − faltas<br/>+ saldo reservado del semestre anterior]
        H --> I{¿Menos de un mes?}
        I -- Sí --> J[No se deposita:<br/>pasa al semestre siguiente]
        I -- No --> K[Exportar CTS: entrada CTS<br/>de la boleta del lote]
        H --> L[CTS en dólares = total ÷ tipo de cambio]
  - id: gratificacion
    titulo: Gratificación de julio y diciembre
    mermaid: |
      flowchart TD
        A[Remuneración computable] --> B{Régimen laboral}
        B -- General --> C[Monto por mes = ÷ 6]
        B -- Pequeña empresa --> D[Monto por mes = ÷ 12]
        C --> E[Meses completos del semestre]
        D --> E
        E --> F{¿Calcular días grati.?}
        F -- Sí --> G[+ días sueltos × monto por día]
        F -- No --> H[Solo meses]
        G --> I[− faltas × monto por día]
        H --> I
        I --> J{¿Bono extraordinario?}
        J -- Sí --> K[+ % del seguro social<br/>del trabajador: Ley 29351]
        J -- No --> L[Sin bono]
        K --> M[Exportar: entradas de gratificación<br/>y bonificación 9 %]
        L --> M
  - id: quinta
    titulo: Renta de 5ta categoría del mes
    mermaid: |
      flowchart TD
        A[Lote del mes] --> B[Generar quinta:<br/>una línea por boleta]
        B --> C[Proyección: rem. base × meses restantes<br/>+ rem. del mes + gratificaciones<br/>+ meses anteriores + otros empleadores]
        C --> D[− 7 UIT del año]
        D --> E[Impuesto por tramos<br/>8 · 14 · 17 · 20 · 30 %]
        E --> F{¿Hay quinta del<br/>mes anterior?}
        F -- Sí, mismo impuesto --> G[Parte del saldo pendiente]
        F -- Sí, impuesto distinto --> H[Reproyecta descontando<br/>lo ya retenido]
        F -- No --> I[Impuesto − retenciones previas<br/>− otros empleadores]
        G --> J[Retención = saldo ÷ divisor del mes<br/>12 en enero … 1 en diciembre]
        H --> J
        I --> J
        J --> K{¿Retención mayor que 0?}
        K -- No --> L[Excluidos de quinta]
        K -- Sí --> M[Afectos a quinta]
        L -- Agregar empleados --> M
        M --> N[Exportar quinta: entradas QUINTA<br/>y retención extraordinaria]
  - id: liquidacion
    titulo: Liquidación de cese
    texto: >-
      Se liquida sobre el lote del mes de cese: entran los trabajadores con
      situación de baja cuyo fin de contrato cae en el periodo de su boleta.
    mermaid: |
      flowchart TD
        A[Lote del mes de cese] --> B[Procesar]
        B --> C[Gratificación trunca<br/>semestre en curso + bono]
        B --> D[CTS trunca<br/>desde el último depósito]
        B --> E[Vacaciones truncas desde el aniversario<br/>− ONP o AFP de la boleta]
        B --> F[Fila de conceptos extra<br/>por cesado]
        F --> G[Agregar conceptos:<br/>ingresos y descuentos]
        C --> H[Exportar liquidación]
        D --> H
        E --> H
        G --> H
        H --> I[Entradas truncas y conceptos<br/>en la boleta del cesado]
  - id: provisiones
    titulo: Provisión mensual
    mermaid: |
      flowchart TD
        A[Lote del mes] --> B[Procesar]
        B --> C{Por cada boleta con básico}
        C -- Cesado en el mes o empleador<br/>con menos de 4 trabajadores --> D[No se provisiona]
        C -- Microempresa --> E[Solo vacaciones]
        C -- General o pequeña --> F[CTS: computable + 1/6 grati ÷ 12]
        C -- General o pequeña --> G[Vacaciones: computable ÷ 12]
        C -- Ingresó antes del lote --> H[Gratificación: computable ÷ 6<br/>+ bono con la tasa del seguro]
        F --> I[Pequeña empresa ÷ 2, micro ÷ 2 en vacaciones<br/>CTS y vacaciones: prorrateo del mes de ingreso]
        G --> I
        H --> I
        E --> I
        I --> J[Obtener acumulado del semestre o año]
        J --> K[Cerrar o generar el asiento<br/>con el módulo de contabilización]
  - id: prestamos
    titulo: Préstamos, adelantos y su descuento
    mermaid: |
      flowchart TD
        A[Préstamo: monto, fecha y cuotas] --> B[Generar cuotas<br/>iguales al último día de cada mes]
        C[Adelanto: monto y fecha de descuento] --> D[Estado No pagado]
        B --> E[Lote de nómina ▸ Importar préstamos]
        D --> F[Lote de nómina ▸ Importar adelantos]
        E --> G{¿Tipo especial de BBSS<br/>o quincena?}
        F --> G
        G -- No --> H[Entrada del tipo en la boleta<br/>y marca Pagado]
        G -- Sí --> I[Se descuenta en su beneficio;<br/>si ya se pagó, se regulariza]
  - id: quincena
    titulo: Subsidios y adelanto quincenal
    mermaid: |
      flowchart TD
        A[Lote de subsidios del periodo] --> B[Procesar: suspensiones T21<br/>21 enfermedad y 22 maternidad]
        B --> C[Traer información:<br/>12 meses de remuneraciones]
        C --> D{¿Enfermedad que no supera<br/>los 20 días del empleador?}
        D -- Sí --> E[Aviso: aún no corresponde subsidio]
        D -- No --> F[Calcular subsidio:<br/>total ÷ 30 × meses con boleta]
        F --> G[Reparto por periodos<br/>No pagado]
        G --> H[Lote ▸ Importar subsidios]
        I[Adelanto quincenal] --> J[Generar quincena:<br/>boletas de los contratos vigentes]
        J --> K[Importar adelantos y préstamos<br/>de tipo quincena]
        K --> L[Exportar quincena: neto quincenal<br/>como entrada de la boleta mensual]

pasos_intro: >-
  Recorrido con la planilla de pruebas de «Comercial Demo Perú S.A.C.», cuyos
  trabajadores son ficticios, y con los datos «DEMO FICHA HR2».
pasos:
  - seccion: Configuración
    texto: Una vez por compañía, antes del primer beneficio.
  - titulo: Configurar el motor de beneficios
    ruta: Nómina ▸ Configuración ▸ Perú ▸ Parámetros ▸ Configuración principal ▸ Beneficios sociales
    texto: >-
      Una pestaña por compañía indica qué **entradas** de la boleta reciben
      cada beneficio y qué **reglas salariales** y **tipos de días** usa el
      motor: básico, asignación familiar, sobretiempo, comisiones y
      bonificaciones para los promedios; días laborados, faltas y descanso
      médico para el tiempo computable.
    puntos:
      - La misma pestaña configura las entradas de liquidación de cese, subsidios, utilidades, adelantos y préstamos especiales y quincena.
      - Los motores comparan la regla concreta configurada con las líneas de la boleta; si apunta a otra estructura, no encuentra importes.
    imagen: screenshots/01-parametros.png

  - titulo: Quincena y vacaciones en Ajustes
    ruta: "Ajustes ▸ Nómina ▸ Perú: quincena y beneficios sociales"
    texto: >-
      Lo que cambia de una empresa a otra se fija en **Ajustes**, con el ícono
      de compañía que avisa que vale solo para la compañía activa: cómo se
      calcula la **Quincena** (porcentaje del sueldo o días trabajados, la
      fracción que se adelanta y si se adelantan la asignación familiar y la
      AFP u ONP) y, en **Vacaciones y liquidación**, si la asignación familiar
      entra en la remuneración vacacional y quién es el **Encargado** de la
      liquidación semestral.
    puntos:
      - "Ajustes guarda en la Configuración principal de la compañía: es una por compañía y se crea sola."
      - "El mapeo de entradas, reglas y tipos de días sigue en Configuración principal ▸ Beneficios sociales."
    imagen: screenshots/21-ajustes-quincena.png

  - titulo: Generar los tramos de la renta de 5ta
    ruta: Configuración principal ▸ Quinta categoría
    texto: >-
      Elija las reglas de remuneración ordinaria, extraordinaria, proyección y
      gratificaciones, y las entradas de quinta y de retención extraordinaria.
      **Generar tramos** reemplaza la tabla con la UIT del año en curso: 5, 20,
      35 y 45 UIT al 8, 14, 17 y 20 %, y el resto al 30 %.
    imagen: screenshots/02-quinta-tramos.png
    pie: "UIT 2026 de S/ 5.500,00: el primer tramo llega a S/ 27.500,00; límite 0 es «sin tope»."

  - seccion: CTS
    texto: Dos depósitos al año por lote de nómina.
  - titulo: Procesar la CTS del semestre
    ruta: Nómina ▸ Beneficios sociales ▸ CTS
    texto: >-
      Elija el **Año** de la lista (del próximo año hacia atrás), el tipo
      (**CTS Noviembre - Abril** o **CTS Mayo - Octubre**), el lote de nómina,
      la fecha de depósito y el tipo de cambio, y pulse **Procesar**. Se crea
      una línea por trabajador con meses, días, sueldo, asignación familiar,
      1/6 de gratificación, remuneración computable y total; el ícono de lista
      al final de cada fila abre su detalle.
    puntos:
      - "**Recalcular** vuelve a calcular las líneas; marcando **No recalcular** en una línea se conservan sus cambios manuales."
      - "**Exportar CTS** vuelca los importes como entrada de las boletas del lote y cierra el documento; **Volver a borrador** lo reabre."
      - Al trabajador con menos de un mes no se le deposita en ese semestre; su importe se suma al depósito siguiente.
      - "El nombre del documento lo propone el sistema (tipo y año) y la compañía es la activa: no se editan a mano."
    imagen: screenshots/03-cts.png
    pie: "CTS noviembre 2025 – abril 2026: nueve trabajadores y S/ 17.848,77 de CTS."

  - titulo: Revisar el detalle de un trabajador
    ruta: CTS ▸ línea del trabajador
    texto: >-
      La ficha lleva al trabajador como título y su periodo computable (meses,
      días, faltas y exceso de descanso médico) junto a sus datos; las
      pestañas **Remuneración computable**, **Cálculo** y **Depósito** muestran
      sueldo, asignación familiar, 1/6 de gratificación y promedios, los montos
      por mes y por día con lo descontado por faltas, intereses y otros
      descuentos, y el total en soles y dólares con la cuenta CTS y el banco. **Calcular** recalcula solo esa línea y **Detalle
      histórico** abre los importes mes a mes de las boletas de los seis meses
      previos con la estructura BASE del núcleo.
    puntos:
      - El descanso médico computa hasta 60 días al año; el exceso se descuenta como falta.
    imagen: screenshots/04-cts-trabajador.png

  - seccion: Gratificación
  - titulo: Liquidar la gratificación
    ruta: Nómina ▸ Beneficios sociales ▸ Gratificación
    texto: >-
      Mismo circuito que la CTS con el tipo **Gratificación Fiestas Patrias**
      o **Navidad**. Con **Bono extraordinario** se añade la bonificación de la
      Ley 29351 con el porcentaje del seguro social del trabajador; con
      **Calcular días grati.** también cuentan los días sueltos además de los
      meses completos.
    imagen: screenshots/06-gratificacion.png
    pie: "Fiestas Patrias 2026: S/ 30.479,12 de gratificación y S/ 2.524,13 de bono, exportados al lote."

  - seccion: Renta de 5ta categoría
    texto: Una liquidación por lote mensual.
  - titulo: Calcular la retención del mes
    ruta: Nómina ▸ Beneficios sociales ▸ Renta de 5ta categoría
    texto: >-
      Elija el lote del mes y pulse **Generar quinta**: se crea una línea por
      boleta y el documento pasa a **En proceso**. La pestaña **Afectos a
      quinta** muestra renta bruta anual, deducción de 7 UIT, renta neta,
      impuesto anual proyectado y retención mensual. **Exportar quinta** lleva
      la retención a las boletas.
    puntos:
      - "El **Mes** es el del medio del lote y fija los meses restantes de proyección y el divisor de la retención."
      - "Si existe la quinta del lote anterior aparece en el bloque **Anterior** y la retención parte de su saldo."
      - "**Volver a borrador** borra las líneas para generar de nuevo."
    imagen: screenshots/07-renta-5ta.png

  - titulo: Excluidos de quinta
    ruta: Renta de 5ta categoría ▸ Excluidos de quinta
    texto: >-
      Quien no llega a retener (renta neta anual negativa o retención en
      cero) pasa a esta pestaña con su proyección. **Agregar empleados** abre
      un asistente para devolver excluidos a afectos —p. ej. por ingresos de
      otro empleador— y **Recalcular quinta** los calcula.
    imagen: screenshots/08-renta-5ta-excluidos.png
    pie: "Junio 2026: cinco excluidos cuya renta bruta anual no supera las 7 UIT (S/ 37.450,00)."

  - titulo: La línea de un afecto
    ruta: Afectos a quinta ▸ línea del trabajador
    texto: >-
      Todo el cálculo en una ficha. Con **Editar proy.** se pueden corregir a
      mano la remuneración base y las gratificaciones proyectadas; siempre se
      pueden declarar **Rem. otros emp.**, **Ret. otros emp.** y **Rem. ext.**
      y pulsar **Calcular**.
    imagen: screenshots/09-renta-5ta-linea.png
    pie: "Retención de junio: S/ 4.951,20 ÷ 7 = S/ 707,31; quedan S/ 4.243,89 por retener."

  - seccion: Liquidación de cese
    texto: Los truncos del trabajador que termina su vínculo.
  - titulo: Procesar la liquidación
    ruta: Nómina ▸ Beneficios sociales ▸ Liquidación de cese
    texto: >-
      Elija el lote del mes de cese: año, tipo de gratificación y tipo de CTS
      se deducen de su fecha. **Procesar** genera las pestañas
      **Gratificación**, **CTS** y **Vacaciones** con los importes truncos y
      una fila de **Conceptos extra** por cesado. **Exportar liquidación**
      escribe las entradas truncas en su boleta.
    puntos:
      - Entran los trabajadores del lote con situación de baja y fin de contrato dentro del periodo de su boleta.
      - "En **Conceptos extra**, **Agregar conceptos** registra ingresos y descuentos con su entrada de nómina."
      - "Con el módulo de contabilización aparecen **Obtener provisiones** y la pestaña **Asientos contables**."
    imagen: screenshots/10-liquidacion.png
    pie: "Trabajadora DEMO cesada el 31/08/2026: gratificación trunca S/ 933,33 y bono S/ 84,00."

  - titulo: Vacaciones truncas con su aporte previsional
    ruta: Liquidación de cese ▸ Vacaciones
    texto: >-
      Meses y días desde el último aniversario de ingreso sobre la
      remuneración computable, menos el aporte ONP o AFP con las tasas de la
      boleta del mes. **(+) Vac. devengadas** y **(-) Vac. adelantadas** se
      capturan en la línea.
    imagen: screenshots/11-liquidacion-vacaciones.png
    pie: "Vacaciones truncas S/ 466,67 − ONP S/ 60,67 = neto S/ 406,00."

  - seccion: Provisiones
  - titulo: Provisionar los beneficios del mes
    ruta: Nómina ▸ Beneficios sociales ▸ Provisiones
    texto: >-
      Por lote de nómina, **Procesar** calcula el devengo de gratificación
      (con su bono), CTS y vacaciones de cada trabajador en tres pestañas.
      El icono de cada línea abre sus **Conceptos adicionales**. **Obtener
      acumulado** suma lo provisionado en el semestre o el año y **Cerrar**
      fija el documento.
    puntos:
      - Solo puede haber una provisión por lote de nómina en cada compañía.
      - Una provisión cerrada no se puede eliminar sin volverla a borrador.
    imagen: screenshots/12-provisiones.png
    pie: "Julio 2026 de la trabajadora DEMO: gratificación S/ 466,67 + bono S/ 42,00; ya tiene asiento."

  - seccion: Subsidios EsSalud
    texto: Enfermedad y maternidad, a partir de las suspensiones registradas.
  - titulo: Calcular un subsidio
    ruta: Nómina ▸ Beneficios sociales ▸ Subsidios
    texto: >-
      El lote de subsidios de un periodo, al **Procesar**, crea un subsidio por
      cada suspensión T21 de enfermedad (21) o maternidad (22) que empieza en
      él. En cada subsidio, **Traer información** carga las remuneraciones de
      los 12 meses previos y **Calcular subsidio** reparte el importe por
      periodos, que se importan a la boleta desde el lote de nómina.
    puntos:
      - "En enfermedad, los primeros 20 días del año son del empleador; **Computar 20 días** indica que ya se cubrieron en otro descanso."
      - "Un periodo ya importado se devuelve con **Cambiar a no pagado** antes de recalcular."
    imagen: screenshots/13-subsidio.png
    pie: Formulario de un subsidio nuevo; la base de pruebas no tiene suspensiones de subsidio.

  - seccion: Utilidades
  - titulo: Repartir las utilidades
    ruta: Nómina ▸ Beneficios sociales ▸ Utilidades
    texto: >-
      Indique el ejercicio, la renta anual antes de impuestos y el porcentaje
      de su actividad. **Procesar** reparte la mitad por remuneraciones del año
      y la otra mitad por días laborados menos faltas, y muestra los dos
      factores. **Exportar utilidades** lleva el total a la boleta del lote de
      pago.
    imagen: screenshots/14-utilidades.png
    pie: "Renta de S/ 500.000,00 al 10 %: S/ 50.000,00 repartidos entre diez trabajadores."

  - seccion: Vacaciones
    texto: Récord, saldos y liquidación del goce o la venta.
  - titulo: Recalcular el récord vacacional
    ruta: Nómina ▸ Beneficios sociales ▸ Vacaciones ▸ Récord vacacional
    texto: >-
      **Calcular saldos** recalcula para todos los empleados —o los elegidos
      al desmarcar **Todos los empleados**— los días devengados por año
      vacacional y el trunco del año en curso, y abre los saldos finales.
    imagen: screenshots/15-record-vacacional.png

  - titulo: Consultar los saldos de vacaciones
    ruta: Nómina ▸ Beneficios sociales ▸ Vacaciones ▸ Saldos de vacaciones
    texto: >-
      Cada movimiento con año, periodo, motivo, días e importe y el saldo
      acumulado en días y en soles. Se filtra por **Saldo final** y se agrupa
      por empleado o año.
    imagen: screenshots/16-saldos-vacaciones.png
    pie: "Quispe Mamani: 30 + 30 días devengados y 16 truncos en 2026, saldo de 76 días."

  - titulo: Liquidar vacaciones en la planilla
    ruta: Nómina ▸ Beneficios sociales ▸ Vacaciones ▸ Liquidación vacacional
    texto: >-
      Sobre el lote del mes, **Procesar** toma las suspensiones de vacaciones
      (T21-23) del periodo y calcula cada goce o venta con la remuneración
      computable, el aporte previsional y el neto. **Importar quinta** añade la
      retención de 5ta proporcional, **Exportar vacaciones** escribe las
      entradas VAC, COMP_VAC, ADE_VAC y QUINTA de la boleta y **Descargar
      Excel** entrega el detalle.

  - seccion: Adelantos y préstamos
  - titulo: Registrar un adelanto
    ruta: Nómina ▸ Beneficios sociales ▸ Adelantos y préstamos ▸ Adelantos
    texto: >-
      Trabajador, monto, tipo de adelanto, fecha y **fecha de descuento**: se
      descuenta en la boleta cuyo periodo incluye esa fecha. Al importarse pasa
      a **Pagado**; **Cambiar a no pagado** lo devuelve.
    imagen: screenshots/17-adelanto.png

  - titulo: Registrar un préstamo con cronograma
    ruta: Nómina ▸ Beneficios sociales ▸ Adelantos y préstamos ▸ Préstamos
    texto: >-
      Elija trabajador, tipo de préstamo, fecha, monto y número de cuotas y
      pulse **Generar cuotas**: cuotas iguales que vencen el último día de cada
      mes con su deuda pendiente. Si edita cuotas a mano, **Recalcular**
      rehace la deuda y el número de cuotas.
    puntos:
      - Los tipos de préstamo y de adelanto definen la entrada de la boleta por la que se descuentan.
      - No se puede eliminar un préstamo con cuotas ya aplicadas.
    imagen: screenshots/18-prestamo.png

  - titulo: Importar a las boletas del lote
    ruta: Nómina ▸ Recibos de nómina ▸ Periodos de nómina ▸ ⋮
    texto: >-
      Con el lote en **Listo**, su menú ofrece **Importar subsidios**,
      **Importar adelantos** e **Importar préstamos**: vuelcan lo pendiente del
      periodo a las entradas de cada boleta y lo marcan como pagado.
    imagen: screenshots/20-lote-importar.png

  - seccion: Adelanto quincenal
  - titulo: Pagar la primera quincena
    ruta: Nómina ▸ Beneficios sociales ▸ Adelantos quincenales
    texto: >-
      Nombre, periodo (del 1 al 15 del mes en curso por defecto) y el lote
      mensual. **Generar quincena** crea una boleta por empleado con contrato
      vigente y pasa a **Confirmado**; ahí se pueden **Recalcular**,
      **Importar adelantos** e **Importar préstamos** de tipo quincena.
      **Exportar quincena** valida las boletas y escribe el neto quincenal como
      entrada de la boleta mensual.
    puntos:
      - "El modo de cálculo, la tasa y si se adelantan asignación familiar y aportes se fijan en Ajustes ▸ Nómina ▸ Perú: quincena y beneficios sociales."
      - "**Reabrir quincena** vuelve a Confirmado para corregir y exportar de nuevo."
    imagen: screenshots/19-quincena.png

