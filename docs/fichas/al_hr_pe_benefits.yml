funcionalidades:
  - grupo: CTS y gratificación
    items:
      - Semestres de CTS tipo mayo y noviembre; gratificaciones de julio y diciembre.
      - Remuneración computable con básico, asignación familiar, promedios de variables y 1/6 de gratificación (solo CTS).
      - Divisores de pequeña empresa (CTS ÷ 24 y gratificación ÷ 12 por mes).
      - Descuento de faltas y exceso de descanso médico sobre 60 días.
      - Reserva del trabajador con menos de un mes para el semestre siguiente.
      - Bono extraordinario de la Ley 29351 con el porcentaje del seguro social.
      - Líneas protegidas contra el recálculo y detalle histórico mes a mes.
      - Exportación de los importes a las boletas del lote.
  - grupo: Configuración y multicompañía
    items:
      - Una Configuración principal por compañía, creada sola; quincena y vacaciones en Ajustes ▸ Nómina ▸ Perú.
      - Cada documento es de una compañía, que se toma de la activa y no se edita.
      - Los asistentes (récord vacacional, excluidos de quinta) rechazan trabajadores o líneas de otra compañía.
      - Año como lista desplegable y nombres legibles en documentos y líneas.
  - grupo: Renta de 5ta y liquidación de cese
    items:
      - Proyección anual con gratificaciones proyectadas o ya liquidadas y remuneraciones de meses anteriores.
      - Tabla escalonada de tramos por compañía generada desde la UIT del año.
      - Reproyección con el saldo de la quinta del mes anterior.
      - Afectos y excluidos en pestañas separadas, con asistente para reincorporar excluidos.
      - Liquidación de cese con CTS, gratificación y vacaciones truncas, aportes previsionales y conceptos extra.
  - grupo: Provisiones, subsidios y utilidades
    items:
      - Provisión mensual de CTS, gratificación con bono y vacaciones, con conceptos adicionales y acumulado del periodo.
      - Subsidios EsSalud de enfermedad (20 primeros días a cargo del empleador) y maternidad, repartidos por periodo.
      - Utilidades D.L. 892 con reparto 50 % por remuneraciones y 50 % por días laborados.
  - grupo: Vacaciones, préstamos y quincena
    items:
      - Récord vacacional y saldos de vacaciones por trabajador.
      - Liquidación vacacional de goce o venta, con importación de la quinta y descarga en Excel.
      - Adelantos y préstamos con importación a las boletas del lote.
      - Lote de adelanto quincenal que genera boletas y exporta el neto como descuento de la mensual.

ejemplos_intro: >-
  Cifras tomadas de las capturas; los cálculos cuadran al céntimo.
ejemplos:
  - titulo: CTS de noviembre–abril de un trabajador con faltas
    texto: >-
      Sueldo S/ 2.500,00 con asignación familiar S/ 113,00, sin variables. En
      el semestre computa 5 meses y 26 días, con 4 faltas:
    tabla:
      - [Concepto, Cálculo, Importe S/]
      - [Remuneración computable, "2.500,00 + 113,00", "2.613,00"]
      - [Monto por mes, "2.613,00 ÷ 12", "217,75"]
      - [Monto por día, "217,75 ÷ 30", "7,26"]
      - [CTS por meses, "217,75 × 5", "1.088,75"]
      - [CTS por días, "7,2583 × 26", "188,72"]
      - [(−) Faltas, "7,2583 × 4", "−29,03"]
      - [Total CTS, "", "1.248,44"]

  - titulo: Gratificación de Fiestas Patrias con bono extraordinario
    texto: Mismo trabajador, 5 meses computables y 4 faltas, asegurado en EsSalud.
    tabla:
      - [Concepto, Cálculo, Importe S/]
      - [Monto por mes, "2.613,00 ÷ 6", "435,50"]
      - [Gratificación por meses, "435,50 × 5", "2.177,50"]
      - [(−) Faltas, "435,50 ÷ 30 × 4", "−58,07"]
      - [Total gratificación, "", "2.119,43"]
      - [(+) Bono extraordinario, "9 % de 2.119,43", "190,75"]
      - [Total a pagar, "", "2.310,18"]
    nota: La provisión mensual de la misma gratificación es 435,50 + 39,20 de bono = 474,70.

  - titulo: Retención de 5ta categoría de junio
    texto: >-
      Trabajadora con S/ 6.000,00 al mes y UIT de S/ 5.500,00. La renta bruta
      anual proyectada es S/ 84.280,00:
    tabla:
      - [Paso, Cálculo, Importe S/]
      - [Renta neta anual, "84.280,00 − 7 UIT (38.500,00)", "45.780,00"]
      - [Primer tramo, "8 % de 27.500,00 (5 UIT)", "2.200,00"]
      - [Segundo tramo, "14 % de 18.280,00", "2.559,20"]
      - [Impuesto anual proyectado, "", "4.759,20"]
      - [Retención de junio, "4.759,20 ÷ 7", "679,89"]
    nota: >-
      El divisor lo fija el mes: 12 en enero, 11 en febrero… 7 en junio y 1 en
      diciembre, restando antes las retenciones ya practicadas.

  - titulo: Liquidación de cese de la trabajadora DEMO
    texto: >-
      Sueldo S/ 2.800,00, sin asignación familiar, en ONP y asegurada en
      EsSalud, cesada el 31/08/2026. Solo tiene boletas de julio y agosto de
      2026 en el sistema, así que el motor computa **2 meses** en cada trunco.
    tabla:
      - [Concepto, Cálculo, Importe S/]
      - [Gratificación trunca, "2.800,00 ÷ 6 × 2", "933,33"]
      - [(+) Bono extraordinario, "9 % de 933,33", "84,00"]
      - [CTS trunca, "2.800,00 ÷ 12 × 2", "466,67"]
      - [Vacaciones truncas, "2.800,00 ÷ 12 × 2", "466,67"]
      - [(−) ONP de las vacaciones, "13 % de 466,67", "−60,67"]
      - [Total por pagar, "", "1.890,00"]
    nota: >-
      Con la provisión DEMO de julio, **Obtener provisiones** trae un acumulado
      de 508,67 en gratificación, 233,33 en CTS y 233,33 en vacaciones.

  - titulo: Provisión de julio de la misma trabajadora
    tabla:
      - [Concepto, Cálculo, Importe S/]
      - [CTS, "2.800,00 ÷ 12", "233,33"]
      - [Gratificación, "2.800,00 ÷ 6", "466,67"]
      - [Bono extraordinario, "9 % de 466,67", "42,00"]
      - [Vacaciones, "2.800,00 ÷ 12", "233,33"]

  - titulo: Reparto de utilidades
    texto: >-
      Renta de S/ 500.000,00 al 10 %: S/ 50.000,00, mitad por remuneraciones
      (S/ 230.386,83 en el año) y mitad por días (1.716 días).
    tabla:
      - [Trabajador, Remuneraciones, Días, Por remuneraciones, Por días, Total]
