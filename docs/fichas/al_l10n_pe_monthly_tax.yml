titulo: Declaración mensual IGV y renta (621)
subtitulo: >-
  Un documento por periodo con todo lo que se declara en el Formulario Virtual
  621: IGV del mes, saldo a favor, percepciones y retenciones con su arrastre y
  pago a cuenta del impuesto a la renta según el régimen.
categoria: Contabilidad · Tributos
etiquetas: [SUNAT, IGV, Impuesto a la renta, Formulario 621, MYPE Tributario]
portada: screenshots/02-igv.png

destacados_intro: >-
  El cierre tributario del mes en una sola pantalla, calculado desde la
  contabilidad.
destacados:
  - icono: "S/"
    titulo: IGV del periodo
    texto: >-
      Débito fiscal de las ventas y crédito fiscal de las compras, con las notas
      de crédito restadas, y el saldo a favor que pasa al mes siguiente.
  - icono: "↻"
    titulo: Percepciones y retenciones
    texto: >-
      Las sufridas en el periodo más las no aplicadas de meses anteriores; lo que
      no se aplica pasa al mes siguiente.
  - icono: "%"
    titulo: Pago a cuenta de renta
    texto: >-
      Régimen General (mayor entre coeficiente y 1,5 %), MYPE Tributario (1 %
      hasta 300 UIT) y Régimen Especial (1,5 %), con la suspensión aprobada.
  - icono: "✓"
    titulo: Borrador, calculado, declarado
    texto: >-
      Cada periodo toma los saldos del anterior; el asiento del pago a cuenta es
      opcional.

contexto:
  titulo: El problema que resuelve
  texto: >-
    Cada mes el contador reúne a mano el IGV de los registros, el saldo a favor,
    las percepciones y retenciones que le hicieron y el pago a cuenta del impuesto
    a la renta para llenar el 621. El módulo lo calcula desde la contabilidad y
    guarda los saldos que pasan al mes siguiente.
  nota: >-
    **Fuente de los importes.** El IGV sale de los asientos publicados del mes; las
    percepciones y retenciones, de los módulos de percepciones y retenciones si
    están instalados. El 621 se presenta en SOL; este resumen no lo envía.

pasos_intro: >-
  Registre el régimen y el coeficiente en Ajustes; luego cree y calcule cada
  periodo.
pasos:
  - titulo: Declaraciones del año
    ruta: Perú ▸ Declaración mensual (621)
    texto: >-
      Un periodo por compañía y mes, con el IGV, la renta y el total a pagar.
    imagen: screenshots/01-lista.png
  - titulo: IGV, saldo a favor, percepciones y retenciones
    ruta: Perú ▸ Declaración mensual (621) ▸ periodo
    texto: >-
      Calcular trae los importes del mes y los saldos del periodo anterior; los
      saldos no aplicados quedan para el siguiente.
    imagen: screenshots/02-igv.png
  - titulo: Pago a cuenta del impuesto a la renta
    ruta: Pestaña Renta
    texto: >-
      Ingresos netos del mes y del ejercicio, el sistema aplicado y la cuota.
    imagen: screenshots/03-renta.png
  - titulo: Régimen tributario
    ruta: Perú ▸ Configuración ▸ Tributos SUNAT ▸ Régimen tributario
    texto: >-
      El régimen del RUC desde una fecha: cada periodo usa el vigente.
    imagen: screenshots/04-regimen.png

