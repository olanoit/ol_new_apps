configuracion_intro: >-
  El módulo trae un script de datos de demostración que crea cuentas, diarios,
  socios y un recorrido completo para validar la instalación.
configuracion:
  - Instale el módulo desde Aplicaciones.
  - "En **Perú ▸ Configuración ▸ Cuentas de la localización ▸ Cuentas de letras** registre las cuentas por tipo de cuenta, tipo de letra y moneda (al menos En cartera)."
  - Cree diarios generales cuyo nombre contenga «letra» y «cobrar» (clientes) o «letra» y «pagar» (proveedores).
  - Cree las cuentas **Redondeo** de tipo gasto y de tipo otros ingresos.
  - Asigne a los usuarios el grupo de **Gestión de letras** que corresponda.
requisitos_nota: >-
  Funciona en Community y Enterprise. Usa el tipo de cambio compra/venta del
  módulo de tipo de cambio Perú para los canjes en moneda extranjera.

faq:
  - pregunta: No me aparece ningún diario al crear el canje.
    respuesta: >-
      El campo solo ofrece diarios de la compañía cuyo nombre contiene «letra»
      y «cobrar» (clientes) o «letra» y «pagar» (proveedores). Renombre o cree
      el diario.
  - pregunta: No encuentro la factura al añadirla al canje.
    respuesta: >-
      Solo se ofrecen apuntes publicados, sin conciliar y con saldo, del mismo
      socio, de la moneda del diario y del tipo de documento elegido.
  - pregunta: Al enviar a cobranza libre dice que no hay cuenta configurada.
    respuesta: >-
      Falta la fila en **Cuentas de letras** para ese tipo de cuenta, tipo de
      letra y moneda del canje.
  - pregunta: ¿Puedo canjear solo una parte de la deuda?
    respuesta: >-
      Sí. Baje el **Importe div** de la factura, o en **Letras** elija **Pago**
      parcial e indique el importe; el resto sigue pendiente.
  - pregunta: El cliente no pagará una letra a tiempo, ¿qué hago?
    respuesta: >-
      Use **Refinanciar** con la fecha nueva: se crea un canje en borrador con
      lo adeudado como documento de origen, para generar letras nuevas.
  - pregunta: Un canje ya no aparece en Canje de letras.
    respuesta: >-
      Forma parte de un canje masivo: búsquelo en **Historial de canje**.
  - pregunta: ¿Por qué no puedo poner fecha de mañana al canje?
    respuesta: >-
      La fecha de canje no puede ser futura, y el vencimiento de las letras
      debe ser igual o posterior a la fecha de canje.

