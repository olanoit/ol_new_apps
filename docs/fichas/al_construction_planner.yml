titulo: Planificación de obra
subtitulo: >-
  El plan de recursos de la obra en el mismo árbol que se ejecuta: piso,
  departamento, ambiente y módulo, con sus materiales y contratas generados
  desde las tipologías y el monto planificado de cada nivel a la vista.
categoria: Construcción · Proyectos
portada: screenshots/02-seleccion-parcial.png
etiquetas: [Plan de recursos, Tipologías, Árbol de recursos, Selección en cascada, Contratas por driver, Tarifas por obra, Etapa de consumo]

destacados_intro: >-
  La jerarquía de la obra, el catálogo de tipologías, actividades y tarifas,
  la generación del plan y el árbol de recursos con selección en cascada.
destacados:
  - icono: "🏢"
    titulo: La obra como árbol
    texto: >-
      Piso › departamento › ambiente › módulo sobre las tareas del proyecto.
      Cada nivel sabe a qué piso, departamento y ambiente pertenece.
  - icono: "▦"
    titulo: Tipologías como plantilla
    texto: >-
      Cada tipología de cocina o closet trae sus módulos, sus actividades por
      ambiente y su lista de materiales con la etapa en que se consume.
  - icono: "⚙"
    titulo: Generar plan en un paso
    texto: >-
      Crea los módulos de cada ambiente y las líneas de armado, contratas y
      materiales, con una vista previa de cantidades y montos.
  - icono: "S/"
    titulo: Tarifas con prioridad
    texto: >-
      Obra y contrata, solo obra, solo contrata o tarifa base, con vigencias
      que no se superponen.
  - icono: "Σ"
    titulo: Monto de cualquier nivel
    texto: >-
      El piso suma sus departamentos, el departamento sus ambientes y el
      ambiente sus módulos, sin recorrer el árbol.
  - icono: "☑"
    titulo: Árbol de recursos
    texto: >-
      Obra › piso › departamento › ambiente › módulo cargado por niveles.
      Marque un piso o unos módulos y vea al lado todo lo que consumen.
  - icono: "!"
    titulo: Advertencias que no bloquean
    texto: >-
      Materiales sin etapa, líneas sin costo, ambientes sin tipología o
      módulos que faltan: se ven antes de generar y se corrigen antes de
      aprobar.

contexto:
  titulo: El problema que resuelve
  texto: >-
    En una obra de muebles a medida el costo se calcula en un maestro de
    Excel: por tipología, cuántos módulos, cuántos metros lineales de mueble
    bajo y alto, qué materiales y qué contratas. Cuando la obra arranca, ese
    maestro no está en el ERP: compras, producción y las contratas trabajan
    sin saber cuánto estaba previsto para cada departamento.


    El planificador lleva el maestro a Odoo como **tipologías** y genera el
    **plan de recursos** de la obra sobre su propio árbol de tareas. Las
    fases siguientes usan el plan para aprobar, pedir materiales, asignar
    contratas, registrar avances y comparar lo planificado con lo real.
  nota: >-
    **Nombres sin prefijo x_.** La especificación usa los nombres de Studio
    (x_level, x_typology_id…); en el módulo son campos propios con prefijo
    `construction_` en los modelos de Odoo. La tabla de equivalencias está en
    `docs/planificador/DISENO_TECNICO.md`.

flujos_intro: >-
  De la tipología al plan y del plan a la selección.
flujos:
  - id: generar
    titulo: Generar el plan
    texto: >-
      El planificador carga las tipologías y el árbol de la obra, crea el plan
      en borrador y lo genera. Puede volver a generarlo: no duplica módulos y
      conserva los costos escritos y las líneas manuales.
    mermaid: |
      flowchart TD
        A[Tipología: módulos, actividades, BOM con etapa] --> C
        B[Árbol: piso, departamento, ambiente con tipología] --> C
        C[Plan de recursos en borrador] --> D[Generar plan: vista previa]
        D --> E{¿Advertencias?}
        E -- Sí, no bloquean --> F[Generar]
        E -- No --> F
        F --> G[Tareas de módulo con estado Planificado]
        F --> H[Armado por módulo a la tarifa vigente]
        F --> I[Contratas por ambiente o por ML del módulo]
        F --> J[Materiales de la BOM, sin costo]
        J --> K[El planificador escribe el costo]
  - id: arbol
    titulo: Árbol de recursos
    texto: >-
      El árbol carga cada nivel cuando se abre. Marcar un nodo marca lo que
      cuelga de él; el servidor suma la selección y la barra ofrece las
      acciones de las fases instaladas.
    mermaid: |
      flowchart LR
        A[Obras ▸ Árbol de recursos] --> B[Obra › pisos › departamentos › ambientes › módulos]
        B --> C[Marcar nodos: cascada y parciales]
        C --> D[Barra: módulos, ML, montos]
        C --> E[Panel: recursos por actividad, producto o rol]
        D --> F[Compra, requerimiento, contrata, avance…]

pasos_intro: >-
  El árbol de recursos con el piso 05 de demostración («DEMO PLAN
  MOMEN-35-26»).
pasos:
  - titulo: Árbol de recursos
    ruta: Planificación de obra ▸ Obras ▸ Árbol de recursos
    texto: >-
      Elija el plan arriba a la izquierda. Cada nivel se abre con la flecha y
      trae sus módulos, ML, material, contrata y total: el piso 05 suma 66
      módulos, 41.33 ML y S/ 8,944.44; el Dpto 501, 7 módulos y S/ 993.66.
    imagen: screenshots/01-arbol-recursos.png
  - titulo: Selección en cascada
    ruta: Árbol de recursos ▸ casillas
    texto: >-
      Marcar el piso marca todo lo que cuelga de él. Al desmarcar un módulo,
      el ambiente, el departamento y el piso quedan con un guion (selección
      parcial) y la barra pasa a 65 módulos.
    puntos:
      - "El panel de la derecha suma los recursos de la selección por actividad, material o rol, con su contrata."
      - "Los botones de compra, requerimiento, contrata o avance aparecen en la barra a medida que se instalan sus fases."
    imagen: screenshots/02-seleccion-parcial.png
  - titulo: Medida en cantidades
    ruta: Árbol de recursos ▸ Cantidad
    texto: >-
      Cambia los montos por las cantidades de driver: material, driver de
      las contratas y total. «Avance» muestra el estado de cada módulo.
    imagen: screenshots/03-medida-cantidad.png

campos_intro: >-
  Los campos de la fase 1 en los modelos nuevos y en los que el módulo amplía.
campos:
  - grupo: Tarea (nivel de obra)
    ruta: Proyecto ▸ Tarea ▸ Obra
    campos:
      - [Nivel de obra, "Piso, departamento, ambiente o módulo.", Vacío, "Cada nivel cuelga del inmediato superior"]
      - ["Piso, departamento, ambiente", Ancestros por nivel., Calculado, Base de la acumulación]
      - [Tipología, Plantilla del ambiente., Vacío, De ella sale el plan]
      - ["Código, tipo, ancho y grupo ML del módulo", Del ETO o de la tipología., Al generar, El ancho baja la instalación por ML al módulo]
      - [Estado del módulo, "Planificado, en producción, producido, en obra, instalado, entregado.", Planificado, Con seguimiento]
      - [Monto planificado, Suma del plan vigente del nivel y de lo que tiene debajo., Calculado, "—"]
  - grupo: Tipología
    ruta: Planificación de obra ▸ Configuración ▸ Tipologías
    campos:
      - ["Obra, familia, código", Identificación única por obra y familia., "—", "—"]
      - ["Módulos", "Código, tipo, ancho, grupo ML, actividad de armado y BOM opcional.", "—", "Uno por módulo de la plantilla"]
      - [Actividades por ambiente, Actividad y cantidad de driver por ambiente., "—", "Puertas, entarugado, instalación…"]
      - ["ML bajo y alto", De los anchos o escritos a mano., Calculado, "—"]
      - [Lista de materiales, Componentes con su etapa de consumo., "—", Materiales del plan]
  - grupo: Actividad y tarifa
    ruta: Planificación de obra ▸ Configuración
    campos:
      - ["Código, etapa, unidad del driver", "Und, ML o módulo.", "—", "—"]
      - ["Por módulo / por metro lineal", Cómo se mide la actividad., Desmarcado, "No ambos a la vez"]
      - [Tarifa base, Precio si no hay tarifa., "0", "—"]
      - ["Tarifa: obra, contrata, vigencia, retención", Precio por combinación., "—", Sin superposición]
  - grupo: Plan de recursos
    ruta: Planificación de obra ▸ Obras ▸ Planes de recursos
    campos:
      - [Número y versión, "PLR/año/##### · vN.", Automático, Una versión vigente y una en preparación por obra]
      - ["Inicio y fin", Fechas del plan., De la obra, "—"]
      - [Política de exceso, "Avisar, pedir aprobación o bloquear.", Pedir aprobación, Se aplica en la fase de requerimientos]
      - [Anticipación, "Días antes del inicio de la tarea por tipo de recurso.", "7 / 3 / 7", Fecha de necesidad]
      - ["Montos por tipo", "Material, servicio, contrata, personal propio, producción.", Calculado, "—"]
  - grupo: Línea del plan
    ruta: Plan ▸ Líneas
    campos:
      - [Nivel, Tarea de la obra., "—", "De ella salen piso, departamento, ambiente y módulo"]
      - ["Tipo de recurso y etapa", "—", "—", "Sin etapa no se aprueba"]
      - ["Producto / actividad", "—", "—", "La contrata y el personal propio necesitan actividad"]
      - ["Cantidad, costo unitario, monto", "—", "Contrata: tarifa vigente; material: vacío", "Editable solo en borrador"]
      - [Fecha de necesidad, Inicio de la tarea menos la anticipación., Calculado, Editable]
  - grupo: Lista de materiales
    ruta: Fabricación ▸ Lista de materiales ▸ Componentes
    campos:
      - [Etapa de consumo, Etapa en que se consume el componente., Vacío, Etapa de la línea de material]

