configuracion_intro: >-
  El script `tools/planner_demo_data.py` crea la obra «DEMO PLAN
  MOMEN-35-26», sus actividades, tarifas, tipologías y el piso 05, y genera
  el plan.
configuracion:
  - Instale el módulo desde Aplicaciones.
  - "Marque la obra con **Es obra** (módulo de requerimientos de obra)."
  - "Cargue las **actividades** y sus **tarifas** en **Planificación de obra ▸ Configuración**."
  - "Cree las **tipologías** de la obra con sus módulos, actividades y lista de materiales, indicando la **etapa de consumo** de cada componente."
  - "Cree el árbol: pisos, departamentos y ambientes con su tipología."
  - "Cree el **plan de recursos** de la obra y pulse **Generar plan**."
  - "Defina las **reglas de aprobación** del plan en **Planificación de obra ▸ Configuración ▸ Reglas de aprobación**."
  - "La regla «Exceso sobre el plan: jefatura del planificador» del requerimiento de obra viene con el módulo; sus revisores necesitan ver los requerimientos (grupo de aprobador del requerimiento)."
  - "Para la compra masiva y los requerimientos, el planificador necesita también los grupos de requerimientos de compra y de requerimientos de obra."
  - "Revise la semana de las contratas en **Ajustes ▸ Planificación de obra** (jueves, jueves y sábado) y, si se quiere la factura por el neto, la **cuenta de retención**; cada obra puede cambiar los días en su pestaña Ajustes."
  - "La regla «Liquidación de contrata: jefatura de proyectos» viene con el módulo; los feriados se toman de las ausencias globales de la compañía."
  - "`tools/planner_demo_contracts.py` asigna las contratas del demo, registra el avance del ejemplo y prepara la liquidación del 05/11."
  - "Personal propio: actividades en horas con su **rol** y empleados con **costo hora**; el capataz necesita permiso de hoja de horas sobre otros empleados. `tools/planner_demo_control.py` deja una cuadrilla demo."
  - "Las OC con la analítica de la obra se controlan contra el presupuesto del plan vigente; las OC de servicio de las contratas se controlan al asignar y al liquidar."
  - "Ponga el **código de familia** (4 dígitos) en las categorías de producto donde los planificadores crearán productos, y el umbral de la **alerta de precio** en **Ajustes ▸ Planificación de obra**."
  - "`tools/planner_demo_prices.py` carga 27 compras de la melamina blanca del demo (24 en dólares y 3 en soles) y la familia 3105."
  - "Ruta del ingreso: en la obra, pestaña **Calendario e ingresos**, elija la **orden de venta del contrato** (servicio con política de facturación por entregas, una línea por partida) y revise el calendario; los valores por defecto y los **días hábiles del ingreso** están en **Ajustes ▸ Planificación de obra ▸ Ingresos**. Quien factura necesita el grupo **Planificación de obra: ingresos** y facturación."
  - "`tools/planner_demo_income.py` crea la OV de la partida «Cocinas», tres entregas semanales confirmadas y la valorización 1 confirmada y facturada."
requisitos_nota: >-
  Requiere Enterprise (planificación y previsión de proyectos) y los módulos
  OCA de requerimientos de compra y de aprobación por niveles. Licencia
  LGPL-3 porque depende de `base_tier_validation` (AGPL-3).

faq:
  - pregunta: "¿Por qué el plan no toma el costo del producto?"
    respuesta: >-
      Porque puede estar mal cargado (en la especificación la melamina tiene
      de costo el precio en dólares). El planificador mira «Precios de compra
      del producto», en soles al tipo de cambio de cada compra, y escribe el
      costo con su base.
  - pregunta: "¿Qué es una compra atípica?"
    respuesta: >-
      Un precio fuera de 1.5 veces el rango intercuartílico de la ventana
      (con 4 compras o más), como una compra chica a otro proveedor. Se ve en
      rojo en el gráfico; el ponderado la diluye y el promedio simple no.
  - pregunta: "¿Por qué los materiales salen sin costo?"
    respuesta: >-
      La especificación pide que el costo lo escriba el planificador después
      de revisar los precios de compra. Al regenerar se conserva el costo ya
      escrito de cada producto.
  - pregunta: "¿Qué pasa si el ambiente ya tiene módulos del ETO?"
    respuesta: >-
      No se duplican: se usan los existentes por código. Los de la plantilla
      que no están en el ambiente se avisan y no se generan.
  - pregunta: "¿Qué pasa con el presupuesto de la versión anterior?"
    respuesta: >-
      Al aprobar la versión nueva pasa a «Revisado» y queda como presupuesto
      padre del nuevo: la historia de revisiones queda en Contabilidad.
  - pregunta: "¿La compra masiva cuenta como pedido de la obra?"
    respuesta: >-
      No: sube el comprado. El pedido es de los requerimientos de obra y las
      OF; la necesidad de una compra masiva nueva descuenta ambos.
  - pregunta: "¿Qué pasa con los documentos abiertos al replanificar?"
    respuesta: >-
      Al aprobar la versión nueva, las asignaciones abiertas pasan a la línea
      que continúa a la suya; las cerradas quedan en la anterior. «Solo
      saldos» copia lo planificado menos lo pedido con documentos cerrados.
  - pregunta: "¿Qué pasa con un avance validado después del jueves?"
    respuesta: >-
      Entra a la liquidación siguiente como rezagado. Lo reportado y aún no
      validado al preparar la liquidación también espera a la semana
      siguiente.
  - pregunta: "¿Se puede revertir un avance?"
    respuesta: >-
      Sí, mientras no esté en una liquidación aprobada. Si está en una
      liquidación en borrador sale de ella; si está presentada o validada,
      primero se devuelve la liquidación.
  - pregunta: "¿Cómo se registra la retención en la factura?"
    respuesta: >-
      Con una cuenta de retención en Ajustes, como una línea negativa: la
      factura queda por el neto. Sin cuenta, la factura va por el bruto y la
      retención queda en la liquidación para que contabilidad la trate.
  - pregunta: "¿Por qué el estado de la línea no cambia al instante?"
    respuesta: >-
      Cambia con cada documento del plan (asignaciones, compras,
      requerimientos, OF, movimientos, avances, turnos y horas). Lo que no
      pasa por un documento, como un turno que termina con el paso del
      tiempo, lo recoge la acción programada horaria o «Actualizar control».
  - pregunta: "¿La obra del planificador es la obra de la planilla?"
    respuesta: >-
      Son modelos distintos y no dependen uno del otro: se enlazan por la
      cuenta analítica. Ponga en la obra de la planilla de construcción civil
      la cuenta analítica del proyecto y los costos de ambas caen en la misma
      obra.
  - pregunta: "¿Cómo se registra el fondo de garantía en la factura?"
    respuesta: >-
      Por defecto la factura va por lo confirmado y el fondo de garantía (y la
      amortización del adelanto) quedan en la valorización, que es lo que
      acepta la factura electrónica peruana. Con una cuenta en Ajustes, la
      factura los lleva como líneas negativas sin impuestos (útil en otras
      localizaciones). La decisión final es de contabilidad.
  - pregunta: "¿Qué partida toma cada línea del plan?"
    respuesta: >-
      La línea de la OV con la familia de la tipología del ambiente (cocina,
      closet…). La única línea sin familia toma el resto de la obra, como
      MOMEN con una sola partida «Cocinas».
  - pregunta: "¿El cronograma valorizado es contable?"
    respuesta: >-
      No: es de gestión. El costo es devengado (lo ejecutado al costo del
      plan), no lo pagado, y los montos van sin IGV. Sirve para ver la
      brecha entre lo que la obra consume y lo que se cobra.
  - pregunta: "¿Quién es supervisor de una obra?"
    respuesta: >-
      El responsable del proyecto y los usuarios de «Supervisores de obra»
      (Proyecto ▸ Ajustes). Un planificador que no supervisa ninguna obra ve
      los pendientes de todas.
  - pregunta: "¿Cuándo la instalación por ML va al módulo?"
    respuesta: >-
      Cuando la tipología tiene anchos por módulo. Sin anchos queda en el
      ambiente con su cantidad por ambiente, y se avisa.

