titulo: Planificación de obra
subtitulo: >-
  El plan de recursos de la obra en el mismo árbol que se ejecuta: piso,
  departamento, ambiente y módulo, con sus materiales y contratas generados
  desde las tipologías y el monto planificado de cada nivel a la vista.
categoria: Construcción · Proyectos
portada: screenshots/02-seleccion-parcial.png
etiquetas: [Plan de recursos, Tipologías, Árbol de recursos, Selección en cascada, Contratas por driver, Tarifas por obra, Etapa de consumo, Aprobación por niveles, Presupuesto analítico, Versiones del plan, Compra masiva, Control de exceso, Orden de fabricación, OC de servicio, Avance por driver, Liquidación semanal, Análisis de control, Personal propio, Cambiar fechas, Cronograma con recursos, Precios de compra, Crear producto, Abastecimiento de la obra, Entrega semanal, Valorización, Calendario e ingresos, Cronograma valorizado, Curva S, Inicio con pendientes, Importar maestro y ETO]

destacados_intro: >-
  La jerarquía de la obra, el catálogo de tipologías, actividades y tarifas,
  la generación del plan, el árbol de recursos con selección en cascada, la
  línea base aprobada con su presupuesto analítico y las compras,
  requerimientos y órdenes de fabricación que nacen del plan y lo descuentan,
  las contratas (asignación, avance por driver y liquidación semanal), el
  personal propio, el control de lo planificado contra lo real, la ruta
  del ingreso (entrega semanal, valorización con el cliente y factura), el
  cronograma valorizado con su curva S y el inicio con los pendientes de
  cada usuario.
destacados:
  - icono: "🏢"
    titulo: La obra como árbol
    texto: >-
      Piso › departamento › ambiente › módulo sobre las tareas del proyecto.
      Cada nivel sabe a qué piso, departamento y ambiente pertenece.
  - icono: "▦"
    titulo: Tipologías como plantilla
    texto: >-
      Cada tipología de cocina o closet trae sus módulos, sus actividades por
      ambiente y su lista de materiales con la etapa en que se consume.
  - icono: "⚙"
    titulo: Generar plan en un paso
    texto: >-
      Crea los módulos de cada ambiente y las líneas de armado, contratas y
      materiales, con una vista previa de cantidades y montos.
  - icono: "S/"
    titulo: Tarifas con prioridad
    texto: >-
      Obra y contrata, solo obra, solo contrata o tarifa base, con vigencias
      que no se superponen.
  - icono: "Σ"
    titulo: Monto de cualquier nivel
    texto: >-
      El piso suma sus departamentos, el departamento sus ambientes y el
      ambiente sus módulos, sin recorrer el árbol.
  - icono: "☑"
    titulo: Árbol de recursos
    texto: >-
      Obra › piso › departamento › ambiente › módulo cargado por niveles.
      Marque un piso o unos módulos y vea al lado todo lo que consumen.
  - icono: "✔"
    titulo: Aprobación por niveles
    texto: >-
      «Solicitar aprobación» no deja pasar líneas sin etapa ni sin costo, y
      las lista. Las revisiones por monto usan las reglas de aprobación de la
      suite.
  - icono: "▤"
    titulo: Presupuesto al aprobar
    texto: >-
      La aprobación crea el presupuesto analítico, una línea por combinación
      de cuentas de la obra, y congela los montos del plan.
  - icono: "⎘"
    titulo: Versiones con motivo
    texto: >-
      «Nueva versión» copia todo o solo saldos. La vigente sigue en uso hasta
      aprobar la nueva; entonces pasa a «Reemplazado».
  - icono: "🛒"
    titulo: Compra masiva en dos modos
    texto: >-
      Desde el árbol: con la analítica de la obra o como stock general,
      descontando lo libre en el central. Las planchas se redondean a entero.
  - icono: "⚖"
    titulo: Pedir contra el saldo
    texto: >-
      El requerimiento de obra muestra el saldo del plan por material. Al
      pedir más, la política del plan avisa, pide una revisión más con
      justificación o bloquea.
  - icono: "🏭"
    titulo: OF desde la tipología
    texto: >-
      Una orden de fabricación por piso con el producto de la tipología por
      sus ambientes y los componentes de la BOM; al cerrarla sube lo
      consumido.
  - icono: "🤝"
    titulo: Asignar contrata a un grupo
    texto: >-
      Marque el piso, elija la etapa y la contrata: ve cada actividad con su
      driver total, la tarifa vigente, el monto y la retención, y el alcance
      se suma a la OC de servicio de la contrata en la obra.
  - icono: "📷"
    titulo: Avance por driver con foto
    texto: >-
      La contrata reporta metros lineales, módulos o tapas, con foto; el
      supervisor valida. El porcentaje lo calcula el sistema, ponderado por
      valor en cada nivel.
  - icono: "📅"
    titulo: Liquidación semanal automática
    texto: >-
      Cada jueves se preparan las liquidaciones de jueves a miércoles. Al
      aprobarlas se recibe en la OC y se crea la factura con vencimiento el
      sábado.
  - icono: "%"
    titulo: Análisis de control
    texto: >-
      Planificado, comprometido, real, saldo y % ejecutado por etapa y tipo
      de recurso, por contrata o por producto, en pivote y gráfico. El estado
      de cada línea se filtra y se agrupa.
  - icono: "👷"
    titulo: Cuadrillas propias
    texto: >-
      Turnos por obrero y semana con la tarea del nivel. Las horas de la hoja
      de horas suben el ejecutado y el real (por el costo hora); los turnos
      sin horas son el comprometido.
  - icono: "⇆"
    titulo: Cambiar fechas
    texto: >-
      Desplace la selección n días o llévela a una fecha nueva: se recalculan
      las fechas de necesidad y Logística recibe una actividad en los
      requerimientos y OC desfasados.
  - icono: "🧾"
    titulo: OC contra el presupuesto
    texto: >-
      Una OC con la analítica de la obra se contrasta al confirmarla con el
      presupuesto analítico de su combinación: avisa, pide aprobación o
      bloquea según el plan.
  - icono: "📈"
    titulo: Precios de compra en soles
    texto: >-
      Seis meses de compras convertidas al tipo de cambio de cada fecha, con
      ponderado, mediana, medias móviles, resumen por proveedor y las compras
      atípicas a la vista antes de escribir el costo.
  - icono: "＋"
    titulo: Crear producto desde el plan
    texto: >-
      Código de la familia más correlativo asignado al guardar, productos de
      nombre parecido antes de crear y una actividad a Logística para
      completarlo.
  - icono: "🚚"
    titulo: Abastecimiento de la obra
    texto: >-
      Necesidad por semana, stock, OC abiertas y cantidad a comprar por
      producto, con alerta de precio; la compra masiva sale de la misma
      tabla.
  - icono: "📈"
    titulo: Ingreso devengado cada semana
    texto: >-
      La entrega semanal mide el avance valorizado de cada partida (contratas,
      personal propio y material consumido) y devenga precio × avance del
      periodo, con su costo y su margen.
  - icono: "🤝"
    titulo: Valorización trazable
    texto: >-
      Envío, observaciones y conformidad del cliente con fecha, nombre, cargo
      y documento; lo no confirmado vuelve en la siguiente y la factura no
      supera lo confirmado.
  - icono: "📅"
    titulo: Fechas del ingreso por obra
    texto: >-
      Corte, presentación, confirmación, factura y cobro previstos según el
      calendario de cada obra, corridos al siguiente día hábil.
  - icono: "📈"
    titulo: Cronograma valorizado
    texto: >-
      Costo, ingreso, margen, valorizado, facturado y cobrado por semana, en
      plan y real, con la curva S, la brecha de caja y la exportación a
      Excel.
  - icono: "☑"
    titulo: Pendientes de hoy
    texto: >-
      Al entrar, cada usuario ve sus obras con el próximo hito y lo que le
      toca atender; cada fila abre la lista filtrada.
  - icono: "⇪"
    titulo: Maestro y ETO desde Excel
    texto: >-
      Tipologías, módulos, actividades, BOM y árbol de la obra en un libro;
      el ETO con el ancho real de cada módulo. Vista previa con advertencias
      y reimportación sin duplicar.
  - icono: "!"
    titulo: Advertencias que no bloquean
    texto: >-
      Materiales sin etapa, líneas sin costo, ambientes sin tipología o
      módulos que faltan: se ven antes de generar y se corrigen antes de
      aprobar.

contexto:
  titulo: El problema que resuelve
  texto: >-
    En una obra de muebles a medida el costo se calcula en un maestro de
    Excel: por tipología, cuántos módulos, cuántos metros lineales de mueble
    bajo y alto, qué materiales y qué contratas. Cuando la obra arranca, ese
    maestro no está en el ERP: compras, producción y las contratas trabajan
    sin saber cuánto estaba previsto para cada departamento.


    El planificador lleva el maestro a Odoo como **tipologías** y genera el
    **plan de recursos** de la obra sobre su propio árbol de tareas. Las
    fases siguientes usan el plan para aprobar, pedir materiales, asignar
    contratas, registrar avances y comparar lo planificado con lo real.
  nota: >-
    **Nombres sin prefijo x_.** La especificación usa los nombres de Studio
    (x_level, x_typology_id…); en el módulo son campos propios con prefijo
    `construction_` en los modelos de Odoo. La tabla de equivalencias está en
    `docs/planificador/DISENO_TECNICO.md`.

flujos_intro: >-
  De la tipología al plan y del plan a la selección.
flujos:
  - id: generar
    titulo: Generar el plan
    texto: >-
      El planificador carga las tipologías y el árbol de la obra, crea el plan
      en borrador y lo genera. Puede volver a generarlo: no duplica módulos y
      conserva los costos escritos y las líneas manuales.
    mermaid: |
      flowchart TD
        A[Tipología: módulos, actividades, BOM con etapa] --> C
        B[Árbol: piso, departamento, ambiente con tipología] --> C
        C[Plan de recursos en borrador] --> D[Generar plan: vista previa]
        D --> E{¿Advertencias?}
        E -- Sí, no bloquean --> F[Generar]
        E -- No --> F
        F --> G[Tareas de módulo con estado Planificado]
        F --> H[Armado por módulo a la tarifa vigente]
        F --> I[Contratas por ambiente o por ML del módulo]
        F --> J[Materiales de la BOM, sin costo]
        J --> K[El planificador escribe el costo]
  - id: arbol
    titulo: Árbol de recursos
    texto: >-
      El árbol carga cada nivel cuando se abre. Marcar un nodo marca lo que
      cuelga de él; el servidor suma la selección y la barra ofrece las
      acciones de las fases instaladas.
    mermaid: |
      flowchart LR
        A[Obras ▸ Árbol de recursos] --> B[Obra › pisos › departamentos › ambientes › módulos]
        B --> C[Marcar nodos: cascada y parciales]
        C --> D[Barra: módulos, ML, montos]
        C --> E[Panel: recursos por actividad, producto o rol]
        D --> F[Compra, requerimiento, contrata, avance…]
  - id: linea_base
    titulo: Línea base y versiones
    texto: >-
      El planificador aplica los costos con su base, pide la aprobación y,
      con la última revisión, el plan queda aprobado con su presupuesto. Para
      cambiarlo se crea una versión nueva.
    mermaid: |
      flowchart TD
        A[Plan en borrador] --> B[Aplicar costo: manual, último precio, ponderado]
        B --> C{¿Sin etapa, sin costo o contrata sin actividad?}
        C -- Sí --> B
        C -- No --> D[Solicitar aprobación]
        D --> E[Revisiones por nivel]
        E -- Rechazo --> A
        E -- Última aprobación --> F[Aprobado: presupuesto analítico, líneas congeladas]
        F --> G[Nueva versión con motivo]
        G --> H[Aprobar la nueva]
        H --> I[La anterior: Reemplazado y presupuesto revisado]
        F --> J[Cerrar: solo lectura]
  - id: abastecimiento
    titulo: Asignaciones y compras
    texto: >-
      Cada documento que nace del plan guarda qué parte corresponde a cada
      línea (asignación). Lo comprado, lo llegado a obra y lo consumido se
      reparten por fecha de necesidad y mueven el estado de la línea.
    mermaid: |
      flowchart TD
        A[Árbol: selección de pisos, departamentos o ambientes] --> B[Compra masiva]
        A --> C[Requerimiento de obra]
        A --> D[Orden de fabricación]
        B --> B1[Requerimiento de compra: con analítica o stock general]
        B1 --> X[Asignaciones a las líneas del plan]
        C --> C1{Solicitar aprobación: ¿excede el saldo?}
        C1 -- No --> C2[Revisiones normales]
        C1 -- Sí, avisar --> C2
        C1 -- Sí, pedir aprobación --> C3[Justificación y revisión de la jefatura]
        C1 -- Sí, bloquear --> C4[No se envía]
        C3 --> C2
        C2 --> X
        D --> D1{Confirmar: ¿excede producción o armado?}
        D1 -- No --> D2[OF confirmada]
        D1 -- Sí --> D3[Justificación; la jefatura confirma si pide aprobación]
        D3 --> D2
        D2 --> X
        X --> Y[Pedido, comprado, despachado, consumido, saldo y estado de la línea]
        Y --> Z[Nueva versión: las abiertas pasan a la línea nueva]
  - id: contratas
    titulo: Contrata, avance, liquidación y pago
    texto: >-
      La contrata cobra por su driver: reporta las unidades con foto, el
      supervisor valida, el jueves se prepara la liquidación de la semana y,
      aprobada, se recibe en la OC de servicio y se factura con vencimiento el
      sábado.
    mermaid: |
      flowchart TD
        A[Árbol: selección y etapa] --> B[Asignar contrata: tarifa vigente y retención]
        B --> C[Contrata en las líneas y OC de servicio de la contrata en la obra]
        C --> D[Compras confirma la OC]
        D --> E[Registrar avance: unidades de driver con foto]
        E --> F{¿El supervisor valida?}
        F -- No, con motivo --> E
        F -- Sí --> G[Acumulado y % de avance de la línea y de los niveles]
        G --> H[Jueves: liquidación en borrador de jueves a miércoles]
        H --> I[Presentar] --> J{¿Validar?}
        J -- Devolver con motivo --> H
        J -- Sí --> K[Aprobación de la jefatura]
        K --> L[Recepción en la OC y factura con vencimiento el sábado]
        L --> M[Pagada al quedar pagada la factura]

  - id: precios_abastecimiento
    titulo: Precio, producto y abastecimiento
    texto: >-
      El planificador fija el costo mirando las compras en soles; si el
      producto no existe lo crea desde la línea. Logística compra desde el
      tablero de la obra lo que falta para las próximas semanas.
    mermaid: |
      flowchart TD
        A[Línea del plan] --> B{¿Existe el producto?}
        B -- No --> C[Crear producto: familia, nombre, unidades, proveedor]
        C --> C1[Productos parecidos] --> C2[Código de la familia al guardar]
        C2 --> C3[Producto activo, marcado con el plan y en la línea]
        C3 --> C4[Actividad a Logística]
        B -- Sí --> D[Precios de compra: 6 meses en soles]
        C3 --> D
        D --> E[Aplicar costo con la base elegida]
        E --> F[Plan aprobado]
        F --> G[Abastecimiento de la obra: necesidad por semana de la etapa]
        G --> H[A comprar = horizonte − stock − en OC]
        H --> I[Marcar filas ▸ Compra masiva]
        G --> J[Alertas: precio sobre el plan, sin OC a una semana, sin proveedor]

pasos_intro: >-
  El árbol de recursos con el piso 05 de demostración («DEMO PLAN
  MOMEN-35-26»).
pasos:
  - titulo: Árbol de recursos
    ruta: Planificación de obra ▸ Obras ▸ Árbol de recursos
    texto: >-
      Elija el plan arriba a la izquierda. Cada nivel se abre con la flecha y
      trae sus módulos, ML, material, contrata y total: el piso 05 suma 66
      módulos, 41.33 ML y S/ 8,944.44; el Dpto 501, 7 módulos y S/ 993.66.
    imagen: screenshots/01-arbol-recursos.png
  - titulo: Selección en cascada
    ruta: Árbol de recursos ▸ casillas
    texto: >-
      Marcar el piso marca todo lo que cuelga de él. Al desmarcar un módulo,
      el ambiente, el departamento y el piso quedan con un guion (selección
      parcial) y la barra pasa a 65 módulos.
    puntos:
      - "El panel de la derecha suma los recursos de la selección por actividad, material o rol, con su contrata."
      - "Los botones de compra, requerimiento, contrata o avance aparecen en la barra a medida que se instalan sus fases."
    imagen: screenshots/02-seleccion-parcial.png
  - titulo: Medida en cantidades
    ruta: Árbol de recursos ▸ Cantidad
    texto: >-
      Cambia los montos por las cantidades de driver: material, driver de
      las contratas y total. «Avance» muestra el estado de cada módulo.
    imagen: screenshots/03-medida-cantidad.png
  - seccion: Línea base
    texto: >-
      La versión 1 del piso 05 aprobada y la versión 2 en preparación
      (`tools/planner_demo_baseline.py`).
  - titulo: Resumen por etapa
    ruta: Planificación de obra ▸ Obras ▸ Planes de recursos ▸ plan ▸ Resumen por etapa
    texto: >-
      Material, contrata, planificado, presupuesto, diferencia, comprometido,
      real y saldo por etapa. En la versión aprobada el presupuesto es igual
      a lo planificado: S/ 8,944.44.
    puntos:
      - "Botones «Presupuesto» y «Versiones» arriba; «Nueva versión» y «Cerrar» en la cabecera."
      - "Comprometido y real se llenan con las asignaciones, contratas y producción."
    imagen: screenshots/04-resumen-etapa.png
  - titulo: Presupuesto analítico
    ruta: Plan ▸ Presupuesto
    texto: >-
      Lo crea la aprobación: una línea por combinación de cuentas analíticas
      de las líneas del plan (aquí, la cuenta de la obra).
    imagen: screenshots/05-presupuesto.png
  - titulo: Nueva versión
    ruta: Plan aprobado ▸ Nueva versión
    texto: >-
      Motivo obligatorio; copia todo o solo saldos. La versión nueva queda en
      borrador y la vigente se sigue usando.
    imagen: screenshots/06-nueva-version.png
  - titulo: Versión en preparación
    ruta: Plan v2 ▸ Resumen por etapa
    texto: >-
      Compara contra el presupuesto vigente: la melamina blanca a costo
      ponderado baja Producción en S/ 819.06. La rejilla de ventilación,
      sin etapa, aparece en rojo.
    imagen: screenshots/07-version-borrador.png
  - titulo: Aprobación bloqueada
    ruta: Plan v2 ▸ Solicitar aprobación
    texto: >-
      El mensaje lista las líneas sin etapa y sin costo para corregirlas.
    imagen: screenshots/08-aprobacion-bloqueada.png
  - titulo: Aplicar costo
    ruta: Plan ▸ Aplicar costo
    texto: >-
      Sugiere el último precio y los ponderados de 3 y 6 meses de las compras
      confirmadas; el planificador escribe el costo y la base queda en las
      líneas.
    imagen: screenshots/09-aplicar-costo.png
  - titulo: Análisis del plan
    ruta: Planificación de obra ▸ Obras ▸ Análisis del plan
    texto: >-
      Pivote y gráfico de las líneas de los planes vigentes por etapa y tipo
      de recurso.
    imagen: screenshots/10-analisis.png
  - seccion: Asignaciones y compras
    texto: >-
      Compra masiva, requerimientos y una OF generados desde la versión
      vigente del piso 05 (`tools/planner_demo_supply.py`).
  - titulo: Plan en ejecución
    ruta: Planificación de obra ▸ Obras ▸ Planes de recursos ▸ plan vigente
    texto: >-
      El primer documento generado pasa el plan a «En ejecución». En la
      cabecera, «Compra masiva», «Requerimiento de obra» y «Orden de
      fabricación»; arriba, el botón «Asignaciones».
    puntos:
      - "Los mismos asistentes salen de la barra del árbol de recursos con la selección marcada."
      - "El resumen por etapa ya muestra comprometido y real."
    imagen: screenshots/11-plan-en-ejecucion.png
  - titulo: Compra masiva
    ruta: Plan ▸ Compra masiva (o Árbol de recursos ▸ Compra masiva)
    texto: >-
      Necesidad, libre en el central, lo que ya viene en compras y a comprar
      por producto. Con analítica compra toda la necesidad con la cuenta de
      la obra; en stock general descuenta lo libre y lo que ya viene.
    puntos:
      - "Necesidad: lo planificado menos lo ya comprado o pedido por la obra."
      - "Planchas y demás unidades se redondean a entero hacia arriba: 17.66 planchas de melamina blanca → 18."
    imagen: screenshots/12-compra-masiva.png
  - titulo: Requerimiento de obra desde el plan
    ruta: Plan ▸ Requerimiento de obra
    texto: >-
      Planificado, pedido, saldo, disponible en el central y a pedir por
      material, agrupado por ambiente, departamento o piso. Crea el
      requerimiento en borrador con una asignación por cada línea del plan.
    imagen: screenshots/13-requerimiento-desde-plan.png
  - titulo: Asignaciones del plan
    ruta: Plan ▸ Asignaciones
    texto: >-
      Qué parte de cada documento corresponde a cada línea, lo ejecutado y
      el estado, que sigue al documento.
    imagen: screenshots/14-asignaciones.png
  - titulo: Control de plan en el requerimiento
    ruta: Planificación de obra ▸ Abastecimiento ▸ Requerimientos de obra
    texto: >-
      Columnas «Saldo del plan» y «Control» en las líneas. Aquí se piden 20
      tornillos del Dpto 501 que ya se pidieron con el requerimiento del
      piso: excede 20, con la política «pedir aprobación» se justificó y el
      requerimiento espera también la revisión de la jefatura.
    imagen: screenshots/15-control-de-plan.png
  - titulo: Orden de fabricación desde el plan
    ruta: Plan ▸ Orden de fabricación ▸ OF ▸ Plan de obra
    texto: >-
      El producto de la tipología por los ambientes incluidos, con los
      componentes de la BOM. Las asignaciones van a las líneas de producción
      y armado de esos ambientes; al confirmar se controla su saldo.
    imagen: screenshots/16-of-desde-plan.png

  - seccion: Contratas y liquidación semanal
    texto: >-
      Leandro con la instalación del piso 05, el avance del ejemplo de la
      especificación y su liquidación del 29/10 al 04/11
      (`tools/planner_demo_contracts.py`).
  - titulo: Asignar contrata
    ruta: Plan ▸ Asignar contrata (o Árbol de recursos ▸ Asignar contrata)
    texto: >-
      Selección, etapa, actividades y contrata. Cada actividad con su driver
      presupuestado, la tarifa vigente (obra y contrata › obra › contrata ›
      base), el monto y la retención. Para la instalación del piso 05 a
      Leandro: 8 actividades, 64 líneas, S/ 941.17 y neto S/ 847.05; en la
      imagen, el armado del piso a Gonza.
    puntos:
      - "Indica a qué OC de servicio se suma el alcance; si la contrata no tiene una abierta en la obra, se crea en borrador."
      - "Las líneas que ya tienen otra contrata no se reasignan y se avisa."
    imagen: screenshots/17-asignar-contrata.png
  - titulo: OC de servicio
    ruta: Contratas ▸ OC de servicio
    texto: >-
      Una por contrata y obra, con una línea por actividad y tarifa y su
      retención. Compras la confirma; cada liquidación aprobada recibe en
      ella lo de la semana.
    imagen: screenshots/18-oc-de-servicio.png
  - titulo: Registrar avance
    ruta: Avance ▸ Registrar avance (o el plan, el árbol o la tarea)
    texto: >-
      Elija la actividad: una fila por módulo o ambiente donde cuelga, con
      presupuestado, acumulado, por validar y saldo. Propone el saldo y no
      acepta más que el saldo más la tolerancia del plan. Las fotos son
      obligatorias.
    imagen: screenshots/19-registrar-avance.png
  - titulo: Avances por validar
    ruta: Avance ▸ Avances por validar
    texto: >-
      Agrupados por obra, contrata y semana de liquidación. «Validar» suma al
      acumulado; «Rechazar» pide el motivo. La columna «Liquidación prevista»
      dice en qué jueves se paga cada avance.
    imagen: screenshots/20-avances-por-validar.png
  - titulo: Liquidación semanal
    ruta: Contratas ▸ Liquidaciones semanales
    texto: >-
      Periodo de jueves a miércoles, liquidación el jueves y pago el sábado.
      Cada línea es el driver de la semana por la tarifa de la OC; el
      acumulado y el avance son informativos. Ejemplo: bruto S/ 380.88,
      retención 10 % S/ 38.09, neto S/ 342.79.
    puntos:
      - "Presentar › Validar (supervisor) › aprobación de la jefatura; «Devolver a la contrata» pide el motivo."
      - "Al aprobar recibe en la OC (nunca más de lo ordenado) y crea la factura con vencimiento el sábado."
    imagen: screenshots/21-liquidacion-semanal.png
  - titulo: Recursos y avance del ambiente
    ruta: Tarea del ambiente o módulo ▸ Recursos y avance
    texto: >-
      Las líneas del plan vigente del nivel con su contrata, presupuestado,
      acumulado, monto y avance, el avance valorizado y los avances
      reportados. «Registrar avance» abre el asistente con este nivel.
    imagen: screenshots/22-recursos-y-avance.png
  - titulo: Árbol con la medida «Avance»
    ruta: Árbol de recursos ▸ Avance
    texto: >-
      El avance valorizado de cada nivel: Σ ejecutado × costo entre Σ
      planificado de las contratas y el personal propio. Los módulos muestran
      su estado (Producido, Instalado).
    imagen: screenshots/23-arbol-avance.png

  - seccion: Control y personal propio
    texto: >-
      La cuadrilla propia en la cocina del Dpto 501 y el control del plan
      vigente (`tools/planner_demo_control.py`).
  - titulo: Control del plan (P-13)
    ruta: Plan ▸ pestaña Control
    texto: >-
      Por etapa y, dentro de ella, por tipo de recurso: planificado,
      comprometido, real, saldo y % ejecutado (real entre planificado), con
      el total de la obra. «Actualizar control» recalcula; además se
      actualiza con cada documento y cada hora.
    puntos:
      - "Comprometido: pedido o comprado sin consumir, OC de servicio sin recibir y turnos sin horas registradas."
      - "Real: consumido al costo del plan, recibido en la OC de servicio y horas registradas por el costo hora del empleado."
    imagen: screenshots/24-control.png
  - titulo: Análisis de control
    ruta: Obras ▸ Análisis de control (o el botón del plan)
    texto: >-
      Las líneas en pivote y gráfico con planificado, comprometido, real y
      saldo; agrupe por etapa, tipo de recurso, contrata, producto,
      actividad, nivel o estado de la línea.
    imagen: screenshots/25-analisis-control.png
  - titulo: Asignar cuadrilla
    ruta: Plan ▸ Asignar cuadrilla (o Árbol de recursos, o Contratas ▸ Asignar cuadrilla)
    texto: >-
      Rol, obreros, primera semana, semanas y horas por semana. La vista
      previa da un turno por obrero, semana y línea de personal propio de la
      selección, con las horas repartidas por monto planificado.
    puntos:
      - "Los obreros reciben el rol si no lo tienen, para que sus horas cuenten en la línea."
      - "El capataz registra las horas en la hoja de horas de la tarea (o de sus módulos)."
    imagen: screenshots/26-asignar-cuadrilla.png
  - titulo: Cambiar fechas
    ruta: Plan ▸ Cambiar fechas (o Árbol de recursos ▸ Cambiar fechas)
    texto: >-
      Desplazar n días o fecha nueva para el inicio más temprano de la
      selección. Con todas las etapas se mueven las tareas y se recalcula la
      fecha de necesidad; con algunas, solo la de esas líneas. La vista
      previa muestra la necesidad actual y la nueva.
    imagen: screenshots/27-cambiar-fechas.png
  - titulo: Cronograma con recursos
    ruta: Planificación de obra ▸ Cronograma (o el botón «Cronograma» del plan)
    texto: >-
      El Gantt de proyectos con los pisos, departamentos y ambientes de la
      obra y, debajo de cada ambiente, sus etapas (producción, armado,
      instalación, acabado) enlazadas en ese orden. Cada barra dice su
      contrata y su avance; la clara es una etapa sin contrata ni cuadrilla.
      Las columnas suman el monto del plan, el avance y la contrata de cada
      nivel.
    puntos:
      - "«Etapas» o «Tareas» cambia las filas; el selector de etapa deja solo una (las filas, la selección y la carga semanal)."
      - "Debajo, la carga semanal: monto de contratas y personal propio por contrata y etapa, repartido entre los días hábiles de cada etapa."
    imagen: screenshots/28-cronograma.png
  - titulo: Pedir y asignar desde el cronograma
    ruta: Cronograma ▸ casillas de la primera columna
    texto: >-
      Marcar un piso marca todo lo que cuelga de él, igual que en el árbol.
      El panel de la derecha muestra los recursos de la selección y los
      botones de la barra abren los asistentes (compra masiva, requerimiento,
      OF, asignar contrata, cuadrilla, avance, cambiar fechas) con ella.
    puntos:
      - "Con «Instalación» en el selector de etapa, marcar el piso 05 y «Asignar contrata» abre el asistente con las 8 actividades de instalación del piso por S/ 941.17."
      - "Marcar barras de etapa sueltas lleva al asistente sus ambientes y esas etapas."
    imagen: screenshots/29-cronograma-seleccion.png
  - titulo: Mover una etapa
    ruta: Cronograma ▸ arrastrar la barra de la etapa
    texto: >-
      Arrastrar o estirar la barra guarda las fechas de la etapa. La fecha de
      necesidad de sus líneas (en el ambiente y sus módulos) se desplaza los
      mismos días y Logística recibe una actividad en los requerimientos y OC
      que quedan con fecha anterior a la nueva necesidad (o posterior, si se
      adelanta).
    puntos:
      - "Con «Encadenar» activo, las etapas siguientes del ambiente que quedan solapadas se empujan al lunes siguiente, con su duración."
      - "«Cambiar fechas» (W-08) también mueve las etapas de las etapas elegidas; «Etapas del cronograma» las lista para editarlas."
    imagen: screenshots/30-cronograma-etapa.png
  - titulo: Precios de compra del producto
    ruta: Abastecimiento ▸ Precios de compra del producto (o el ícono de gráfico de la línea del plan)
    texto: >-
      Las compras confirmadas de la ventana (6 meses por defecto) en soles,
      cada compra en dólares al tipo de cambio de Odoo de su fecha de
      aprobación. Ponderado, promedio simple, mediana, mínimo, máximo,
      desviación, último precio y medias móviles de 4 semanas y 3 meses; el
      gráfico tiene un punto por semana y las compras atípicas en rojo.
    puntos:
      - "Al pasar el cursor por un punto se ven las compras, la cantidad y la media móvil de la semana."
      - "Las semanas empiezan el día configurado en la obra (jueves por defecto)."
      - "Con un plan en borrador y la base elegida, «Aplicar costo» abre W-12 con esa base y la fecha del fin de la ventana."
    imagen: screenshots/31-precios-compra.png
  - titulo: Resumen por proveedor
    ruta: Precios de compra del producto ▸ Por proveedor
    texto: >-
      Compras, cantidad, ponderado y último precio de cada proveedor con su
      moneda. Por mes, la media de 3 meses; por semana, la de 4 semanas; en
      «Compras», cada línea de OC con su tipo de cambio.
    imagen: screenshots/32-precios-por-proveedor.png
  - titulo: Aplicar costo con media móvil
    ruta: Precios de compra ▸ Aplicar costo (o Plan ▸ Aplicar costo)
    texto: >-
      Las cinco bases: ponderado de 6 y 3 meses, media móvil de 4 semanas,
      último precio y manual. El planificador escribe el costo; la base y su
      fecha quedan en las líneas.
    imagen: screenshots/33-aplicar-costo-media-movil.png
  - titulo: Crear producto desde el plan
    ruta: Línea del plan sin producto ▸ Crear producto (o Plan ▸ Crear producto)
    texto: >-
      Familia, nombre, unidades de consumo y de compra, proveedor y precio de
      referencia. Antes de crear muestra los productos de nombre parecido
      con su coincidencia y último precio; «Usar este» pone el existente en
      la línea.
    puntos:
      - "El código es el de la familia (4 dígitos) más un correlativo de 3, asignado al crear: dos planificadores no toman el mismo."
      - "El producto queda activo, marcado con el plan y en la línea; Logística recibe una actividad para completar marca, proveedor y cuentas."
      - "La línea sigue sin costo hasta aplicar W-12, y sin costo el plan no se aprueba."
    imagen: screenshots/34-crear-producto.png
  - titulo: Abastecimiento de la obra
    ruta: Abastecimiento ▸ Abastecimiento de la obra (o el botón del plan)
    texto: >-
      Por producto: necesidad total de la obra, necesidad por semana de
      inicio de la etapa que lo consume, stock libre en la obra y el central,
      lo pedido en OC con la analítica de la obra, cantidad a comprar en la
      unidad de compra, costo del plan, último precio y monto.
    puntos:
      - "A comprar = necesidad del horizonte − stock − en OC, redondeado hacia arriba en unidades enteras: 192.13 − 40 − 96 = 56.13 → 57 planchas."
      - "Horizonte de 2 a 12 semanas y filtro por etapa; lo atrasado entra en la primera semana."
      - "El último precio en rojo supera el costo del plan en el umbral de Ajustes (5 %) o más."
      - "«Marcar lo que falta» y «Compra masiva» abren W-02 con los productos marcados, la etapa del filtro y la necesidad hasta el fin del horizonte."
    imagen: screenshots/35-abastecimiento-obra.png
  - titulo: Calendario e ingresos de la obra
    ruta: Proyecto (obra) ▸ Calendario e ingresos
    texto: >-
      La orden de venta del contrato (una línea por partida, cantidad 1), la
      frecuencia de valorización (cada n semanas o en fechas fijas), los días
      para presentar, para la confirmación del cliente y para facturar, el
      plazo de cobro (por defecto el del cliente), el adelanto con su
      amortización y el fondo de garantía con su cobro. Debajo, las
      valorizaciones previstas.
    puntos:
      - "Presentación = corte + días para presentar; confirmación = presentación + días del cliente; factura = confirmación + días para facturar; cobro = factura + plazo de cobro."
      - "Una fecha que cae en día no hábil pasa al siguiente: la presentación de la valorización 5 caería el viernes 25/12 (feriado) y pasa al lunes 28/12."
      - "Monto previsto: precio de cada partida × su avance previsto, con las líneas del plan repartidas en los días hábiles de su etapa; la última valorización cierra en el precio."
      - "La partida «Cocinas» de una OV sin familia toma toda la obra; con varias partidas, cada línea de la OV lleva su familia (cocina, closet…)."
    imagen: screenshots/36-calendario-ingresos.png
  - titulo: Entrega semanal
    ruta: Ingresos ▸ Entregas semanales (o el botón «Entregas» de la obra)
    texto: >-
      La prepara la acción programada del día de liquidación, una por obra y
      semana, y la confirma la Jefatura de Proyectos. Por partida: avance
      anterior y al cierre, ingreso devengado, costo devengado y margen.
    puntos:
      - "Avance de la partida = (driver acumulado × tarifa + horas × costo hora + material consumido × costo del plan) ÷ monto planificado de la partida."
      - "Ingreso devengado = precio × (avance al cierre − anterior), sin redondear el avance: 159,231.23 × (42.94 % − 28.10 %) = 23,627.65."
      - "Costo devengado = lo ejecutado en la semana, separado en contratas, materiales y personal propio."
      - "Un avance validado después de confirmar la entrega cae en la siguiente."
    imagen: screenshots/37-entrega-semanal.png
  - titulo: Valorización con el cliente
    ruta: Ingresos ▸ Valorizaciones · Preparar valorización (W-13)
    texto: >-
      Reúne las entregas confirmadas hasta el corte y valoriza cada partida:
      % anterior (lo confirmado antes), % del periodo, % acumulado,
      entregado, confirmado, fondo de garantía y neto. Se envía al cliente
      con su PDF en el historial, recibe observaciones y se reenvía.
    puntos:
      - "Borrador › enviada › observada › confirmada › facturada; la anula la Jefatura sin factura y sus entregas vuelven a Confirmada."
      - "Cada observación del cliente queda con fecha y autor (subtipo «Observación del cliente») y se lista en su pestaña."
      - "La acción programada la prepara en borrador al pasar cada corte de la obra."
    imagen: screenshots/38-valorizacion.png
  - titulo: Conformidad del cliente y factura
    ruta: Valorización ▸ Confirmar (W-14) · Crear factura
    texto: >-
      Sin fecha, nombre, cargo y documento del cliente no pasa a Confirmada.
      El monto confirmado por partida puede ser menor que lo entregado: la
      diferencia queda por valorizar y entra en la siguiente. «Crear
      factura» (Administración y Finanzas) factura lo confirmado desde la OV
      del contrato.
    puntos:
      - "La línea de la OV queda con la cantidad entregada al % acumulado confirmado y la factura guarda su valorización; publicada, la valorización pasa a Facturada."
      - "La factura no puede publicarse por encima de lo confirmado en ninguna partida."
      - "Con 2 decimales en la cantidad (0.42 de 1), el precio unitario se ajusta hacia abajo para que el subtotal sea lo confirmado."
    imagen: screenshots/39-conformidad-cliente.png
  - titulo: Cronograma valorizado (plan)
    ruta: Reportes ▸ Cronograma valorizado (o el botón de la obra)
    texto: >-
      Una fila por semana de la obra con el costo, el ingreso devengado, el
      margen acumulado, la valorización confirmada, lo facturado y lo
      cobrado, y encima la curva S de costo, ingreso y cobrado acumulados.
      En plan, cada línea del plan se reparte en los días hábiles de su
      etapa y el ingreso sigue el avance previsto de cada partida.
    puntos:
      - "Valorización, factura y cobro en las semanas del calendario de la obra (P-21): la valorización 2 confirmada en la semana 12/11–18/11, facturada en la 19/11–25/11 y cobrada en la 17/12–23/12."
      - "El fondo de garantía se cobra al cierre (fila final): el cobrado acumulado llega al precio del contrato."
      - "La última semana absorbe el redondeo: cierra en el costo del plan y en el precio."
      - "Indicadores: costo, precio, margen al cierre, cobrado con el fondo y la mayor brecha costo − cobrado (costo devengado, no pagado)."
    imagen: screenshots/40-cronograma-valorizado.png
  - titulo: Cronograma valorizado (real) y análisis
    ruta: Cronograma valorizado ▸ Real · Pivote y gráfico · Exportar a Excel
    texto: >-
      El escenario real toma lo ejecutado valorizado (avances validados a
      tarifa, horas a costo hora y consumos a costo del plan), las entregas
      confirmadas, las valorizaciones confirmadas en su fecha de
      conformidad, las facturas publicadas de la OV del contrato y los cobros
      conciliados, sin IGV. Las mismas filas se ven en el pivote y el
      gráfico nativos por obra, semana, concepto y escenario.
    puntos:
      - "Se recalcula al abrir la pantalla y cada día con la acción programada."
      - "El cobro cuenta cuando el pago o el extracto está conciliado con la factura."
      - "Excel con una hoja para el plan y otra para lo real."
    imagen: screenshots/41-cronograma-valorizado-real.png
  - titulo: Análisis del cronograma valorizado
    ruta: Reportes ▸ Análisis del cronograma valorizado
    texto: >-
      Pivote por semana y concepto (y gráfico de líneas acumulado) de las
      filas del cronograma, filtrables por obra y escenario.
    imagen: screenshots/42-cronograma-pivote.png
  - titulo: Inicio con obras y pendientes de hoy
    ruta: Planificación de obra (al abrir la aplicación) · Obras ▸ Inicio
    texto: >-
      Las obras con su plan, lo planificado, el saldo, el avance, el próximo
      hito y el estado; al costado, los pendientes de hoy según el grupo del
      usuario, cada uno con su cantidad. Pulsar una fila abre la lista ya
      filtrada.
    puntos:
      - "Próximo hito: el más cercano entre corte, presentación, confirmación, factura y cobro de las valorizaciones previstas y fin de etapa; un plan en borrador tiene «Aprobar el plan»."
      - "El supervisor ve solo los avances y liquidaciones por validar de sus obras (responsable del proyecto o en «Supervisores de obra»)."
      - "Jefatura: entregas por confirmar; Finanzas: valorizaciones por facturar; Planificador: abastecimiento, etapas sin contrata y líneas sin costo."
    imagen: screenshots/43-inicio.png
  - titulo: Importar el maestro de planificación
    ruta: Configuración ▸ Importar maestro y ETO · Obra ▸ Importar maestro y ETO
    texto: >-
      El maestro de ejemplo (obra genérica de 3 pisos con cocina, closet y
      baño) en una obra vacía: la vista previa cuenta lo que se creará por
      hoja, sin escribir nada, y muestra las advertencias que el ejemplo trae
      a propósito.
    puntos:
      - "Hojas opcionales: CATALOGO, TIPOLOGIAS, MODULOS, ACTIVIDADES, BOM, ARBOL y ETO; columnas por su encabezado, en cualquier orden."
      - "Advertencias: BOM sin etapa con su monto en la obra, productos que no existen o sin costo, productos repetidos (se suman), actividades o tipologías desconocidas y cantidades con más decimales que la unidad."
      - "«Crear los productos que no existen» los crea con el código, nombre, unidad y costo del libro; la hoja CATALOGO la aplica un administrador."
      - "Descargar plantilla (vacía, con la hoja LEEME), Descargar ejemplo y Descargar ETO de ejemplo."
    imagen: screenshots/44-importar-maestro.png
  - titulo: Importar el ETO
    ruta: Configuración ▸ Importar maestro y ETO
    texto: >-
      El ETO de ejemplo crea los módulos reales de las cocinas del piso 01
      con su ancho; el departamento que no existe se avisa y se omite.
    puntos:
      - "Los módulos se reconocen por su código en el ambiente: volver a importar actualiza su ancho."
      - "«Generar plan» usa el ancho real del módulo: la instalación y la limpieza por ML bajan al módulo con ese ancho."
    imagen: screenshots/45-importar-eto.png
  - titulo: Tipología importada
    ruta: Configuración ▸ Tipologías
    texto: >-
      La cocina C01 del ejemplo con sus seis módulos con ancho, sus
      actividades por ambiente y su lista de materiales con la etapa de
      consumo de cada componente.
    puntos:
      - "Lo que el libro trae de una tipología queda exactamente así: una fila borrada del libro se borra de la tipología."
      - "Con el plan generado: 126 módulos y 390 líneas de contrata por S/ 3,300.00 en la obra de ejemplo."
    imagen: screenshots/46-tipologia-importada.png

campos_intro: >-
  Los campos de los modelos nuevos y de los que el módulo amplía.
campos:
  - grupo: Tarea (nivel de obra)
    ruta: Proyecto ▸ Tarea ▸ Obra
    campos:
      - [Nivel de obra, "Piso, departamento, ambiente o módulo.", Vacío, "Cada nivel cuelga del inmediato superior"]
      - ["Piso, departamento, ambiente", Ancestros por nivel., Calculado, Base de la acumulación]
      - [Tipología, Plantilla del ambiente., Vacío, De ella sale el plan]
      - ["Código, tipo, ancho y grupo ML del módulo", Del ETO o de la tipología., Al generar, El ancho baja la instalación por ML al módulo]
      - [Estado del módulo, "Planificado, en producción, producido, en obra, instalado, entregado.", Planificado, Con seguimiento]
      - [Monto planificado, Suma del plan vigente del nivel y de lo que tiene debajo., Calculado, "—"]
  - grupo: Tipología
    ruta: Planificación de obra ▸ Configuración ▸ Tipologías
    campos:
      - ["Obra, familia, código", Identificación única por obra y familia., "—", "—"]
      - ["Módulos", "Código, tipo, ancho, grupo ML, actividad de armado y BOM opcional.", "—", "Uno por módulo de la plantilla"]
      - [Actividades por ambiente, Actividad y cantidad de driver por ambiente., "—", "Puertas, entarugado, instalación…"]
      - ["ML bajo y alto", De los anchos o escritos a mano., Calculado, "—"]
      - [Lista de materiales, Componentes con su etapa de consumo., "—", Materiales del plan]
  - grupo: Actividad y tarifa
    ruta: Planificación de obra ▸ Configuración
    campos:
      - ["Código, etapa, unidad del driver", "Und, ML o módulo.", "—", "—"]
      - ["Por módulo / por metro lineal", Cómo se mide la actividad., Desmarcado, "No ambos a la vez"]
      - [Tarifa base, Precio si no hay tarifa., "0", "—"]
      - ["Tarifa: obra, contrata, vigencia, retención", Precio por combinación., "—", Sin superposición]
  - grupo: Plan de recursos
    ruta: Planificación de obra ▸ Obras ▸ Planes de recursos
    campos:
      - [Número y versión, "PLR/año/##### · vN.", Automático, Una versión vigente y una en preparación por obra]
      - ["Inicio y fin", Fechas del plan., De la obra, "—"]
      - [Política de exceso, "Avisar, pedir aprobación o bloquear.", Pedir aprobación, En requerimientos de obra y OF]
      - [Tolerancia, Porcentaje sobre lo planificado antes de exceder., "0", "—"]
      - [Anticipación, "Días antes del inicio de la tarea por tipo de recurso.", "7 / 3 / 7", Fecha de necesidad]
      - ["Montos por tipo", "Material, servicio, contrata, personal propio, producción.", Calculado, "—"]
      - [Presupuesto analítico, Lo crea la aprobación., "—", "La versión anterior queda «Revisado»"]
