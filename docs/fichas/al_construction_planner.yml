titulo: Planificación de obra
subtitulo: >-
  El plan de recursos de la obra en el mismo árbol que se ejecuta: piso,
  departamento, ambiente y módulo, con sus materiales y contratas generados
  desde las tipologías y el monto planificado de cada nivel a la vista.
categoria: Construcción · Proyectos
portada: screenshots/02-seleccion-parcial.png
etiquetas: [Plan de recursos, Tipologías, Árbol de recursos, Selección en cascada, Contratas por driver, Tarifas por obra, Etapa de consumo, Aprobación por niveles, Presupuesto analítico, Versiones del plan, Compra masiva, Control de exceso, Orden de fabricación, OC de servicio, Avance por driver, Liquidación semanal]

destacados_intro: >-
  La jerarquía de la obra, el catálogo de tipologías, actividades y tarifas,
  la generación del plan, el árbol de recursos con selección en cascada, la
  línea base aprobada con su presupuesto analítico y las compras,
  requerimientos y órdenes de fabricación que nacen del plan y lo descuentan,
  y las contratas: asignación, avance por driver y liquidación semanal.
destacados:
  - icono: "🏢"
    titulo: La obra como árbol
    texto: >-
      Piso › departamento › ambiente › módulo sobre las tareas del proyecto.
      Cada nivel sabe a qué piso, departamento y ambiente pertenece.
  - icono: "▦"
    titulo: Tipologías como plantilla
    texto: >-
      Cada tipología de cocina o closet trae sus módulos, sus actividades por
      ambiente y su lista de materiales con la etapa en que se consume.
  - icono: "⚙"
    titulo: Generar plan en un paso
    texto: >-
      Crea los módulos de cada ambiente y las líneas de armado, contratas y
      materiales, con una vista previa de cantidades y montos.
  - icono: "S/"
    titulo: Tarifas con prioridad
    texto: >-
      Obra y contrata, solo obra, solo contrata o tarifa base, con vigencias
      que no se superponen.
  - icono: "Σ"
    titulo: Monto de cualquier nivel
    texto: >-
      El piso suma sus departamentos, el departamento sus ambientes y el
      ambiente sus módulos, sin recorrer el árbol.
  - icono: "☑"
    titulo: Árbol de recursos
    texto: >-
      Obra › piso › departamento › ambiente › módulo cargado por niveles.
      Marque un piso o unos módulos y vea al lado todo lo que consumen.
  - icono: "✔"
    titulo: Aprobación por niveles
    texto: >-
      «Solicitar aprobación» no deja pasar líneas sin etapa ni sin costo, y
      las lista. Las revisiones por monto usan las reglas de aprobación de la
      suite.
  - icono: "▤"
    titulo: Presupuesto al aprobar
    texto: >-
      La aprobación crea el presupuesto analítico, una línea por combinación
      de cuentas de la obra, y congela los montos del plan.
  - icono: "⎘"
    titulo: Versiones con motivo
    texto: >-
      «Nueva versión» copia todo o solo saldos. La vigente sigue en uso hasta
      aprobar la nueva; entonces pasa a «Reemplazado».
  - icono: "🛒"
    titulo: Compra masiva en dos modos
    texto: >-
      Desde el árbol: con la analítica de la obra o como stock general,
      descontando lo libre en el central. Las planchas se redondean a entero.
  - icono: "⚖"
    titulo: Pedir contra el saldo
    texto: >-
      El requerimiento de obra muestra el saldo del plan por material. Al
      pedir más, la política del plan avisa, pide una revisión más con
      justificación o bloquea.
  - icono: "🏭"
    titulo: OF desde la tipología
    texto: >-
      Una orden de fabricación por piso con el producto de la tipología por
      sus ambientes y los componentes de la BOM; al cerrarla sube lo
      consumido.
  - icono: "🤝"
    titulo: Asignar contrata a un grupo
    texto: >-
      Marque el piso, elija la etapa y la contrata: ve cada actividad con su
      driver total, la tarifa vigente, el monto y la retención, y el alcance
      se suma a la OC de servicio de la contrata en la obra.
  - icono: "📷"
    titulo: Avance por driver con foto
    texto: >-
      La contrata reporta metros lineales, módulos o tapas, con foto; el
      supervisor valida. El porcentaje lo calcula el sistema, ponderado por
      valor en cada nivel.
  - icono: "📅"
    titulo: Liquidación semanal automática
    texto: >-
      Cada jueves se preparan las liquidaciones de jueves a miércoles. Al
      aprobarlas se recibe en la OC y se crea la factura con vencimiento el
      sábado.
  - icono: "!"
    titulo: Advertencias que no bloquean
    texto: >-
      Materiales sin etapa, líneas sin costo, ambientes sin tipología o
      módulos que faltan: se ven antes de generar y se corrigen antes de
      aprobar.

contexto:
  titulo: El problema que resuelve
  texto: >-
    En una obra de muebles a medida el costo se calcula en un maestro de
    Excel: por tipología, cuántos módulos, cuántos metros lineales de mueble
    bajo y alto, qué materiales y qué contratas. Cuando la obra arranca, ese
    maestro no está en el ERP: compras, producción y las contratas trabajan
    sin saber cuánto estaba previsto para cada departamento.


    El planificador lleva el maestro a Odoo como **tipologías** y genera el
    **plan de recursos** de la obra sobre su propio árbol de tareas. Las
    fases siguientes usan el plan para aprobar, pedir materiales, asignar
    contratas, registrar avances y comparar lo planificado con lo real.
  nota: >-
    **Nombres sin prefijo x_.** La especificación usa los nombres de Studio
    (x_level, x_typology_id…); en el módulo son campos propios con prefijo
    `construction_` en los modelos de Odoo. La tabla de equivalencias está en
    `docs/planificador/DISENO_TECNICO.md`.

flujos_intro: >-
  De la tipología al plan y del plan a la selección.
flujos:
  - id: generar
    titulo: Generar el plan
    texto: >-
      El planificador carga las tipologías y el árbol de la obra, crea el plan
      en borrador y lo genera. Puede volver a generarlo: no duplica módulos y
      conserva los costos escritos y las líneas manuales.
    mermaid: |
      flowchart TD
        A[Tipología: módulos, actividades, BOM con etapa] --> C
        B[Árbol: piso, departamento, ambiente con tipología] --> C
        C[Plan de recursos en borrador] --> D[Generar plan: vista previa]
        D --> E{¿Advertencias?}
        E -- Sí, no bloquean --> F[Generar]
        E -- No --> F
        F --> G[Tareas de módulo con estado Planificado]
        F --> H[Armado por módulo a la tarifa vigente]
        F --> I[Contratas por ambiente o por ML del módulo]
        F --> J[Materiales de la BOM, sin costo]
        J --> K[El planificador escribe el costo]
  - id: arbol
    titulo: Árbol de recursos
    texto: >-
      El árbol carga cada nivel cuando se abre. Marcar un nodo marca lo que
      cuelga de él; el servidor suma la selección y la barra ofrece las
      acciones de las fases instaladas.
    mermaid: |
      flowchart LR
        A[Obras ▸ Árbol de recursos] --> B[Obra › pisos › departamentos › ambientes › módulos]
        B --> C[Marcar nodos: cascada y parciales]
        C --> D[Barra: módulos, ML, montos]
        C --> E[Panel: recursos por actividad, producto o rol]
        D --> F[Compra, requerimiento, contrata, avance…]
  - id: linea_base
    titulo: Línea base y versiones
    texto: >-
      El planificador aplica los costos con su base, pide la aprobación y,
      con la última revisión, el plan queda aprobado con su presupuesto. Para
      cambiarlo se crea una versión nueva.
    mermaid: |
      flowchart TD
        A[Plan en borrador] --> B[Aplicar costo: manual, último precio, ponderado]
        B --> C{¿Sin etapa, sin costo o contrata sin actividad?}
        C -- Sí --> B
        C -- No --> D[Solicitar aprobación]
        D --> E[Revisiones por nivel]
        E -- Rechazo --> A
        E -- Última aprobación --> F[Aprobado: presupuesto analítico, líneas congeladas]
        F --> G[Nueva versión con motivo]
        G --> H[Aprobar la nueva]
        H --> I[La anterior: Reemplazado y presupuesto revisado]
        F --> J[Cerrar: solo lectura]
  - id: abastecimiento
    titulo: Asignaciones y compras
    texto: >-
      Cada documento que nace del plan guarda qué parte corresponde a cada
      línea (asignación). Lo comprado, lo llegado a obra y lo consumido se
      reparten por fecha de necesidad y mueven el estado de la línea.
    mermaid: |
      flowchart TD
        A[Árbol: selección de pisos, departamentos o ambientes] --> B[Compra masiva]
        A --> C[Requerimiento de obra]
        A --> D[Orden de fabricación]
        B --> B1[Requerimiento de compra: con analítica o stock general]
        B1 --> X[Asignaciones a las líneas del plan]
        C --> C1{Solicitar aprobación: ¿excede el saldo?}
        C1 -- No --> C2[Revisiones normales]
        C1 -- Sí, avisar --> C2
        C1 -- Sí, pedir aprobación --> C3[Justificación y revisión de la jefatura]
        C1 -- Sí, bloquear --> C4[No se envía]
        C3 --> C2
        C2 --> X
        D --> D1{Confirmar: ¿excede producción o armado?}
        D1 -- No --> D2[OF confirmada]
        D1 -- Sí --> D3[Justificación; la jefatura confirma si pide aprobación]
        D3 --> D2
        D2 --> X
        X --> Y[Pedido, comprado, despachado, consumido, saldo y estado de la línea]
        Y --> Z[Nueva versión: las abiertas pasan a la línea nueva]
  - id: contratas
    titulo: Contrata, avance, liquidación y pago
    texto: >-
      La contrata cobra por su driver: reporta las unidades con foto, el
      supervisor valida, el jueves se prepara la liquidación de la semana y,
      aprobada, se recibe en la OC de servicio y se factura con vencimiento el
      sábado.
    mermaid: |
      flowchart TD
        A[Árbol: selección y etapa] --> B[Asignar contrata: tarifa vigente y retención]
        B --> C[Contrata en las líneas y OC de servicio de la contrata en la obra]
        C --> D[Compras confirma la OC]
        D --> E[Registrar avance: unidades de driver con foto]
        E --> F{¿El supervisor valida?}
        F -- No, con motivo --> E
        F -- Sí --> G[Acumulado y % de avance de la línea y de los niveles]
        G --> H[Jueves: liquidación en borrador de jueves a miércoles]
        H --> I[Presentar] --> J{¿Validar?}
        J -- Devolver con motivo --> H
        J -- Sí --> K[Aprobación de la jefatura]
        K --> L[Recepción en la OC y factura con vencimiento el sábado]
        L --> M[Pagada al quedar pagada la factura]

pasos_intro: >-
  El árbol de recursos con el piso 05 de demostración («DEMO PLAN
  MOMEN-35-26»).
pasos:
  - titulo: Árbol de recursos
    ruta: Planificación de obra ▸ Obras ▸ Árbol de recursos
    texto: >-
      Elija el plan arriba a la izquierda. Cada nivel se abre con la flecha y
      trae sus módulos, ML, material, contrata y total: el piso 05 suma 66
      módulos, 41.33 ML y S/ 8,944.44; el Dpto 501, 7 módulos y S/ 993.66.
    imagen: screenshots/01-arbol-recursos.png
  - titulo: Selección en cascada
    ruta: Árbol de recursos ▸ casillas
    texto: >-
      Marcar el piso marca todo lo que cuelga de él. Al desmarcar un módulo,
      el ambiente, el departamento y el piso quedan con un guion (selección
      parcial) y la barra pasa a 65 módulos.
    puntos:
      - "El panel de la derecha suma los recursos de la selección por actividad, material o rol, con su contrata."
      - "Los botones de compra, requerimiento, contrata o avance aparecen en la barra a medida que se instalan sus fases."
    imagen: screenshots/02-seleccion-parcial.png
  - titulo: Medida en cantidades
    ruta: Árbol de recursos ▸ Cantidad
    texto: >-
      Cambia los montos por las cantidades de driver: material, driver de
      las contratas y total. «Avance» muestra el estado de cada módulo.
    imagen: screenshots/03-medida-cantidad.png
  - seccion: Línea base
    texto: >-
      La versión 1 del piso 05 aprobada y la versión 2 en preparación
      (`tools/planner_demo_baseline.py`).
  - titulo: Resumen por etapa
    ruta: Planificación de obra ▸ Obras ▸ Planes de recursos ▸ plan ▸ Resumen por etapa
    texto: >-
      Material, contrata, planificado, presupuesto, diferencia, comprometido,
      real y saldo por etapa. En la versión aprobada el presupuesto es igual
      a lo planificado: S/ 8,944.44.
    puntos:
      - "Botones «Presupuesto» y «Versiones» arriba; «Nueva versión» y «Cerrar» en la cabecera."
      - "Comprometido y real se llenan con las asignaciones, contratas y producción."
    imagen: screenshots/04-resumen-etapa.png
  - titulo: Presupuesto analítico
    ruta: Plan ▸ Presupuesto
    texto: >-
      Lo crea la aprobación: una línea por combinación de cuentas analíticas
      de las líneas del plan (aquí, la cuenta de la obra).
    imagen: screenshots/05-presupuesto.png
  - titulo: Nueva versión
    ruta: Plan aprobado ▸ Nueva versión
    texto: >-
      Motivo obligatorio; copia todo o solo saldos. La versión nueva queda en
      borrador y la vigente se sigue usando.
    imagen: screenshots/06-nueva-version.png
  - titulo: Versión en preparación
    ruta: Plan v2 ▸ Resumen por etapa
    texto: >-
      Compara contra el presupuesto vigente: la melamina blanca a costo
      ponderado baja Producción en S/ 819.06. La rejilla de ventilación,
      sin etapa, aparece en rojo.
    imagen: screenshots/07-version-borrador.png
  - titulo: Aprobación bloqueada
    ruta: Plan v2 ▸ Solicitar aprobación
    texto: >-
      El mensaje lista las líneas sin etapa y sin costo para corregirlas.
    imagen: screenshots/08-aprobacion-bloqueada.png
  - titulo: Aplicar costo
    ruta: Plan ▸ Aplicar costo
    texto: >-
      Sugiere el último precio y los ponderados de 3 y 6 meses de las compras
      confirmadas; el planificador escribe el costo y la base queda en las
      líneas.
    imagen: screenshots/09-aplicar-costo.png
  - titulo: Análisis del plan
    ruta: Planificación de obra ▸ Obras ▸ Análisis del plan
    texto: >-
      Pivote y gráfico de las líneas de los planes vigentes por etapa y tipo
      de recurso.
    imagen: screenshots/10-analisis.png
  - seccion: Asignaciones y compras
    texto: >-
      Compra masiva, requerimientos y una OF generados desde la versión
      vigente del piso 05 (`tools/planner_demo_supply.py`).
  - titulo: Plan en ejecución
    ruta: Planificación de obra ▸ Obras ▸ Planes de recursos ▸ plan vigente
    texto: >-
      El primer documento generado pasa el plan a «En ejecución». En la
      cabecera, «Compra masiva», «Requerimiento de obra» y «Orden de
      fabricación»; arriba, el botón «Asignaciones».
    puntos:
      - "Los mismos asistentes salen de la barra del árbol de recursos con la selección marcada."
      - "El resumen por etapa ya muestra comprometido y real."
    imagen: screenshots/11-plan-en-ejecucion.png
  - titulo: Compra masiva
    ruta: Plan ▸ Compra masiva (o Árbol de recursos ▸ Compra masiva)
    texto: >-
      Necesidad, libre en el central, lo que ya viene en compras y a comprar
      por producto. Con analítica compra toda la necesidad con la cuenta de
      la obra; en stock general descuenta lo libre y lo que ya viene.
    puntos:
      - "Necesidad: lo planificado menos lo ya comprado o pedido por la obra."
      - "Planchas y demás unidades se redondean a entero hacia arriba: 17.66 planchas de melamina blanca → 18."
    imagen: screenshots/12-compra-masiva.png
  - titulo: Requerimiento de obra desde el plan
    ruta: Plan ▸ Requerimiento de obra
    texto: >-
      Planificado, pedido, saldo, disponible en el central y a pedir por
      material, agrupado por ambiente, departamento o piso. Crea el
      requerimiento en borrador con una asignación por cada línea del plan.
    imagen: screenshots/13-requerimiento-desde-plan.png
  - titulo: Asignaciones del plan
    ruta: Plan ▸ Asignaciones
    texto: >-
      Qué parte de cada documento corresponde a cada línea, lo ejecutado y
      el estado, que sigue al documento.
    imagen: screenshots/14-asignaciones.png
  - titulo: Control de plan en el requerimiento
    ruta: Planificación de obra ▸ Abastecimiento ▸ Requerimientos de obra
    texto: >-
      Columnas «Saldo del plan» y «Control» en las líneas. Aquí se piden 20
      tornillos del Dpto 501 que ya se pidieron con el requerimiento del
      piso: excede 20, con la política «pedir aprobación» se justificó y el
      requerimiento espera también la revisión de la jefatura.
    imagen: screenshots/15-control-de-plan.png
  - titulo: Orden de fabricación desde el plan
    ruta: Plan ▸ Orden de fabricación ▸ OF ▸ Plan de obra
    texto: >-
      El producto de la tipología por los ambientes incluidos, con los
      componentes de la BOM. Las asignaciones van a las líneas de producción
      y armado de esos ambientes; al confirmar se controla su saldo.
    imagen: screenshots/16-of-desde-plan.png

  - seccion: Contratas y liquidación semanal
    texto: >-
      Leandro con la instalación del piso 05, el avance del ejemplo de la
      especificación y su liquidación del 29/10 al 04/11
      (`tools/planner_demo_contracts.py`).
  - titulo: Asignar contrata
    ruta: Plan ▸ Asignar contrata (o Árbol de recursos ▸ Asignar contrata)
    texto: >-
      Selección, etapa, actividades y contrata. Cada actividad con su driver
      presupuestado, la tarifa vigente (obra y contrata › obra › contrata ›
      base), el monto y la retención. Para la instalación del piso 05 a
      Leandro: 8 actividades, 64 líneas, S/ 941.17 y neto S/ 847.05; en la
      imagen, el armado del piso a Gonza.
    puntos:
      - "Indica a qué OC de servicio se suma el alcance; si la contrata no tiene una abierta en la obra, se crea en borrador."
      - "Las líneas que ya tienen otra contrata no se reasignan y se avisa."
    imagen: screenshots/17-asignar-contrata.png
  - titulo: OC de servicio
    ruta: Contratas ▸ OC de servicio
    texto: >-
      Una por contrata y obra, con una línea por actividad y tarifa y su
      retención. Compras la confirma; cada liquidación aprobada recibe en
      ella lo de la semana.
    imagen: screenshots/18-oc-de-servicio.png
  - titulo: Registrar avance
    ruta: Avance ▸ Registrar avance (o el plan, el árbol o la tarea)
    texto: >-
      Elija la actividad: una fila por módulo o ambiente donde cuelga, con
      presupuestado, acumulado, por validar y saldo. Propone el saldo y no
      acepta más que el saldo más la tolerancia del plan. Las fotos son
      obligatorias.
    imagen: screenshots/19-registrar-avance.png
  - titulo: Avances por validar
    ruta: Avance ▸ Avances por validar
    texto: >-
      Agrupados por obra, contrata y semana de liquidación. «Validar» suma al
      acumulado; «Rechazar» pide el motivo. La columna «Liquidación prevista»
      dice en qué jueves se paga cada avance.
    imagen: screenshots/20-avances-por-validar.png
  - titulo: Liquidación semanal
    ruta: Contratas ▸ Liquidaciones semanales
    texto: >-
      Periodo de jueves a miércoles, liquidación el jueves y pago el sábado.
      Cada línea es el driver de la semana por la tarifa de la OC; el
      acumulado y el avance son informativos. Ejemplo: bruto S/ 380.88,
      retención 10 % S/ 38.09, neto S/ 342.79.
    puntos:
      - "Presentar › Validar (supervisor) › aprobación de la jefatura; «Devolver a la contrata» pide el motivo."
      - "Al aprobar recibe en la OC (nunca más de lo ordenado) y crea la factura con vencimiento el sábado."
    imagen: screenshots/21-liquidacion-semanal.png
  - titulo: Recursos y avance del ambiente
    ruta: Tarea del ambiente o módulo ▸ Recursos y avance
    texto: >-
      Las líneas del plan vigente del nivel con su contrata, presupuestado,
      acumulado, monto y avance, el avance valorizado y los avances
      reportados. «Registrar avance» abre el asistente con este nivel.
    imagen: screenshots/22-recursos-y-avance.png
  - titulo: Árbol con la medida «Avance»
    ruta: Árbol de recursos ▸ Avance
    texto: >-
      El avance valorizado de cada nivel: Σ ejecutado × costo entre Σ
      planificado de las contratas y el personal propio. Los módulos muestran
      su estado (Producido, Instalado).
    imagen: screenshots/23-arbol-avance.png

campos_intro: >-
  Los campos de los modelos nuevos y de los que el módulo amplía.
campos:
  - grupo: Tarea (nivel de obra)
    ruta: Proyecto ▸ Tarea ▸ Obra
    campos:
      - [Nivel de obra, "Piso, departamento, ambiente o módulo.", Vacío, "Cada nivel cuelga del inmediato superior"]
      - ["Piso, departamento, ambiente", Ancestros por nivel., Calculado, Base de la acumulación]
      - [Tipología, Plantilla del ambiente., Vacío, De ella sale el plan]
      - ["Código, tipo, ancho y grupo ML del módulo", Del ETO o de la tipología., Al generar, El ancho baja la instalación por ML al módulo]
      - [Estado del módulo, "Planificado, en producción, producido, en obra, instalado, entregado.", Planificado, Con seguimiento]
      - [Monto planificado, Suma del plan vigente del nivel y de lo que tiene debajo., Calculado, "—"]
  - grupo: Tipología
    ruta: Planificación de obra ▸ Configuración ▸ Tipologías
    campos:
      - ["Obra, familia, código", Identificación única por obra y familia., "—", "—"]
      - ["Módulos", "Código, tipo, ancho, grupo ML, actividad de armado y BOM opcional.", "—", "Uno por módulo de la plantilla"]
      - [Actividades por ambiente, Actividad y cantidad de driver por ambiente., "—", "Puertas, entarugado, instalación…"]
      - ["ML bajo y alto", De los anchos o escritos a mano., Calculado, "—"]
      - [Lista de materiales, Componentes con su etapa de consumo., "—", Materiales del plan]
  - grupo: Actividad y tarifa
    ruta: Planificación de obra ▸ Configuración
    campos:
      - ["Código, etapa, unidad del driver", "Und, ML o módulo.", "—", "—"]
      - ["Por módulo / por metro lineal", Cómo se mide la actividad., Desmarcado, "No ambos a la vez"]
      - [Tarifa base, Precio si no hay tarifa., "0", "—"]
      - ["Tarifa: obra, contrata, vigencia, retención", Precio por combinación., "—", Sin superposición]
