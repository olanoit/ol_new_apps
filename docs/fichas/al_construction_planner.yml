funcionalidades:
  - grupo: Jerarquía y catálogo
    items:
      - "Niveles de obra en las tareas con validación de la jerarquía y ancestros almacenados."
      - "Tipologías con módulos, actividades por ambiente y lista de materiales."
      - "Actividades de mano de obra con driver por unidad, ML o módulo."
      - "Tarifas por obra y contrata con prioridad y vigencias sin superposición."
      - "Etapa de consumo en las líneas de la lista de materiales."
  - grupo: Plan de recursos
    items:
      - "Plan por obra con versiones, estados y políticas de exceso y anticipación."
      - "Generación desde las tipologías con vista previa y advertencias."
      - "Regenerar sin duplicar módulos y conservando costos y líneas manuales."
      - "Monto planificado de cada nivel por sus ancestros almacenados."
      - "Analítica de la obra en cada línea."
  - grupo: Árbol de recursos
    items:
      - "Árbol OWL obra › piso › departamento › ambiente › módulo cargado por niveles."
      - "Módulos, ML, material, contrata y total de cada nivel acumulados en el servidor."
      - "Selección en cascada con estado parcial y barra de resumen."
      - "Panel de recursos acumulados de la selección con su contrata."
      - "Filtros por etapa, tipo de recurso, estado del módulo y contrata; medida en soles, cantidad o avance."
  - grupo: Línea base
    items:
      - "«Solicitar aprobación» bloqueada con líneas sin etapa, sin costo o contratas sin actividad, con la lista."
      - "Aprobación por niveles con reglas por monto (OCA base_tier_validation)."
      - "Presupuesto analítico por combinación de cuentas al aprobar; líneas congeladas."
      - "Nueva versión con motivo, copiando todo o solo saldos; la anterior pasa a «Reemplazado»."
      - "Aplicar costo con último precio y ponderados de 3 y 6 meses de las compras."
      - "Resumen por etapa, análisis en pivote y gráfico, y cierre del plan."
  - grupo: Asignaciones y compras
    items:
      - "Asignaciones de cada documento a las líneas del plan, con lo hecho repartido por fecha de necesidad y el estado del documento."
      - "Pedido, comprado, despachado, consumido, saldo, comprometido, real y estado de cada línea."
      - "Compra masiva desde la selección, con analítica de la obra o como stock general, redondeada a la unidad de compra."
      - "Requerimiento de obra desde la selección, agrupado por ambiente, departamento o piso."
      - "Saldo del plan y control por línea en el requerimiento de obra; política de exceso al solicitar la aprobación con justificación y revisión adicional."
      - "Orden de fabricación por piso o selección desde la BOM de la tipología, con control al confirmar y consumo al cerrar."
      - "Las asignaciones abiertas pasan a la versión nueva al aprobarla; el plan no se cierra con documentos abiertos."
  - grupo: Contratas
    items:
      - "«Asignar contrata» desde la selección con la tarifa vigente, la retención y la OC de servicio de la contrata en la obra (una por contrata y obra)."
      - "Avance por driver con fotos obligatorias, saldo y tolerancia del plan; validación y rechazo con motivo por el supervisor."
      - "Avances por validar por obra, contrata y semana de liquidación."
      - "Ejecutado, liquidado y avance de cada línea; avance valorizado de cada nivel en el árbol y en la tarea (pestaña «Recursos y avance»)."
      - "Estado del módulo automático: Producido con todo su armado, Instalado con toda su instalación."
  - grupo: Liquidación semanal
    items:
      - "Liquidación por contrata, obra y semana con los avances validados del periodo y los rezagados."
      - "Acción programada diaria en el día de liquidación de cada obra; feriados al día hábil anterior."
      - "Presentar, devolver con motivo, validar y aprobación por niveles de la jefatura."
      - "Recepción en la OC de servicio sin pasar lo ordenado y factura con vencimiento el día de pago; «Pagada» con la factura pagada."
      - "El plan no se cierra con liquidaciones pendientes; los avances no liquidados pasan a la versión nueva."
  - grupo: Seguridad
    items:
      - "Grupos Reporte de avance, Usuario, Planificador y Administrador, y el grupo aparte de ingresos."
      - "Multicompañía en todos los modelos, con reglas por compañía."

