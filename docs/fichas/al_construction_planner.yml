funcionalidades:
  - grupo: Jerarquía y catálogo
    items:
      - "Niveles de obra en las tareas con validación de la jerarquía y ancestros almacenados."
      - "Tipologías con módulos, actividades por ambiente y lista de materiales."
      - "Actividades de mano de obra con driver por unidad, ML o módulo."
      - "Tarifas por obra y contrata con prioridad y vigencias sin superposición."
      - "Etapa de consumo en las líneas de la lista de materiales."
  - grupo: Plan de recursos
    items:
      - "Plan por obra con versiones, estados y políticas de exceso y anticipación."
      - "Generación desde las tipologías con vista previa y advertencias."
      - "Regenerar sin duplicar módulos y conservando costos y líneas manuales."
      - "Monto planificado de cada nivel por sus ancestros almacenados."
      - "Analítica de la obra en cada línea."
  - grupo: Árbol de recursos
    items:
      - "Árbol OWL obra › piso › departamento › ambiente › módulo cargado por niveles."
      - "Módulos, ML, material, contrata y total de cada nivel acumulados en el servidor."
      - "Selección en cascada con estado parcial y barra de resumen."
      - "Panel de recursos acumulados de la selección con su contrata."
      - "Filtros por etapa, tipo de recurso, estado del módulo y contrata; medida en soles, cantidad o avance."
  - grupo: Línea base
    items:
      - "«Solicitar aprobación» bloqueada con líneas sin etapa, sin costo o contratas sin actividad, con la lista."
      - "Aprobación por niveles con reglas por monto (OCA base_tier_validation)."
      - "Presupuesto analítico por combinación de cuentas al aprobar; líneas congeladas."
      - "Nueva versión con motivo, copiando todo o solo saldos; la anterior pasa a «Reemplazado»."
      - "Aplicar costo con último precio y ponderados de 3 y 6 meses de las compras."
      - "Resumen por etapa, análisis en pivote y gráfico, y cierre del plan."
  - grupo: Asignaciones y compras
    items:
      - "Asignaciones de cada documento a las líneas del plan, con lo hecho repartido por fecha de necesidad y el estado del documento."
      - "Pedido, comprado, despachado, consumido, saldo, comprometido, real y estado de cada línea."
      - "Compra masiva desde la selección, con analítica de la obra o como stock general, redondeada a la unidad de compra."
      - "Requerimiento de obra desde la selección, agrupado por ambiente, departamento o piso."
      - "Saldo del plan y control por línea en el requerimiento de obra; política de exceso al solicitar la aprobación con justificación y revisión adicional."
      - "Orden de fabricación por piso o selección desde la BOM de la tipología, con control al confirmar y consumo al cerrar."
      - "Las asignaciones abiertas pasan a la versión nueva al aprobarla; el plan no se cierra con documentos abiertos."
  - grupo: Contratas
    items:
      - "«Asignar contrata» desde la selección con la tarifa vigente, la retención y la OC de servicio de la contrata en la obra (una por contrata y obra)."
      - "Avance por driver con fotos obligatorias, saldo y tolerancia del plan; validación y rechazo con motivo por el supervisor."
      - "Avances por validar por obra, contrata y semana de liquidación."
      - "Ejecutado, liquidado y avance de cada línea; avance valorizado de cada nivel en el árbol y en la tarea (pestaña «Recursos y avance»)."
      - "Estado del módulo automático: Producido con todo su armado, Instalado con toda su instalación."
  - grupo: Liquidación semanal
    items:
      - "Liquidación por contrata, obra y semana con los avances validados del periodo y los rezagados."
      - "Acción programada diaria en el día de liquidación de cada obra; feriados al día hábil anterior."
      - "Presentar, devolver con motivo, validar y aprobación por niveles de la jefatura."
      - "Recepción en la OC de servicio sin pasar lo ordenado y factura con vencimiento el día de pago; «Pagada» con la factura pagada."
      - "El plan no se cierra con liquidaciones pendientes; los avances no liquidados pasan a la versión nueva."
  - grupo: Control y personal propio
    items:
      - "Estado de la línea y montos de control guardados: se filtran y agrupan, con acción programada horaria de respaldo."
      - "Análisis de control (P-13) en la pestaña del plan y en pivote y gráfico por etapa, tipo de recurso, contrata o producto."
      - "OC con analítica de la obra contrastada al confirmar con el presupuesto analítico de la combinación (avisar, pedir aprobación a la jefatura o bloquear)."
      - "«Asignar cuadrilla»: turnos por obrero y semana con la tarea y la línea; horas de la hoja de horas como ejecutado y real, turnos sin horas como comprometido."
      - "«Cambiar fechas»: desplaza o fija la fecha de la selección por etapas y avisa a Logística de los requerimientos y OC desfasados."
      - "Revertir un avance validado baja el estado del módulo a lo que justifica el avance que queda."
  - grupo: Cronograma con recursos
    items:
      - "Etapas de cada ambiente con fechas, creadas al generar el plan (y con «Crear etapas del cronograma» en planes ya generados)."
      - "Gantt de proyectos de la suite con las etapas como filas hijas del ambiente y sus vínculos de precedencia; monto, avance, contrata, estado del módulo y alertas en la rejilla."
      - "Casillas con selección en cascada, panel con los recursos de la selección y botones de los asistentes W-02 a W-08."
      - "Arrastrar una etapa desplaza la necesidad de sus líneas y avisa a Logística, con un solo aviso por documento aunque se muevan varias etapas."
      - "Carga semanal por contrata y etapa debajo del diagrama, filtrable por etapa."
  - grupo: Productos, precios y abastecimiento
    items:
      - "Vista de precios de compra: una fila por línea de OC confirmada en la unidad del producto y en soles al tipo de cambio de su fecha."
      - "Precios de compra del producto (P-16) con ventana editable, estadísticos, medias móviles, resumen por semana, mes y proveedor y gráfico con atípicas."
      - "«Aplicar costo» con media móvil de 4 semanas además de ponderados, último precio y manual."
      - "Crear producto desde el plan (W-11) con código de familia sin colisiones, parecidos por nombre, marca del plan y actividad a Logística."
      - "Abastecimiento de la obra (P-18) con necesidad semanal por etapa, stock, OC abiertas, cantidad a comprar, alerta de precio y compra masiva de lo marcado."
      - "Alertas de abastecimiento reutilizables: precio sobre el plan, necesidad sin OC a menos de una semana y producto sin proveedor habitual."
  - grupo: Ruta del ingreso
    items:
      - "Calendario e ingresos por obra (P-21) con valores por defecto en Ajustes y tabla de valorizaciones previstas con días no hábiles corridos al siguiente día hábil."
      - "Entrega semanal (P-19) creada por la acción programada del día de liquidación, con avance valorizado de la partida, ingreso, costo y margen devengados."
      - "Valorización (P-20) con W-13, envío con PDF, observaciones del cliente, conformidad obligatoria (W-14) y lo no confirmado por valorizar."
      - "Factura desde la OV con la cantidad entregada al % acumulado confirmado y control: no se publica por encima de lo confirmado."
      - "Fondo de garantía y amortización del adelanto en la valorización; como líneas negativas de la factura solo si se configuran sus cuentas."
  - grupo: Cronograma valorizado e inicio
    items:
      - "Cronograma valorizado (P-22) por obra y semana, plan y real: costo, ingreso devengado, margen, valorización, facturado y cobrado con la curva S y el fondo de garantía al cierre."
      - "Exportación a Excel (plan y real), pivote y gráfico nativos; recálculo al abrir y acción programada diaria."
      - "Inicio (P-01) como acción por defecto: obras con planificado, saldo, avance, próximo hito y estado."
      - "Pendientes de hoy por grupo con su lista filtrada: avances y liquidaciones por validar, entregas por confirmar, valorizaciones por facturar, alertas de abastecimiento, etapas sin contrata y líneas sin costo."
      - "Supervisores de obra en el proyecto; menú Reportes y Cobranza de la obra."
  - grupo: Seguridad
    items:
      - "Grupos Reporte de avance, Usuario, Planificador y Administrador, y el grupo aparte de ingresos."
      - "Multicompañía en todos los modelos, con reglas por compañía."

