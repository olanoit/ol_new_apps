      - [Destino de cuenta clase 6 a 9, Cuentas que empiezan por 6, Cuentas que empiezan por 9, "La de Ajustes (791) o la propia: 72, 78 o 79"]
      - [Destino de cuenta clase 9 a 6, Cuentas que empiezan por 9, Cuentas que empiezan por 6, "La de Ajustes (791) o la propia: 72, 78 o 79"]
    nota: Las cuentas de la clase de origen con Desactivar destinos quedan fuera del reparto.

configuracion:
  - Instale el módulo desde Aplicaciones (requiere la localización peruana).
  - "En **Perú ▸ Configuración ▸ Ajustes ▸ Asientos de destino** elija el sentido, el diario de destinos y la cuenta de carga por defecto (791)."
  - "Cree las cuentas del Elemento 9 que necesite (la localización no las trae) e indique en cada centro de costo su **Cuenta de destino**."
  - "Para lo que no tenga centro de costo, configure el reparto en las cuentas de la clase de origen."
  - "Compruebe el reparto en **Perú ▸ Configuración ▸ Cuentas de la localización ▸ Destinos por cuenta**: cada grupo debe sumar 100 %."
requisitos_nota: >-
  Funciona en Community y Enterprise. Solo actúa sobre comprobantes de
  compañías con país Perú.

faq:
  - pregunta: Al publicar dice que parte del importe no tiene destino
    respuesta: >-
      El gasto tiene una parte con centro de costo con destino y otra sin él, y
      la cuenta no tiene reparto propio. Asigne cuenta de destino a ese centro
      de costo o configure el reparto de la cuenta.
  - pregunta: Al publicar pide configurar el diario de destinos
    respuesta: >-
      Elija el diario en **Perú ▸ Configuración ▸ Ajustes ▸ Asientos de
      destino**. El módulo ya no crea ni busca un diario por su cuenta.
  - pregunta: No veo la pestaña Configuración de destinos en la cuenta
    respuesta: >-
      Solo aparece en las cuentas de la clase de origen: clase 6 con el sentido
      6 → 9, clase 9 con el sentido 9 → 6. Revise el sentido en Ajustes.
  - pregunta: ¿Qué pasa si corrijo el comprobante?
    respuesta: >-
      Al pasarlo a borrador, el asiento de destino también vuelve a borrador;
      al publicarlo de nuevo, se reemplazan sus líneas con el reparto vigente y
      se publica otra vez.
  - pregunta: ¿Puedo cambiar los porcentajes a mitad de año?
    respuesta: >-
      Sí. El nuevo reparto se aplica a lo que se publique desde entonces; para
      recalcular lo ya publicado use **Destinos del periodo ▸ Regenerar
      destinos** con el rango de fechas.
  - pregunta: ¿Cómo encuentro el asiento de destino de un asiento manual?
    respuesta: >-
      Busque en el diario de destinos de Ajustes la referencia «Destino:»
      seguida del número del asiento. El enlace directo solo se muestra en
      facturas y notas.

