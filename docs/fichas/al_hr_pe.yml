ejemplos_intro: Cifras de la planilla DEMO de julio 2026 (estructura BASE, RMV S/ 1 130).
ejemplos:
  - titulo: Reglas principales de la estructura BASE
    texto: >-
      Fórmulas tal como están en las reglas del módulo. `wage` es la
      remuneración de la versión; los importes de gratificación, CTS,
      comisiones, adelantos o préstamos llegan como inputs de la boleta.
    tabla:
      - [Código, Regla, Código SUNAT, Cálculo]
      - [BAS, Básico, "0121", "Remuneración mensual; proporcional a los días (wage ÷ 30) si el mes no está completo"]
      - [FAL / TAR, Faltas / Tardanzas, "0705 / 0704", "Días × wage ÷ 30 / horas × wage ÷ 30 ÷ 8"]
      - [AF, Asignación familiar, "0201", "Asignación de los parámetros si la boleta tiene derecho; cero con 30 días de vacaciones o subsidio"]
      - [HE25 / HE35 / HE100, Horas extras, "0105 / 0106 / 0107", "(wage + AF) ÷ 30 ÷ 8 × 1,25 / 1,35 / 2 × horas"]
      - [TINGR, Total ingresos, "—", Suma de los ingresos del mes]
      - [ONP, ONP, "0607", "% fondo × ingresos afectos ONP, si la afiliación es ONP"]
      - [A_JUB, AFP aporte al fondo, "0608", "% fondo × ingresos afectos AFP"]
      - [COMFI / COMMIX, AFP comisión, "0601", "% comisión × ingresos afectos AFP, según el tipo de comisión"]
      - [SEGI, AFP prima de seguros, "0606", "% prima × ingresos afectos AFP hasta el tope; cero si es mayor de 65"]
      - [TAT, Total aportes del trabajador, "—", "ONP + A_JUB + COMFI + COMMIX + SEGI + QUINTA"]
      - [TDESN, Total descuentos al neto, "—", "Adelantos, retención judicial, préstamos y descuentos en BBSS"]
      - [NETO, Neto a pagar, "—", "TINGR − (TAT + TDESN)"]
      - [ESSALUD, EsSalud, "0804", "9 % de los ingresos afectos, con mínimo sobre la RMV; con EPS, la tasa del seguro"]
      - [SVLEY, Seguro Vida Ley, "0803", "Tasa × ingresos afectos, o monto fijo, del aporte SVLEY de la versión"]
    nota: "Ingresos afectos AFP (AAFP): básico del mes, AF, horas extras, bonificaciones regulares, subsidios, vacaciones y comisiones; vale cero con excepción de jornada I u O."

  - titulo: Tres sistemas de pensiones en la misma planilla
    texto: >-
      Los importes salen de las líneas de cada boleta. La asignación familiar
      (10 % de la RMV) solo la recibe la trabajadora con hijos menores.
    tabla:
      - [Concepto, "Salazar (AFP INTEGRA, flujo)", "Huamán (ONP)", "Rivas (AFP PRIMA, mixta)"]
      - [Básico, "S/ 2.800,00", "S/ 1.800,00", "S/ 4.500,00"]
      - [Asignación familiar, "S/ 113,00", "—", "—"]
      - [Total ingresos, "S/ 2.913,00", "S/ 1.800,00", "S/ 4.500,00"]
      - ["Aporte al fondo 10 % / ONP 13 %", "S/ 291,30", "S/ 234,00", "S/ 450,00"]
      - [Comisión AFP, "S/ 45,15 (1,55 %)", "—", "S/ 0,00 (0 %)"]
      - ["Prima de seguro 1,70 %", "S/ 49,52", "—", "S/ 76,50"]
      - [Total aportes del trabajador, "S/ 385,97", "S/ 234,00", "S/ 526,50"]
      - [Neto a pagar, "S/ 2.527,03", "S/ 1.566,00", "S/ 3.973,50"]
      - [EsSalud 9 % (empleador), "S/ 262,17", "S/ 162,00", "S/ 405,00"]
    nota: "Comprobación: 2.913,00 − 385,97 = 2.527,03. La prima se calcula sobre la remuneración hasta el tope asegurable de S/ 11.981,55."

  - titulo: ¿Quién da asignación familiar?
    texto: >-
      El derecho se evalúa en la fecha de fin de cada boleta, así que se
      pierde solo el mes en que el hijo cumple la edad límite.
    tabla:
      - [Derechohabiente, Edad, "¿Estudia?", "¿Da asignación?", Motivo]
      - [Hija (Camila), "10", "No", "Sí", Menor de 18 años]
      - [Hijo (Mateo), "5", "No", "Sí", Menor de 18 años]
      - [Cónyuge (Martín), "37", "—", "No", Solo cuentan los hijos]
      - [Hijo de 20 años, "20", "Sí", "Sí", Hasta 24 si cursa estudios superiores]
      - [Hijo de 20 años, "20", "No", "No", Superó los 18 sin estudios]
    nota: Si el trabajador aún no tiene derechohabientes registrados, se usa el número de hijos de la ficha para no cortar una asignación que ya cobraba.

  - titulo: Archivos que produce el módulo
    tabla:
      - [Archivo, Contenido, Dónde se genera]
      - ["0601202607<RUC>.rem", "Una línea por trabajador y código SUNAT: documento, concepto, devengado y pagado", Lote ▸ PLAME (.rem)]
      - ["0601202607<RUC>.jor", Horas ordinarias y de sobretiempo, Lote ▸ PLAME horas (.jor)]
      - ["0601202607<RUC>.snl", Días de suspensión por tipo (T21), Lote ▸ PLAME suspensiones (.snl)]
      - ["0601202607<RUC>.toc", Condición de los trabajadores con Seguro Vida Ley, Lote ▸ PLAME condiciones (.toc)]
      - [AFPNet .xlsx, "Una fila por afiliado AFP: CUSPP, documento, nombres, indicadores y remuneración asegurable", Lote ▸ AFPNet (.xlsx)]
      - ["RP_<RUC>.ide / .tra / .per", "T-Registro: E04 datos personales, E05 datos laborales, E11 periodos", Empleados ▸ Acciones]
      - ["RP_<RUC>.est / .edu / .cta", "E17 establecimientos, E29 estudios, E30 cuenta de abono (si aplican)", Empleados ▸ Acciones]
      - ["derechohabientes_<RUC>_<fecha>.xlsx", Hojas Altas y Bajas para la macro de SUNAT, Derechohabientes ▸ Exportar para el T-Registro]
    nota: "Formato del T-Registro según el manual del PVS: separador | también al final de la línea, fechas dd/mm/aaaa, texto sin tildes y codificación latin-1."

  - titulo: Línea del alta en la E11
    texto: >-
      El alta declara cuatro renglones por trabajador —vínculo, tipo de
      trabajador, régimen de salud y régimen pensionario— con la fecha de
      inicio del contrato; la baja, uno solo con la fecha de cese y el motivo.
    tabla:
      - [Tipo de registro, Qué declara, De dónde sale el código]
      - ["1", Vínculo laboral, "—"]
      - ["2", Tipo de trabajador, Tipo de trabajador (T08) de la versión]
      - ["3", Régimen de salud, Código T-Registro (T32) del seguro social y código EPS (T14)]
      - ["4", Régimen pensionario, Código T-Registro (T11) de la afiliación]

configuracion_intro: Puesta en marcha recomendada, en este orden.
configuracion:
  - Instale el módulo (requiere Nómina de Odoo Enterprise y la localización peruana).
  - "Cree los **Parámetros principales** de cada compañía: RMV, reglas de referencia y la pestaña **Boleta**."
  - Revise la **UIT** del año, las tasas de las **Afiliaciones (AFP/ONP)**, los **Seguros sociales** y los **Aportes**.
  - "Genere los **periodos** del ejercicio (con semanas si hay regímenes semanales)."
  - "Ponga el **código de establecimiento** en los lugares de trabajo y la **Entidad SUNAT (T36)** en los bancos."
  - "Complete en cada empleado la identificación PLAME, el domicilio y los datos del **T-Registro**, y registre sus **derechohabientes**."
  - "Asigne la estructura **BASE** (o la suya) a las boletas y calcule el primer lote."
requisitos_nota: >-
  Requiere Odoo 19 Enterprise (Nómina). La firma y el envío de los archivos a
  SUNAT se hacen en sus propios aplicativos (PDT PLAME, PVS T-Registro y
  AFPNet).

faq:
  - pregunta: ¿Dónde se registra la AFP, el CUSPP o el seguro social del trabajador?
    respuesta: >-
      Son campos de la versión del empleado. Se ven y se editan (edición
      múltiple) como columnas en Nómina ▸ Empleados ▸ Registros de los
      empleados, y se cargan de forma masiva con el importador «Datos PE de
      versiones» del módulo de importadores Excel.
  - pregunta: Cambió la tasa de una AFP, ¿se recalculan las boletas anteriores?
    respuesta: >-
      No. Cada boleta guarda en la pestaña Perú las tasas con las que se
      calculó. Las boletas nuevas toman la tasa vigente de la afiliación.
  - pregunta: ¿Por qué el T-Registro no genera el archivo?
    respuesta: >-
      Porque faltan datos que SUNAT rechazaría. El aviso lista, por trabajador,
      qué completar: documento, sexo, catálogos obligatorios, establecimiento,
      estudios o cuenta de abono.
  - pregunta: ¿Se generan las estructuras 13 y 24 de derechohabientes?
    respuesta: >-
      No hay especificación pública campo a campo de esas estructuras. El
      módulo genera el Excel con las columnas del registro, que es lo que
      consume la macro oficial de carga masiva.
  - pregunta: ¿Puedo tener regímenes semanales, como construcción civil?
    respuesta: >-
      Sí. Genere los periodos con semanas: cada semana cuelga de su mes, la
      boleta semanal toma la semana como periodo y el lote semanal muestra el
      mes como Periodo PLAME.
  - pregunta: ¿Dar de baja a un derechohabiente lo borra?
    respuesta: >-
      No. Pone la fecha de fin del vínculo y pide el motivo; el registro se
      conserva y desde el día siguiente figura «De baja».

