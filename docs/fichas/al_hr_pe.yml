titulo: Planillas Perú — Núcleo
subtitulo: >-
  La norma laboral peruana debajo del motor de nómina de Odoo 19: ficha
  laboral con los códigos del T-Registro, AFP/ONP y EsSalud, derechohabientes
  con asignación familiar por edad, reglas salariales con su código SUNAT y
  los archivos PLAME, AFPNet y T-Registro listos para subir.
categoria: Localización Perú · Planillas
etiquetas: [PLAME, T-Registro, AFP / ONP, EsSalud, Asignación familiar, Derechohabientes, Multicompañía]
portada: screenshots/21-boleta-peru.png

destacados_intro: >-
  Es la base de la suite de planillas: los demás módulos (beneficios,
  asistencia, contabilidad, reportes, importadores) leen lo que se configura
  aquí.
destacados:
  - icono: "T"
    titulo: Ficha laboral T-Registro
    texto: >-
      Régimen laboral (T33), tipo de contrato (T12), ocupación (T30), situación
      educativa (T09), domicilio estructurado, establecimientos, estudios y
      cuenta de abono: los datos de las estructuras E04, E05, E11, E17, E29 y
      E30, en la propia ficha del empleado.
  - icono: "%"
    titulo: AFP, ONP y EsSalud
    texto: >-
      Afiliaciones con aporte al fondo, comisión sobre flujo o mixta, prima de
      seguro y tope asegurable; seguros sociales EsSalud (9 %) y EPS con su tasa.
  - icono: "AF"
    titulo: Asignación familiar por edad
    texto: >-
      El derecho sale de los hijos registrados: menores de 18 años, o hasta 24
      si cursan estudios superiores (Ley 25129). Caduca solo el día que el hijo
      cumple la edad.
  - icono: "📷"
    titulo: Snapshot en la boleta
    texto: >-
      Al calcular, la boleta guarda la RMV, la asignación familiar y las tasas
      AFP que usó: recalcular una boleta antigua no la contamina con las tasas
      de hoy.
  - icono: "601"
    titulo: PLAME y AFPNet
    texto: >-
      Desde el lote de nóminas: archivos .rem, .jor, .snl y .toc con el nombre
      oficial 0601AAAAMM<RUC> y la plantilla XLSX de AFPNet, guardados como
      adjuntos del lote.
  - icono: "✓"
    titulo: Carga masiva validada
    texto: >-
      El ZIP del T-Registro (.ide, .tra, .per y, si aplican, .est, .edu, .cta)
      se genera solo después de revisar lo que el PVS de SUNAT rechazaría.

contexto:
  titulo: El problema que resuelve
  texto: >-
    Odoo trae un motor de nómina, pero no la norma peruana: ni los catálogos
    del Anexo 2 de la Planilla Electrónica, ni las tasas de AFP y ONP, ni la
    asignación familiar, ni los formatos que exige SUNAT para declarar.


    Este módulo añade todo eso sobre `hr.version` —que en Odoo 19 absorbió al
    contrato— sin escribir códigos dentro de la lógica: qué work entry es un
    día laborado, qué categoría de regla es un ingreso o qué regla da el neto
    se configura en los **Parámetros principales** de cada compañía. Los
    catálogos llegan cargados (tablas T05, T06, T08, T09, T12, T15, T17, T19,
    T20, T21, T24, T27, T30, T33, T34 y T36) y se revisan, no se teclean.
  nota: >-
    **Multicompañía por diseño.** Parámetros, periodos y catálogos propios
    por compañía, reglas de registro y `check_company` en todo el módulo: dos
    empresas con criterios distintos conviven en la misma base.

flujos_intro: >-
  Los cuatro procesos del núcleo, tal como los recorre el código.
flujos:
  - id: alta-tregistro
    titulo: Alta del trabajador y carga masiva del T-Registro
    texto: >-
      Los datos se completan en la ficha y en la versión del empleado; el
      archivo solo se genera cuando no queda nada que SUNAT rechazaría.
    mermaid: |
      flowchart TD
        A[Ficha del empleado:<br/>apellidos, nombres, documento,<br/>sexo y nacimiento] --> B[Domicilio T-Registro<br/>con ubigeo]
        B --> C[Versión: régimen T33, contrato T12,<br/>ocupación T30, T08, T15,<br/>AFP/ONP y seguro social]
        C --> D[Establecimiento con código,<br/>estudios y cuenta de abono]
        D --> E[Lista de empleados ▸ Acciones<br/>T-Registro: generar alta]
        E --> F{¿Falta algún dato<br/>obligatorio?}
        F -- Sí --> G[Aviso con la lista<br/>por trabajador] --> A
        F -- No --> H[ZIP RP_RUC: .ide, .tra, .per<br/>y .est, .edu, .cta si aplican]
        H --> I[Subir al PVS del T-Registro]
    pie: "La baja (Acciones ▸ T-Registro: generar baja) exige fecha de cese y motivo T17 y solo remite el archivo .per."
  - id: planilla-mensual
    titulo: De la boleta a la PLAME
    texto: >-
      El lote lleva su periodo; cada boleta toma sola el periodo más ajustado
      y fotografía los valores con los que calcula.
    mermaid: |
      flowchart TD
        A[Generar periodos del año<br/>código AAAAMM] --> B[Lote de nóminas<br/>con su Periodo]
        B --> C[Boleta: periodo más ajustado<br/>que la contiene]
        C --> D[Snapshot: RMV y<br/>asignación familiar,<br/>tasas AFP/ONP y tope]
        D --> E[Días trabajados:<br/>conceptos PE en cero,<br/>DOM completa el periodo]
        E --> F[Estructura BASE:<br/>64 reglas con código SUNAT]
        F --> G[Totales PLAME por categoría:<br/>aportes, descuentos al neto,<br/>aportes del empleador]
        G --> H[Menú del lote:<br/>.rem, .jor, .snl, .toc, AFPNet]
        H --> I[Adjunto del lote y descarga<br/>0601AAAAMMRUC]
  - id: derechohabientes
    titulo: Derechohabientes y asignación familiar
    texto: >-
      El mismo registro sirve para acreditar al familiar en EsSalud y para
      decidir la asignación familiar de cada boleta.
    mermaid: |
      flowchart TD
        A[Registrar derechohabiente<br/>Situación: Por declarar] --> B{¿El tipo es hijo?}
        B -- No --> C[No da asignación familiar]
        B -- Sí --> D{¿Menor de 18, o menor de 24<br/>y cursa estudios superiores?}
        D -- No --> C
        D -- Sí --> E[Da asignación familiar]
        E --> F[Boleta: derecho a<br/>asignación familiar<br/>a su fecha de fin]
        A --> G[Exportar para el T-Registro]
        G --> H{¿Documentos y fechas<br/>completos?}
        H -- No --> I[Aviso: corregir antes de exportar]
        H -- Sí --> J[Excel con hojas Altas y Bajas]
        J --> K[Altas marcadas como declaradas<br/>Situación: Vigente]
    pie: "Si el trabajador no tiene ningún derechohabiente registrado, se usa el campo nativo «hijos» de la ficha."
  - id: periodos-semanales
    titulo: Periodos semanales dentro del mes
    texto: >-
      Para los regímenes que pagan por semana: las semanas se cortan en el fin
      de mes y cuelgan de su periodo mensual.
    mermaid: |
      flowchart TD
        A[Generar periodos<br/>con semanas] --> B[12 periodos mensuales AAAAMM]
        B --> C[Semanas de lunes a domingo<br/>AAAAMM-S01, S02…]
        C --> D{¿La semana cruza<br/>el fin de mes?}
        D -- Sí --> E[Se corta el último día del mes]
        D -- No --> F[Semana completa]
        E --> G[Boleta semanal:<br/>toma la semana,<br/>el periodo más corto]
        F --> G
        G --> H[Lote semanal:<br/>Periodo PLAME = su mes]

pasos_intro: >-
  Todas las funciones del módulo con los datos de demostración de la compañía
  «Comercial Demo Perú S.A.C.»: tres trabajadores «DEMO FICHA HR1» con AFP
  INTEGRA, ONP y AFP PRIMA y su planilla de julio de 2026.
pasos:
  - seccion: Configuración de la compañía
    texto: Parámetros, valores oficiales y tasas previsionales, una vez por compañía.
  - titulo: Todo lo peruano, agrupado en Configuración ▸ Perú
    ruta: Nómina ▸ Configuración ▸ Perú
    texto: >-
      La configuración de la localización vive en siete grupos: Parámetros,
      Periodos y suspensiones, Seguridad social, Derechohabientes, Catálogos
      SUNAT, Construcción civil y Documentos (estos dos últimos los añaden
      sus módulos).
    imagen: screenshots/01-menu-peru.png
    pie: Los catálogos del T-Registro se listan con su número de tabla.

  - titulo: Parámetros principales de la compañía
    ruta: Nómina ▸ Configuración ▸ Perú ▸ Parámetros ▸ Parámetros principales
    texto: >-
      Un registro por compañía que consulta toda la suite. En **Generales**
      se fija la **R.M.V.** (S/ 1 130 por defecto); la **asignación familiar**
      se calcula sola como el 10 % de la RMV. En **Reglas de referencia** se
      eligen la regla del neto y la de ingresos afectos a AFP. La pestaña
      **Boleta** clasifica los tipos de work entry (días laborados, no
      laborados, subsidiados, sobretiempo y ausencias) y las categorías de
      reglas de ingresos, descuentos y aportes.
    puntos:
      - Si falta el registro de una compañía, los exportadores se niegan a trabajar con un mensaje claro en lugar de calcular mal.
      - Solo puede haber un registro por compañía.
      - Las demás pestañas (beneficios sociales, quinta categoría, contabilidad, tareaje, pagos bancarios) las añaden los otros módulos de la suite.
    imagen: screenshots/02-parametros.png

  - titulo: Valor de la UIT por año
    ruta: Nómina ▸ Configuración ▸ Perú ▸ Parámetros ▸ UIT
    texto: >-
      Lista editable con un valor por año, sin compañía porque es nacional.
      Alimenta la renta de quinta categoría: si el año no está cargado, el
      cálculo se detiene y lo indica.
    imagen: screenshots/03-uit.png

  - titulo: Afiliaciones AFP/ONP con sus tasas
    ruta: Nómina ▸ Configuración ▸ Perú ▸ Seguridad social ▸ Afiliaciones (AFP/ONP)
    texto: >-
      Cada AFP trae su aporte al fondo (10 %), comisión sobre flujo, comisión
      mixta, prima de seguro y remuneración máxima asegurable; la ONP, su
      13 %. Los registros son globales: las tasas las fija la SBS y se
      mantienen una sola vez para todas las compañías.
    imagen: screenshots/04-afiliaciones.png

  - titulo: Ficha de la afiliación
    ruta: Afiliaciones (AFP/ONP) ▸ registro
    texto: >-
      **Tasas (%)** y **Configuración**: la cuenta contable del pasivo es
      propia de cada compañía sobre el mismo registro. Los cambios de tasa
      quedan en el historial; las boletas ya calculadas conservan las suyas.
    imagen: screenshots/05-afiliacion.png

  - titulo: Seguros sociales y aportes del empleador
    ruta: Nómina ▸ Configuración ▸ Perú ▸ Seguridad social ▸ Seguros sociales
    texto: >-
      **Seguros sociales** trae EsSalud (9 %) y EPS (6,75 %). En **Aportes**
      se registran los aportes adicionales del empleador, por tasa o monto
      fijo; viene cargado el Seguro Vida Ley (D. Leg. 688) con tasa 0,0053.
    imagen: screenshots/06-seguros.png

  - seccion: Periodos y suspensiones
    texto: El calendario de declaración y las suspensiones que van a la PLAME.
  - titulo: Generar los periodos del ejercicio
    ruta: Nómina ▸ Configuración ▸ Perú ▸ Periodos y suspensiones ▸ Generar periodos
    texto: >-
      Crea de una vez los doce periodos mensuales con código PLAME `AAAAMM`.
      Con **Generar también semanas** añade las semanas de lunes a domingo
      cortadas en el fin de mes, colgadas de su mes: la suma de las semanas
      es exactamente el mes.
    puntos:
      - Volver a generar un año no duplica periodos existentes.
      - Al terminar abre la lista de periodos de ese año.
    imagen: screenshots/07-generar-periodos.png

  - titulo: Consultar los periodos
    ruta: Nómina ▸ Configuración ▸ Perú ▸ Periodos y suspensiones ▸ Periodos
    texto: >-
      Código, nombre, fechas, periodicidad y periodo mensual del que cuelga
      cada semana. En la ficha de un mes con semanas, la pestaña **Semanas**
      las lista con sus días. La boleta y el lote toman de aquí su
      **Periodo**.
    puntos:
      - El código no se puede repetir dentro de la compañía.
      - Una semana tiene que caber dentro de su mes.
    imagen: screenshots/08-periodos.png

  - titulo: Registrar suspensiones de labores (T21)
    ruta: Nómina ▸ Configuración ▸ Perú ▸ Periodos y suspensiones ▸ Suspensiones de labores
    texto: >-
      Lista editable: periodo, trabajador, tipo de suspensión de la tabla 21,
      fechas y días. Es la fuente del archivo PLAME **.snl** del lote de ese
      periodo. Los 28 tipos (perfecta S.P. e imperfecta S.I.) están en
      **Tipos de suspensión (T21)**.
    puntos:
      - Los días tienen que ser positivos.
    imagen: screenshots/09-suspensiones.png
    pie: "DEMO: la falta no justificada del 10/09/2026 de Salazar, un día con el código 07."

  - seccion: Catálogos SUNAT
    texto: Las tablas del Anexo 2, cargadas con sus códigos.
  - titulo: Regímenes laborales (T33) y familia de cálculo
    ruta: Nómina ▸ Configuración ▸ Perú ▸ Catálogos SUNAT ▸ Regímenes laborales (T33)
    texto: >-
      Los 27 regímenes de SUNAT, cada uno con su **Familia de cálculo**
      (régimen general, pequeña empresa, microempresa, practicante o
      construcción civil). Al elegir el régimen en la versión, la familia se
      copia sola: así los divisores de CTS, gratificación y vacaciones
      siempre son los del régimen declarado.
    puntos:
      - "Todos los catálogos siguen el mismo patrón: registros globales, con posibilidad de uno propio por compañía, y archivables."
    imagen: screenshots/10-regimenes.png

  - titulo: Ocupaciones (T30)
    ruta: Nómina ▸ Configuración ▸ Perú ▸ Catálogos SUNAT ▸ Ocupaciones (T30)
    texto: >-
      4 644 ocupaciones con las columnas **Ejecutivo**, **Empleado** y
      **Obrero** de la tabla, y filtros por cada una. Al cambiar la
      **Categoría ocupacional (T24)** en la ficha, la ocupación elegida se
      borra si SUNAT no la admite para esa categoría.
    puntos:
      - "Además: tipos de vía (T05) y de zona (T06), tipos de trabajador (T08), situación educativa (T09), tipos de contrato (T12), situaciones (T15), motivos de baja (T17), categorías ocupacionales (T24), instituciones educativas (T34, con 5 925 carreras) y entidades financieras (T36)."
    imagen: screenshots/11-ocupaciones.png

  - seccion: Ficha del trabajador
    texto: Los datos que piden la PLAME y el T-Registro, en el empleado y su versión.
  - titulo: Identificación PLAME y domicilio
    ruta: Empleados ▸ ficha del empleado ▸ pestaña Personal
    texto: >-
      **Perú — Identificación (PLAME)** descompone el nombre en apellido
      paterno, materno y nombres (el nombre del empleado se recompone solo),
      con condición de domicilio, tipo y número de documento y cuenta CTS.
      **Domicilio (T-Registro)** guarda dos direcciones estructuradas —vía,
      número, zona y distrito (ubigeo)— e indica cuál usa EsSalud para el
      centro asistencial. **Documento (extranjeros)** pide el país emisor
      (T26) y la nacionalidad (T04).
    puntos:
      - El tipo y número de documento no se pueden repetir dentro de la compañía.
      - "Ambos bloques solo los ve el personal de Recursos Humanos: son datos privados que no forman parte del perfil público del empleado."
      - Si el centro asistencial se asigna por la dirección 2, hay que informarla.
    imagen: screenshots/12-ficha-plame.png

  - titulo: Datos laborales del T-Registro
    ruta: Empleados ▸ ficha del empleado ▸ pestaña Nómina ▸ T-Registro (SUNAT)
    texto: >-
      **Establecimientos (E17)** toma el lugar de trabajo y admite otros;
      **Cuenta de abono (E30)** muestra la cuenta bancaria principal;
      **Estudios concluidos (E29)** lista institución, carrera y año de
      egreso. Debajo, condición laboral, jornada y remuneración, situación
      especial, riesgo y discapacidad: los campos de la E05 con el código
      SUNAT como clave. Todo vive en la versión del empleado, así que los
      cambios quedan en su histórico.
    puntos:
      - Al elegir el **Régimen laboral (T33)** se ajusta el **Régimen laboral (PE)**.
      - "Los estudios solo admiten la situación educativa 11 o 13, y la carrera tiene que ser de la institución elegida."
      - El RUC del trabajador (CAS) debe tener 11 dígitos.
    imagen: screenshots/13-ficha-tregistro.png
    pie: "DEMO: Salazar con la sede 0001, estudios en Cibertec (2014) y cuenta de abono del banco DEMO."

  - titulo: Código de establecimiento del lugar de trabajo
    ruta: Empleados ▸ Configuración ▸ Empleado ▸ Ubicaciones de trabajo
    texto: >-
      **Código de establecimiento (SUNAT)**: los 4 dígitos con los que el
      local está inscrito en el RUC. Solo los lugares con código se declaran
      en la E17.
    imagen: screenshots/14-lugar-trabajo.png

  - titulo: Entidad SUNAT del banco
    ruta: Contactos ▸ Configuración ▸ Bancos
    texto: >-
      **Entidad SUNAT (T36)** es el código de la entidad financiera que viaja
      en la E30. Con él se comprueba además el largo de la cuenta (por
      ejemplo, 13, 14 o 20 dígitos para el código 002) y que un CCI empiece
      por el código de la entidad.
    imagen: screenshots/15-banco.png

  - titulo: Afiliación y datos previsionales por versión
    ruta: Nómina ▸ Empleados ▸ Registros de los empleados
    texto: >-
      El histórico de versiones muestra el régimen y la afiliación AFP/ONP, y
      permite activar como columnas opcionales el tipo de trabajador (T08), la
      situación (T15), el seguro social, el CUSPP, el tipo de comisión AFP y
      los catálogos del T-Registro. La lista admite edición múltiple:
      seleccione las versiones y cambie la columna.
    imagen: screenshots/16-versiones.png
    pie: Tres trabajadores DEMO con AFP INTEGRA (flujo), ONP y AFP PRIMA (mixta).

  - seccion: Derechohabientes
    texto: Familiares con derecho a EsSalud y origen de la asignación familiar.
  - titulo: Registrar los derechohabientes
    ruta: Empleados ▸ ficha del empleado ▸ botón Derechohab.
    texto: >-
      Cónyuge o concubino, hijos menores, hijos mayores incapacitados y madre
      gestante, con el documento que acredita el vínculo. La lista muestra la
      edad y si **da asignación familiar** hoy; la situación pasa de «Por
      declarar» a «Vigente» cuando su alta se incluye en la exportación.
    puntos:
      - "**Exportar para el T-Registro** genera el Excel con las hojas Altas y Bajas que alimenta la macro de carga masiva de SUNAT; sin selección exporta todos."
      - También en Empleados ▸ Empleados ▸ Derechohabientes, con filtros Vigentes, Por declarar y Dan asignación familiar, y agrupación por trabajador, tipo o situación.
    imagen: screenshots/17-derechohabientes.png

  - titulo: Ficha del derechohabiente
    ruta: Derechohabientes ▸ registro
    texto: >-
      Vínculo, identificación, acreditación y asignación familiar. Solo se
      admite un cónyuge o concubino vigente por trabajador; la gestante exige
      fecha probable de parto y no pide documento ni fecha de nacimiento.
      **Cursa estudios superiores** aparece solo para los hijos.
    imagen: screenshots/18-derechohabiente.png

  - titulo: Dar de baja
    ruta: Derechohabiente ▸ Dar de baja
    texto: >-
      Pide confirmación y pone la fecha de hoy como **Fin del vínculo**; con
      esa fecha se vuelve obligatorio el **Motivo de baja** (tabla 20). Desde
      el día siguiente la situación es «De baja» y la fila sale en la hoja
      Bajas de la exportación.
    imagen: screenshots/19-dar-baja.png

  - titulo: Tipos de derechohabiente
    ruta: Nómina ▸ Configuración ▸ Perú ▸ Derechohabientes ▸ Tipos de derechohabiente
    texto: >-
      El vínculo familiar de la tabla 19 con las banderas que usa el cálculo:
      **Es hijo** (da asignación familiar según la edad), **Es cónyuge o
      concubino** (uno vigente), **Hijo por nacer (gestante)** y **Exige
      resolución de incapacidad**. Al lado, **Motivos de baja de
      derechohabientes** (tabla 20).
    imagen: screenshots/20-tipos-derechohabiente.png

  - seccion: Cálculo de la boleta
    texto: Estructura peruana y valores fotografiados en cada boleta.
  - titulo: Pestaña Perú de la boleta
    ruta: Nómina ▸ Recibos de nómina ▸ boleta ▸ pestaña Perú
    texto: >-
      **Snapshot del cálculo** muestra la RMV, la asignación familiar, la
      afiliación y los porcentajes de fondo, comisión (flujo o mixta según la
      versión) y prima, y el tope asegurable; son editables para un caso
      puntual. **Totales PLAME** suma las líneas por categoría: aportes del
      trabajador, descuentos al neto y aportes del empleador. El campo
      **Periodo** se completa solo junto a la estructura.
    imagen: screenshots/21-boleta-peru.png
    pie: "Boleta de julio 2026 con AFP INTEGRA: aportes del trabajador S/ 385,97 y EsSalud S/ 262,17."

  - titulo: La estructura BASE
    ruta: Nómina ▸ Configuración ▸ Salario ▸ Estructuras ▸ BASE
    texto: >-
      64 reglas con su código de la tabla 22 de SUNAT: básico, faltas y
      tardanzas, licencias, asignación familiar, horas extras, bonificaciones,
      gratificación, CTS, ONP, AFP (fondo, comisión y prima), quinta
      categoría, descuentos al neto, EsSalud, Vida Ley y totales. Las
      principales se detallan en la tabla de reglas más abajo.
    puntos:
      - Un input que la boleta no tiene vale cero, así las fórmulas no fallan por un concepto ausente.
      - Todos los tipos de work entry peruanos tienen línea en la boleta aunque valgan cero, y los días de descanso (DOM) completan los días calendario del periodo.
    imagen: screenshots/22-estructura-base.png

  - seccion: Declaraciones
    texto: PLAME, AFPNet y T-Registro.
  - titulo: Exportar PLAME y AFPNet desde el lote
    ruta: Nómina ▸ Recibos de nómina ▸ Periodos de nómina ▸ menú ⋮ del lote
    texto: >-
      El menú del lote ofrece **PLAME (.rem)**, **PLAME horas (.jor)**,
      **PLAME suspensiones (.snl)**, **PLAME condiciones (.toc)** y
      **AFPNet (.xlsx)**. Cada archivo toma las boletas del lote, queda como
      adjunto y se descarga al momento.
    puntos:
      - "El nombre se arma con la fecha de fin del lote y el RUC: 0601AAAAMM<RUC>."
      - "El .snl lee las suspensiones registradas en el **Periodo** del lote; el .jor exige la pestaña Boleta de los parámetros completa; AFPNet usa la regla de ingresos afectos AFP."
      - Se exporta un lote a la vez.
      - Las demás opciones del menú (subsidios, adelantos, asiento, pagos bancarios) las añaden otros módulos de la suite.
    imagen: screenshots/23-lote-plame.png

  - titulo: Generar la carga masiva del T-Registro
    ruta: Empleados ▸ lista ▸ seleccionar ▸ Acciones ▸ T-Registro
    texto: >-
      **T-Registro: generar alta (.ide/.tra/.per)** y **T-Registro: generar
      baja (.per)** producen un ZIP con los archivos `RP_<RUC>` que se suben
      al PVS de SUNAT. Solo las ve el administrador de nómina.
    puntos:
      - Los trabajadores tienen que ser de una sola compañía, y la compañía necesita RUC.
    imagen: screenshots/24-tregistro-acciones.png

  - titulo: Corregir antes de subir
    ruta: "Acciones ▸ T-Registro: generar alta"
    texto: >-
      Antes de generar nada, el módulo comprueba lo que SUNAT rechazaría
      —documento, apellidos, sexo, fecha de nacimiento, inicio del vínculo,
      catálogos obligatorios, establecimiento (E17), estudios si la educación
      es superior (E29) y cuenta de abono si cobra por depósito (E30)— y lo
      lista por trabajador.
    imagen: screenshots/25-tregistro-validacion.png
    pie: Salazar ya está completa; a Huamán y Rivas les falta el sexo, el establecimiento, los estudios y la cuenta.

