          in: header
          name: Authorization
          description: '[Llave privada.](#section/Autenticacion)'
          required: true
        - schema:
            type: string
          in: query
          name: plan_id
          description: ID del plan.
        - schema:
            type: number
          in: query
          name: status
          description: |
            Estado de la suscripción.<br/>1 = Creada<br/>2 = Periodo de prueba<br/>3 = Activa<br/>4 = Cancelada<br/>5 = En cola<br/>6 = Vencida
        - schema:
            type: number
            minLength: 10
            maxLength: 13
          in: query
          name: creation_date_from
          description: Fecha inicial de las suscripciones en UNIX Timestamp.
