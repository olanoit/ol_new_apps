    get:
      tags:
        - Suscripciones
      operationId: listar-suscripciones
      summary: Listar suscripciones
      description: |
        Te permite obtener una serie de suscripciones existentes. De acuerdo a los filtros que uses, las diferentes suscripciones serán ordenadas según a su fecha de creación; siendo el primero, el más reciente.
