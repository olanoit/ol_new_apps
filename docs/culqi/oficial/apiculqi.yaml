          type: integer
          example: 10000
          description: Monto inicial del cargo en céntimos.
        amount_refunded:
          type: integer
          example: 500
          description: Monto devuelto del cargo en céntimos.
        current_amount:
          type: integer
          example: 9900
          description: Monto actual del cargo en céntimos.
        installments:
          type: integer
