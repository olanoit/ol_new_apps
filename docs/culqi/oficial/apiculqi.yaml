    get:
      tags:
        - Cargos
      summary: Listar cargos
      operationId: listar-cargo
      description: Este recurso te permitirá obtener una serie de cargos existentes, de acuerdo a los filtros que uses. Los cargos serán ordenados según la fecha de creación, siendo el primero el más reciente.
      parameters:
        - schema:
            type: string
            example: Bearer sk_test_UTCQSGcXW8bCyU59
          in: header
          name: Authorization
          required: true
          description: '[Llave privada](#section/Autenticacion)'
        - schema:
            type: string
            minLength: 300
            maxLength: 999900
            example: '50000'
          in: query
          name: amount
          description: 'Monto de los cargos en céntimos.</br> recuerda que: 500.00 sería 50000.'
        - schema:
            type: string
            minLength: 300
            maxLength: 999900
            example: '10000'
          in: query
          name: min_amount
          description: 'Monto mínimo de los cargos en céntimos.</br> recuerda que: 100.00 sería 10000'
        - schema:
            type: string
            maxLength: 999900
            minLength: 300
            example: '10000'
          in: query
          name: max_amount
          description: 'Monto máximo de los cargos en céntimos.</br> recuerda que: 100.00 sería 10000'
        - schema:
            type: string
            minLength: 2
            maxLength: 48
            example: '4'
          in: query
          name: installments
          description: Cantidad de cuotas que se aplicaron al cargo.
        - schema:
            type: string
            example: '8'
            minLength: 2
            maxLength: 48
          in: query
          name: min_installments
          description: Cantidad mínima de cuotas que se aplicaron al cargo.
        - schema:
            type: string
