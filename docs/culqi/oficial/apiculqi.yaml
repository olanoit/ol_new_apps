    post:
      tags:
        - Planes
      operationId: crear-plan
      summary: Crear plan
      description: |
        Esta operación permitirá crear planes de suscripción recurrente para sus clientes. También puedes hacerlo vía CulqiPanel.
      parameters:
        - schema:
            type: string
            example: application/json
          in: header
          name: Content-type
          required: true
        - schema:
            type: string
            example: Bearer sk_test_UTCQSGcXW8bCyU59
          in: header
          name: Authorization
          description: '[Llave_privada](#section/Autenticacion)'
          required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Plan de Prueba.
                  minLength: 5
                  maxLength: 50
                short_name:
                  type: string
                  description: Nombre corto del plan.
                  minLength: 5
                  maxLength: 50
                description:
                  type: string
                  minLength: 5
                  maxLength: 200
                  description: Descripción Plan de Prueba.
                amount:
                  type: number
                  minimum: 300
                  maximum: 5000000
                  description: |
                    Monto del plan en céntimos.<br/>Ejemplo: S/ 1.00 = 100
                currency:
                  type: string
                  enum:
                    - PEN
                    - USD
                  description: Código de la moneda en formato ISO 4217 (PEN o USD).
                interval_unit_time:
                  type: number
                  enum:
                    - 1
                    - 2
                    - 3
                    - 4
                    - 5
                    - 6
                  description: Unidad de tiempo del intervalo de facturación.<br/> 1 = Diario <br/> 2 = Semanal <br/> 3 = Mensual <br/> 4 = Anual <br/> 5 = Trimestral <br/> 6 = Semestral
                interval_count:
                  type: number
                  description: Cantidad de intervalos entre cada cargo.<br><strong>Si envia el 0 se cobrará de forma indefinida.</strong>
                initial_cycles:
                  type: object
                  description: Ciclos iniciales del plan.
                  properties:
                    count:
                      type: number
                      description: Cantidad de ciclos iniciales.
                    has_initial_charge:
                      type: boolean
                      description: Indica si hay un cargo inicial asociado al plan.
                    amount:
                      type: number
                      description: Monto del cargo inicial, en caso de haberlo.
                    interval_unit_time:
                      type: number
                      description: |
                        Unidad de tiempo del intervalo de facturación. para los ciclos iniciales.
                image:
                  type: string
                  description: URL de la imagen asociada al plan.
                metadata:
                  type: object
                  description: |
                    Envía parametros adicionales con información relevante. [Ver más](#section/Metadata)<br/>          
              required:
                - name
                - short_name
                - description
                - amount
                - currency
                - interval_unit_time
                - interval_count
                - initial_cycles
            examples:
              example-1:
                value:
                  name: Plan de Prueba.
                  short_name: plan-de-prueba-001
                  description: Descripción Plan de Prueba
                  amount: 5
                  currency: PEN
                  interval_unit_time: 1
                  interval_count: 1
                  initial_cycles:
                    count: 0
                    has_initial_charge: false
                    amount: 0
                    interval_unit_time: 1
                  metadata:
                    DNI: 123456782
      responses:
        '201':
          description: La petición fue exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
