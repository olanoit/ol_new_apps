        - lang: Ruby
          source: |-
            require 'uri'
            require 'net/http'
            require 'openssl'

            url = URI("https://secure.culqi.com/v2/tokens")

            http = Net::HTTP.new(url.host, url.port)
            http.use_ssl = true
            http.verify_mode = OpenSSL::SSL::VERIFY_NONE

            request = Net::HTTP::Post.new(url)
            request["Authorization"] = 'Bearer pk_test_UTCQSGcXW8bCyU59'
            request["x-culqi-product"] = 'online'
            request["content-type"] = 'application/json'
            request.body = "{\"card_number\":\"4111111111111111\",\"cvv\":\"123\",\"expiration_month\":9,\"expiration_year\":\"2020\",\"email\":\"ichard@piedpiper.com\",\"metadata\":{\"dni\":\"5831543\"}}"

            response = http.request(request)
            puts response.read_body
        - lang: Swift
          source: |-
            import Foundation

            let headers = [
              "Authorization": "Bearer pk_test_UTCQSGcXW8bCyU59",
              "x-culqi-product": "online",
              "content-type": "application/json"
            ]
            let parameters = [
              "card_number": "4111111111111111",
              "cvv": "123",
              "expiration_month": 9,
              "expiration_year": "2020",
              "email": "ichard@piedpiper.com",
              "metadata": ["dni": "5831543"]
            ] as [String : Any]

            let postData = JSONSerialization.data(withJSONObject: parameters, options: [])

            let request = NSMutableURLRequest(url: NSURL(string: "https://secure.culqi.com/v2/tokens")! as URL,
                                                    cachePolicy: .useProtocolCachePolicy,
                                                timeoutInterval: 10.0)
            request.httpMethod = "POST"
            request.allHTTPHeaderFields = headers
            request.httpBody = postData as Data

            let session = URLSession.shared
            let dataTask = session.dataTask(with: request as URLRequest, completionHandler: { (data, response, error) -> Void in
              if (error != nil) {
                print(error)
              } else {
                let httpResponse = response as? HTTPURLResponse
                print(httpResponse)
              }
            })

            dataTask.resume()
        - lang: Jquery
