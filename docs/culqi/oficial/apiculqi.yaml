    # Errores

    Por medio de nuestra API, serás notificado con toda la información en caso presentes un error al momento de hacer una petición a cualquier operación. Utilizamos el estándar de Códigos de Estado HTTP (HTTP Status Codes) en todas sus respuestas para indicar si las solicitudes se pudieron procesar con éxito o fallaron.

