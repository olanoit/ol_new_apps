    # Paginación

    Todas nuestras APIS soportan operaciones de listado, entre ellos [tokens](#tag/Tokens), [cargos](#tag/Cargos), [tarjetas](#tag/Tarjetas), [clientes](#tag/Clientes), [suscripciones](#tag/Suscripciones), [devoluciones](#tag/Devoluciones) y [planes](#tag/Planes). Adicionalmente, todos los métodos de listado comparten una estructura similar tomando en cuenta estos tres parámetros: _limit_, _after_ y _before_.

    Utilizamos una paginación en tiempo real basada en cursor a través de los parámetros after y before. Un cursor se refiere a un <em>string</em> de caracteres random que marca un ítem específico en una lista de datos. A menos que el ítem sea borrado, el cursor siempre estará punteando la misma parte de la lista, pero será invalidado si el ítem es removido.

    Los parámetros _after_ y _before_ toman el valor ID y retornan los objetos en un orden cronológico reverso. El parámetro before devuelve los objetos creados antes del objeto en cuestión. El parámetro after devuelve los objetos creados después del objeto en cuestión. Si ambos parámetros son provistos solo before es utilizado.

    ## Ejemplo de paginación

    En el siguiente ejemplo podrás conocer cómo realizar una petición para obtener un listado de los últimos 50 [cargos](#operation/listar-cargo).

    ### Petición

    Petición

    ```json
    curl -X GET -H "Authorization: Bearer sk_test_wJ7jU1ydtz9npsmc"
    -H "Cache-Control: no-cache"
    "https://api.culqi.com/v2/charges?limit=50&before=chr_test_kzGrl1jlVSaY8guT"
    ```

