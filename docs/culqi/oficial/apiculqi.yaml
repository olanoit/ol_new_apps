      description: Listar tokens te permitirá obtener una serie de tokens existentes. De acuerdo a los filtros que uses los tokens serán ordenados según la fecha de creación, siendo el primero el más reciente.
      parameters:
        - schema:
            type: string
            example: Bearer sk_test_UTCQSGcXW8bCyU59
          in: header
          name: Authorization
          required: true
          description: '[Llave privada](#section/Autenticacion)'
        - schema:
            type: string
            example: '1476132639'
          in: query
          name: creation_date
          description: Fecha del token en [UNIX Timestamp.](http://www.unixtimestamp.com/)
        - schema:
            type: string
            example: '1476132639'
            minLength: 5
            maxLength: 15
          in: query
          name: creation_date_from
          description: Fecha inicial de las tarjetas en UNIX Timestamp.
        - schema:
            type: string
            example: '1476132639'
            minLength: 5
            maxLength: 15
          in: query
          name: creation_date_to
          description: Fecha limite de las tarjetas en UNIX Timestamp.
        - schema:
            type: string
            enum:
              - Visa
              - Mastercard
              - Amex
              - Diner
            example: Visa
          in: query
          name: card_brand
          description: Marca de la tarjeta.
        - schema:
            type: string
            enum:
              - credito
              - debito
              - internacional
            example: credito
          in: query
          name: card_type
          description: Tipo de tarjeta.
        - schema:
            type: string
            enum:
              - escritorio
              - movil
              - tablet
            example: escritorio
          in: query
          name: device_type
          description: Tipo de dispositivo.
        - schema:
            type: string
            minLength: 6
            maxLength: 8
            example: '411111'
          in: query
          name: bin
          description: 'Primeros seis dígitos de la tarjeta expresado en formato **ISO/IEC 7812.** '
        - schema:
            type: string
            example: PE
          in: query
          name: country_code
          description: Código del país, en formato ISO-3166 (Alfa 2).
        - schema:
            type: string
            example: '50'
            minLength: 1
            maxLength: 100
          in: query
          name: limit
          description: Cantidad exacta de tokens que se quieren listar.
        - schema:
            type: string
            minLength: 25
            maxLength: 25
            example: tkn_test_7lYOtONQ9LxcgJUW
          in: query
          name: before
          description: El ID del token desde donde se quiere traer los resultados anteriores. No inclusivo.
        - schema:
            type: string
            example: tkn_test_7lYOtOMM6LxcgJUW
            minLength: 25
            maxLength: 25
          in: query
          name: after
          description: El ID del token desde donde se quiere traer los resultados siguientes. No inclusivo.
