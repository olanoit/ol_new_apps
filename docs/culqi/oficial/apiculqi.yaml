    # Introducción

    Nuestra API está construido bajo los estándares de **REST**. Es decir, posee URLs orientadas a recursos y hace uso de los [códigos de respuesta HTTP](https://httpstatuses.com/) para indicar los posibles errores en ella. Para cada petición se encuentra implementada una autenticación HTTP (_Bearer Token_). Además, soportamos las solicitudes HTTP de origen cruzado (CORS), permitiendo que podamos interactuar con tu **sitio** de manera segura mediante nuestra API desde una aplicación cliente. Cada petición a la API retorna un objeto [JSON](http://www.json.org/) incluyendo errores. Adicionalmente, nuestras [bibliotecas](https://docs.culqi.com/es/documentacion/librerias/) convierten las respuestas en objetos específicos para cada lenguaje soportado.

    Para que puedas comenzar a experimentar con nuestra API, todas las cuentas registradas en Culqi poseen llaves para el **entorno de prueba** ([Regístrate](https://integ-panel.culqi.com/#/registro) y obtén tus llaves) y el **entorno de producción**. al usar las **llaves de prueba**, las transacciones no pasan por redes bancarias ni tienen costo ( Al probar, recuerda usar [tarjetas de prueba](https://docs.culqi.com/es/documentacion/pagos-online/tarjetas-de-prueba/)).

    <div class="box info"><div class="content">Nunca debes exponer tu <a href="https://docs.culqi.com/es/documentacion/pagos-online/llaves/">Llave Secreta</a> en el código de la aplicación cliente web.</div></div>

