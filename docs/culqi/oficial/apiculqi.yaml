            phone_number: +1.800.774.7390
          installments_allowed:
            - 2
            - 4
            - 8
            - 12
            - 24
            - 36
        client:
          ip: 72.229.28.185
          ip_country: United States
          ip_country_code: US
          browser: Google Chrome 56.0.2924.87
          device_fingerprint: 6rITdVTYkWfOrss8
          device_type: escritorio
        metadata:
          dni: '5831543'
    ChargesObject:
