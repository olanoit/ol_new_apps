      description: Cuando agregues nueva tarjeta, tendrás que relacionarla a un token de cliente, que previamente ha sido creada en la opción de pagos posteriores o suscripciones.
      tags:
        - Tarjetas
      parameters:
        - in: header
          name: Content-type
          required: true
          schema:
            type: string
            example: application/json
        - in: header
          name: Authorization
          required: true
          description: '[Llave privada](#section/Autenticacion)'
          schema:
            type: string
            example: Bearer sk_test_UTCQSGcXW8bCyU59
        - in: header
          name: x-culqi-rsa-id
          required: false
          description: ID de la llave pública RSA, requerido si encripta el payload. [Ver más](#section/Encriptacion-AESRSA)
          schema:
            type: string
            example: 2ab335ad-c40d-4375-8dad-3ea315de23b0
        - in: header
          name: x-culqi-product
          required: false
          description: |
            Identificador del producto.
          schema:
            type: string
            example: online
      requestBody:
        content:
          application/json:
            schema:
              description: ''
              type: object
              x-examples:
                example-1:
                  customer_id: cus_test_Lz6Yfsm7QqCPIECW
                  token_id: tkn_test_vEcZSCOVz5PGDPdQ
              properties:
                customer_id:
                  type: string
                  minLength: 25
                  maxLength: 25
                  description: ID del cliente a enlazar a la tarjeta.
                  example: cus_test_Lz6Yfsm7QqCPIECW
                token_id:
                  type: string
                  description: ID del token generado al Crear Token.
                  example: tkn_test_vEcZSCOVz5PGDPdQ
                  minLength: 25
                  maxLength: 25
                validate:
                  type: boolean
                  default: true
                  description: Indica si se debe realizar una validación a la tarjeta, es decir, Culqi crea un cargo mínimo (3 PEN) y lo devuelve inmediatamente. Si no se considera el parametro, por defecto tiene un valor true.
                authentication_3DS:
                  type: object
                  description: Parámetros 3DS.
                  properties:
                    xid:
                      type: string
                      example: Y2FyZGluYWxjb21tZXJjZWF1dGg=
                      description: Cadena utilizada por Visa y Mastercard que identifica una transacción específica en los servidores de directorio. Este valor de cadena debe permanecer constante a lo largo de un historial de transacciones.
                    cavv:
                      type: string
                      example: AAABAWFlmQAAAABjRWWZEEFgFz+=
                      description: Valor de verificación de autenticación del titular de la tarjeta.
                    directoryServerTransactionId:
                      type: string
                      example: 88debec7-a798-46d1-bcfb-db3075fedb82
                      description: El ID de transacción del servidor de directorio es generado por el servidor de directorio de Mastercard durante la transacción de autenticación y devuelto al comerciante con los resultados de la autenticación.
                    eci:
                      type: string
                      example: '06'
                      description: El indicador de comercio numérico que indica al banco el grado de cambio de responsabilidad logrado durante el proceso de autenticación del pagador.
                    protocolVersion:
                      type: string
                      description: ' Este campo contiene la versión de 3D Secure que se utilizó para procesar la transacción. Por ejemplo, 1.0.2 o 2.0.0.'
                      example: 2.1.0
                metadata:
                  type: object
                  description: 'Informacion adicional que se requiera enviar al crear la tarjeta.</br> Example: {"marca_tarjeta": "VISA"}'
                  example:
                    marca_tarjeta: VISA
              required:
                - customer_id
                - token_id
            examples:
              example-1:
                value:
                  customer_id: cus_test_Lz6Yfsm7QqCPIECW
                  token_id: tkn_test_vEcZSCOVz5PGDPdQ
                  validate: true
                  metadata:
                    marca_tarjeta: VISA
