            1 = Diario <br/> 2 = Semanal <br/> 3 = Mensual <br/> 4 = Anual <br/> 5 = Trimestral <br/> 6 = Semestral
          example: 1
        interval_count:
          type: integer
          description: Cantidad de intervalos entre cada cargo.
          example: 1
        amount:
          type: integer
          description: Monto del cargo en céntimos.
          example: 8600
        currency:
          type: string
          enum:
            - PEN
            - USD
          description: Código de la moneda en formato ISO 4217 (PEN o USD).
          example: PEN
        name:
          type: string
          description: Nombre del plan.
          example: Plan de Prueba
        description:
          type: string
          description: Descripción del plan.
          example: Descripción Plan de Prueba.
        short_name:
          type: string
          description: Nombre corto del plan.
          example: plan-de-prueba-001
        initial_cycles:
          type: object
          description: Ciclos iniciales del plan.
          properties:
            count:
              type: integer
              description: Cantidad de ciclos iniciales.
              example: 0
            has_initial_charge:
              type: boolean
              description: Indica si hay un cargo inicial asociado al plan.
              example: false
            amount:
              type: integer
              description: Monto del cargo inicial en céntimos, en caso de haberlo.
              example: 0
            interval_unit_time:
              type: integer
              enum:
                - 1
                - 2
                - 3
                - 4
                - 5
                - 6
              description: Unidad de tiempo del intervalo de facturación para los ciclos iniciales.
              example: 1
