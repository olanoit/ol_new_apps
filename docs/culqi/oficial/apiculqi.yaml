              description: Código ISO-3166-1 (Alfa 2) del país del cliente.
            first_name:
              type: string
              minLength: 2
              maxLength: 50
              example: Richard
              description: Nombres del cliente.
            last_name:
              type: string
              minLength: 2
              maxLength: 50
              example: Hendricks
              description: Apellidos del cliente.
            phone_number:
              type: string
              minLength: 5
              maxLength: 15
              example: '999777666'
              description: Número de teléfono del cliente.
        authentication_3DS:
          type: object
          description: Parámetros 3DS.
          properties:
            xid:
              type: string
              example: MTIzNDU2Nzg5MDEyMzQ1Njc4OTA=
              description: Cadena utilizada por Visa y Mastercard que identifica una transacción específica en los servidores de directorio. Este valor de cadena debe permanecer constante a lo largo de un historial de transacciones.
            cavv:
              type: string
              example: MTIzNDU2Nzg5MDEyMzQ1Njc4OTA=
              description: Valor de verificación de autenticación del titular de la tarjeta.
            directoryServerTransactionId:
              type: string
              example: '12312312313131'
              description: El ID de transacción del servidor de directorio es generado por el servidor de directorio de Mastercard durante la transacción de autenticación y devuelto al comerciante con los resultados de la autenticación.
            eci:
              type: string
              example: '05'
              description: El indicador de comercio numérico que indica al banco el grado de cambio de responsabilidad logrado durante el proceso de autenticación del pagador.
            protocolVersion:
              type: string
              example: 2.2.0
              description: Este campo contiene la versión de 3D Secure que se utilizó para procesar la transacción. Por ejemplo, 1.0.2 o 2.0.0.
    Tokens:
      title: Objeto Token
      description: Objeto token
      type: object
      properties:
        object:
          type: string
          enum:
            - token
          description: Nombre del objeto.
          example: token
        id:
          type: string
          description: ID del token.
          example: tkn_test_0CjjdWhFpEAZlxlz
        type:
          type: string
          enum:
            - card
          description: Método de pago.
          example: card
        creation_date:
          type: integer
          format: int64
          description: Fecha de creación del [token en UNIX.](http://www.unixtimestamp.com/)
          example: 1476132639
        email:
          type: string
          format: email
          description: Dirección de correo electrónico del cliente.
          example: richard@piedpiper.com
        card_number:
          type: string
          description: Número de la tarjeta enmascarado.
          example: 442328******1214
        last_four:
          type: string
          description: Últimos cuatro números de la tarjeta.
          example: '1214'
        active:
          type: boolean
          description: Indica si el token se encuentra activo para realizar un cargo.
          example: true
        iin:
          type: object
          description: Información del banco emisor y el tipo de tarjeta.
          properties:
            object:
              type: string
              description: Nombre del objeto.
              example: iin
            bin:
              type: string
              description: Código de identificación del banco emisor expresado en formato ISO/IEC 7812.
              example: '442328'
            card_brand:
              type: string
              enum:
                - Visa
                - Mastercard
                - Amex
                - Diners
              description: Marca de la tarjeta.
              example: Visa
            card_type:
              type: string
              enum:
                - credito
                - debito
                - prepagada
              description: Tipo de tarjeta.
              example: credito
            card_category:
              type: string
              description: Categoría de la tarjeta.
              example: platinum
            issuer:
              type: object
              description: Información del banco emisor de la tarjeta.
              properties:
                name:
                  type: string
                  description: Nombre del banco emisor de la tarjeta.
                  example: Silicon Valley Bank
                country:
                  type: string
                  description: País del banco emisor de la tarjeta.
                  example: United States
                country_code:
                  type: string
                  description: Código del país del banco emisor en formato ISO 3166-2.
                  example: US
                website:
                  type: string
                  description: Sitio web del banco emisor.
                  example: https://www.svb.com/
                phone_number:
                  type: string
                  description: Número de teléfono del banco emisor.
                  example: +1.800.774.7390
            installments_allowed:
              type: array
              description: Número de cuotas soportadas por la tarjeta.
              items:
                type: integer
                example: 2
              example:
                - 2
                - 4
                - 8
                - 12
                - 24
                - 36
        client:
          type: object
          description: Información del cliente y dispositivo utilizado.
          properties:
            ip:
              type: string
              description: Dirección IP. </br>Este IP llega con el request enviado desde el browser o servidor usado para crear el token. Tomarlo sólo como referencia.
              example: 72.229.28.185
            ip_country:
              type: string
              description: País de la Dirección IP.
              example: United States
            ip_country_code:
              type: string
              description: Código del país de la Dirección IP en formato ISO 3166-2.
              example: US
            browser:
              type: string
              description: Nombre y versión del navegador.
              example: Google Chrome 56.0.2924.87
            device_fingerprint:
              type: string
              description: Código único de identificación del dispositivo.
              example: 6rITdVTYkWfOrss8
            device_type:
              type: string
              enum:
                - escritorio
                - tablet
                - smartphone
              description: Tipo de dispositivo.
              example: escritorio
        metadata:
          type: object
          description: Envía parámetros adicionales con información relevante. [Ver más](#section/Metadata)
          properties:
            dni:
              type: string
              example: '5831543'
          example:
            dni: '5831543'
      example:
        object: token
        id: tkn_test_0CjjdWhFpEAZlxlz
        type: card
        email: richard@piedpiper.com
        creation_date: 1476132639
        card_number: 442328******1214
        last_four: '1214'
        active: true
        iin:
          object: iin
          bin: '442328'
          card_brand: Visa
          card_type: credito
          card_category: platinum
          issuer:
            name: Silicon Valley Bank
