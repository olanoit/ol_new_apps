  - name: Clientes
    description: |
      Puedes guardar la información de tus clientes, esto con el fin de que puedas realizar cobros recurrentes o posteriores. Nuestra API permite: crear, eliminar y actualizar datos. Adicional, podrás consultar datos de clientes en particular o listarlos en base a los filtros que desees crear.

      # Objeto cliente

      <SchemaDefinition schemaRef="#/components/schemas/Customers" />
  - name: Tarjetas
    description: |
      Se pueden crear cargos posteriores a una tarjeta en específico. Tener en cuenta que un token de cliente vence a los 5 minutos de creado, pero si se cambia la opción "Tarjeta" podrás realizar cargos posteriores múltiples veces a un cliente.

      # Objeto tarjeta

      <SchemaDefinition schemaRef="#/components/schemas/Cards" />
  - name: Planes
    description: |
      Contiene información acerca de los tipos de cargo: frecuencia y montos de cobros que se requieran hacer a una tarjeta de manera recurrente. Por ejemplo: configurar un Descripción Plan de Prueba de S/ 50 mensuales y un plan premium de S/ 75 mensuales.

      # Objeto plan

      <SchemaDefinition schemaRef="#/components/schemas/Plans" />
  - name: Suscripciones
    description: |
      El crear suscripciones te permite realizar cargos recurrentes a la tarjeta de un cliente. Una suscripción relaciona al objeto customer y al objeto plan que creaste previamente.

      # Objeto suscripción

      <SchemaDefinition schemaRef="#/components/schemas/Subscriptions" />
  - name: Órdenes
    description: |
      El objeto orden contiene información de una posible venta y es usado para el método de pago en efectivo. Una vez que tu cliente paga la orden vía banco o agente, el estado cambia en el mismo momento de la acción. Con este recurso podrás brindar a tus clientes la opción de pagar sus compras en efectivo.

      # Objeto orden

      <SchemaDefinition schemaRef="#/components/schemas/Orders" />
  - name: Eventos
    description: |
      Cuando algo sucede en tu cuenta, creamos un objeto evento como una forma de comunicártelo. Por ejemplo, cuando un cargo es exitoso, habilitamos el evento _charge.succeeded_.
      Adicionalmente, si realizas muchas peticiones al API podría llegar a
      causar multiples eventos. Es decir, si creas una suscripción para un
      cliente, recibirás el evento customer.subscription.created y el evento
      _charge.succeeded_.

      Al igual que los otros recursos del API, puedes consultar un evento
      particular o listar una serie de eventos directamente desde ella.
      También, hemos construido un sistema automatizado que enviará
      eventos directamente a tu servidor: webhooks. Reconedamos que revises
      nuestra guía de webhooks para que sepas cómo configurarlos.

      # Objeto evento

      <SchemaDefinition schemaRef="#/components/schemas/Evento" />

      # ↗️ Notificar evento

      Puedes configurar notificaciones de eventos para tokens, cargos, devoluciones, clientes, tarjetas, planes, suscripciones y órdenes.
      Para esto debes registrar la Url de tu webhook a través del Culqi Panel con un evento asociado.</br>
      Ejemplo:
      order.status.changed

      El objeto que se enviará a tu Url de webhook es el siguiente:

      <SchemaDefinition schemaRef="#/components/schemas/NotificarEvento" />
  - name: Links
    description: |
      **CulqiLink** es un servicio simple y seguro que te permite realizar cobros desde tus redes sociales sin necesidad de tener una tienda virtual. Puedes crear links de cobro para enviarlos a tus clientes y así automatizar tu proceso de venta. Adicionalmente, si cuentas con una página web informativa, podrás insertar la URL de nuestro link en tu botón de pago para mejorar la experiencia de compra de tus clientes. Para más información de links de pago ingresa [aquí](https://docs.culqi.com/es/documentacion/pagos-links)

      # Objeto link

      <SchemaDefinition schemaRef="#/components/schemas/Links" />
  - name: Estado Cuenta
    description: |
      Con esta API, podrás obtener los datos de tus depósitos y estado de cuenta, tal como se visualizan en el Panel Culqi.

      Si eres de los comercios que necesitan automatizar la conciliación de sus ventas con sus sistemas de contabilidad, esta opción te será de gran ayuda.

      <b>\* Válido para comercios Online con Estados de cuenta activos<b>
paths:
  /v2/tokens:
    post:
      tags:
        - Tokens
      summary: Crear token
      operationId: crear-token
      servers:
        - url: https://secure.culqi.com
      description: |-
        Crear tokens te permitirá obtener información de la tarjeta y utilizarla para [crear un cargo](#operation/crear-cargo) o [crear una tarjeta](#operation/crear-tarjeta).
        - Si desarrollas una página web debes crear el token utilizando Culqi Checkout o CulqiJS.
        - Si desarrollas una aplicación móvil debes crear el token utilizando nuestros SDKs para móviles (iOS o Android).
        - Si deseas crear el token de manera directa con el API de Culqi debes llenar el siguiente autocuestionario.
      parameters:
        - in: header
          name: Content-type
          required: true
          schema:
            type: string
            example: application/json
        - in: header
          name: Authorization
          required: true
          description: '[Llave pública](#section/Autenticacion)'
          schema:
            type: string
            example: Bearer pk_test_UTCQSGcXW8bCyU59
        - in: header
          name: x-culqi-rsa-id
          required: false
          description: ID de la llave pública RSA, requerido si encripta el payload. [Ver más](#section/Encriptacion-AESRSA)
          schema:
            type: string
            example: 2ab335ad-c40d-4375-8dad-3ea315de23b0
        - in: header
          name: x-culqi-product
          required: false
          description: |
            Identificador del producto.
          schema:
            type: string
            example: online
      requestBody:
        content:
          application/json:
            schema:
              type: object
              x-examples:
                example-1:
                  card_number: '4111111111111111'
                  cvv: '123'
                  expiration_month: 9
                  expiration_year: '2020'
                  email: richard@piedpiper.com
              properties:
                card_number:
                  type: string
                  minLength: 13
                  maxLength: 16
                  description: Número de tarjeta.
                  example: '4111111111111111'
                cvv:
                  type: string
                  minLength: 3
                  maxLength: 4
                  description: CVV de la tarjeta.
                  example: '123'
                expiration_month:
                  type: string
                  minLength: 1
                  maxLength: 2
                  example: 9
                  description: Mes de expiración de la tarjeta.
                expiration_year:
                  type: string
                  description: Año de expiración de la tarjeta.
                  minLength: 4
                  maxLength: 4
                  example: '2020'
                email:
                  type: string
                  description: Dirección de correo electrónico del cliente.
                  minLength: 5
                  maxLength: 50
                  example: ichard@piedpiper.com
                metadata:
                  type: object
                  description: 'Informacion adicional que se quiere enviar del token.</br> Example: {"dni":"71701978"}'
                  example:
                    dni: '5831543'
              required:
                - card_number
                - cvv
                - expiration_month
                - expiration_year
                - email
            examples:
              ejemplo 1:
                value:
                  card_number: '4111111111111111'
                  cvv: '123'
                  expiration_month: 9
                  expiration_year: '2020'
                  email: ichard@piedpiper.com
                  metadata:
                    dni: '5831543'
        description: ''
      responses:
        '201':
          description: La petición exitosa.
          content:
            application/json:
              schema:
                type: object
                properties: {}
              examples:
                ejemplo 1:
                  value:
                    object: token
                    id: tkn_test_0CjjdWhFpEAZlxlz
                    type: card
                    email: richard@piedpiper.com
                    creation_date: 1476132639
                    card_number: 442328******1214
                    last_four: '1214'
                    active: true
                    iin:
                      object: iin
                      bin: '442328'
                      card_brand: Visa
                      card_type: credito
                      card_category: platinum
                      issuer:
                        name: Silicon Valley Bank
                        country: United States
                        country_code: US
                        website: https://www.svb.com
                        phone_number: +1.800.774.7390
                      installments_allowed:
                        - 2
                        - 4
                        - 8
                        - 12
                        - 24
                        - 36
                    client:
                      ip: 72.229.28.185
                      ip_country: United States
                      ip_country_code: US
                      browser: Google Chrome 56.0.2924.87
                      device_fingerprint: 6rITdVTYkWfOrss8
                      device_type: escritorio
                    metadata:
                      dni: '5831543'
      x-code-samples:
        - lang: Java
          source: |-
            HttpResponse<String> response = Unirest.post("https://secure.culqi.com/v2/tokens")
              .header("Authorization", "Bearer pk_test_UTCQSGcXW8bCyU59")
              .header("x-culqi-product", "online")
              .header("content-type", "application/json")
              .body("{\"card_number\":\"4111111111111111\",\"cvv\":\"123\",\"expiration_month\":9,\"expiration_year\":\"2020\",\"email\":\"ichard@piedpiper.com\",\"metadata\":{\"dni\":\"5831543\"}}")
              .asString();
        - lang: Php
          source: |-
            <?php

            $request = new HttpRequest();
            $request->setUrl('https://secure.culqi.com/v2/tokens');
            $request->setMethod(HTTP_METH_POST);

            $request->setHeaders([
              'Authorization' => 'Bearer pk_test_UTCQSGcXW8bCyU59',
              'x-culqi-product' => 'online',
              'content-type' => 'application/json'
            ]);

            $request->setBody('{"card_number":"4111111111111111","cvv":"123","expiration_month":9,"expiration_year":"2020","email":"ichard@piedpiper.com","metadata":{"dni":"5831543"}}');

            try {
              $response = $request->send();

              echo $response->getBody();
            } catch (HttpException $ex) {
              echo $ex;
            }
        - lang: Python
          source: |-
            import requests

            url = "https://secure.culqi.com/v2/tokens"

            payload = {
                "card_number": "4111111111111111",
                "cvv": "123",
                "expiration_month": 9,
                "expiration_year": "2020",
                "email": "ichard@piedpiper.com",
                "metadata": {"dni": "5831543"}
            }
            headers = {
                "Authorization": "Bearer pk_test_UTCQSGcXW8bCyU59",
                "x-culqi-product": "online",
                "content-type": "application/json"
            }

            response = requests.request("POST", url, json=payload, headers=headers)

            print(response.text)
        - lang: C#
          source: |-
            var client = new RestClient("https://secure.culqi.com/v2/tokens");
            var request = new RestRequest(Method.POST);
            request.AddHeader("Authorization", "Bearer pk_test_UTCQSGcXW8bCyU59");
            request.AddHeader("x-culqi-product", "online");
            request.AddHeader("content-type", "application/json");
            request.AddParameter("application/json", "{\"card_number\":\"4111111111111111\",\"cvv\":\"123\",\"expiration_month\":9,\"expiration_year\":\"2020\",\"email\":\"ichard@piedpiper.com\",\"metadata\":{\"dni\":\"5831543\"}}", ParameterType.RequestBody);
            IRestResponse response = client.Execute(request);
        - lang: Go
          source: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n\t\"net/http\"\n\t\"io/ioutil\"\n)\n\nfunc main() {\n\n\turl := \"https://secure.culqi.com/v2/tokens\"\n\n\tpayload := strings.NewReader(\"{\\\"card_number\\\":\\\"4111111111111111\\\",\\\"cvv\\\":\\\"123\\\",\\\"expiration_month\\\":9,\\\"expiration_year\\\":\\\"2020\\\",\\\"email\\\":\\\"ichard@piedpiper.com\\\",\\\"metadata\\\":{\\\"dni\\\":\\\"5831543\\\"}}\")\n\n\treq, _ := http.NewRequest(\"POST\", url, payload)\n\n\treq.Header.Add(\"Authorization\", \"Bearer pk_test_UTCQSGcXW8bCyU59\")\n\treq.Header.Add(\"x-culqi-product\", \"online\")\n\treq.Header.Add(\"content-type\", \"application/json\")\n\n\tres, _ := http.DefaultClient.Do(req)\n\n\tdefer res.Body.Close()\n\tbody, _ := ioutil.ReadAll(res.Body)\n\n\tfmt.Println(res)\n\tfmt.Println(string(body))\n\n}"
        - lang: Node.js
          source: |
