    # Autenticación

    Culqi autentica tus solicitudes de API usando tu llave pública o privada.
    Se genera un error de petición si no incluyes una llave en la petición, y un error de autenticación si la llave es incorrecta.

    Para poder acceder y utilizar nuestra API necesitas previamente obtener tus [Llaves de Autenticación](https://docs.culqi.com/es/documentacion/pagos-online/llaves/) e incluirlas en cada petición que hagas. Podrás encontrar tus llaves en el Panel de [Integración](https://integ-panel.culqi.com/) y [Producción](http://mipanel.culqi.com/).

    <div class="box warning"><div class="content">Ten en cuenta que es información muy sensible y no puedes compartirla con nadie.</div></div>

    Para usar nuestra API utiliza autenticación Bearer y envía el header Authorization como se muestra a continuación:

    **Ejemplo de autenticación:**

    ```
    curl --location --request POST 'https://api.culqi.com/v2/charges' \
    --header 'Authorization: Bearer sk_test_UTCQSGcXW8bCyU59' \
    --header 'Content-Type: application/json'
    ```

    <div class="box warning"><div class="content">Las llaves secretas de integración tiene el prefijo 'sk_test_' y las llaves secretas de producción tienen el prefijo 'sk_live_'</div></div>

    Todas las peticiones al API deben ser hechas bajo el protocolo de transferencia **HTTPS.** Las llamadas hechas bajo el protocolo HTTP plano fallarán en el [entorno de producción](https://docs.culqi.com/es/documentacion/pagos-online/integracion-vs-produccion/) al igual que las peticiones sin autenticación.

    # Encriptación AES/RSA

    Culqi proporciona un mecanismo de encriptación híbrido AES/RSA entre tus servidor y Culqi, ya que permite encriptar la data sensible del payload de los servicios POST y PATCH resguardando los datos en tránsito y brindando un segundo factor de protección, ya que cifra los datos y los protege contra cualquier acceso ilícito.

    La data sensible del payload se encripta con AES-256-GCM (encriptación simétrica) con un “key” e “iv” generados aleatoriamente, luego se encripta el “key” e “iv” con la llave pública RSA (encriptación asimétrica) y el algoritmo “RSA/ECB/OAEPWithSHA-256AndMGF1Padding”.

    El payload encriptado tiene formato json y consta de 3 parámetros:

    - encrypted_data: payload encriptado.
    - encrypted_key: key de la encriptación simétrica AES-256.
    - encrypted_iv: Vector de inicialización de la encriptación simétrica AES-256.

    Para poder encriptar el payload de nuestra API necesitas previamente obtener tus llave RSA e incluir en el header el ID de la llave RSA en cada petición que hagas. Podrás generar tus llaves RSA en el Panel de [Integración](https://integ-panel.culqi.com/) o [Producción](http://mipanel.culqi.com/).

    ## ¿Cómo generar el payload encriptado?

    Para generar la encriptación del payload debe seguir los siguientes pasos:

    1. Almacena tu llave RSA y ID de la llave RSA en tu server.

    2. Genera un key aleatorio(AES-GCM).

    3. Genera un iv aleatorio(ASES-GCM).

    4. Encripta el payload con el key e iv generados con el algoritmo AES-GCM.

    5. Encripta el key aleatorio con la llave RSA pública.

    6. Encripta el iv aleatorio con la llave RSA pública.

    7. Genera el payload encriptado en formato JSON, el cual contiene el encrypted_data, encripted_key, encrypted_id.

    8. Debes enviar en tu petición el payload encriptado.

    A continuación mostramos un ejemplo de encriptación con Python:

    ```python
    import json
    from Crypto.PublicKey import RSA
    from Crypto.Cipher import PKCS1_OAEP
    from Crypto.Cipher import AES
    from Crypto.Random import get_random_bytes
    from Crypto.Hash import SHA256
    import base64

    class RsaAesEncoder:

        def _encrypt(self, data, public_key):
            # Generate a random encryption key
            key = get_random_bytes(32)
            iv = get_random_bytes(16)

            # Message to be encrypted
            message = json.dumps(data).encode('utf-8')

            # Initialize the cipher with the key and IV
            cipher = AES.new(key, AES.MODE_GCM, iv)

            # Encrypt the message
            # Note that the message length must be a multiple of 16 bytes
            ciphertext = cipher.encrypt(message)

            encrypted_message = base64.b64encode(ciphertext).decode('utf-8')

            # Encrypt the key with the public key
            cipher = PKCS1_OAEP.new(RSA.import_key(public_key), hashAlgo=SHA256)
            ciphertext_key = cipher.encrypt(key)

            # Encrypt the iv with the public key
            cipher = PKCS1_OAEP.new(RSA.import_key(public_key), hashAlgo=SHA256)
            ciphertext_iv = cipher.encrypt(iv)

            # Convert the encrypted message to a string
            encrypted_aes_key = base64.b64encode(ciphertext_key).decode()
            encrypted_aes_iv = base64.b64encode(ciphertext_iv).decode()

            return {
                "encrypted_data": encrypted_message,
                "encrypted_key": encrypted_aes_key,
                "encrypted_iv": encrypted_aes_iv
            }
    ```

    Para conocer más del proceso de encriptación haz click [aquí](https://docs.culqi.com/es/documentacion/pagos-online/llaves_rsa/).

    ## ¿Cómo realizar una petición encriptada?

    Para realizar una petición con payload encriptado, envía el header x-culqi-rsa-id y el body encriptado como se muestra a continuación:

    ```
    curl --location --request POST 'https://secure.culqi.com/v2/tokens' \
    --header 'Authorization: Bearer pk_live_53d22e51b61a43d1' \
    --header 'Content-Type: application/json' \
    --header 'x-culqi-rsa-id: 2ab335ad-c40d-4375-8dad-3ea315de23b0' \
    --data-raw '{
        "encrypted_data": "+iXSkRrC7nUYL310YsEOnk39iqr5b6fUTf+taY1KgQuIyoK93Ss5EAI1MVnL8jmuHdOpZd1GP6+1AMZ7QjaHWW5gmEuPA/lHRbpqdw4hNLgIBZxu7kvnF9pLRLrtmrIrr1CQJXK4eX8NcLpV/JCvXQ/CMK4CnQwQLnTHf4b0fdg5GmqFugFSdynuey0ubel70HsB1bszmUl1cGNTkNyboe+PKWZcpSwl1btLszOvKSOVe0mNoWeiRYVbqGZF87BE",
        "encrypted_key": "G8YuFIiX7rDbtV9r0iKndJRNBRqOnPDqqhsHiUlGb6rmp0lNZgZayWsgP9etL4m1YdCsjuRhdhmOTbNtlhh4HrgeI2NGAHWltgdHsS85kbzuOZT3elV5BZptDBjhh9UeCiOWX228vE8wznIdXvp/hB1bmFtvR5w1DUB+qK2MPDY=",
        "encrypted_iv": "HZkjM80P5CpVP3XvmuTUjGFWp7Lol6u0ocn5OXoTr658dLgkCjZIubIrLqgmsiMV9+wV6XK0CZgXWNe+hYdI5ZfuuOvkT5onaajAOz5IjzaATM0xlzltAZqEFaZzPjJf7pdCVLUJRfOqbrJPljNk+axSrKc1o+6UxL7cQG3SHrY="
