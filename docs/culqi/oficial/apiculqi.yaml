    ## Auto-paginación

    La mayoría de nuestras [bibliotecas](https://docs.culqi.com/es/documentacion/librerias/) soportan la auto-paginación. Esta funcionalidad te permite manejar grandes listados de recursos sin tener que implementar manualmente resultados paginados o realizar peticiones subsequentes.

    # ID de rastreo

    Cada petición al API está asociada a un identificador de rastreo. Puedes encontrar este valor en los headers de respuesta, bajo el nombre de x-culqi-tracking-id, en el Panel de Culqi y en el detalle de cada petición.

    <div class="box info"><div class="content">Si necesitas ayuda con alguna petición en específica, al brindar este ID de rastreo, será más fácil la ubicación y posterior solución al problema o incidencia.</div></div>

