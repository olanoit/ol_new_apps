# Ayuda contextual (botón «?» de al_docs_help) para pantallas de modelos
# OFICIALES que la suite amplía. Los modelos y asistentes propios de cada
# módulo se mapean solos a su guía (scripts/gen_docs_help.py).
#
#   <modelo o tag>:
#     modulo: <módulo con página en la documentación (modulos: en su encabezado)>
#     seccion: <encabezado exacto de la página>   # opcional; sin él, el inicio
#     nombre: <texto para la lista de Ajustes>   # opcional
#     tipo: model | tag                          # opcional (model)
#
# Después de editar: python3 scripts/gen_docs_help.py
