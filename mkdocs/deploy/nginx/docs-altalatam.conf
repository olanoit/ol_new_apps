# =============================================================================
# DOCUMENTACIÓN ol_new_apps | docs.altalatam.com
# Sitio estático en el contenedor odoo_docs (/opt/odoo-infra/docs-site).
# Archivo manual: no lo generan sync-projects.sh ni new-project.sh.
# =============================================================================
server {
    listen 80;
    server_name docs.altalatam.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl; http2 on;
    server_name docs.altalatam.com;

    ssl_certificate     /etc/letsencrypt/live/docs.altalatam.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.altalatam.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/docs.altalatam.com/chain.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL_docs:5m;
    ssl_session_timeout 1d; ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        # Resolución en cada petición: nginx arranca aunque odoo_docs esté caído.
        resolver 127.0.0.11 valid=30s;
        set $docs_upstream http://odoo_docs:80;
        proxy_pass $docs_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect http://$host/ https://$host/;
    }
}
