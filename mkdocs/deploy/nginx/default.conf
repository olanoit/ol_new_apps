# Intentos de inicio de sesión: 10 por minuto por IP (con ráfaga de 5).
limit_req_zone $binary_remote_addr zone=docs_login:1m rate=10r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # IP real del visitante (viene del nginx principal por la red interna).
    set_real_ip_from 172.20.0.0/24;
    real_ip_header X-Forwarded-For;

    gzip on; gzip_vary on; gzip_comp_level 5; gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml text/xml;

    # Todo el sitio exige sesión (odoo_docs_auth); sin ella, a la página de acceso.
    auth_request /_auth;
    error_page 401 = @login;

    location = /_auth {
        internal;
        proxy_pass http://odoo_docs_auth:8000/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location @login {
        return 302 /_login/?next=$request_uri;
    }

    location /_login/ {
        auth_request off;
        limit_req zone=docs_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://odoo_docs_auth:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /_login/logo.png {
        auth_request off;
        proxy_pass http://odoo_docs_auth:8000;
    }

    # La versión vigente (alias «latest» de versions.json) es la portada.
    location = / { return 302 /latest/; }

    location / {
        try_files $uri $uri/ =404;
    }
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "private";
        try_files $uri =404;
    }
    location ~* (versions\.json|search_index\.json|\.html)$ {
        add_header Cache-Control "no-cache, private";
        try_files $uri =404;
    }
    error_page 404 /latest/404.html;
}
