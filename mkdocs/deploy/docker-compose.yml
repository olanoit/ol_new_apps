# Documentación unificada de ol_new_apps: https://docs.altalatam.com
# El nginx principal (odoo_nginx) termina TLS y reenvía a odoo_docs, que sirve
# el sitio estático ya construido (www/) y pide sesión a odoo_docs_auth
# (página de inicio de sesión propia, auth/auth_server.py).
services:
  docs:
    image: nginx:1.27-alpine
    container_name: odoo_docs
    restart: unless-stopped
    depends_on:
      - docs_auth
    volumes:
      - ./www:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - odoo_net
    logging:
      driver: "json-file"
      options: { max-size: "20m", max-file: "3" }

  docs_auth:
    image: python:3.12-alpine
    container_name: odoo_docs_auth
    restart: unless-stopped
    command: ["python3", "/app/auth_server.py", "serve"]
    environment:
      DOCS_AUTH_DATA: /data
      DOCS_LOGO: /www/latest/assets/logo.png
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./auth/auth_server.py:/app/auth_server.py:ro
      - ./auth/data:/data
      - ./www:/www:ro
    networks:
      - odoo_net
    logging:
      driver: "json-file"
      options: { max-size: "20m", max-file: "3" }

networks:
  odoo_net:
    external: true
    name: odoo_internal_net
